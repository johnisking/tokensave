<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ブロック崩し</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111827;
    color: #e5e7eb;
    font-family: "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #0b1020;
    border: 2px solid #374151;
    border-radius: 6px;
    max-width: 100vw;
    max-height: calc(100vh - 60px);
    cursor: none;
  }
  .help {
    margin-top: 8px;
    font-size: 14px;
    color: #9ca3af;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div class="help">
  操作: ← → / A D キー または マウス移動でパドル操作 ｜ スペース / クリックで発射 ｜ P で一時停止 ｜ R でリスタート
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  // ===== 設定 =====
  const HUD_HEIGHT = 40;
  const PADDLE_W = 110;
  const PADDLE_H = 14;
  const PADDLE_Y = H - 40;
  const PADDLE_SPEED = 520; // px/秒（キーボード）
  const BALL_R = 8;
  const MAX_LIVES = 3;

  const BRICK_COLS = 10;
  const BRICK_GAP = 6;
  const BRICK_H = 22;
  const BRICK_TOP = HUD_HEIGHT + 40;
  const BRICK_SIDE = 30;
  const BRICK_W = (W - BRICK_SIDE * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;

  // レベル定義: 数字 = ブロックの耐久度（0 = なし）
  const LEVELS = [
    {
      name: "レベル 1",
      ballSpeed: 340,
      layout: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      name: "レベル 2",
      ballSpeed: 420,
      layout: [
        "2222222222",
        "2111111112",
        "2120000212",
        "2121111212",
        "2120000212",
        "2111111112",
        "2222222222",
      ],
    },
  ];

  const ROW_COLORS = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#06b6d4", "#3b82f6", "#a855f7"];

  // ===== 状態 =====
  // state: "title" | "ready" | "playing" | "paused" | "levelClear" | "gameOver" | "win"
  let state = "title";
  let levelIndex = 0;
  let score = 0;
  let lives = MAX_LIVES;
  let bricks = [];
  let levelClearTimer = 0;

  const paddle = { x: W / 2 - PADDLE_W / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R, speed: 0 };

  const keys = { left: false, right: false };
  let mouseX = null;

  // ===== 初期化 =====
  function buildLevel(index) {
    const level = LEVELS[index];
    bricks = [];
    level.layout.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        const hp = parseInt(ch, 10);
        if (hp > 0) {
          bricks.push({
            x: BRICK_SIDE + c * (BRICK_W + BRICK_GAP),
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            w: BRICK_W,
            h: BRICK_H,
            hp,
            maxHp: hp,
            color: ROW_COLORS[r % ROW_COLORS.length],
          });
        }
      });
    });
  }

  function resetBall() {
    ball.speed = LEVELS[levelIndex].ballSpeed;
    ball.vx = 0;
    ball.vy = 0;
    stickBallToPaddle();
    state = "ready";
  }

  function stickBallToPaddle() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launchBall() {
    if (state !== "ready") return;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3); // 上方向 ±約17°
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    state = "playing";
  }

  function startGame() {
    levelIndex = 0;
    score = 0;
    lives = MAX_LIVES;
    paddle.x = W / 2 - PADDLE_W / 2;
    buildLevel(levelIndex);
    resetBall();
  }

  function nextLevel() {
    levelIndex++;
    paddle.x = W / 2 - PADDLE_W / 2;
    buildLevel(levelIndex);
    resetBall();
  }

  // ===== 入力 =====
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = true;
    if (k === "ArrowRight" || k === "d" || k === "D") keys.right = true;
    if (k === "ArrowLeft" || k === "ArrowRight") mouseX = null; // キー操作を優先
    if (k === " " || k === "Enter") {
      e.preventDefault();
      primaryAction();
    }
    if (k === "p" || k === "P" || k === "Escape") togglePause();
    if (k === "r" || k === "R") startGame();
    if (k.startsWith("Arrow") || k === " ") e.preventDefault();
  });

  document.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });

  function toCanvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }

  canvas.addEventListener("mousemove", (e) => {
    mouseX = toCanvasX(e.clientX);
  });

  canvas.addEventListener("mousedown", (e) => {
    e.preventDefault();
    mouseX = toCanvasX(e.clientX);
    primaryAction();
  });

  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state === "playing") state = "paused";
  });

  function primaryAction() {
    switch (state) {
      case "title":
      case "gameOver":
      case "win":
        startGame();
        break;
      case "ready":
        launchBall();
        break;
      case "paused":
        state = "playing";
        break;
      case "levelClear":
        if (levelClearTimer <= 0) nextLevel();
        break;
    }
  }

  function togglePause() {
    if (state === "playing") state = "paused";
    else if (state === "paused") state = "playing";
  }

  // ===== 更新 =====
  function updatePaddle(dt) {
    if (keys.left || keys.right) {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      paddle.x += dir * PADDLE_SPEED * dt;
      mouseX = null;
    } else if (mouseX !== null) {
      paddle.x = mouseX - paddle.w / 2;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function circleRectHit(cx, cy, r, rect) {
    const nx = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    const ny = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    const dx = cx - nx;
    const dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function stepBall(dt) {
    const prevX = ball.x;
    const prevY = ball.y;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // 壁
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < HUD_HEIGHT) { ball.y = HUD_HEIGHT + ball.r; ball.vy = Math.abs(ball.vy); }

    // パドル
    if (ball.vy > 0 && circleRectHit(ball.x, ball.y, ball.r, paddle)) {
      // 当たった位置で反射角を変える（-60°〜60°）
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const clamped = Math.max(-1, Math.min(1, hit));
      const angle = clamped * (Math.PI / 3);
      ball.vx = Math.sin(angle) * ball.speed;
      ball.vy = -Math.cos(angle) * ball.speed;
      ball.y = paddle.y - ball.r - 0.5;
    }

    // ブロック（1ステップにつき1つだけ処理）
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      if (!circleRectHit(ball.x, ball.y, ball.r, b)) continue;

      // 直前位置から衝突面を判定
      const wasLeft = prevX + ball.r <= b.x;
      const wasRight = prevX - ball.r >= b.x + b.w;
      const wasAbove = prevY + ball.r <= b.y;
      const wasBelow = prevY - ball.r >= b.y + b.h;

      if (wasLeft || wasRight) {
        ball.vx = -ball.vx;
        ball.x = prevX;
      } else if (wasAbove || wasBelow) {
        ball.vy = -ball.vy;
        ball.y = prevY;
      } else {
        ball.vy = -ball.vy;
        ball.x = prevX;
        ball.y = prevY;
      }

      b.hp--;
      if (b.hp <= 0) {
        score += 100 * b.maxHp;
        bricks.splice(i, 1);
      } else {
        score += 20;
      }
      break;
    }

    // 落下
    if (ball.y - ball.r > H) {
      loseLife();
      return false;
    }
    return true;
  }

  function loseLife() {
    lives--;
    if (lives <= 0) {
      lives = 0;
      state = "gameOver";
    } else {
      resetBall();
    }
  }

  function update(dt) {
    if (state === "levelClear") {
      levelClearTimer -= dt;
      return;
    }
    if (state !== "playing" && state !== "ready") return;

    updatePaddle(dt);

    if (state === "ready") {
      stickBallToPaddle();
      return;
    }

    // すり抜け防止のためにサブステップで移動
    const dist = ball.speed * dt;
    const steps = Math.max(1, Math.ceil(dist / (ball.r * 0.5)));
    const sub = dt / steps;
    for (let s = 0; s < steps; s++) {
      if (!stepBall(sub)) return;
      if (bricks.length === 0) {
        score += lives * 500; // 残りライフボーナス
        if (levelIndex + 1 < LEVELS.length) {
          state = "levelClear";
          levelClearTimer = 0.8;
        } else {
          state = "win";
        }
        return;
      }
    }
  }

  // ===== 描画 =====
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "#111827";
    ctx.fillRect(0, 0, W, HUD_HEIGHT);
    ctx.strokeStyle = "#374151";
    ctx.beginPath();
    ctx.moveTo(0, HUD_HEIGHT + 0.5);
    ctx.lineTo(W, HUD_HEIGHT + 0.5);
    ctx.stroke();

    ctx.font = "bold 18px 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#e5e7eb";
    ctx.textAlign = "left";
    ctx.fillText(`スコア: ${score}`, 16, HUD_HEIGHT / 2);

    ctx.textAlign = "center";
    ctx.fillText(LEVELS[levelIndex].name, W / 2, HUD_HEIGHT / 2);

    ctx.textAlign = "right";
    ctx.fillText("ライフ:", W - 16 - MAX_LIVES * 22, HUD_HEIGHT / 2);
    for (let i = 0; i < MAX_LIVES; i++) {
      ctx.fillStyle = i < lives ? "#f43f5e" : "#374151";
      drawHeart(W - 16 - (MAX_LIVES - 1 - i) * 22 - 9, HUD_HEIGHT / 2, 8);
    }
  }

  function drawHeart(cx, cy, s) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.9);
    ctx.bezierCurveTo(cx - s * 1.4, cy - s * 0.1, cx - s * 0.7, cy - s * 1.2, cx, cy - s * 0.4);
    ctx.bezierCurveTo(cx + s * 0.7, cy - s * 1.2, cx + s * 1.4, cy - s * 0.1, cx, cy + s * 0.9);
    ctx.fill();
  }

  function drawBricks() {
    for (const b of bricks) {
      ctx.globalAlpha = b.hp < b.maxHp ? 0.55 : 1;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      if (b.maxHp > 1) {
        ctx.strokeStyle = "#f9fafb";
        ctx.lineWidth = 2;
        roundRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2, 4);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(b.x + 4, b.y + 3, b.w - 8, 3);
    }
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, "#93c5fd");
    g.addColorStop(1, "#2563eb");
    ctx.fillStyle = g;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
  }

  function drawBall() {
    ctx.fillStyle = "#f9fafb";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawOverlay(title, lines) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(0, HUD_HEIGHT, W, H - HUD_HEIGHT);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#f9fafb";
    ctx.font = "bold 44px 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 40);
    ctx.font = "20px 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif";
    lines.forEach((line, i) => {
      ctx.fillText(line, W / 2, H / 2 + 15 + i * 30);
    });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawPaddle();
    drawBall();
    drawHUD();

    switch (state) {
      case "title":
        drawOverlay("ブロック崩し", [
          "← → / A D キー または マウスでパドルを操作",
          "スペース / クリックでスタート",
        ]);
        break;
      case "ready":
        ctx.textAlign = "center";
        ctx.fillStyle = "#d1d5db";
        ctx.font = "18px 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif";
        ctx.fillText("スペース / クリックで発射", W / 2, H / 2 + 80);
        break;
      case "paused":
        drawOverlay("一時停止", ["P / スペース / クリックで再開"]);
        break;
      case "levelClear":
        drawOverlay(`${LEVELS[levelIndex].name} クリア！`, [
          `スコア: ${score}`,
          "スペース / クリックで次のレベルへ",
        ]);
        break;
      case "gameOver":
        drawOverlay("ゲームオーバー", [
          `スコア: ${score}`,
          "スペース / クリック / R でもう一度",
        ]);
        break;
      case "win":
        drawOverlay("全レベルクリア！", [
          `最終スコア: ${score}`,
          "スペース / クリック / R でもう一度",
        ]);
        break;
    }
  }

  // ===== メインループ =====
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); // タブ復帰時の大ジャンプを抑制
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  buildLevel(0);
  stickBallToPaddle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
