<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Арканоїд</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 30%, #1e2a4a, #0a0f1e);
    color: #e8ecff;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none;
  }
  h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: 3px; color: #7fd4ff; }
  canvas {
    background: #0d1430;
    border: 3px solid #3a4f8f;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(80, 140, 255, .35);
    max-width: 96vw; max-height: 80vh;
    cursor: none;
  }
  .help { margin-top: 10px; font-size: 14px; color: #9aa7d6; text-align: center; }
  .help b { color: #fff; }
</style>
</head>
<body>
<h1>АРКАНОЇД</h1>
<canvas id="game" width="800" height="600"></canvas>
<div class="help">
  <b>←/→</b> або <b>A/D</b> чи <b>миша</b> — рух платформи &nbsp;|&nbsp;
  <b>Пробіл</b> / <b>клік</b> — запуск м'яча &nbsp;|&nbsp;
  <b>P</b> — пауза
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const HUD = 40; // висота верхньої панелі

  // ---------- Рівні ----------
  // Символи: '.' — порожньо, '1' — звичайна цеглинка, '2' — міцна (2 удари), '#' — незламна
  const LEVELS = [
    {
      name: 'Рівень 1',
      speed: 5,
      map: [
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
      ]
    },
    {
      name: 'Рівень 2',
      speed: 6,
      map: [
        '2222222222',
        '2.111111.2',
        '21.1221.12',
        '211.22.112',
        '2111..1112',
        '#.#1111#.#',
        '1111111111',
      ]
    }
  ];

  const ROW_COLORS = ['#ff5a6e', '#ff9f43', '#ffd93d', '#6bdc7a', '#4fc3f7', '#a78bfa', '#f472b6'];

  const BRICK_COLS = 10;
  const BRICK_GAP = 6;
  const BRICK_TOP = HUD + 40;
  const BRICK_SIDE = 30;
  const BRICK_H = 24;
  const BRICK_W = (W - BRICK_SIDE * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;

  // ---------- Стан ----------
  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 9 };
  const ball = { x: 0, y: 0, r: 8, vx: 0, vy: 0, stuck: true };
  let bricks = [];
  let particles = [];
  let score = 0, lives = 3, levelIndex = 0;
  let state = 'start'; // start | play | paused | levelComplete | gameOver | win
  let keys = { left: false, right: false };
  let mouseX = null;

  function buildLevel(i) {
    bricks = [];
    LEVELS[i].map.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === '.') return;
        const hp = ch === '2' ? 2 : ch === '#' ? Infinity : 1;
        bricks.push({
          x: BRICK_SIDE + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H,
          hp, maxHp: hp,
          color: ch === '#' ? '#8892b0' : ROW_COLORS[r % ROW_COLORS.length],
          points: ch === '2' ? 20 : 10
        });
      });
    });
  }

  function resetBall() {
    ball.stuck = true;
    ball.vx = 0; ball.vy = 0;
    placeBallOnPaddle();
  }

  function placeBallOnPaddle() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launchBall() {
    if (!ball.stuck) return;
    const speed = LEVELS[levelIndex].speed;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = speed * Math.cos(angle);
    ball.vy = speed * Math.sin(angle);
    ball.stuck = false;
  }

  function newGame() {
    score = 0; lives = 3; levelIndex = 0;
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    particles = [];
    resetBall();
    state = 'play';
  }

  function nextLevel() {
    levelIndex++;
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    particles = [];
    resetBall();
    state = 'play';
  }

  // ---------- Керування ----------
  function primaryAction() {
    if (state === 'start' || state === 'gameOver' || state === 'win') newGame();
    else if (state === 'levelComplete') nextLevel();
    else if (state === 'play') launchBall();
    else if (state === 'paused') state = 'play';
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.left = true; mouseX = null; }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.right = true; mouseX = null; }
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); primaryAction(); }
    if (e.code === 'KeyP' || e.code === 'Escape') {
      if (state === 'play') state = 'paused';
      else if (state === 'paused') state = 'play';
    }
    if (e.code.startsWith('Arrow')) e.preventDefault();
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });

  function toCanvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener('mousemove', e => { mouseX = toCanvasX(e.clientX); });
  canvas.addEventListener('mousedown', e => { e.preventDefault(); primaryAction(); });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault(); mouseX = toCanvasX(e.touches[0].clientX);
  }, { passive: false });
  canvas.addEventListener('touchstart', e => {
    e.preventDefault(); mouseX = toCanvasX(e.touches[0].clientX); primaryAction();
  }, { passive: false });
  window.addEventListener('blur', () => {
    keys.left = keys.right = false;
    if (state === 'play') state = 'paused';
  });

  // ---------- Логіка ----------
  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6,
        life: 30 + Math.random() * 20,
        color
      });
    }
  }

  function update() {
    // частинки оновлюємо завжди, крім паузи
    if (state !== 'paused') {
      particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; });
      particles = particles.filter(p => p.life > 0);
    }
    if (state !== 'play') return;

    // Платформа
    if (keys.left) paddle.x -= paddle.speed;
    if (keys.right) paddle.x += paddle.speed;
    if (mouseX !== null && !keys.left && !keys.right) paddle.x = mouseX - paddle.w / 2;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (ball.stuck) { placeBallOnPaddle(); return; }

    // Рух м'яча кроками, щоб уникнути «проскакування»
    const speed = Math.hypot(ball.vx, ball.vy);
    const steps = Math.ceil(speed / 4);
    for (let s = 0; s < steps; s++) {
      ball.x += ball.vx / steps;
      ball.y += ball.vy / steps;
      if (stepCollisions()) break;
      if (state !== 'play') break;
    }
  }

  // Повертає true, якщо м'яч втрачено
  function stepCollisions() {
    // Стіни
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < HUD) { ball.y = HUD + ball.r; ball.vy = Math.abs(ball.vy); }

    // Падіння
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) { state = 'gameOver'; }
      else resetBall();
      return true;
    }

    // Платформа
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x + ball.r >= paddle.x && ball.x - ball.r <= paddle.x + paddle.w) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const clamped = Math.max(-1, Math.min(1, hit));
      const angle = clamped * (Math.PI / 3); // до 60° від вертикалі
      const sp = Math.min(Math.hypot(ball.vx, ball.vy) * 1.01, LEVELS[levelIndex].speed * 1.6);
      ball.vx = sp * Math.sin(angle);
      ball.vy = -sp * Math.cos(angle);
      ball.y = paddle.y - ball.r;
    }

    // Цеглинки
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > ball.r * ball.r) continue;

      // Визначаємо сторону зіткнення за найменшим перекриттям
      const overlapL = ball.x + ball.r - b.x;
      const overlapR = b.x + b.w - (ball.x - ball.r);
      const overlapT = ball.y + ball.r - b.y;
      const overlapB = b.y + b.h - (ball.y - ball.r);
      const minX = Math.min(overlapL, overlapR);
      const minY = Math.min(overlapT, overlapB);
      if (minX < minY) {
        if (overlapL < overlapR) { ball.x = b.x - ball.r; ball.vx = -Math.abs(ball.vx); }
        else { ball.x = b.x + b.w + ball.r; ball.vx = Math.abs(ball.vx); }
      } else {
        if (overlapT < overlapB) { ball.y = b.y - ball.r; ball.vy = -Math.abs(ball.vy); }
        else { ball.y = b.y + b.h + ball.r; ball.vy = Math.abs(ball.vy); }
      }

      if (b.hp !== Infinity) {
        b.hp--;
        if (b.hp <= 0) {
          score += b.points;
          spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);
          bricks.splice(i, 1);
        } else {
          score += 5;
        }
      }

      // Запобігаємо надто горизонтальному руху
      if (Math.abs(ball.vy) < 1.5) ball.vy = ball.vy < 0 ? -1.5 : 1.5;

      if (!bricks.some(br => br.hp !== Infinity)) {
        state = levelIndex < LEVELS.length - 1 ? 'levelComplete' : 'win';
      }
      break; // одне зіткнення за крок
    }
    return false;
  }

  // ---------- Малювання ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = '#151e44';
    ctx.fillRect(0, 0, W, HUD);
    ctx.fillStyle = '#3a4f8f';
    ctx.fillRect(0, HUD - 2, W, 2);

    ctx.font = 'bold 18px Segoe UI, Arial';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffd93d';
    ctx.textAlign = 'left';
    ctx.fillText('Рахунок: ' + score, 16, HUD / 2);

    ctx.fillStyle = '#7fd4ff';
    ctx.textAlign = 'center';
    ctx.fillText(LEVELS[levelIndex].name + ' / ' + LEVELS.length, W / 2, HUD / 2);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#ff5a6e';
    ctx.fillText('Життя:', W - 16 - 3 * 22, HUD / 2);
    for (let i = 0; i < 3; i++) {
      drawHeart(W - 16 - (2 - i) * 22 - 9, HUD / 2, i < lives);
    }
  }

  function drawHeart(x, y, filled) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, 5);
    ctx.bezierCurveTo(-9, -2, -6, -10, 0, -5);
    ctx.bezierCurveTo(6, -10, 9, -2, 0, 5);
    ctx.closePath();
    ctx.fillStyle = filled ? '#ff5a6e' : '#3a3f5c';
    ctx.fill();
    ctx.restore();
  }

  function drawBricks() {
    bricks.forEach(b => {
      roundRect(b.x, b.y, b.w, b.h, 4);
      const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
      g.addColorStop(0, b.color);
      g.addColorStop(1, shade(b.color, -40));
      ctx.fillStyle = g;
      ctx.fill();
      if (b.maxHp === 2) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = b.hp === 2 ? '#ffffff' : 'rgba(255,255,255,.35)';
        ctx.stroke();
        if (b.hp === 1) { // тріщина
          ctx.beginPath();
          ctx.moveTo(b.x + b.w * 0.3, b.y + 2);
          ctx.lineTo(b.x + b.w * 0.45, b.y + b.h * 0.5);
          ctx.lineTo(b.x + b.w * 0.6, b.y + b.h - 2);
          ctx.strokeStyle = 'rgba(0,0,0,.5)';
          ctx.stroke();
        }
      } else if (b.maxHp === Infinity) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#cfd6ee';
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      ctx.fillRect(b.x + 4, b.y + 3, b.w - 8, 3);
    });
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, Math.min(255, (n >> 16) + amt));
    const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
    const b = Math.max(0, Math.min(255, (n & 255) + amt));
    return `rgb(${r},${g},${b})`;
  }

  function drawPaddle() {
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, '#9be7ff');
    g.addColorStop(1, '#2a7fd4');
    ctx.fillStyle = g;
    ctx.shadowColor = '#4fc3f7';
    ctx.shadowBlur = 15;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / 50);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    });
    ctx.globalAlpha = 1;
  }

  function overlay(title, lines, color) {
    ctx.fillStyle = 'rgba(5, 8, 20, .72)';
    ctx.fillRect(0, HUD, W, H - HUD);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.font = 'bold 48px Segoe UI, Arial';
    ctx.fillText(title, W / 2, H / 2 - 40);
    ctx.fillStyle = '#e8ecff';
    ctx.font = '20px Segoe UI, Arial';
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 15 + i * 32));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawParticles();
    drawPaddle();
    drawBall();
    drawHUD();

    if (state === 'play' && ball.stuck) {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(232,236,255,.8)';
      ctx.font = '18px Segoe UI, Arial';
      ctx.fillText('Натисніть Пробіл або клікніть, щоб запустити м\'яч', W / 2, paddle.y - 60);
    }

    if (state === 'start') overlay('АРКАНОЇД', [
      'Розбийте всі цеглинки на 2 рівнях!',
      'У вас 3 життя.',
      'Натисніть Пробіл або клікніть, щоб почати'
    ], '#7fd4ff');
    else if (state === 'paused') overlay('ПАУЗА', ['Натисніть P, Пробіл або клікніть, щоб продовжити'], '#ffd93d');
    else if (state === 'levelComplete') overlay('РІВЕНЬ ПРОЙДЕНО!', [
      'Рахунок: ' + score,
      'Натисніть Пробіл або клікніть для рівня ' + (levelIndex + 2)
    ], '#6bdc7a');
    else if (state === 'gameOver') overlay('ГРУ ЗАКІНЧЕНО', [
      'Ваш рахунок: ' + score,
      'Натисніть Пробіл або клікніть, щоб зіграти знову'
    ], '#ff5a6e');
    else if (state === 'win') overlay('ПЕРЕМОГА!', [
      'Ви пройшли всі рівні! Рахунок: ' + score,
      'Натисніть Пробіл або клікніть, щоб зіграти знову'
    ], '#ffd93d');
  }

  // ---------- Цикл (фіксований крок 60 Гц) ----------
  let last = performance.now(), acc = 0;
  const STEP = 1000 / 60;
  function loop(now) {
    acc += Math.min(now - last, 100);
    last = now;
    while (acc >= STEP) { update(); acc -= STEP; }
    draw();
    requestAnimationFrame(loop);
  }

  buildLevel(0);
  resetBall();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
