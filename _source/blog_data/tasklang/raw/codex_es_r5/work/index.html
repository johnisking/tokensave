<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rompe Ladrillos</title>
<style>
:root{color-scheme:dark;--cyan:#63e6ff;--pink:#ff5cb8;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#182653 0,#0a1025 55%,#050812 100%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f4f7ff}.wrap{width:min(94vw,900px);padding:24px 0}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 4px 14px}.brand{font-size:clamp(20px,4vw,30px);font-weight:900;letter-spacing:.04em}.brand span{color:var(--cyan)}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:8px 13px;border:1px solid #ffffff20;background:#ffffff09;border-radius:12px;font-size:14px}.stat b{color:var(--gold);margin-left:5px}canvas{width:100%;display:block;aspect-ratio:8/5;border:1px solid #ffffff26;border-radius:18px;background:#090f21;box-shadow:0 24px 80px #0009;touch-action:none}.help{text-align:center;color:#aab6d4;font-size:13px;margin:13px 0 0}.help kbd{font:inherit;color:#eafaff;border:1px solid #ffffff35;border-radius:5px;padding:2px 6px;background:#ffffff0b}
</style>
</head>
<body><main class="wrap"><header class="top"><div class="brand">ROMPE <span>LADRILLOS</span></div><div class="stats"><div class="stat">Puntos <b id="score">0</b></div><div class="stat">Nivel <b id="level">1 / 2</b></div><div class="stat">Vidas <b id="lives">♥ ♥ ♥</b></div></div></header><canvas id="game" width="800" height="500" aria-label="Juego de romper ladrillos"></canvas><p class="help"><kbd>←</kbd> <kbd>→</kbd> o <kbd>A</kbd> <kbd>D</kbd> para mover · Ratón para dirigir · <kbd>Espacio</kbd> para lanzar / continuar</p></main>
<script>
(()=>{const c=document.querySelector('#game'),ctx=c.getContext('2d'),scoreEl=document.querySelector('#score'),levelEl=document.querySelector('#level'),livesEl=document.querySelector('#lives');const W=c.width,H=c.height;let score=0,lives=3,level=1,bricks=[],keys={},mouseX=null,state='ready',last=0,particles=[];const paddle={w:112,h:13,x:W/2-56,y:H-38,speed:7};const ball={x:W/2,y:paddle.y-10,r:8,vx:3.6,vy:-4.3,stuck:true};
function makeBricks(){bricks=[];let rows=level===1?5:6,cols=10,bw=65,bh=21,gap=9,left=(W-(cols*bw+(cols-1)*gap))/2,top=level===1?70:57;for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){if(level===2&&((r+col)%7===0))continue;bricks.push({x:left+col*(bw+gap),y:top+r*(bh+8),w:bw,h:bh,hp:level===2&&r<2?2:1,max:level===2&&r<2?2:1})}}
function ui(){scoreEl.textContent=score;levelEl.textContent=level+' / 2';livesEl.textContent='♥ '.repeat(lives).trim()||'—'}function resetBall(){ball.stuck=true;ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-1;ball.vx=(Math.random()<.5?-1:1)*3.6;ball.vy=-4.3;state='ready'}function start(){if(state==='ready'||state==='won'||state==='lost'){if(state==='won'||state==='lost'){score=0;lives=3;level=1;makeBricks();ui()}state='playing';ball.stuck=false}}
makeBricks();ui();function pointer(e){const rect=c.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*W;mouseX=x-paddle.w/2}c.addEventListener('pointermove',pointer);c.addEventListener('pointerdown',e=>{pointer(e);if(state!=='playing')start()});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','A','d','D'].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.key===' '||e.key==='Enter')start()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function burst(x,y,color){for(let i=0;i<8;i++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:24,color})}function update(dt){let f=Math.min(dt/16.67,2.2);if(state==='playing'){if(mouseX!==null)paddle.x+=Math.max(-paddle.speed*f,Math.min(paddle.speed*f,mouseX-paddle.x));else{if(keys.arrowleft||keys.a)paddle.x-=paddle.speed*f;if(keys.arrowright||keys.d)paddle.x+=paddle.speed*f}paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-1}else{ball.x+=ball.vx*f;ball.y+=ball.vy*f;if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){let hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*5.5;ball.vy=-Math.sqrt(Math.max(12,ball.vx*ball.vx+ball.vy*ball.vy));ball.y=paddle.y-ball.r-1}if(ball.y-ball.r>H){lives--;ui();if(lives<=0)state='lost';else resetBall()}for(let i=bricks.length-1;i>=0;i--){let b=bricks[i];if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.hp--;ball.vy*=-1;burst(ball.x,ball.y,b.hp?'#a88bff':'#63e6ff');if(b.hp<=0){bricks.splice(i,1);score+=level===1?10:20;ui()}break}}if(bricks.length===0){if(level===1){level=2;makeBricks();resetBall();ui()}else state='won'}}}particles=particles.filter(p=>p.life-->0);for(const p of particles){p.x+=p.vx*f;p.y+=p.vy*f}}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0e1935');g.addColorStop(1,'#090d1b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;for(let x=20;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(const b of bricks){let col=b.hp===2?'#9a7bff':(b.y<175?'#ff5ca8':b.y<245?'#ff9566':'#4edbd0');ctx.shadowColor=col;ctx.shadowBlur=12;ctx.fillStyle=col;round(b.x,b.y,b.w,b.h,6);ctx.shadowBlur=0;ctx.fillStyle='#ffffff55';round(b.x+4,b.y+3,b.w-8,3,2);if(b.max===2){ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(b.hp,b.x+b.w/2,b.y+15)}}ctx.shadowColor='#63e6ff';ctx.shadowBlur=19;ctx.fillStyle='#b8f7ff';round(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.shadowColor='#fff';ctx.shadowBlur=14;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;for(const p of particles){ctx.globalAlpha=p.life/24;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;if(state!=='playing'){ctx.fillStyle='#050914ad';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 34px system-ui';let title=state==='won'?'¡VICTORIA!':state==='lost'?'FIN DEL JUEGO':level===2?'NIVEL 2':'LISTO';ctx.fillText(title,W/2,H/2-12);ctx.fillStyle='#b9c8e8';ctx.font='16px system-ui';let sub=state==='won'||state==='lost'?'Pulsa Espacio o haz clic para volver a jugar':'Pulsa Espacio o haz clic para lanzar';ctx.fillText(sub,W/2,H/2+25)}}function loop(t){let dt=t-last||16.67;last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
