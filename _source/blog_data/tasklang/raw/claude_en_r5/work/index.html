<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    color: #e8ecf4;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  canvas {
    background: linear-gradient(#1a2033, #0d1018);
    border: 2px solid #3a4566;
    border-radius: 6px;
    max-width: 100vw;
    max-height: 85vh;
    cursor: none;
  }
  #help {
    margin-top: 10px;
    font-size: 14px;
    color: #8f9bb8;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div id="help">
  Keyboard: ← → or A / D to move, Space to launch, P to pause &nbsp;|&nbsp;
  Mouse: move to steer, click to launch
</div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ---- Level definitions ----
  // Digits = brick hit points (1-3), '.' = empty.
  const LEVELS = [
    {
      name: "Level 1",
      speed: 5,
      layout: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      name: "Level 2",
      speed: 6.2,
      layout: [
        "3.3.33.3.3",
        "2222222222",
        "1.221122.1",
        "2222222222",
        "11.1111.11",
        "3.2.11.2.3",
      ],
    },
  ];

  const BRICK_COLS = 10;
  const BRICK_GAP = 6;
  const BRICK_TOP = 70;
  const BRICK_SIDE = 30;
  const BRICK_H = 24;
  const BRICK_W = (W - BRICK_SIDE * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;
  const COLORS = { 1: "#4fc3f7", 2: "#ffb74d", 3: "#ef5350" };
  const POINTS = { 1: 10, 2: 20, 3: 30 };

  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 9 };
  const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0, stuck: true };

  let bricks = [];
  let levelIndex = 0;
  let score = 0;
  let lives = 3;
  // states: "ready" (ball on paddle), "playing", "paused", "levelClear", "gameOver", "win"
  let state = "ready";
  let messageTimer = 0;

  const keys = { left: false, right: false };
  let mouseX = null;

  function buildLevel(i) {
    bricks = [];
    LEVELS[i].layout.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === ".") return;
        const hp = parseInt(ch, 10);
        bricks.push({
          x: BRICK_SIDE + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W,
          h: BRICK_H,
          hp,
          maxHp: hp,
        });
      });
    });
  }

  function resetBall() {
    ball.stuck = true;
    ball.vx = 0;
    ball.vy = 0;
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launchBall() {
    if (!ball.stuck) return;
    const speed = LEVELS[levelIndex].speed;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = speed * Math.cos(angle);
    ball.vy = speed * Math.sin(angle);
    ball.stuck = false;
    state = "playing";
  }

  function newGame() {
    score = 0;
    lives = 3;
    levelIndex = 0;
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = "ready";
  }

  // Primary action: Space / click
  function action() {
    if (state === "ready") launchBall();
    else if (state === "paused") state = ball.stuck ? "ready" : "playing";
    else if (state === "gameOver" || state === "win") newGame();
    else if (state === "levelClear" && messageTimer <= 0) startNextLevel();
  }

  function startNextLevel() {
    levelIndex++;
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = "ready";
  }

  function togglePause() {
    if (state === "playing" || state === "ready") state = "paused";
    else if (state === "paused") state = ball.stuck ? "ready" : "playing";
  }

  // ---- Input ----
  document.addEventListener("keydown", (e) => {
    switch (e.code) {
      case "ArrowLeft": case "KeyA": keys.left = true; mouseX = null; e.preventDefault(); break;
      case "ArrowRight": case "KeyD": keys.right = true; mouseX = null; e.preventDefault(); break;
      case "Space": case "Enter": action(); e.preventDefault(); break;
      case "KeyP": case "Escape": togglePause(); break;
    }
  });
  document.addEventListener("keyup", (e) => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
  });
  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (W / rect.width);
  });
  canvas.addEventListener("mousedown", (e) => {
    e.preventDefault();
    action();
  });
  // Touch support as a bonus
  canvas.addEventListener("touchmove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.touches[0].clientX - rect.left) * (W / rect.width);
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("touchstart", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.touches[0].clientX - rect.left) * (W / rect.width);
    action();
    e.preventDefault();
  }, { passive: false });
  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state === "playing") state = "paused";
  });

  // ---- Update ----
  function updatePaddle(dt) {
    if (mouseX !== null) {
      paddle.x = mouseX - paddle.w / 2;
    } else {
      if (keys.left) paddle.x -= paddle.speed * dt;
      if (keys.right) paddle.x += paddle.speed * dt;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function circleRect(cx, cy, r, rect) {
    const nx = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    const ny = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 && circleRect(ball.x, ball.y, ball.r, paddle)) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const clamped = Math.max(-1, Math.min(1, hit));
      const angle = clamped * (Math.PI / 3); // up to 60° from vertical
      const speed = Math.hypot(ball.vx, ball.vy);
      ball.vx = speed * Math.sin(angle);
      ball.vy = -speed * Math.cos(angle);
      ball.y = paddle.y - ball.r - 0.5;
    }

    // Bricks (one hit per step)
    for (const b of bricks) {
      if (b.hp <= 0 || !circleRect(ball.x, ball.y, ball.r, b)) continue;
      // Decide bounce axis by smallest penetration
      const overlapL = ball.x + ball.r - b.x;
      const overlapR = b.x + b.w - (ball.x - ball.r);
      const overlapT = ball.y + ball.r - b.y;
      const overlapB = b.y + b.h - (ball.y - ball.r);
      const minX = Math.min(overlapL, overlapR);
      const minY = Math.min(overlapT, overlapB);
      if (minX < minY) {
        ball.vx = overlapL < overlapR ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      } else {
        ball.vy = overlapT < overlapB ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      }
      b.hp--;
      if (b.hp <= 0) score += POINTS[b.maxHp];
      else score += 5;
      // Slight speed-up per hit, capped
      const speed = Math.hypot(ball.vx, ball.vy);
      const maxSpeed = LEVELS[levelIndex].speed * 1.6;
      if (speed < maxSpeed) {
        ball.vx *= 1.01;
        ball.vy *= 1.01;
      }
      break;
    }

    // Avoid near-horizontal trajectories
    const speed = Math.hypot(ball.vx, ball.vy);
    if (Math.abs(ball.vy) < speed * 0.25) {
      ball.vy = Math.sign(ball.vy || -1) * speed * 0.25;
      ball.vx = Math.sign(ball.vx) * Math.sqrt(speed * speed - ball.vy * ball.vy);
    }

    // Fell off bottom
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) {
        state = "gameOver";
      } else {
        resetBall();
        state = "ready";
      }
      return false;
    }

    // Level cleared
    if (bricks.every((b) => b.hp <= 0)) {
      score += lives * 100; // bonus
      if (levelIndex + 1 < LEVELS.length) {
        state = "levelClear";
        messageTimer = 60;
      } else {
        state = "win";
      }
      resetBall();
      return false;
    }
    return true;
  }

  function update(dt) {
    if (state === "paused" || state === "gameOver" || state === "win") return;
    if (state === "levelClear") {
      messageTimer -= dt;
      return;
    }
    updatePaddle(dt);
    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
      return;
    }
    // Sub-steps to prevent tunneling
    const steps = Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / (ball.r * 0.5));
    const sub = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (!stepBall(sub)) break;
    }
  }

  // ---- Render ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "#e8ecf4";
    ctx.font = "bold 20px Segoe UI, Arial";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 20, 30);
    ctx.textAlign = "center";
    ctx.fillText(LEVELS[levelIndex].name + " / " + LEVELS.length, W / 2, 30);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 90, 30);
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(W - 70 + i * 22, 30, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5f7a" : "#3a4566";
      ctx.fill();
    }
    ctx.strokeStyle = "#2a3350";
    ctx.beginPath();
    ctx.moveTo(0, 52);
    ctx.lineTo(W, 52);
    ctx.stroke();
  }

  function drawOverlay(title, subtitle) {
    ctx.fillStyle = "rgba(8, 10, 16, 0.65)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 48px Segoe UI, Arial";
    ctx.fillText(title, W / 2, H / 2 - 30);
    if (subtitle) {
      ctx.font = "20px Segoe UI, Arial";
      ctx.fillStyle = "#b8c2dc";
      ctx.fillText(subtitle, W / 2, H / 2 + 25);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawHUD();

    for (const b of bricks) {
      if (b.hp <= 0) continue;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = COLORS[b.hp];
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
      if (b.maxHp > 1 && b.hp < b.maxHp) {
        ctx.strokeStyle = "rgba(0,0,0,0.35)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x + b.w * 0.3, b.y + 2);
        ctx.lineTo(b.x + b.w * 0.45, b.y + b.h * 0.6);
        ctx.lineTo(b.x + b.w * 0.6, b.y + b.h - 2);
        ctx.stroke();
        ctx.lineWidth = 1;
      }
    }

    // Paddle
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    const grad = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    grad.addColorStop(0, "#c5e1ff");
    grad.addColorStop(1, "#5c8dd6");
    ctx.fillStyle = grad;
    ctx.fill();

    // Ball
    if (state !== "gameOver") {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#9fd3ff";
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    if (state === "ready") {
      ctx.textAlign = "center";
      ctx.fillStyle = "#b8c2dc";
      ctx.font = "20px Segoe UI, Arial";
      ctx.fillText("Press Space or click to launch", W / 2, H / 2 + 80);
    } else if (state === "paused") {
      drawOverlay("Paused", "Press P or Space / click to resume");
    } else if (state === "levelClear") {
      drawOverlay(LEVELS[levelIndex].name + " Cleared!",
        messageTimer > 0 ? "Score: " + score : "Press Space or click for " + LEVELS[levelIndex + 1].name);
    } else if (state === "gameOver") {
      drawOverlay("Game Over", "Final score: " + score + " — Space or click to restart");
    } else if (state === "win") {
      drawOverlay("You Win!", "Final score: " + score + " — Space or click to play again");
    }
  }

  // ---- Main loop (dt normalized to 60 FPS frames) ----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / (1000 / 60), 3);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
