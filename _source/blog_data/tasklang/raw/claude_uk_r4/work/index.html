<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Арканоїд</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at top, #1b2448, #0a0d1c 70%);
    color: #e8ecff;
    font-family: "Segoe UI", Tahoma, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none;
  }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 3px; color: #7fd3ff; text-shadow: 0 0 12px #2a8bd8; }
  canvas {
    background: #0d1230;
    border: 2px solid #3a4a8c;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(60, 120, 255, .35);
    max-width: 96vw; max-height: 80vh;
    cursor: none;
  }
  .help { margin-top: 10px; font-size: 14px; color: #9aa6d8; text-align: center; line-height: 1.6; }
  kbd { background: #26305e; border: 1px solid #47569a; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
</style>
</head>
<body>
<h1>АРКАНОЇД</h1>
<canvas id="game" width="800" height="600"></canvas>
<div class="help">
  Керування: <kbd>←</kbd> <kbd>→</kbd> або <kbd>A</kbd> <kbd>D</kbd> чи рух миші — ракетка ·
  <kbd>Пробіл</kbd> / клік — запуск м'яча ·
  <kbd>P</kbd> — пауза · <kbd>Enter</kbd> — почати знову
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const HUD_H = 40;

  // ---------- Рівні ----------
  // Символи: '.' — порожньо, '1' — звичайна цеглинка, '2' — міцна (2 удари), '#' — дуже міцна (3 удари)
  const LEVELS = [
    {
      name: 'Рівень 1',
      ballSpeed: 360,
      map: [
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
      ]
    },
    {
      name: 'Рівень 2',
      ballSpeed: 430,
      map: [
        '#........#',
        '2#......#2',
        '22#....#22',
        '1122##2211',
        '1112..2111',
        '11.2112.11',
        '1..1..1..1',
      ]
    }
  ];

  const ROW_COLORS = ['#ff5c7a', '#ff9f43', '#ffd93d', '#6bdc7b', '#4cc9f0', '#9b7bff', '#ff7bd5'];
  const BRICK_COLS = 10;
  const BRICK_GAP = 6;
  const BRICK_TOP = HUD_H + 40;
  const BRICK_SIDE = 30;
  const BRICK_W = (W - BRICK_SIDE * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;
  const BRICK_H = 22;

  // ---------- Стан гри ----------
  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 620 };
  const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0, stuck: true };
  let bricks = [];
  let particles = [];
  let score = 0;
  let lives = 3;
  let levelIndex = 0;
  let state = 'start'; // start | playing | paused | levelComplete | gameOver | win
  let stateTimer = 0;
  const keys = { left: false, right: false };
  let mouseX = null;

  function buildLevel(i) {
    bricks = [];
    const map = LEVELS[i].map;
    map.forEach((row, r) => {
      for (let c = 0; c < BRICK_COLS; c++) {
        const ch = row[c];
        if (!ch || ch === '.') continue;
        const hp = ch === '#' ? 3 : ch === '2' ? 2 : 1;
        bricks.push({
          x: BRICK_SIDE + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H,
          hp, maxHp: hp,
          color: ROW_COLORS[r % ROW_COLORS.length],
          alive: true
        });
      }
    });
  }

  function resetBall() {
    ball.stuck = true;
    ball.vx = 0; ball.vy = 0;
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launchBall() {
    if (!ball.stuck) return;
    const speed = LEVELS[levelIndex].ballSpeed;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    ball.stuck = false;
  }

  function newGame() {
    score = 0;
    lives = 3;
    levelIndex = 0;
    particles = [];
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = 'playing';
  }

  function nextLevel() {
    levelIndex++;
    particles = [];
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = 'playing';
  }

  // ---------- Введення ----------
  function primaryAction() {
    switch (state) {
      case 'start': newGame(); break;
      case 'playing': launchBall(); break;
      case 'paused': state = 'playing'; break;
      case 'levelComplete': if (stateTimer <= 0) nextLevel(); break;
      case 'gameOver':
      case 'win': if (stateTimer <= 0) newGame(); break;
    }
  }

  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A' || k === 'ф' || k === 'Ф') { keys.left = true; mouseX = null; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D' || k === 'в' || k === 'В') { keys.right = true; mouseX = null; e.preventDefault(); }
    else if (k === ' ' || k === 'Spacebar' || k === 'ArrowUp') { e.preventDefault(); if (!e.repeat) primaryAction(); }
    else if (k === 'Enter') {
      e.preventDefault();
      if (state === 'start' || state === 'gameOver' || state === 'win') newGame();
      else if (state === 'levelComplete') nextLevel();
      else if (state === 'playing' || state === 'paused') newGame();
    }
    else if (k === 'p' || k === 'P' || k === 'з' || k === 'З' || k === 'Escape') {
      if (state === 'playing') state = 'paused';
      else if (state === 'paused') state = 'playing';
    }
  });
  document.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A' || k === 'ф' || k === 'Ф') keys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D' || k === 'в' || k === 'В') keys.right = false;
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener('mousemove', e => { mouseX = canvasX(e.clientX); });
  canvas.addEventListener('mousedown', e => { e.preventDefault(); mouseX = canvasX(e.clientX); primaryAction(); });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); mouseX = canvasX(e.touches[0].clientX); }, { passive: false });
  canvas.addEventListener('touchstart', e => { e.preventDefault(); mouseX = canvasX(e.touches[0].clientX); primaryAction(); }, { passive: false });
  window.addEventListener('blur', () => { keys.left = keys.right = false; if (state === 'playing') state = 'paused'; });

  // ---------- Логіка ----------
  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6 + Math.random() * 0.3, color });
    }
  }

  function updatePaddle(dt) {
    if (keys.left || keys.right) {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      paddle.x += dir * paddle.speed * dt;
    } else if (mouseX !== null) {
      paddle.x = mouseX - paddle.w / 2;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function hitBrick(b) {
    b.hp--;
    if (b.hp <= 0) {
      b.alive = false;
      score += 10 * b.maxHp * (levelIndex + 1);
      spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);
    } else {
      score += 5;
    }
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Стіни
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < HUD_H) { ball.y = HUD_H + ball.r; ball.vy = Math.abs(ball.vy); }

    // Ракетка
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x + ball.r >= paddle.x && ball.x - ball.r <= paddle.x + paddle.w) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const clamped = Math.max(-1, Math.min(1, hit));
      const angle = clamped * (Math.PI / 3); // до 60° від вертикалі
      const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.01, LEVELS[levelIndex].ballSpeed * 1.6);
      ball.vx = Math.sin(angle) * speed;
      ball.vy = -Math.cos(angle) * speed;
      ball.y = paddle.y - ball.r - 0.5;
    }

    // Цеглинки
    for (const b of bricks) {
      if (!b.alive) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy <= ball.r * ball.r) {
        // Визначаємо сторону зіткнення за найменшим проникненням
        const overlapL = ball.x + ball.r - b.x;
        const overlapR = b.x + b.w - (ball.x - ball.r);
        const overlapT = ball.y + ball.r - b.y;
        const overlapB = b.y + b.h - (ball.y - ball.r);
        const minX = Math.min(overlapL, overlapR);
        const minY = Math.min(overlapT, overlapB);
        if (minX < minY) {
          if (overlapL < overlapR) { ball.x = b.x - ball.r; ball.vx = -Math.abs(ball.vx); }
          else { ball.x = b.x + b.w + ball.r; ball.vx = Math.abs(ball.vx); }
        } else {
          if (overlapT < overlapB) { ball.y = b.y - ball.r; ball.vy = -Math.abs(ball.vy); }
          else { ball.y = b.y + b.h + ball.r; ball.vy = Math.abs(ball.vy); }
        }
        hitBrick(b);
        break; // одне зіткнення за крок
      }
    }

    // Не даємо м'ячу летіти майже горизонтально
    const sp = Math.hypot(ball.vx, ball.vy);
    if (Math.abs(ball.vy) < sp * 0.25) {
      ball.vy = Math.sign(ball.vy || -1) * sp * 0.25;
      ball.vx = Math.sign(ball.vx) * Math.sqrt(sp * sp - ball.vy * ball.vy);
    }

    // Втрата м'яча
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) {
        state = 'gameOver';
        stateTimer = 0.6;
      } else {
        resetBall();
      }
      return false;
    }
    return true;
  }

  function update(dt) {
    // Частинки оновлюються завжди (окрім паузи)
    if (state !== 'paused') {
      for (const p of particles) {
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vy += 400 * dt;
        p.life -= dt;
      }
      particles = particles.filter(p => p.life > 0);
    }
    if (stateTimer > 0) stateTimer -= dt;
    if (state !== 'playing') return;

    updatePaddle(dt);

    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
      return;
    }

    // Підкроки, щоб м'яч не «пролітав» крізь цеглинки
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / (ball.r * 0.5)));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (!stepBall(sdt)) break;
    }

    if (state === 'playing' && bricks.every(b => !b.alive)) {
      if (levelIndex < LEVELS.length - 1) {
        state = 'levelComplete';
      } else {
        score += lives * 500;
        state = 'win';
      }
      stateTimer = 0.6;
    }
  }

  // ---------- Малювання ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.round(r * k); g = Math.round(g * k); b = Math.round(b * k);
    return `rgb(${Math.min(255, r)},${Math.min(255, g)},${Math.min(255, b)})`;
  }

  function drawHUD() {
    ctx.fillStyle = '#141a3d';
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.fillStyle = '#3a4a8c';
    ctx.fillRect(0, HUD_H - 2, W, 2);

    ctx.font = 'bold 18px "Segoe UI", sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd93d';
    ctx.fillText('Рахунок: ' + score, 16, HUD_H / 2);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#7fd3ff';
    ctx.fillText(LEVELS[levelIndex].name + ' / ' + LEVELS.length, W / 2, HUD_H / 2);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#ff5c7a';
    ctx.fillText('Життя:', W - 16 - 3 * 24, HUD_H / 2);
    for (let i = 0; i < 3; i++) {
      drawHeart(W - 16 - (2 - i) * 24 - 10, HUD_H / 2, i < lives);
    }
  }

  function drawHeart(x, y, filled) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.bezierCurveTo(-10, -2, -6, -10, 0, -4);
    ctx.bezierCurveTo(6, -10, 10, -2, 0, 6);
    ctx.closePath();
    if (filled) { ctx.fillStyle = '#ff4d6d'; ctx.fill(); }
    else { ctx.strokeStyle = '#6b3446'; ctx.lineWidth = 1.5; ctx.stroke(); }
    ctx.restore();
  }

  function drawBricks() {
    for (const b of bricks) {
      if (!b.alive) continue;
      const k = 0.55 + 0.45 * (b.hp / b.maxHp);
      const grad = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
      grad.addColorStop(0, shade(b.color, k * 1.15));
      grad.addColorStop(1, shade(b.color, k * 0.75));
      ctx.fillStyle = grad;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      if (b.maxHp > 1) {
        ctx.strokeStyle = b.maxHp === 3 ? '#e6e9ff' : 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Позначки міцності
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        for (let i = 0; i < b.hp; i++) {
          ctx.beginPath();
          ctx.arc(b.x + b.w / 2 + (i - (b.hp - 1) / 2) * 9, b.y + b.h / 2, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(b.x + 4, b.y + 3, b.w - 8, 3);
    }
  }

  function drawPaddle() {
    const grad = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    grad.addColorStop(0, '#b6e6ff');
    grad.addColorStop(1, '#2a8bd8');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#4cc9f0';
    ctx.shadowBlur = 14;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 16;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function overlay(title, lines, color) {
    ctx.fillStyle = 'rgba(5, 8, 22, 0.72)';
    ctx.fillRect(0, HUD_H, W, H - HUD_H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 48px "Segoe UI", sans-serif';
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    ctx.fillText(title, W / 2, H / 2 - 40);
    ctx.shadowBlur = 0;
    ctx.font = '20px "Segoe UI", sans-serif';
    ctx.fillStyle = '#dfe5ff';
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 20 + i * 30));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawHUD();
    drawBricks();
    drawPaddle();
    drawBall();
    drawParticles();

    if (state === 'playing' && ball.stuck) {
      ctx.textAlign = 'center';
      ctx.font = '18px "Segoe UI", sans-serif';
      ctx.fillStyle = 'rgba(223,229,255,0.85)';
      ctx.fillText('Натисніть Пробіл або клікніть, щоб запустити м\'яч', W / 2, H - 90);
    }

    switch (state) {
      case 'start':
        overlay('АРКАНОЇД', [
          'Розбийте всі цеглинки на 2 рівнях. У вас 3 життя.',
          'Миша або ← → / A D — рух ракетки',
          'Натисніть Пробіл або клікніть, щоб почати'
        ], '#7fd3ff');
        break;
      case 'paused':
        overlay('ПАУЗА', ['Натисніть P або клікніть, щоб продовжити'], '#ffd93d');
        break;
      case 'levelComplete':
        overlay('РІВЕНЬ ПРОЙДЕНО!', [
          'Рахунок: ' + score,
          'Пробіл / клік — перейти до рівня ' + (levelIndex + 2)
        ], '#6bdc7b');
        break;
      case 'gameOver':
        overlay('ГРУ ЗАКІНЧЕНО', [
          'Ваш рахунок: ' + score,
          'Пробіл / клік / Enter — грати знову'
        ], '#ff5c7a');
        break;
      case 'win':
        overlay('ПЕРЕМОГА!', [
          'Усі рівні пройдено! Бонус за життя: ' + (lives * 500),
          'Підсумковий рахунок: ' + score,
          'Пробіл / клік / Enter — грати знову'
        ], '#ffd93d');
        break;
    }
  }

  // ---------- Головний цикл ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  buildLevel(0);
  resetBall();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
