<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Арканоїд</title>
<style>
:root{color-scheme:dark;--ink:#eef6ff;--muted:#9db0d0;--cyan:#4de4df;--pink:#ff5cad;--gold:#ffd166}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 5%,#1b3260 0,#0b1225 55%,#060a14 100%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(100%,820px)}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}h1{margin:0;font-size:clamp(1.5rem,4vw,2.1rem);letter-spacing:.13em;text-transform:uppercase}h1 span{color:var(--cyan)}.stats{display:flex;gap:clamp(12px,4vw,32px);font-size:.95rem;color:var(--muted)}.stats strong{color:var(--ink);font-variant-numeric:tabular-nums;margin-left:5px}#lives{color:var(--pink);letter-spacing:3px}.board{position:relative;border:1px solid #49628e;border-radius:14px;overflow:hidden;background:#090f20;box-shadow:0 22px 70px #0009,0 0 32px #4de4df12}canvas{display:block;width:100%;height:auto;touch-action:none}footer{display:flex;justify-content:space-between;gap:14px;margin-top:12px;color:var(--muted);font-size:.85rem}.key{display:inline-block;padding:1px 7px;border:1px solid #526789;border-radius:5px;color:var(--ink);font-size:.8em}.hint{text-align:right}@media(max-width:520px){header{align-items:flex-start;flex-direction:column}.stats{width:100%;justify-content:space-between}.hint{max-width:60%}}
</style>
</head>
<body>
<main class="wrap">
<header><h1><span>◈</span> Арканоїд</h1><div class="stats" aria-live="polite"><div>РАХУНОК<strong id="score">0</strong></div><div>РІВЕНЬ<strong id="level">1 / 2</strong></div><div>ЖИТТЯ<strong id="lives">♥♥♥</strong></div></div></header>
<div class="board"><canvas id="game" width="800" height="560" aria-label="Ігрове поле Арканоїд"></canvas></div>
<footer><div>Керування: <span class="key">←</span> <span class="key">→</span> або миша</div><div class="hint">Пробіл — старт / пауза · <span class="key">R</span> — нова гра</div></footer>
</main>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
const scoreEl=document.querySelector('#score'),levelEl=document.querySelector('#level'),livesEl=document.querySelector('#lives');
const colors=['#4de4df','#54a6ff','#b178ff','#ff5cad','#ffd166'];
let score=0,lives=3,level=1,bricks=[],keys={},state='ready',last=0,particles=[];
const paddle={w:112,h:13,x:W/2-56,y:H-38,speed:7};
const ball={r:8,x:W/2,y:paddle.y-12,vx:3.2,vy:-4.3,stuck:true};
function buildBricks(){bricks=[];const rows=level===1?4:5,cols=10,bw=68,bh=21,gap=8,left=(W-(cols*bw+(cols-1)*gap))/2,top=76;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(level===2&&((r===1||r===3)&&c>2&&c<7))continue;bricks.push({x:left+c*(bw+gap),y:top+r*(bh+9),w:bw,h:bh,hp:level===2&&r<2?2:1,color:colors[(r+c)%colors.length],alive:true})}}
function resetBall(){ball.stuck=true;ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;ball.vx=(Math.random()<.5?-1:1)*3.2;ball.vy=-4.3}
function newGame(){score=0;lives=3;level=1;state='ready';paddle.x=W/2-paddle.w/2;particles=[];buildBricks();resetBall();updateHud()}
function updateHud(){scoreEl.textContent=score;levelEl.textContent=level+' / 2';livesEl.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives)}
function launch(){if(state==='ready'){state='playing';ball.stuck=false}}
function pointer(e){const rect=canvas.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(e.clientX-rect.left)*W/rect.width-paddle.w/2));if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2}}
canvas.addEventListener('pointermove',pointer);canvas.addEventListener('pointerdown',e=>{pointer(e);launch()});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','Spacebar'].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.key===' '){if(state==='ready')launch();else if(state==='playing')state='paused';else if(state==='paused')state='playing'}if(e.key.toLowerCase()==='r')newGame()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function burst(x,y,color){for(let i=0;i<7;i++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:24,color})}
function collide(){if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){const offset=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=offset*5.2;ball.vy=-Math.sqrt(Math.max(12,ball.vx*ball.vx+22));ball.y=paddle.y-ball.r-1}
for(const b of bricks){if(!b.alive||ball.x+ball.r<b.x||ball.x-ball.r>b.x+b.w||ball.y+ball.r<b.y||ball.y-ball.r>b.y+b.h)continue;b.hp--;score+=b.hp?5:10;if(!b.hp){b.alive=false;burst(ball.x,ball.y,b.color)}else burst(ball.x,ball.y,'#fff');if(ball.x> b.x&&ball.x<b.x+b.w)ball.vy*=-1;else ball.vx*=-1;break}
if(bricks.every(b=>!b.alive)){if(level===1){level=2;buildBricks();resetBall();state='ready'}else state='won'}
}
function update(dt){if(keys.arrowleft||keys.a)paddle.x-=paddle.speed*dt;if(keys.arrowright||keys.d)paddle.x+=paddle.speed*dt;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2}if(state==='playing'){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;collide();if(ball.y-ball.r>H){lives--;updateHud();if(lives<=0)state='over';else{resetBall();state='ready'}}}particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#111c35');bg.addColorStop(1,'#090f20');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;for(let x=20;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=20;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
for(const b of bricks){if(!b.alive)continue;ctx.shadowColor=b.color;ctx.shadowBlur=9;ctx.fillStyle=b.hp>1?'#fff':b.color;rounded(b.x,b.y,b.w,b.h,5);ctx.shadowBlur=0;if(b.hp>1){ctx.fillStyle='#182039';rounded(b.x+2,b.y+2,b.w-4,b.h-4,4);ctx.fillStyle=b.color;ctx.fillRect(b.x+8,b.y+8,b.w-16,4)}}
ctx.shadowColor='#4de4df';ctx.shadowBlur=17;const pg=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x+paddle.w,paddle.y);pg.addColorStop(0,'#36aaff');pg.addColorStop(.5,'#76fff0');pg.addColorStop(1,'#36aaff');ctx.fillStyle=pg;rounded(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.shadowBlur=0;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=15;ctx.fill();ctx.shadowBlur=0;for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/24);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;
if(state!=='playing'){ctx.fillStyle='#050a16a8';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#eef6ff';ctx.font='700 32px system-ui';let title=state==='ready'?(level===1&&score===0?'Починаємо?':'Рівень '+level):state==='paused'?'ПАУЗА':state==='won'?'ПЕРЕМОГА!':'ГРУ ЗАВЕРШЕНО';ctx.fillText(title,W/2,H/2-14);ctx.font='16px system-ui';ctx.fillStyle='#b8c9e6';ctx.fillText(state==='ready'?'Натисни пробіл або клацни, щоб запустити':state==='paused'?'Пробіл — продовжити':'Натисни R, щоб зіграти ще раз',W/2,H/2+23)} }
function frame(t){const dt=Math.min((t-last)/16.67||1,2);last=t;update(dt);draw();requestAnimationFrame(frame)}buildBricks();updateHud();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
