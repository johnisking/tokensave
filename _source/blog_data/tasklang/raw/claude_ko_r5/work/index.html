<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>벽돌깨기</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111827;
    color: #e5e7eb;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #0b1020;
    border: 2px solid #374151;
    border-radius: 6px;
    max-width: 100vw;
    max-height: 85vh;
    cursor: none;
  }
  .help {
    margin-top: 10px;
    font-size: 14px;
    color: #9ca3af;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div class="help">
  이동: 마우스 / ← → (또는 A, D) &nbsp;|&nbsp; 발사: 클릭 / 스페이스 &nbsp;|&nbsp; 일시정지: P
</div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ----- 레벨 정의 (0: 빈칸, 1~3: 벽돌 내구도) -----
  const LEVELS = [
    {
      name: "레벨 1",
      speed: 5,
      map: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      name: "레벨 2",
      speed: 6,
      map: [
        "3300000033",
        "2222222222",
        "1213113121",
        "0222222220",
        "1111111111",
        "0011221100",
      ],
    },
  ];

  const COLORS = { 1: "#22c55e", 2: "#f59e0b", 3: "#ef4444" };
  const BRICK_COLS = 10, BRICK_W = 70, BRICK_H = 22, BRICK_GAP = 6;
  const BRICK_TOP = 70;
  const BRICK_LEFT = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;

  const paddle = { w: 110, h: 14, x: (W - 110) / 2, y: H - 40, speed: 9 };
  const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0, speed: 5 };

  let bricks = [];
  let score = 0;
  let lives = 3;
  let level = 0;
  // state: "ready" (공 대기), "playing", "paused", "levelclear", "gameover", "win"
  let state = "ready";
  const keys = { left: false, right: false };

  function loadLevel(idx) {
    level = idx;
    bricks = [];
    const map = LEVELS[idx].map;
    for (let r = 0; r < map.length; r++) {
      for (let c = 0; c < BRICK_COLS; c++) {
        const hp = parseInt(map[r][c], 10);
        if (hp > 0) {
          bricks.push({
            x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP),
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            hp,
            maxHp: hp,
          });
        }
      }
    }
    ball.speed = LEVELS[idx].speed;
    resetBall();
  }

  function resetBall() {
    paddle.x = (W - paddle.w) / 2;
    ball.vx = 0;
    ball.vy = 0;
    stickBall();
    state = "ready";
  }

  function stickBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launch() {
    const angle = (Math.random() * 0.6 - 0.3) - Math.PI / 2; // 위쪽 ±17도
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    state = "playing";
  }

  function newGame() {
    score = 0;
    lives = 3;
    loadLevel(0);
  }

  // 사용자의 "행동" 입력(클릭/스페이스) 처리
  function action() {
    switch (state) {
      case "ready": launch(); break;
      case "paused": state = "playing"; break;
      case "levelclear": loadLevel(level + 1); break;
      case "gameover":
      case "win": newGame(); break;
    }
  }

  // ----- 입력 -----
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); action(); }
    else if (e.key === "p" || e.key === "P") {
      if (state === "playing") state = "paused";
      else if (state === "paused") state = "playing";
    }
    if (e.key.startsWith("Arrow")) e.preventDefault();
  });
  document.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
  });
  canvas.addEventListener("mousemove", (e) => {
    if (state === "paused") return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = clamp(mx - paddle.w / 2, 0, W - paddle.w);
  });
  canvas.addEventListener("mousedown", (e) => { e.preventDefault(); action(); });
  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state === "playing") state = "paused";
  });

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  // ----- 업데이트 -----
  function update() {
    if (state !== "playing" && state !== "ready") return;

    if (keys.left) paddle.x -= paddle.speed;
    if (keys.right) paddle.x += paddle.speed;
    paddle.x = clamp(paddle.x, 0, W - paddle.w);

    if (state === "ready") { stickBall(); return; }

    // 터널링 방지를 위해 여러 단계로 나눠 이동
    const steps = Math.ceil(ball.speed / 3);
    for (let i = 0; i < steps; i++) {
      ball.x += ball.vx / steps;
      ball.y += ball.vy / steps;
      if (collide()) break;
    }
  }

  // 충돌 처리. 레벨 종료/목숨 감소 시 true 반환
  function collide() {
    // 벽
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // 바닥으로 떨어짐
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) { state = "gameover"; }
      else { resetBall(); }
      return true;
    }

    // 패들
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x + ball.r >= paddle.x && ball.x - ball.r <= paddle.x + paddle.w) {
      // 맞은 위치에 따라 반사 각도 결정 (-60° ~ +60°)
      const hit = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const angle = hit * (Math.PI / 3);
      ball.vx = Math.sin(angle) * ball.speed;
      ball.vy = -Math.cos(angle) * ball.speed;
      ball.y = paddle.y - ball.r;
    }

    // 벽돌
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const nx = clamp(ball.x, b.x, b.x + BRICK_W);
      const ny = clamp(ball.y, b.y, b.y + BRICK_H);
      const dx = ball.x - nx, dy = ball.y - ny;
      if (dx * dx + dy * dy <= ball.r * ball.r) {
        // 겹친 정도가 작은 축으로 반사
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BRICK_W - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BRICK_H - (ball.y - ball.r));
        if (overlapX < overlapY) {
          ball.vx = ball.x < b.x + BRICK_W / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
        } else {
          ball.vy = ball.y < b.y + BRICK_H / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
        }
        b.hp--;
        score += 10;
        if (b.hp <= 0) {
          score += 10 * b.maxHp;
          bricks.splice(i, 1);
        }
        if (bricks.length === 0) {
          score += lives * 100; // 남은 목숨 보너스
          state = level + 1 < LEVELS.length ? "levelclear" : "win";
          return true;
        }
        break; // 한 단계에 벽돌 하나만 처리
      }
    }
    return false;
  }

  // ----- 그리기 -----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "#e5e7eb";
    ctx.font = "bold 20px 'Segoe UI', 'Malgun Gothic', sans-serif";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillText("점수: " + score, 20, 30);
    ctx.textAlign = "center";
    ctx.fillText(LEVELS[level].name, W / 2, 30);
    ctx.textAlign = "right";
    ctx.fillText("목숨:", W - 20 - 3 * 22, 30);
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(W - 20 - (2 - i) * 22 - 8, 30, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#f43f5e" : "#374151";
      ctx.fill();
    }
    ctx.strokeStyle = "#1f2937";
    ctx.beginPath();
    ctx.moveTo(0, 55);
    ctx.lineTo(W, 55);
    ctx.stroke();
  }

  function drawOverlay(title, sub) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 44px 'Segoe UI', 'Malgun Gothic', sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 30);
    ctx.font = "20px 'Segoe UI', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#d1d5db";
    ctx.fillText(sub, W / 2, H / 2 + 20);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 벽돌
    for (const b of bricks) {
      ctx.fillStyle = COLORS[b.hp];
      roundRect(b.x, b.y, BRICK_W, BRICK_H, 4);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.fillRect(b.x + 3, b.y + 3, BRICK_W - 6, 4);
    }

    // 패들
    ctx.fillStyle = "#60a5fa";
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();

    // 공
    if (state !== "gameover") {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = "#fde047";
      ctx.fill();
    }

    drawHUD();

    if (state === "ready") {
      ctx.textAlign = "center";
      ctx.fillStyle = "#d1d5db";
      ctx.font = "18px 'Segoe UI', 'Malgun Gothic', sans-serif";
      ctx.fillText("클릭 또는 스페이스로 공 발사", W / 2, H / 2 + 60);
    } else if (state === "paused") {
      drawOverlay("일시정지", "P, 클릭 또는 스페이스로 계속");
    } else if (state === "levelclear") {
      drawOverlay(LEVELS[level].name + " 클리어!", "클릭 또는 스페이스로 다음 레벨");
    } else if (state === "gameover") {
      drawOverlay("게임 오버", "최종 점수: " + score + "  —  클릭 또는 스페이스로 다시 시작");
    } else if (state === "win") {
      drawOverlay("모든 레벨 클리어!", "최종 점수: " + score + "  —  클릭 또는 스페이스로 다시 시작");
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  newGame();
  loop();
})();
</script>
</body>
</html>
