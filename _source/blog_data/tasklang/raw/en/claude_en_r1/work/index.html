<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    color: #e8ecf4;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  canvas {
    background: linear-gradient(#1b2133, #0d1018);
    border: 2px solid #3a4560;
    border-radius: 6px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
    touch-action: none;
  }
  .help {
    margin-top: 10px;
    font-size: 14px;
    color: #9aa6c0;
    text-align: center;
  }
  kbd {
    background: #2a3248;
    border: 1px solid #47526e;
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 12px;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div class="help">
  Move: <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> or mouse &nbsp;·&nbsp;
  Launch: <kbd>Space</kbd> or click &nbsp;·&nbsp; Pause: <kbd>P</kbd> / <kbd>Esc</kbd>
</div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ---- Configuration ----
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 620;
  const BALL_R = 8;
  const START_LIVES = 3;
  const BRICK_ROWS_TOP = 70, BRICK_GAP = 6, BRICK_H = 24, BRICK_COLS = 12, SIDE_MARGIN = 30;
  const BRICK_W = (W - SIDE_MARGIN * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;

  // Level layouts: '.' = empty, digits = brick hit points (1-3)
  const LEVELS = [
    {
      name: "Level 1",
      ballSpeed: 380,
      map: [
        "111111111111",
        "111111111111",
        "111111111111",
        "111111111111",
        "111111111111",
      ],
    },
    {
      name: "Level 2",
      ballSpeed: 450,
      map: [
        "3..333333..3",
        "22.222222.22",
        "222..22..222",
        "111111111111",
        ".1111..1111.",
        "2.2.2..2.2.2",
        "111111111111",
      ],
    },
  ];

  const COLORS = { 1: ["#4fc3f7", "#0288d1"], 2: ["#ffb74d", "#ef6c00"], 3: ["#e57373", "#c62828"] };
  const ROW_TINTS = ["#4fc3f7", "#81c784", "#fff176", "#ba68c8", "#4dd0e1", "#aed581", "#f06292"];

  // ---- State ----
  let state = "title"; // title | serve | play | paused | levelClear | gameOver | win
  let levelIndex = 0, score = 0, lives = START_LIVES;
  let bricks = [];
  const paddle = { x: W / 2 - PADDLE_W / 2, w: PADDLE_W };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, speed: 0 };
  const keys = { left: false, right: false };
  let mouseX = null;
  let particles = [];
  let flashTimer = 0;

  function buildLevel(i) {
    bricks = [];
    LEVELS[i].map.forEach((row, r) => {
      for (let c = 0; c < BRICK_COLS; c++) {
        const ch = row[c];
        if (!ch || ch === ".") continue;
        const hp = parseInt(ch, 10);
        bricks.push({
          x: SIDE_MARGIN + c * (BRICK_W + BRICK_GAP),
          y: BRICK_ROWS_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H,
          hp, maxHp: hp, row: r,
        });
      }
    });
  }

  function resetBall() {
    ball.speed = LEVELS[levelIndex].ballSpeed;
    ball.vx = 0; ball.vy = 0;
    stickBall();
  }

  function stickBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = PADDLE_Y - BALL_R - 1;
  }

  function launchBall() {
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    state = "play";
  }

  function newGame() {
    levelIndex = 0; score = 0; lives = START_LIVES;
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    particles = [];
    state = "serve";
  }

  function nextLevel() {
    levelIndex++;
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = "serve";
  }

  // Primary action: Space / click / Enter
  function action() {
    switch (state) {
      case "title": newGame(); break;
      case "serve": launchBall(); break;
      case "paused": state = "play"; break;
      case "levelClear": nextLevel(); break;
      case "gameOver":
      case "win": newGame(); break;
    }
  }

  function togglePause() {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }

  // ---- Input ----
  window.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; mouseX = null; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; mouseX = null; e.preventDefault(); }
    else if (k === " " || k === "Enter") { if (!e.repeat) action(); e.preventDefault(); }
    else if (k === "p" || k === "P" || k === "Escape") { togglePause(); e.preventDefault(); }
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });
  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state === "play") state = "paused";
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener("mousemove", (e) => { mouseX = canvasX(e.clientX); });
  canvas.addEventListener("mousedown", (e) => { if (e.button === 0) { mouseX = canvasX(e.clientX); action(); } });
  canvas.addEventListener("touchstart", (e) => { mouseX = canvasX(e.touches[0].clientX); action(); e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchmove", (e) => { mouseX = canvasX(e.touches[0].clientX); e.preventDefault(); }, { passive: false });

  // ---- Update ----
  function updatePaddle(dt) {
    if (mouseX !== null) {
      paddle.x = mouseX - paddle.w / 2;
    } else {
      let dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      paddle.x += dir * PADDLE_SPEED * dt;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.3, color });
    }
  }

  function setBallDirection(angle) {
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + BALL_R >= PADDLE_Y && ball.y - BALL_R <= PADDLE_Y + PADDLE_H &&
        ball.x + BALL_R >= paddle.x && ball.x - BALL_R <= paddle.x + paddle.w) {
      const hit = ((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2));
      const clamped = Math.max(-1, Math.min(1, hit));
      const maxAngle = Math.PI / 3; // 60 degrees from vertical
      setBallDirection(-Math.PI / 2 + clamped * maxAngle);
      ball.y = PADDLE_Y - BALL_R - 0.5;
    }

    // Bricks (one collision per sub-step)
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const nx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const ny = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - nx, dy = ball.y - ny;
      if (dx * dx + dy * dy > BALL_R * BALL_R) continue;

      // Determine reflection axis using penetration depth
      const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + b.w - (ball.x - BALL_R));
      const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + b.h - (ball.y - BALL_R));
      if (overlapX < overlapY) {
        ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      } else {
        ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      }

      b.hp--;
      if (b.hp <= 0) {
        score += 10 * b.maxHp;
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, brickColor(b));
        bricks.splice(i, 1);
      } else {
        score += 5;
      }
      // Gradually speed up
      ball.speed = Math.min(ball.speed * 1.008, LEVELS[levelIndex].ballSpeed * 1.5);
      const mag = Math.hypot(ball.vx, ball.vy);
      ball.vx = ball.vx / mag * ball.speed;
      ball.vy = ball.vy / mag * ball.speed;
      break;
    }

    // Prevent near-horizontal trajectories
    const minVy = ball.speed * 0.25;
    if (Math.abs(ball.vy) < minVy) {
      ball.vy = (ball.vy < 0 ? -1 : 1) * minVy;
      ball.vx = Math.sign(ball.vx || 1) * Math.sqrt(ball.speed * ball.speed - minVy * minVy);
    }
  }

  function update(dt) {
    // Particles always animate
    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; });
    particles = particles.filter(p => p.life > 0);
    if (flashTimer > 0) flashTimer -= dt;

    if (state === "serve") {
      updatePaddle(dt);
      stickBall();
      return;
    }
    if (state !== "play") return;

    updatePaddle(dt);

    // Sub-step to avoid tunneling through bricks
    const steps = Math.ceil((ball.speed * dt) / (BALL_R * 0.5));
    const sdt = dt / steps;
    for (let s = 0; s < steps; s++) {
      stepBall(sdt);
      if (bricks.length === 0) {
        state = levelIndex < LEVELS.length - 1 ? "levelClear" : "win";
        score += lives * 100;
        return;
      }
      if (ball.y - BALL_R > H) {
        lives--;
        flashTimer = 0.4;
        if (lives <= 0) {
          state = "gameOver";
        } else {
          resetBall();
          state = "serve";
        }
        return;
      }
    }
  }

  // ---- Render ----
  function brickColor(b) {
    if (b.maxHp === 1) return ROW_TINTS[b.row % ROW_TINTS.length];
    return COLORS[b.hp][0];
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBricks() {
    bricks.forEach(b => {
      const color = brickColor(b);
      const grad = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
      grad.addColorStop(0, color);
      grad.addColorStop(1, shade(color, -0.35));
      ctx.fillStyle = grad;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.lineWidth = 1;
      ctx.stroke();
      if (b.maxHp > 1) {
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.font = "bold 13px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
    });
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, bl = n & 255;
    r = Math.round(Math.max(0, Math.min(255, r + r * amt)));
    g = Math.round(Math.max(0, Math.min(255, g + g * amt)));
    bl = Math.round(Math.max(0, Math.min(255, bl + bl * amt)));
    return `rgb(${r},${g},${bl})`;
  }

  function drawPaddle() {
    const grad = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
    grad.addColorStop(0, "#e0e7ff");
    grad.addColorStop(1, "#7986cb");
    ctx.fillStyle = grad;
    roundRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H, 7);
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#9fd8ff";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life * 1.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    });
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(0, 0, W, 44);
    ctx.font = "bold 20px 'Segoe UI', sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#e8ecf4";

    ctx.textAlign = "left";
    ctx.fillText(`Score: ${score}`, 16, 22);

    ctx.textAlign = "center";
    ctx.fillText(LEVELS[levelIndex].name, W / 2, 22);

    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 16 - START_LIVES * 22, 22);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - 8 - i * 22, 22, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5c7a" : "rgba(255,255,255,0.15)";
      ctx.fill();
    }
  }

  function drawOverlay(title, lines) {
    ctx.fillStyle = "rgba(8,10,16,0.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 52px 'Segoe UI', sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 50);
    ctx.font = "20px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#c5cde0";
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 10 + i * 32));
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    if (flashTimer > 0) {
      ctx.fillStyle = `rgba(255,60,90,${flashTimer * 0.5})`;
      ctx.fillRect(0, 0, W, H);
    }
    drawBricks();
    drawParticles();
    drawPaddle();
    if (state !== "gameOver") drawBall();
    drawHUD();

    if (state === "serve") {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "18px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#c5cde0";
      ctx.fillText("Press Space or click to launch", W / 2, H / 2 + 80);
    } else if (state === "title") {
      drawOverlay("BRICK BREAKER", [
        "Arrow keys / A-D or mouse to move",
        "Space or click to launch the ball",
        "Press Space or click to start",
      ]);
    } else if (state === "paused") {
      drawOverlay("PAUSED", ["Press P, Esc, Space or click to resume"]);
    } else if (state === "levelClear") {
      drawOverlay("LEVEL CLEAR!", [`Score: ${score}`, "Press Space or click for Level 2"]);
    } else if (state === "gameOver") {
      drawOverlay("GAME OVER", [`Final score: ${score}`, "Press Space or click to play again"]);
    } else if (state === "win") {
      drawOverlay("YOU WIN!", [`Final score: ${score}`, "Press Space or click to play again"]);
    }
  }

  // ---- Main loop ----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  buildLevel(0);
  resetBall();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
