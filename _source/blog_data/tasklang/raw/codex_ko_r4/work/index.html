<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>벽돌깨기</title>
<style>
:root{color-scheme:dark;--ink:#eef3ff;--muted:#9aa8c7;--line:#263353;--panel:#111a31;--cyan:#53e5df;--pink:#ff719f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#17264a 0,#0a1020 60%);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,920px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:42px;height:42px;border:1px solid #375078;border-radius:13px;color:var(--cyan);font-size:22px;background:#13213d;box-shadow:0 0 24px #53e5df20}.eyebrow{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.18em}.title{margin:0;font-size:21px;letter-spacing:.03em}.stats{display:flex;gap:8px}.stat{min-width:94px;padding:8px 13px;border:1px solid var(--line);border-radius:12px;background:#111a31dd}.stat span{display:block;color:var(--muted);font-size:10px;letter-spacing:.13em}.stat strong{font-size:18px;font-variant-numeric:tabular-nums}.stat.life strong{color:#ff829e;letter-spacing:.14em;font-size:15px}
.frame{padding:10px;border:1px solid #26385b;border-radius:19px;background:linear-gradient(135deg,#162341,#0e172c);box-shadow:0 24px 80px #0008,inset 0 1px #ffffff0b}.arena{position:relative;overflow:hidden;border-radius:12px;background:#090f20;aspect-ratio:800/520}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#071020b8;backdrop-filter:blur(4px);transition:opacity .2s}.overlay.hidden{opacity:0;pointer-events:none}.card{text-align:center;padding:24px;max-width:410px}.card .kicker{color:var(--cyan);font-size:11px;letter-spacing:.2em}.card h2{font-size:30px;margin:8px 0}.card p{color:#b2bfd8;margin:0 0 18px}.button{border:0;border-radius:10px;padding:11px 20px;background:linear-gradient(100deg,#54e5df,#8cf0c0);color:#071320;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 8px 25px #53e5df30}.button:hover{filter:brightness(1.08);transform:translateY(-1px)}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:12px;padding:13px 4px 0}.keys{display:flex;gap:6px;align-items:center}.key{padding:3px 7px;border:1px solid #354361;border-radius:6px;background:#131d33;color:#dce6ff;font-size:11px}.hint{color:#8493b2}.mobile{display:none}
@media(max-width:620px){body{padding:14px}.header{align-items:flex-start}header{align-items:flex-start;flex-direction:column}.stats{width:100%}.stat{flex:1}.footer{align-items:flex-start;flex-direction:column}.hint{display:none}.mobile{display:inline}}
</style>
</head>
<body>
<main>
<header><div class="brand"><div class="logo">✦</div><div><div class="eyebrow">ARCADE · 01</div><h1 class="title">NEON BREAKER</h1></div></div><div class="stats"><div class="stat"><span>SCORE</span><strong id="score">00000</strong></div><div class="stat"><span>LEVEL</span><strong id="level">01 / 02</strong></div><div class="stat life"><span>LIVES</span><strong id="lives">♥ ♥ ♥</strong></div></div></header>
<div class="frame"><div class="arena"><canvas id="game" width="800" height="520" aria-label="벽돌깨기 게임 화면"></canvas><div class="overlay" id="overlay"><div class="card"><div class="kicker" id="kicker">READY PLAYER ONE</div><h2 id="headline">벽돌을 모두 깨세요</h2><p id="message">패들을 움직여 공을 놓치지 마세요. 두 개의 레벨이 기다리고 있어요.</p><button class="button" id="action">게임 시작</button></div></div></div></div>
<div class="footer"><div class="keys"><span class="key">←</span><span class="key">→</span><span>또는</span><span class="key">A</span><span class="key">D</span><span>이동</span><span class="key mobile">터치</span></div><div class="hint">마우스 이동으로 패들 조작 · 스페이스바 일시정지</div></div>
</main>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay');
const scoreEl=document.querySelector('#score'),levelEl=document.querySelector('#level'),livesEl=document.querySelector('#lives'),headline=document.querySelector('#headline'),message=document.querySelector('#message'),kicker=document.querySelector('#kicker'),action=document.querySelector('#action');
const W=800,H=520;let paddle,ball,bricks=[],score=0,lives=3,level=1,running=false,paused=false,ended=false,keys={},last=0,particles=[];
const palettes=[['#55e5df','#53b9ff','#8c8cff','#d77cff','#ff76ae'],['#ffd166','#ff9f54','#ff7272','#ec69be','#9c83ff']];
function makeBricks(){bricks=[];const cols=10,rows=5,bw=64,bh=19,gap=10,left=(W-(cols*(bw+gap)-gap))/2,top=70;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(level===2&&((r===1||r===3)&&(c===0||c===9)))continue;bricks.push({x:left+c*(bw+gap),y:top+r*(bh+9),w:bw,h:bh,hp:level===2&&r<2?2:1,color:palettes[level-1][r]})}}
function resetBall(){paddle={x:W/2-58,y:H-42,w:116,h:12,speed:8};ball={x:W/2,y:H-62,r:8,vx:(Math.random()>.5?1:-1)*3.1,vy:-4.4};}
function init(){score=0;lives=3;level=1;particles=[];makeBricks();resetBall();updateStats();draw()}
function updateStats(){scoreEl.textContent=String(score).padStart(5,'0');levelEl.textContent=`0${level} / 02`;livesEl.textContent='♥ '.repeat(lives).trim()||'—'}
function show(k,h,m,b){kicker.textContent=k;headline.textContent=h;message.textContent=m;action.textContent=b;overlay.classList.remove('hidden')}
function hide(){overlay.classList.add('hidden')}
function begin(){if(ended)init();running=true;paused=false;hide();last=performance.now();requestAnimationFrame(loop)}
action.addEventListener('click',begin);
function movePaddle(x){const rect=canvas.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(x-rect.left)*W/rect.width-paddle.w/2))}
canvas.addEventListener('pointermove',e=>movePaddle(e.clientX));canvas.addEventListener('pointerdown',e=>{movePaddle(e.clientX);if(!running||paused)begin()});
window.addEventListener('keydown',e=>{const key=e.key.toLowerCase();if(['arrowleft','arrowright',' '].includes(key))e.preventDefault();keys[key]=true;if(key===' '&&running){paused=!paused;if(paused)show('PAUSED','잠시 쉬어 가요','스페이스바를 누르거나 버튼을 눌러 계속하세요.','계속하기');else{hide();last=performance.now();requestAnimationFrame(loop)}}});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function burst(x,y,color){for(let i=0;i<7;i++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:24,color})}
function update(dt){const scale=dt/16.67;if(keys.arrowleft||keys.a)paddle.x-=paddle.speed*scale;if(keys.arrowright||keys.d)paddle.x+=paddle.speed*scale;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));ball.x+=ball.vx*scale;ball.y+=ball.vy*scale;
if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y<ball.r+12){ball.y=ball.r+12;ball.vy=Math.abs(ball.vy)}
if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){let hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*5.2;ball.vy=-Math.max(3.8,Math.sqrt(36-ball.vx*ball.vx));ball.y=paddle.y-ball.r}
for(let i=bricks.length-1;i>=0;i--){const b=bricks[i];if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.hp--;ball.vy*=-1;if(b.hp<=0){score+=level===1?100:150;burst(ball.x,ball.y,b.color);bricks.splice(i,1)}else score+=50;updateStats();break}}
if(ball.y>H+ball.r){lives--;updateStats();if(!lives){running=false;ended=true;show('GAME OVER','다시 도전해 볼까요?','최종 점수 '+score+'점','다시 시작')}else resetBall()}
if(!bricks.length){if(level===1){level=2;makeBricks();resetBall();updateStats();show('LEVEL COMPLETE','레벨 2 시작!','두 번 맞아야 깨지는 벽돌에 주의하세요.','계속하기');running=false}else{running=false;ended=true;show('YOU WIN','완벽한 플레이!','두 레벨을 모두 클리어했어요. 최종 점수 '+score+'점','다시 플레이')}}
particles=particles.filter(p=>p.life-->0);for(const p of particles){p.x+=p.vx*scale;p.y+=p.vy*scale}}
function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0c1530');bg.addColorStop(1,'#090f20');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;for(let x=20;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=20;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.fillStyle='#91a3c522';ctx.font='11px system-ui';ctx.letterSpacing='3px';ctx.fillText('LEVEL 0'+level,W-105,30);
for(const b of bricks){ctx.shadowColor=b.color;ctx.shadowBlur=12;ctx.fillStyle=b.color;roundRect(b.x,b.y,b.w,b.h,5);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffff30';roundRect(b.x+3,b.y+3,b.w-6,3,2);ctx.fill();if(b.hp>1){ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('2',b.x+b.w/2,b.y+14);ctx.textAlign='left'}}
ctx.shadowColor='#53e5df';ctx.shadowBlur=18;ctx.fillStyle='#73f4e5';roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fill();ctx.shadowBlur=0;
ctx.shadowColor='#fff';ctx.shadowBlur=17;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;for(const p of particles){ctx.globalAlpha=p.life/24;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;
if(paused){ctx.fillStyle='#fff';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2);ctx.textAlign='left'}}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function loop(now){if(!running)return;let dt=Math.min(32,now-last);last=now;if(!paused)update(dt);draw();if(running)requestAnimationFrame(loop)}
init();
})();
</script>
</body>
</html>
