<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ブロック崩し</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111827;
    color: #e5e7eb;
    font-family: "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #0b1020;
    border: 2px solid #374151;
    border-radius: 8px;
    max-width: 95vw;
    max-height: 85vh;
    cursor: none;
  }
  p.help {
    margin: 10px 0 0;
    font-size: 14px;
    color: #9ca3af;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p class="help">操作: マウス移動 / ← → (A D) でパドル移動 ・ クリック / スペースで発射 ・ P で一時停止</p>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  // ---- 設定 ----
  const PADDLE_W = 110;
  const PADDLE_H = 14;
  const PADDLE_Y = H - 40;
  const PADDLE_SPEED = 9;
  const BALL_R = 8;
  const START_LIVES = 3;

  const BRICK_COLS = 10;
  const BRICK_W = 68;
  const BRICK_H = 22;
  const BRICK_GAP = 6;
  const BRICK_TOP = 70;
  const BRICK_LEFT = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;

  // レベル定義: 数字は耐久値 (0 = ブロックなし)
  const LEVELS = [
    {
      name: "レベル 1",
      ballSpeed: 5,
      layout: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      name: "レベル 2",
      ballSpeed: 6.2,
      layout: [
        "2222222222",
        "2100000012",
        "2122112212",
        "2121001212",
        "2122112212",
        "2100000012",
        "2222222222",
      ],
    },
  ];

  const COLORS = {
    1: ["#38bdf8", "#f472b6", "#facc15", "#4ade80", "#a78bfa", "#fb923c", "#f87171"],
    2: "#94a3b8",
  };

  // ---- 状態 ----
  // state: "title" | "ready" | "playing" | "paused" | "levelclear" | "gameover" | "win"
  let state = "title";
  let levelIndex = 0;
  let score = 0;
  let lives = START_LIVES;
  let bricks = [];
  const paddle = { x: W / 2 - PADDLE_W / 2, w: PADDLE_W };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, speed: 5 };
  const keys = { left: false, right: false };

  function buildLevel(index) {
    const level = LEVELS[index];
    bricks = [];
    level.layout.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        const hp = parseInt(ch, 10);
        if (hp > 0) {
          bricks.push({
            x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP),
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            hp,
            maxHp: hp,
            row: r,
          });
        }
      });
    });
    ball.speed = level.ballSpeed;
  }

  function resetBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = PADDLE_Y - BALL_R - 1;
    ball.vx = 0;
    ball.vy = 0;
  }

  function launchBall() {
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    state = "playing";
  }

  function newGame() {
    levelIndex = 0;
    score = 0;
    lives = START_LIVES;
    buildLevel(levelIndex);
    resetBall();
    state = "ready";
  }

  function nextLevel() {
    levelIndex++;
    buildLevel(levelIndex);
    resetBall();
    state = "ready";
  }

  // 発射・進行などの「決定」操作
  function action() {
    switch (state) {
      case "title":
      case "gameover":
      case "win":
        newGame();
        break;
      case "ready":
        launchBall();
        break;
      case "levelclear":
        nextLevel();
        break;
      case "paused":
        state = "playing";
        break;
    }
  }

  function togglePause() {
    if (state === "playing") state = "paused";
    else if (state === "paused") state = "playing";
  }

  // ---- 入力 ----
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
    else if (e.key === " " || e.key === "Enter") { action(); e.preventDefault(); }
    else if (e.key === "p" || e.key === "P" || e.key === "Escape") togglePause();
    if (e.key.startsWith("Arrow")) e.preventDefault();
  });
  document.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
  });

  canvas.addEventListener("mousemove", (e) => {
    if (state === "paused") return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = clamp(mx - paddle.w / 2, 0, W - paddle.w);
  });
  canvas.addEventListener("mousedown", (e) => {
    e.preventDefault();
    action();
  });
  // タッチでも一応遊べるように
  canvas.addEventListener("touchmove", (e) => {
    if (state === "paused") return;
    const rect = canvas.getBoundingClientRect();
    const tx = (e.touches[0].clientX - rect.left) * (W / rect.width);
    paddle.x = clamp(tx - paddle.w / 2, 0, W - paddle.w);
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); action(); }, { passive: false });

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  // ---- 更新 ----
  function update() {
    if (state === "paused" || state === "title") return;

    if (keys.left) paddle.x -= PADDLE_SPEED;
    if (keys.right) paddle.x += PADDLE_SPEED;
    paddle.x = clamp(paddle.x, 0, W - paddle.w);

    if (state === "ready") {
      resetBall();
      return;
    }
    if (state !== "playing") return;

    // 高速時のすり抜け防止のため、移動を分割して判定
    const steps = Math.ceil(Math.max(Math.abs(ball.vx), Math.abs(ball.vy)) / (BALL_R / 2));
    for (let i = 0; i < steps; i++) {
      ball.x += ball.vx / steps;
      ball.y += ball.vy / steps;
      if (collide()) break;
    }
  }

  // 衝突判定。ライフ減少やレベル遷移が起きた場合 true を返す
  function collide() {
    // 壁
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    // 落下
    if (ball.y - BALL_R > H) {
      lives--;
      if (lives <= 0) {
        state = "gameover";
      } else {
        resetBall();
        state = "ready";
      }
      return true;
    }

    // パドル
    if (ball.vy > 0 &&
        ball.y + BALL_R >= PADDLE_Y && ball.y + BALL_R <= PADDLE_Y + PADDLE_H + ball.speed &&
        ball.x >= paddle.x - BALL_R && ball.x <= paddle.x + paddle.w + BALL_R) {
      // 当たった位置で反射角を変える (-1 〜 1)
      const hit = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const angle = hit * (Math.PI / 3); // 最大 60 度
      ball.vx = Math.sin(angle) * ball.speed;
      ball.vy = -Math.cos(angle) * ball.speed;
      ball.y = PADDLE_Y - BALL_R;
    }

    // ブロック
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const nearestX = clamp(ball.x, b.x, b.x + BRICK_W);
      const nearestY = clamp(ball.y, b.y, b.y + BRICK_H);
      const dx = ball.x - nearestX;
      const dy = ball.y - nearestY;
      if (dx * dx + dy * dy <= BALL_R * BALL_R) {
        // 衝突面を判定して反射
        const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + BRICK_W - (ball.x - BALL_R));
        const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + BRICK_H - (ball.y - BALL_R));
        if (overlapX < overlapY) {
          ball.vx = ball.x < b.x + BRICK_W / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
        } else {
          ball.vy = ball.y < b.y + BRICK_H / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
        }

        b.hp--;
        if (b.hp <= 0) {
          score += 100 * b.maxHp * (levelIndex + 1);
        } else {
          score += 10;
        }

        if (bricks.every((br) => br.hp <= 0)) {
          state = levelIndex < LEVELS.length - 1 ? "levelclear" : "win";
          return true;
        }
        break; // 1ステップにつき1ブロック
      }
    }
    return false;
  }

  // ---- 描画 ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "#e5e7eb";
    ctx.font = "bold 20px sans-serif";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillText("スコア: " + score, 20, 30);
    ctx.textAlign = "center";
    ctx.fillText(LEVELS[levelIndex].name, W / 2, 30);
    ctx.textAlign = "right";
    ctx.fillText("ライフ:", W - 20 - START_LIVES * 22, 30);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 20 - (START_LIVES - 1 - i) * 22 - 8, 30, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#f87171" : "#374151";
      ctx.fill();
    }
    ctx.strokeStyle = "#1f2937";
    ctx.beginPath();
    ctx.moveTo(0, 52);
    ctx.lineTo(W, 52);
    ctx.stroke();
  }

  function drawBricks() {
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      let color;
      if (b.maxHp >= 2) {
        color = b.hp >= 2 ? COLORS[2] : "#cbd5e1";
      } else {
        color = COLORS[1][b.row % COLORS[1].length];
      }
      roundRect(b.x, b.y, BRICK_W, BRICK_H, 4);
      ctx.fillStyle = color;
      ctx.fill();
      if (b.maxHp >= 2 && b.hp < b.maxHp) {
        // ひび割れ表現
        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x + 20, b.y + 3);
        ctx.lineTo(b.x + 30, b.y + 12);
        ctx.lineTo(b.x + 26, b.y + BRICK_H - 3);
        ctx.stroke();
        ctx.lineWidth = 1;
      }
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(b.x + 3, b.y + 3, BRICK_W - 6, 4);
    }
  }

  function drawPaddle() {
    roundRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H, 7);
    const g = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
    g.addColorStop(0, "#e0f2fe");
    g.addColorStop(1, "#0ea5e9");
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = "#fde68a";
    ctx.shadowColor = "#fde68a";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawOverlay(title, sub, sub2) {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 48px sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 40);
    ctx.font = "22px sans-serif";
    ctx.fillStyle = "#d1d5db";
    if (sub) ctx.fillText(sub, W / 2, H / 2 + 15);
    if (sub2) ctx.fillText(sub2, W / 2, H / 2 + 50);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawHUD();
    drawBricks();
    drawPaddle();
    if (state !== "title") drawBall();

    switch (state) {
      case "title":
        drawOverlay("ブロック崩し", "クリック または スペースでスタート",
          "マウス / ← → キーでパドルを操作");
        break;
      case "ready":
        ctx.textAlign = "center";
        ctx.fillStyle = "#d1d5db";
        ctx.font = "20px sans-serif";
        ctx.fillText("クリック または スペースで発射", W / 2, H / 2 + 60);
        break;
      case "paused":
        drawOverlay("一時停止", "P キー または クリックで再開");
        break;
      case "levelclear":
        drawOverlay(LEVELS[levelIndex].name + " クリア!", "スコア: " + score,
          "クリック または スペースで次のレベルへ");
        break;
      case "gameover":
        drawOverlay("ゲームオーバー", "最終スコア: " + score,
          "クリック または スペースでリトライ");
        break;
      case "win":
        drawOverlay("全レベルクリア!", "最終スコア: " + score + "  (残りライフ " + lives + ")",
          "クリック または スペースでもう一度");
        break;
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  buildLevel(0);
  resetBall();
  loop();
})();
</script>
</body>
</html>
