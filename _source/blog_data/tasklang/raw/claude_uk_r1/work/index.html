<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Арканоїд</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0f1e;
    color: #e8ecff;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: linear-gradient(#141a33, #0d1124);
    border: 2px solid #3a4680;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(80, 110, 255, 0.25);
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
  }
  .help {
    margin-top: 10px;
    font-size: 14px;
    opacity: 0.75;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div class="help">
  Керування: миша або ← → / A D — рух ракетки · Пробіл або клік — запуск м'яча · P — пауза · Enter — почати знову
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---- Рівні: цифра = міцність цеглинки, '.' = порожньо ----
  const LEVELS = [
    {
      speed: 360,
      map: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      speed: 430,
      map: [
        ".22222222.",
        "2111111112",
        "21.1111.12",
        "2111111112",
        "21.1111.12",
        "2111111112",
        ".22222222.",
      ],
    },
  ];

  const ROW_COLORS = ['#ff5c7a', '#ff9f43', '#feca57', '#1dd1a1', '#54a0ff', '#a29bfe', '#ff6bcb'];
  const BRICK_TOP = 70, BRICK_H = 22, BRICK_GAP = 6, MARGIN = 35;
  const HUD_H = 44;
  const MAX_LIVES = 3;

  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 620 };
  const ball = { x: 0, y: 0, r: 8, vx: 0, vy: 0, stuck: true };

  let bricks = [];
  let score = 0;
  let lives = MAX_LIVES;
  let levelIndex = 0;
  let state = 'play'; // play | paused | levelclear | gameover | win
  const keys = {};

  function buildLevel(i) {
    const map = LEVELS[i].map;
    const cols = map[0].length;
    const bw = (W - MARGIN * 2 - BRICK_GAP * (cols - 1)) / cols;
    bricks = [];
    map.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === '.') return;
        const hp = parseInt(ch, 10);
        bricks.push({
          x: MARGIN + c * (bw + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: bw,
          h: BRICK_H,
          hp,
          maxHp: hp,
          color: ROW_COLORS[r % ROW_COLORS.length],
          alive: true,
        });
      });
    });
  }

  function resetBall() {
    ball.stuck = true;
    ball.vx = 0;
    ball.vy = 0;
    placeBallOnPaddle();
  }

  function placeBallOnPaddle() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launchBall() {
    if (!ball.stuck || state !== 'play') return;
    const speed = LEVELS[levelIndex].speed;
    const angle = (Math.random() * 40 - 20) * Math.PI / 180;
    ball.vx = speed * Math.sin(angle);
    ball.vy = -speed * Math.cos(angle);
    ball.stuck = false;
  }

  function startLevel(i) {
    levelIndex = i;
    buildLevel(i);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = 'play';
  }

  function newGame() {
    score = 0;
    lives = MAX_LIVES;
    startLevel(0);
  }

  // ---- Колізії ----
  function circleRectHit(cx, cy, r, rect) {
    const nx = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    const ny = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function findBrickHit() {
    for (const b of bricks) {
      if (b.alive && circleRectHit(ball.x, ball.y, ball.r, b)) return b;
    }
    return null;
  }

  function damageBrick(b) {
    b.hp--;
    if (b.hp <= 0) {
      b.alive = false;
      score += b.maxHp > 1 ? 25 : 10;
    } else {
      score += 5;
    }
  }

  function stepBall(dt) {
    // Рух по X
    ball.x += ball.vx * dt;
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    let b = findBrickHit();
    if (b) {
      ball.x -= ball.vx * dt;
      ball.vx = -ball.vx;
      damageBrick(b);
    }

    // Рух по Y
    ball.y += ball.vy * dt;
    if (ball.y - ball.r < HUD_H) { ball.y = HUD_H + ball.r; ball.vy = Math.abs(ball.vy); }
    b = findBrickHit();
    if (b) {
      ball.y -= ball.vy * dt;
      ball.vy = -ball.vy;
      damageBrick(b);
    }

    // Ракетка
    if (ball.vy > 0 && circleRectHit(ball.x, ball.y, ball.r, paddle)) {
      const speed = Math.hypot(ball.vx, ball.vy);
      let rel = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      rel = Math.max(-1, Math.min(1, rel));
      const angle = rel * 60 * Math.PI / 180;
      ball.vx = speed * Math.sin(angle);
      ball.vy = -speed * Math.cos(angle);
      ball.y = paddle.y - ball.r - 1;
    }
  }

  function update(dt) {
    if (state !== 'play') return;

    // Клавіатура
    let dir = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) dir -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) dir += 1;
    paddle.x += dir * paddle.speed * dt;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (ball.stuck) {
      placeBallOnPaddle();
      return;
    }

    // Підкроки, щоб м'яч не проскакував крізь цеглинки
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / 4));
    for (let i = 0; i < steps; i++) {
      stepBall(dt / steps);
      if (state !== 'play') break;
    }

    // М'яч втрачено
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) {
        state = 'gameover';
      } else {
        resetBall();
      }
      return;
    }

    // Рівень пройдено
    if (bricks.every(b => !b.alive)) {
      if (levelIndex + 1 < LEVELS.length) {
        state = 'levelclear';
      } else {
        state = 'win';
      }
    }
  }

  // ---- Малювання ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHeart(x, y, s, filled) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s / 16, s / 16);
    ctx.beginPath();
    ctx.moveTo(0, 5);
    ctx.bezierCurveTo(0, -1, -8, -1, -8, 5);
    ctx.bezierCurveTo(-8, 10, 0, 14, 0, 17);
    ctx.bezierCurveTo(0, 14, 8, 10, 8, 5);
    ctx.bezierCurveTo(8, -1, 0, -1, 0, 5);
    ctx.fillStyle = filled ? '#ff4d6d' : 'rgba(255,255,255,0.15)';
    ctx.fill();
    ctx.restore();
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.fillStyle = '#3a4680';
    ctx.fillRect(0, HUD_H - 2, W, 2);

    ctx.font = 'bold 20px "Segoe UI", Arial, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e8ecff';
    ctx.textAlign = 'left';
    ctx.fillText('Рахунок: ' + score, 16, HUD_H / 2);
    ctx.textAlign = 'center';
    ctx.fillText('Рівень ' + (levelIndex + 1) + ' / ' + LEVELS.length, W / 2, HUD_H / 2);
    ctx.textAlign = 'right';
    ctx.fillText('Життя:', W - 100, HUD_H / 2);
    for (let i = 0; i < MAX_LIVES; i++) {
      drawHeart(W - 80 + i * 26, HUD_H / 2 - 9, 20, i < lives);
    }
  }

  function drawBricks() {
    for (const b of bricks) {
      if (!b.alive) continue;
      let fill;
      if (b.maxHp > 1) {
        fill = b.hp === b.maxHp ? '#b8c2d9' : '#6f7a94';
      } else {
        fill = b.color;
      }
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(b.x + 3, b.y + 2, b.w - 6, 4);
      if (b.maxHp > 1 && b.hp < b.maxHp) {
        // тріщина
        ctx.strokeStyle = 'rgba(20,20,40,0.7)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(b.x + b.w * 0.3, b.y + 2);
        ctx.lineTo(b.x + b.w * 0.45, b.y + b.h * 0.55);
        ctx.lineTo(b.x + b.w * 0.6, b.y + b.h * 0.4);
        ctx.lineTo(b.x + b.w * 0.7, b.y + b.h - 2);
        ctx.stroke();
      }
    }
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, '#7fd4ff');
    g.addColorStop(1, '#2e86de');
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#9fd8ff';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawOverlay(title, subtitle) {
    ctx.fillStyle = 'rgba(5,8,20,0.7)';
    ctx.fillRect(0, HUD_H, W, H - HUD_H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 48px "Segoe UI", Arial, sans-serif';
    ctx.fillText(title, W / 2, H / 2 - 30);
    ctx.font = '20px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = '#c9d2ff';
    ctx.fillText(subtitle, W / 2, H / 2 + 25);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawPaddle();
    drawBall();
    drawHUD();

    if (state === 'play' && ball.stuck) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '18px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = '#c9d2ff';
      ctx.fillText('Натисніть Пробіл або клацніть мишею, щоб запустити м\'яч', W / 2, H - 100);
    } else if (state === 'paused') {
      drawOverlay('Пауза', 'Натисніть P, щоб продовжити');
    } else if (state === 'levelclear') {
      drawOverlay('Рівень ' + (levelIndex + 1) + ' пройдено!', 'Клацніть або натисніть Пробіл, щоб перейти до рівня ' + (levelIndex + 2));
    } else if (state === 'gameover') {
      drawOverlay('Гру закінчено', 'Рахунок: ' + score + ' · Клацніть або натисніть Enter, щоб почати знову');
    } else if (state === 'win') {
      drawOverlay('Перемога! 🎉', 'Рахунок: ' + score + ' · Клацніть або натисніть Enter, щоб зіграти ще');
    }
  }

  // ---- Головний цикл ----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ---- Обробка дій ----
  function primaryAction() {
    if (state === 'play') launchBall();
    else if (state === 'levelclear') startLevel(levelIndex + 1);
    else if (state === 'gameover' || state === 'win') newGame();
  }

  function togglePause() {
    if (state === 'play') state = 'paused';
    else if (state === 'paused') { state = 'play'; last = performance.now(); }
  }

  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowLeft', 'ArrowRight', 'Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space') primaryAction();
    else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    else if (e.code === 'Enter') {
      if (state === 'gameover' || state === 'win') newGame();
      else if (state === 'levelclear') startLevel(levelIndex + 1);
    }
  });
  document.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => {
    for (const k in keys) keys[k] = false;
    if (state === 'play' && !ball.stuck) state = 'paused';
  });

  canvas.addEventListener('mousemove', e => {
    if (state !== 'play') return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
  });
  canvas.addEventListener('mousedown', e => {
    e.preventDefault();
    if (state === 'paused') togglePause();
    else primaryAction();
  });

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
