<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ブロック崩し</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    color: #e8ecf5;
    font-family: "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  canvas {
    background: #1a1f2e;
    border: 2px solid #3a4360;
    border-radius: 6px;
    max-width: 96vw;
    max-height: 82vh;
    cursor: none;
    touch-action: none;
  }
  .help {
    font-size: 14px;
    color: #9aa5c4;
    text-align: center;
    line-height: 1.6;
  }
  kbd {
    background: #2a3148;
    border: 1px solid #4a5578;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div class="help">
  操作: マウス移動 または <kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> でパドル移動 ／
  クリック または <kbd>Space</kbd> で発射・開始 ／ <kbd>P</kbd> で一時停止
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  // ---- 設定 ----
  const HUD_H = 40;
  const PADDLE_W = 110;
  const PADDLE_H = 14;
  const PADDLE_Y = H - 40;
  const PADDLE_KEY_SPEED = 600; // px/s
  const BALL_R = 8;
  const MAX_LIVES = 3;

  const BRICK_COLS = 10;
  const BRICK_GAP = 6;
  const BRICK_H = 22;
  const BRICK_TOP = HUD_H + 40;
  const BRICK_SIDE = 30;
  const BRICK_W = (W - BRICK_SIDE * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;

  // レベル定義: 0 = 空, 1 = 通常ブロック, 2 = 2回で壊れる硬いブロック
  const LEVELS = [
    {
      name: "LEVEL 1",
      ballSpeed: 360,
      layout: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      name: "LEVEL 2",
      ballSpeed: 440,
      layout: [
        "2222222222",
        "2100000012",
        "2120220212",
        "2112112112",
        "2100000012",
        "1111111111",
        "0202002020",
      ],
    },
  ];

  const ROW_COLORS = ["#ff5f6d", "#ffa94d", "#ffd43b", "#69db7c", "#4dabf7", "#9775fa", "#f783ac"];

  // ---- 状態 ----
  // state: "title" | "serve" | "play" | "paused" | "levelclear" | "gameover" | "win"
  let state = "title";
  let score = 0;
  let lives = MAX_LIVES;
  let levelIndex = 0;
  let bricks = [];
  let particles = [];

  const paddle = { x: W / 2 - PADDLE_W / 2, w: PADDLE_W };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, speed: 0 };
  const keys = { left: false, right: false };

  // ---- 初期化 ----
  function buildLevel(i) {
    const lv = LEVELS[i];
    bricks = [];
    lv.layout.forEach((row, r) => {
      for (let c = 0; c < BRICK_COLS; c++) {
        const ch = row[c];
        if (ch === "1" || ch === "2") {
          const hp = Number(ch);
          bricks.push({
            x: BRICK_SIDE + c * (BRICK_W + BRICK_GAP),
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            w: BRICK_W,
            h: BRICK_H,
            hp,
            maxHp: hp,
            color: ROW_COLORS[r % ROW_COLORS.length],
          });
        }
      }
    });
    ball.speed = lv.ballSpeed;
  }

  function resetBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = PADDLE_Y - BALL_R - 1;
    ball.vx = 0;
    ball.vy = 0;
  }

  function newGame() {
    score = 0;
    lives = MAX_LIVES;
    levelIndex = 0;
    buildLevel(levelIndex);
    particles = [];
    resetBall();
    state = "serve";
  }

  function launchBall() {
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    state = "play";
  }

  // ---- 入力 ----
  function primaryAction() {
    switch (state) {
      case "title":
      case "gameover":
      case "win":
        newGame();
        break;
      case "serve":
        launchBall();
        break;
      case "levelclear":
        levelIndex++;
        buildLevel(levelIndex);
        particles = [];
        resetBall();
        state = "serve";
        break;
      case "paused":
        state = "play";
        break;
    }
  }

  function togglePause() {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }

  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; e.preventDefault(); }
    else if (k === " " || k === "Spacebar" || k === "Enter") {
      if (!e.repeat) primaryAction();
      e.preventDefault();
    }
    else if (k === "p" || k === "P" || k === "Escape") togglePause();
  });

  document.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });

  function pointerToCanvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }

  function movePaddleTo(cx) {
    paddle.x = clamp(cx - paddle.w / 2, 0, W - paddle.w);
  }

  canvas.addEventListener("mousemove", (e) => {
    if (state === "paused") return;
    movePaddleTo(pointerToCanvasX(e.clientX));
  });

  canvas.addEventListener("mousedown", (e) => {
    e.preventDefault();
    primaryAction();
  });

  // タッチ操作にも対応
  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (e.touches[0]) movePaddleTo(pointerToCanvasX(e.touches[0].clientX));
    primaryAction();
  }, { passive: false });

  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (state !== "paused" && e.touches[0]) movePaddleTo(pointerToCanvasX(e.touches[0].clientX));
  }, { passive: false });

  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state === "play") state = "paused";
  });

  // ---- ユーティリティ ----
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  // ---- 更新 ----
  function update(dt) {
    // パーティクルは状態に関係なく動かす（一時停止中を除く）
    if (state !== "paused") {
      for (const p of particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 400 * dt;
        p.life -= dt;
      }
      particles = particles.filter((p) => p.life > 0);
    }

    if (state !== "play" && state !== "serve") return;

    // キーボードでパドル移動
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir !== 0) {
      paddle.x = clamp(paddle.x + dir * PADDLE_KEY_SPEED * dt, 0, W - paddle.w);
    }

    if (state === "serve") {
      resetBall();
      return;
    }

    // すり抜け防止のためサブステップで移動
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / (BALL_R * 0.5)));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (!stepBall(sdt)) break;
    }
  }

  // ボールを1サブステップ動かす。状態が変わったら false を返す
  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // 壁
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - BALL_R < HUD_H) { ball.y = HUD_H + BALL_R; ball.vy = Math.abs(ball.vy); }

    // 落下
    if (ball.y - BALL_R > H) {
      lives--;
      if (lives <= 0) {
        state = "gameover";
      } else {
        resetBall();
        state = "serve";
      }
      return false;
    }

    // パドル
    if (
      ball.vy > 0 &&
      ball.y + BALL_R >= PADDLE_Y &&
      ball.y - BALL_R <= PADDLE_Y + PADDLE_H &&
      ball.x >= paddle.x - BALL_R &&
      ball.x <= paddle.x + paddle.w + BALL_R
    ) {
      // 当たった位置で反射角を変える（-1 〜 1）
      const hit = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const maxAngle = Math.PI / 3; // 60度
      const angle = hit * maxAngle;
      ball.vx = Math.sin(angle) * ball.speed;
      ball.vy = -Math.cos(angle) * ball.speed;
      ball.y = PADDLE_Y - BALL_R;
    }

    // ブロック
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const nx = clamp(ball.x, b.x, b.x + b.w);
      const ny = clamp(ball.y, b.y, b.y + b.h);
      const dx = ball.x - nx;
      const dy = ball.y - ny;
      if (dx * dx + dy * dy > BALL_R * BALL_R) continue;

      // 反射方向の判定: めり込みの浅い軸で反射
      const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + b.w - (ball.x - BALL_R));
      const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + b.h - (ball.y - BALL_R));
      if (overlapX < overlapY) {
        ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      } else {
        ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      }

      b.hp--;
      if (b.hp <= 0) {
        score += b.maxHp === 2 ? 30 : 10;
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);
      } else {
        score += 5;
      }

      if (bricks.every((br) => br.hp <= 0)) {
        score += lives * 100; // 残りライフボーナス
        state = levelIndex >= LEVELS.length - 1 ? "win" : "levelclear";
        return false;
      }
      break; // 1ステップにつき1ブロックのみ
    }
    return true;
  }

  // ---- 描画 ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "#141826";
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.strokeStyle = "#3a4360";
    ctx.beginPath();
    ctx.moveTo(0, HUD_H + 0.5);
    ctx.lineTo(W, HUD_H + 0.5);
    ctx.stroke();

    ctx.font = "bold 18px 'Segoe UI', sans-serif";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#e8ecf5";
    ctx.textAlign = "left";
    ctx.fillText("SCORE: " + score, 16, HUD_H / 2);

    ctx.textAlign = "center";
    ctx.fillText(LEVELS[levelIndex].name + " / " + LEVELS.length, W / 2, HUD_H / 2);

    ctx.textAlign = "right";
    ctx.fillText("LIFE", W - 16 - MAX_LIVES * 22, HUD_H / 2);
    for (let i = 0; i < MAX_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (MAX_LIVES - 1 - i) * 22 - 8, HUD_H / 2, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff6b81" : "#3a4360";
      ctx.fill();
    }
  }

  function drawBricks() {
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.maxHp === 2 && b.hp === 1 ? 0.55 : 1;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.maxHp === 2) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = b.hp === 2 ? "#ffffff" : "rgba(255,255,255,0.4)";
        ctx.stroke();
        if (b.hp === 1) {
          // ひび割れ表現
          ctx.beginPath();
          ctx.moveTo(b.x + b.w * 0.3, b.y + 2);
          ctx.lineTo(b.x + b.w * 0.45, b.y + b.h * 0.5);
          ctx.lineTo(b.x + b.w * 0.6, b.y + b.h - 2);
          ctx.strokeStyle = "rgba(0,0,0,0.5)";
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }
    }
  }

  function drawPaddle() {
    roundRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H, 7);
    const g = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
    g.addColorStop(0, "#a5d8ff");
    g.addColorStop(1, "#4dabf7");
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawOverlay(title, lines) {
    ctx.fillStyle = "rgba(10, 12, 20, 0.72)";
    ctx.fillRect(0, HUD_H, W, H - HUD_H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 48px 'Segoe UI', sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 40);
    ctx.font = "20px 'Segoe UI', 'Meiryo', sans-serif";
    ctx.fillStyle = "#c5cde3";
    lines.forEach((t, i) => ctx.fillText(t, W / 2, H / 2 + 20 + i * 32));
  }

  function drawCenterHint(text) {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "20px 'Segoe UI', 'Meiryo', sans-serif";
    ctx.fillStyle = "#c5cde3";
    ctx.fillText(text, W / 2, H / 2 + 80);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawParticles();
    drawPaddle();
    if (state !== "title") drawBall();
    drawHUD();

    switch (state) {
      case "title":
        drawOverlay("ブロック崩し", [
          "マウス または ←→ / A D キーでパドルを操作",
          "クリック または Space キーでスタート",
        ]);
        break;
      case "serve":
        drawCenterHint(LEVELS[levelIndex].name + " — クリック または Space で発射");
        break;
      case "paused":
        drawOverlay("一時停止", ["P キー または クリックで再開"]);
        break;
      case "levelclear":
        drawOverlay("LEVEL CLEAR!", [
          "スコア: " + score,
          "クリック または Space で次のレベルへ",
        ]);
        break;
      case "gameover":
        drawOverlay("GAME OVER", [
          "スコア: " + score,
          "クリック または Space でもう一度",
        ]);
        break;
      case "win":
        drawOverlay("ALL CLEAR!", [
          "おめでとう！ 最終スコア: " + score,
          "クリック または Space でもう一度",
        ]);
        break;
    }
  }

  // ---- メインループ ----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); // タブ復帰時の大ジャンプを防ぐ
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  buildLevel(0);
  resetBall();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
