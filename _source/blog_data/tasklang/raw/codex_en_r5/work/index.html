<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRICK//BREAK — Arcade</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@500;600;700;800&display=swap');
:root{color-scheme:dark;--ink:#080a12;--panel:#101321;--white:#f5f4ed;--muted:#777d98;--cyan:#70f4df;--pink:#ff6a91;--yellow:#f7dc70}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;color:var(--white);background:radial-gradient(ellipse at 50% 39%,#171a2a 0,#0b0d16 47%,#07080e 100%);font-family:'Syne',system-ui,sans-serif}.shell{width:min(100%,760px)}
.topline{display:flex;justify-content:space-between;align-items:center;margin:0 0 13px}.brand{font-size:12px;font-weight:800;letter-spacing:.22em}.brand i{font-style:normal;color:var(--cyan)}.edition{font:10px 'Space Mono',monospace;color:var(--muted);letter-spacing:.13em}
.dashboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:17px 22px;background:rgba(16,19,33,.92);border:1px solid #292d41;border-bottom:0;border-radius:13px 13px 0 0}.stat small{display:block;font:9px 'Space Mono',monospace;letter-spacing:.16em;color:var(--muted);margin-bottom:5px}.stat strong{font-size:22px;line-height:1}.stat.right{text-align:right}.level{font:11px 'Space Mono',monospace;letter-spacing:.12em;color:var(--cyan);text-align:center}.lives{color:var(--pink)}
.stage{position:relative;overflow:hidden;border:1px solid #292d41;background:#0a0d17;box-shadow:0 25px 80px #0008}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#10172633 1px,transparent 1px),linear-gradient(#10172633 1px,transparent 1px);background-size:32px 32px;opacity:.35}canvas{display:block;width:100%;height:auto;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#080a12aa;z-index:2;transition:opacity .2s}.overlay.hidden{opacity:0;pointer-events:none}.card{text-align:center;padding:20px}.eyebrow{font:10px 'Space Mono',monospace;color:var(--cyan);letter-spacing:.22em;margin-bottom:12px}.card h1{font-size:clamp(34px,8vw,58px);line-height:.95;letter-spacing:-.055em;margin:0 0 13px}.card p{margin:0 auto 22px;max-width:320px;color:#adb2c4;font-size:13px;line-height:1.6}.button{border:0;border-radius:4px;background:var(--cyan);padding:13px 25px;color:#08100f;font:700 11px 'Space Mono',monospace;letter-spacing:.12em;cursor:pointer;box-shadow:0 0 22px #70f4df33}.button:hover{filter:brightness(1.1);transform:translateY(-1px)}
.bottomline{display:flex;justify-content:space-between;align-items:center;padding:12px 17px;background:rgba(16,19,33,.92);border:1px solid #292d41;border-top:0;border-radius:0 0 13px 13px;color:var(--muted);font:9px 'Space Mono',monospace;letter-spacing:.06em}.keys{display:flex;align-items:center;gap:5px}.key{border:1px solid #34394e;border-radius:3px;padding:3px 6px;color:#d9dbe5;font-size:9px}.hint{text-align:right}
@media(max-width:520px){body{padding:12px}.dashboard{padding:14px}.bottomline{gap:10px;align-items:flex-start;flex-direction:column}.hint{text-align:left}.edition{font-size:8px}.stat strong{font-size:19px}}
</style>
</head>
<body>
<main class="shell">
  <header class="topline"><div class="brand">PIXEL<i> / </i>ARCADE</div><div class="edition">NO. 001 &nbsp;·&nbsp; CLASSIC MODE</div></header>
  <section class="dashboard" aria-label="Game status"><div class="stat"><small>SCORE</small><strong id="score">0000</strong></div><div class="level" id="level">LEVEL 01</div><div class="stat right"><small>LIVES</small><strong class="lives" id="lives">♥ ♥ ♥</strong></div></section>
  <div class="stage"><canvas id="game" width="720" height="480" aria-label="Brick breaker game"></canvas>
    <div class="overlay" id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">READY PLAYER ONE?</div><h1 id="headline">BREAK<br>THE BRICKS.</h1><p id="message">Clear every brick. Keep the ball in play. You have three lives and two levels to conquer.</p><button class="button" id="start">START GAME &nbsp;→</button></div></div>
  </div>
  <footer class="bottomline"><div class="keys"><span class="key">←</span><span class="key">→</span><span>or</span><span class="key">A</span><span class="key">D</span><span>MOVE</span><span style="margin-left:7px" class="key">SPACE</span><span>LAUNCH / PAUSE</span></div><div class="hint">MOUSE: MOVE PADDLE &nbsp;·&nbsp; CLICK: LAUNCH</div></footer>
</main>
<script>
(()=>{
  const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),levelEl=document.querySelector('#level'),overlay=document.querySelector('#overlay'),startBtn=document.querySelector('#start'),eyebrow=document.querySelector('#eyebrow'),headline=document.querySelector('#headline'),message=document.querySelector('#message');
  const W=canvas.width,H=canvas.height,colors=['#70f4df','#74b9ff','#c294ff','#ff8eb3','#f7dc70'];
  let score=0,lives=3,level=1,bricks=[],running=false,paused=false,ended=false,raf,last=0,keys={};
  const paddle={w:104,h:11,x:(W-104)/2,y:H-38,speed:430};
  const ball={x:W/2,y:paddle.y-9,vx:185,vy:-290,r:7,stuck:true};
  function layout(){bricks=[];const rows=level===1?5:6,cols=10,gap=8,bw=57,bh=17,left=(W-(cols*bw+(cols-1)*gap))/2,top=58;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(level===2&&r===0&&(c===0||c===9))continue;bricks.push({x:left+c*(bw+gap),y:top+r*(bh+9),w:bw,h:bh,hp:level===2&&r<2?2:1,color:colors[(r+(level-1)*2)%colors.length],alive:true})}}
  function resetBall(){ball.stuck=true;ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;ball.vx=(Math.random()<.5?-1:1)*185;ball.vy=-290}
  function updateHUD(){scoreEl.textContent=String(score).padStart(4,'0');livesEl.textContent=Array.from({length:3},(_,i)=>i<lives?'♥':'♡').join(' ');levelEl.textContent=`LEVEL 0${level}`}
  function show(title,head,body,button){eyebrow.textContent=title;headline.innerHTML=head;message.textContent=body;startBtn.textContent=button;overlay.classList.remove('hidden')}
  function begin(){if(ended){score=0;lives=3;level=1;ended=false;updateHUD();layout()}running=true;paused=false;overlay.classList.add('hidden');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
  function launch(){if(!running){begin();return}if(paused){paused=false;overlay.classList.add('hidden');last=performance.now();raf=requestAnimationFrame(loop)}else if(ball.stuck)ball.stuck=false}
  function pause(){if(!running||ended)return;paused=!paused;if(paused)show('GAME PAUSED','TAKE A<br>BREATHER.','Press SPACE or click to jump back in.','RESUME GAME  →');else{overlay.classList.add('hidden');last=performance.now();raf=requestAnimationFrame(loop)}}
  function loseLife(){lives--;updateHUD();if(lives<=0){running=false;ended=true;show('GAME OVER',`THAT’S A<br>WRAP.`,`Final score: ${score}. Ready for another round?`,'PLAY AGAIN  →')}else resetBall()}
  function nextLevel(){if(level===1){level=2;updateHUD();layout();resetBall();show('NICE WORK','LEVEL TWO.<br>LET’S GO.','The upper rows need two hits. Keep that ball moving.','CONTINUE  →');running=false}else{running=false;ended=true;show('ALL CLEAR','YOU DID<br>THAT.','Two levels down. Final score: '+score+'.','PLAY AGAIN  →')}}
  function update(dt){let dir=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0);paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x+dir*paddle.speed*dt));if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;return}ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}if(ball.y>H+ball.r){loseLife();return}
    if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){let offset=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=offset*330;ball.vy=-Math.max(235,Math.sqrt(290*290+185*185-ball.vx*ball.vx));ball.y=paddle.y-ball.r-1}
    for(const b of bricks)if(b.alive&&ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.hp--;if(b.hp<=0){b.alive=false;score+=level===2?20:10;updateHUD()}else score+=5;let dx=Math.min(ball.x+ball.r-b.x,b.x+b.w-(ball.x-ball.r)),dy=Math.min(ball.y+ball.r-b.y,b.y+b.h-(ball.y-ball.r));if(dx<dy)ball.vx*=-1;else ball.vy*=-1;break}
    if(bricks.every(b=>!b.alive))nextLevel()
  }
  function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#0a0d17';ctx.fillRect(0,0,W,H);
    for(const b of bricks)if(b.alive){ctx.globalAlpha=b.hp===1?1:.58;ctx.shadowColor=b.color;ctx.shadowBlur=10;ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,3);ctx.fill();ctx.shadowBlur=0;if(b.hp>1){ctx.fillStyle='#fff';ctx.globalAlpha=.9;ctx.fillRect(b.x+b.w/2-3,b.y+6,6,5)}ctx.globalAlpha=1}
    ctx.shadowColor='#70f4df';ctx.shadowBlur=17;ctx.fillStyle='#70f4df';ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,6);ctx.fill();ctx.shadowBlur=0;
    ctx.shadowColor='#fff';ctx.shadowBlur=14;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }
  function loop(now){if(!running||paused)return;let dt=Math.min((now-last)/1000,.032);last=now;update(dt);draw();if(running)raf=requestAnimationFrame(loop)}
  startBtn.addEventListener('click',()=>{if(ended){begin();showInitialLaunch()}else if(!running){begin()}else if(paused){launch()}else launch()});
  function showInitialLaunch(){ball.stuck=true;draw()}
  window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.code==='Space'){if(paused)launch();else if(!running&&ended)begin();else if(!running){begin()}else if(ball.stuck)launch();else pause()}if(e.key==='Enter'&&!running)begin()});window.addEventListener('keyup',e=>{keys[e.key]=false});
  canvas.addEventListener('pointermove',e=>{const rect=canvas.getBoundingClientRect(),scale=W/rect.width;paddle.x=Math.max(0,Math.min(W-paddle.w,(e.clientX-rect.left)*scale-paddle.w/2));if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2}if(!running)draw()});canvas.addEventListener('pointerdown',()=>{if(paused)launch();else if(!running){if(ended)begin();else begin()}else if(ball.stuck)launch()});
  layout();updateHUD();draw();
})();
</script>
</body>
</html>
