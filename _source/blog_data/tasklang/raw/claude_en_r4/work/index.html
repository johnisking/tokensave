<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    color: #e8ecf4;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  canvas {
    background: #181d2b;
    border: 2px solid #2c3550;
    border-radius: 8px;
    max-width: 96vw;
    max-height: 84vh;
    cursor: none;
    touch-action: none;
  }
  p.help {
    margin: 10px 0 0;
    font-size: 14px;
    color: #8b95ad;
    text-align: center;
  }
  kbd {
    background: #2c3550;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    color: #e8ecf4;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p class="help">
  Move: <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> or mouse &nbsp;·&nbsp;
  Launch: <kbd>Space</kbd> or click &nbsp;·&nbsp; Pause: <kbd>P</kbd>
</p>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ---- Config ----
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 620;
  const BALL_R = 8;
  const BRICK_ROWS_TOP = 70, BRICK_GAP = 6, BRICK_H = 24, BRICK_SIDE = 30;
  const MAX_LIVES = 3;

  // Level layouts: digit = brick hit points (0 = empty)
  const LEVELS = [
    {
      speed: 340,
      layout: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      speed: 420,
      layout: [
        "2222222222",
        "2111111112",
        "2102222012",
        "2101111012",
        "2100000012",
        "2222222222",
      ],
    },
  ];

  const COLORS = {
    1: ["#4fc3f7", "#81d4fa", "#ffb74d", "#aed581", "#f06292", "#ba68c8"],
    2: "#e57373",
  };

  // ---- State ----
  let state; // "ready" | "playing" | "paused" | "levelClear" | "gameOver" | "won"
  let score, lives, levelIndex, bricks, paddle, ball;
  const keys = { left: false, right: false };

  function buildLevel(i) {
    const layout = LEVELS[i].layout;
    const cols = layout[0].length;
    const bw = (W - BRICK_SIDE * 2 - BRICK_GAP * (cols - 1)) / cols;
    bricks = [];
    layout.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        const hp = parseInt(ch, 10);
        if (hp > 0) {
          bricks.push({
            x: BRICK_SIDE + c * (bw + BRICK_GAP),
            y: BRICK_ROWS_TOP + r * (BRICK_H + BRICK_GAP),
            w: bw, h: BRICK_H, hp, maxHp: hp, row: r,
          });
        }
      });
    });
  }

  function resetBall() {
    ball = { x: paddle.x + paddle.w / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, stuck: true };
  }

  function startLevel(i) {
    levelIndex = i;
    buildLevel(i);
    paddle = { x: (W - PADDLE_W) / 2, w: PADDLE_W };
    resetBall();
    state = "ready";
  }

  function newGame() {
    score = 0;
    lives = MAX_LIVES;
    startLevel(0);
  }

  function launch() {
    if (!ball.stuck) return;
    const speed = LEVELS[levelIndex].speed;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    ball.stuck = false;
    state = "playing";
  }

  // Primary action: Space / click / Enter
  function action() {
    switch (state) {
      case "ready": launch(); break;
      case "paused": state = "playing"; break;
      case "levelClear": startLevel(levelIndex + 1); break;
      case "gameOver":
      case "won": newGame(); break;
    }
  }

  function togglePause() {
    if (state === "playing") state = "paused";
    else if (state === "paused") state = "playing";
  }

  // ---- Input ----
  window.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; e.preventDefault(); }
    else if (k === " " || k === "Enter") { action(); e.preventDefault(); }
    else if (k === "p" || k === "P" || k === "Escape") { togglePause(); }
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });
  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state === "playing") state = "paused";
  });

  function pointerToCanvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  function movePaddleTo(x) {
    if (state === "paused") return;
    paddle.x = clamp(x - paddle.w / 2, 0, W - paddle.w);
    if (ball.stuck) ball.x = paddle.x + paddle.w / 2;
  }
  canvas.addEventListener("pointermove", (e) => movePaddleTo(pointerToCanvasX(e.clientX)));
  canvas.addEventListener("pointerdown", (e) => {
    movePaddleTo(pointerToCanvasX(e.clientX));
    action();
  });

  // ---- Helpers ----
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function brickColor(b) {
    if (b.maxHp >= 2) return b.hp === 2 ? COLORS[2] : "#ffab91";
    return COLORS[1][b.row % COLORS[1].length];
  }

  // ---- Update ----
  function update(dt) {
    if (state === "paused" || state === "levelClear" || state === "gameOver" || state === "won") return;

    // Keyboard paddle movement
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir) {
      paddle.x = clamp(paddle.x + dir * PADDLE_SPEED * dt, 0, W - paddle.w);
    }

    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = PADDLE_Y - BALL_R - 1;
      return;
    }

    // Sub-step to avoid tunneling
    const steps = Math.ceil((Math.hypot(ball.vx, ball.vy) * dt) / (BALL_R * 0.75));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (stepBall(sdt)) break;
    }
  }

  // Returns true if the ball's step should stop (life lost or level cleared)
  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    // Bottom: lose a life
    if (ball.y - BALL_R > H) {
      lives--;
      if (lives <= 0) {
        state = "gameOver";
      } else {
        resetBall();
        state = "ready";
      }
      return true;
    }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + BALL_R >= PADDLE_Y && ball.y - BALL_R <= PADDLE_Y + PADDLE_H &&
        ball.x + BALL_R >= paddle.x && ball.x - BALL_R <= paddle.x + paddle.w) {
      const speed = Math.hypot(ball.vx, ball.vy);
      const hit = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const angle = hit * (Math.PI / 3); // up to 60° from vertical
      ball.vx = speed * Math.sin(angle);
      ball.vy = -speed * Math.cos(angle);
      ball.y = PADDLE_Y - BALL_R;
    }

    // Bricks (handle at most one collision per sub-step)
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const nx = clamp(ball.x, b.x, b.x + b.w);
      const ny = clamp(ball.y, b.y, b.y + b.h);
      const dx = ball.x - nx, dy = ball.y - ny;
      if (dx * dx + dy * dy > BALL_R * BALL_R) continue;

      // Decide reflection axis by penetration depth
      const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + b.w - (ball.x - BALL_R));
      const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + b.h - (ball.y - BALL_R));
      if (overlapX < overlapY) {
        ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      } else {
        ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      }

      b.hp--;
      if (b.hp <= 0) {
        score += 10 * b.maxHp * (levelIndex + 1);
        bricks.splice(i, 1);
      } else {
        score += 5;
      }

      // Slight speed-up on each hit, capped
      const speed = Math.hypot(ball.vx, ball.vy);
      const maxSpeed = LEVELS[levelIndex].speed * 1.6;
      if (speed < maxSpeed) {
        const f = 1.01;
        ball.vx *= f; ball.vy *= f;
      }

      if (bricks.length === 0) {
        state = levelIndex + 1 < LEVELS.length ? "levelClear" : "won";
        return true;
      }
      break;
    }
    return false;
  }

  // ---- Render ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "#e8ecf4";
    ctx.font = "bold 20px system-ui, sans-serif";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillText(`Score: ${score}`, 20, 30);
    ctx.textAlign = "center";
    ctx.fillText(`Level ${levelIndex + 1} / ${LEVELS.length}`, W / 2, 30);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 20 - MAX_LIVES * 22, 30);
    for (let i = 0; i < MAX_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 20 - (MAX_LIVES - 1 - i) * 22 - 8, 30, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5252" : "#3a4260";
      ctx.fill();
    }
    ctx.strokeStyle = "#2c3550";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, 52.5);
    ctx.lineTo(W, 52.5);
    ctx.stroke();
  }

  function drawOverlay(title, subtitle) {
    ctx.fillStyle = "rgba(10, 12, 20, 0.7)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 48px system-ui, sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 30);
    ctx.font = "20px system-ui, sans-serif";
    ctx.fillStyle = "#b8c2da";
    subtitle.split("\n").forEach((line, i) => ctx.fillText(line, W / 2, H / 2 + 25 + i * 30));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Bricks
    for (const b of bricks) {
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = brickColor(b);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
    }

    // Paddle
    roundRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H, 7);
    const grad = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(1, "#9fb3d9");
    ctx.fillStyle = grad;
    ctx.fill();

    // Ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = "#ffeb3b";
    ctx.fill();

    drawHUD();

    if (state === "ready") {
      ctx.textAlign = "center";
      ctx.fillStyle = "#b8c2da";
      ctx.font = "20px system-ui, sans-serif";
      ctx.fillText("Press Space or click to launch", W / 2, H / 2 + 60);
    } else if (state === "paused") {
      drawOverlay("Paused", "Press P, Space or click to resume");
    } else if (state === "levelClear") {
      drawOverlay(`Level ${levelIndex + 1} Clear!`, `Score: ${score}\nPress Space or click for Level ${levelIndex + 2}`);
    } else if (state === "gameOver") {
      drawOverlay("Game Over", `Final score: ${score}\nPress Space or click to play again`);
    } else if (state === "won") {
      drawOverlay("You Win!", `Final score: ${score}\nPress Space or click to play again`);
    }
  }

  // ---- Loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
