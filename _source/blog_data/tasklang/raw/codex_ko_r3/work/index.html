<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>벽돌깨기</title>
  <style>
    :root { color-scheme: dark; --bg:#080d1c; --panel:#111a30; --line:#283653; --text:#edf4ff; --muted:#9aacca; --cyan:#55e6dc; --pink:#ff668c; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:22px; color:var(--text); background:radial-gradient(ellipse at 50% -10%,#1b3157 0,transparent 58%),var(--bg); font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif }
    .game { width:min(100%,900px) }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:12px }
    h1 { margin:0; font-size:clamp(1.35rem,4vw,2rem); letter-spacing:.04em }
    h1 span { color:var(--cyan) }
    .stats { display:flex; gap:8px }
    .stat { min-width:92px; padding:9px 14px; text-align:center; border:1px solid var(--line); border-radius:12px; background:#111a30cc }
    .stat small { display:block; color:var(--muted); font-size:.7rem; letter-spacing:.12em }
    .stat strong { font-size:1.15rem; font-variant-numeric:tabular-nums }
    .board { position:relative; overflow:hidden; border:1px solid #334568; border-radius:18px; background:#0a1122; box-shadow:0 20px 70px #0008 }
    canvas { display:block; width:100%; height:auto; aspect-ratio:8/5; touch-action:none }
    .overlay { position:absolute; inset:0; display:grid; place-items:center; padding:24px; background:#071020b8; text-align:center; backdrop-filter:blur(4px) }
    .overlay.hidden { display:none }
    .card { max-width:440px; padding:30px; border:1px solid #435578; border-radius:18px; background:#111b31ed; box-shadow:0 18px 60px #0008 }
    .card .eyebrow { color:var(--cyan); font-size:.75rem; font-weight:800; letter-spacing:.18em }
    .card h2 { margin:8px 0; font-size:clamp(1.7rem,5vw,2.5rem) }
    .card p { margin:8px 0 20px; color:#b4c3dc; line-height:1.65 }
    button { border:0; border-radius:10px; padding:12px 24px; color:#07131f; background:var(--cyan); font:700 1rem inherit; cursor:pointer; transition:transform .15s,filter .15s }
    button:hover { transform:translateY(-2px); filter:brightness(1.08) }
    .help { display:flex; justify-content:space-between; gap:12px; margin:11px 4px 0; color:var(--muted); font-size:.82rem }
    kbd { padding:2px 7px; border:1px solid #3a4967; border-radius:5px; color:#dfe9fb; background:#111a2d; font:inherit }
    @media(max-width:560px) { body{padding:12px}.stats{gap:5px}.stat{min-width:65px;padding:7px 8px}.help{font-size:.72rem}.card{padding:22px} }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <h1>BRICK <span>BREAK</span></h1>
      <div class="stats" aria-label="게임 정보">
        <div class="stat"><small>점수</small><strong id="score">0</strong></div>
        <div class="stat"><small>레벨</small><strong id="level">1 / 2</strong></div>
        <div class="stat"><small>목숨</small><strong id="lives">♥ ♥ ♥</strong></div>
      </div>
    </header>
    <section class="board" aria-label="벽돌깨기 게임 보드">
      <canvas id="game" width="800" height="500" aria-label="벽돌을 공으로 깨는 게임"></canvas>
      <div class="overlay" id="overlay">
        <div class="card">
          <div class="eyebrow" id="eyebrow">READY, PLAYER ONE</div>
          <h2 id="title">벽돌깨기</h2>
          <p id="message">공을 튕겨 모든 벽돌을 깨 보세요.<br>두 레벨을 모두 클리어하면 승리합니다!</p>
          <button id="start">게임 시작</button>
        </div>
      </div>
    </section>
    <div class="help"><span><kbd>←</kbd> <kbd>→</kbd> 또는 <kbd>A</kbd> <kbd>D</kbd> 로 패들 이동</span><span>마우스 이동으로도 조작할 수 있어요</span></div>
  </main>
<script>
(() => {
  const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
  const scoreEl = document.querySelector('#score'), levelEl = document.querySelector('#level'), livesEl = document.querySelector('#lives');
  const overlay = document.querySelector('#overlay'), titleEl = document.querySelector('#title'), messageEl = document.querySelector('#message'), eyebrowEl = document.querySelector('#eyebrow'), startBtn = document.querySelector('#start');
  const W = canvas.width, H = canvas.height, paddle = { x:W/2-52, y:H-38, w:104, h:12, speed:7.5 };
  const ball = { x:W/2, y:paddle.y-10, r:8, vx:3.6, vy:-4.5 };
  const palettes = [['#56d7ff','#8c7bff','#ff6fae','#ffbd66'], ['#67f0bd','#42c9d5','#788dff','#ed7aff']];
  let bricks=[], score=0, lives=3, level=1, running=false, waiting=true, keys={}, last=0, pointerX=null;

  function makeBricks() {
    bricks=[]; const rows=level===1?5:6, cols=10, gap=8, side=36, bw=(W-side*2-gap*(cols-1))/cols, bh=19, top=74;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
      const tough=level===2 && (r+c)%4===0;
      bricks.push({x:side+c*(bw+gap),y:top+r*(bh+gap),w:bw,h:bh,hp:tough?2:1,max:tough?2:1,color:palettes[level-1][r%4]});
    }
  }
  function updateHud(){ scoreEl.textContent=score; levelEl.textContent=`${level} / 2`; livesEl.textContent='♥ '.repeat(lives).trim()||'—'; livesEl.style.color=lives<=1?'#ff668c':''; }
  function resetBall(){ ball.x=paddle.x+paddle.w/2; ball.y=paddle.y-ball.r-2; ball.vx=(Math.random()<.5?-1:1)*3.6; ball.vy=-4.5; waiting=true; }
  function showOverlay(title, msg, eyebrow, button='계속하기') { titleEl.textContent=title; messageEl.innerHTML=msg; eyebrowEl.textContent=eyebrow; startBtn.textContent=button; overlay.classList.remove('hidden'); }
  function hideOverlay(){ overlay.classList.add('hidden'); }
  function start(){ if(level>2){score=0;lives=3;level=1;makeBricks();updateHud()} hideOverlay(); running=true; waiting=false; last=performance.now(); requestAnimationFrame(loop); }
  function freshGame(){ score=0;lives=3;level=1;makeBricks();resetBall();updateHud();showOverlay('벽돌깨기','공을 튕겨 모든 벽돌을 깨 보세요.<br>두 레벨을 모두 클리어하면 승리합니다!','READY, PLAYER ONE','게임 시작'); }
  startBtn.addEventListener('click',start);
  window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.key===' '&&running&&waiting)waiting=false;});
  window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
  function setPointer(e){const rect=canvas.getBoundingClientRect();pointerX=(e.clientX-rect.left)*W/rect.width;}
  canvas.addEventListener('pointermove',setPointer);
  canvas.addEventListener('pointerdown',e=>{setPointer(e);if(running&&waiting)waiting=false;});
  function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
  function draw(){
    ctx.clearRect(0,0,W,H);
    const glow=ctx.createRadialGradient(W/2,0,20,W/2,0,500);glow.addColorStop(0,'#172b4a');glow.addColorStop(1,'#0a1122');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
    bricks.forEach(b=>{if(!b.hp)return;ctx.globalAlpha=b.hp===1&&b.max===2?.48:1;roundedRect(b.x,b.y,b.w,b.h,5);ctx.fillStyle=b.color;ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#ffffff35';roundedRect(b.x+3,b.y+2,b.w-6,3,2);ctx.fill();});
    ctx.shadowColor='#55e6dc';ctx.shadowBlur=18;roundedRect(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fillStyle='#55e6dc';ctx.fill();ctx.shadowBlur=0;
    ctx.shadowColor='#fff';ctx.shadowBlur=16;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.shadowBlur=0;
  }
  function update(dt){
    const scale=Math.min(dt/16.67,2);
    if(pointerX!==null){paddle.x=pointerX-paddle.w/2}else{if(keys.arrowleft||keys.a)paddle.x-=paddle.speed*scale;if(keys.arrowright||keys.d)paddle.x+=paddle.speed*scale;}
    paddle.x=Math.max(12,Math.min(W-paddle.w-12,paddle.x));
    if(waiting){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;return;}
    ball.x+=ball.vx*scale;ball.y+=ball.vy*scale;
    if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx)} if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)} if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}
    if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){
      ball.y=paddle.y-ball.r;const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);const speed=Math.min(8.2,Math.hypot(ball.vx,ball.vy)+.12);ball.vx=hit*speed*.92;ball.vy=-Math.sqrt(speed*speed-ball.vx*ball.vx);
    }
    for(const b of bricks){if(!b.hp||ball.x+ball.r<b.x||ball.x-ball.r>b.x+b.w||ball.y+ball.r<b.y||ball.y-ball.r>b.y+b.h)continue;
      const overlapX=Math.min(ball.x+ball.r-b.x,b.x+b.w-(ball.x-ball.r)),overlapY=Math.min(ball.y+ball.r-b.y,b.y+b.h-(ball.y-ball.r));
      if(overlapX<overlapY)ball.vx*=-1;else ball.vy*=-1; b.hp--; if(!b.hp)score+=b.max===2?25:10;else score+=8;updateHud();break;
    }
    if(ball.y-ball.r>H){lives--;updateHud();if(lives===0){running=false;showOverlay('게임 오버',`최종 점수 <strong>${score}</strong>점<br>다시 도전해 보세요!`,'GAME OVER','다시 시작');return}resetBall();}
    if(bricks.every(b=>!b.hp)){
      if(level===1){level=2;makeBricks();resetBall();updateHud();running=false;showOverlay('레벨 1 완료','멋져요! 다음 레벨은 강화 벽돌이 등장합니다.','LEVEL UP','레벨 2 시작');}
      else{level=3;updateHud();running=false;showOverlay('완벽한 승리!','두 레벨을 모두 클리어했습니다!<br>최종 점수 <strong>'+score+'</strong>점','YOU WIN','다시 플레이');}
    }
  }
  function loop(now){if(!running)return;const dt=now-last;last=now;update(dt);draw();if(running)requestAnimationFrame(loop);}
  makeBricks();updateHud();draw();
})();
</script>
</body>
</html>
