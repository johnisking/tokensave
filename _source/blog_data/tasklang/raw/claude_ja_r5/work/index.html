<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ブロック崩し</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    color: #e8ecf4;
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: linear-gradient(#1a2035, #0d1020);
    border: 2px solid #3a4466;
    border-radius: 8px;
    max-width: 96vw;
    max-height: 84vh;
    cursor: none;
  }
  .help {
    margin-top: 10px;
    font-size: 14px;
    color: #9aa4c0;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div class="help">
  操作：← → / A D キー または マウス移動でパドル操作 ｜ スペース / Enter / クリックで発射・開始 ｜ P で一時停止
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  // ---- 定数 ----
  const PADDLE_W = 110;
  const PADDLE_H = 14;
  const PADDLE_Y = H - 40;
  const PADDLE_SPEED = 520; // px/秒
  const BALL_R = 8;
  const MAX_LIVES = 3;

  const BRICK_COLS = 10;
  const BRICK_W = 68;
  const BRICK_H = 22;
  const BRICK_GAP = 6;
  const BRICK_TOP = 70;
  const BRICK_LEFT = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;

  const ROW_COLORS = ["#ff5c7a", "#ffa94d", "#ffd84d", "#6ee07a", "#4dc3ff", "#a77dff"];

  // レベル定義：数字はブロックの耐久度（0 = なし）
  const LEVELS = [
    {
      name: "レベル 1",
      ballSpeed: 340,
      map: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      name: "レベル 2",
      ballSpeed: 420,
      map: [
        "2222222222",
        "2100000012",
        "2101111012",
        "2102222012",
        "2101111012",
        "2100000012",
        "1111111111",
      ],
    },
  ];

  // ---- 状態 ----
  let state = "title"; // title | serve | play | paused | levelclear | gameover | win
  let score = 0;
  let lives = MAX_LIVES;
  let levelIndex = 0;
  let bricks = [];
  let particles = [];

  const paddle = { x: (W - PADDLE_W) / 2, w: PADDLE_W };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, speed: 0 };

  const keys = { left: false, right: false };
  let mouseX = null;

  // ---- 初期化 ----
  function buildLevel(idx) {
    const lv = LEVELS[idx];
    bricks = [];
    lv.map.forEach((row, r) => {
      for (let c = 0; c < BRICK_COLS; c++) {
        const hp = parseInt(row[c], 10) || 0;
        if (hp > 0) {
          bricks.push({
            x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP),
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            w: BRICK_W,
            h: BRICK_H,
            hp,
            maxHp: hp,
            color: ROW_COLORS[r % ROW_COLORS.length],
          });
        }
      }
    });
    particles = [];
    resetBall();
  }

  function resetBall() {
    ball.speed = LEVELS[levelIndex].ballSpeed;
    ball.vx = 0;
    ball.vy = 0;
    stickBallToPaddle();
    state = "serve";
  }

  function stickBallToPaddle() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = PADDLE_Y - BALL_R - 1;
  }

  function launchBall() {
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    state = "play";
  }

  function newGame() {
    score = 0;
    lives = MAX_LIVES;
    levelIndex = 0;
    paddle.x = (W - PADDLE_W) / 2;
    buildLevel(levelIndex);
  }

  // 決定操作（スペース / Enter / クリック）
  function primaryAction() {
    switch (state) {
      case "title":
      case "gameover":
      case "win":
        newGame();
        break;
      case "serve":
        launchBall();
        break;
      case "levelclear":
        levelIndex++;
        buildLevel(levelIndex);
        break;
      case "paused":
        state = "play";
        break;
    }
  }

  function togglePause() {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }

  // ---- 入力 ----
  window.addEventListener("keydown", (e) => {
    switch (e.code) {
      case "ArrowLeft":
      case "KeyA":
        keys.left = true;
        mouseX = null;
        e.preventDefault();
        break;
      case "ArrowRight":
      case "KeyD":
        keys.right = true;
        mouseX = null;
        e.preventDefault();
        break;
      case "Space":
      case "Enter":
        if (!e.repeat) primaryAction();
        e.preventDefault();
        break;
      case "KeyP":
      case "Escape":
        togglePause();
        break;
    }
  });

  window.addEventListener("keyup", (e) => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
  });

  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (W / rect.width);
  });

  canvas.addEventListener("mousedown", (e) => {
    e.preventDefault();
    primaryAction();
  });

  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state === "play") state = "paused";
  });

  // ---- 更新 ----
  function updatePaddle(dt) {
    if (mouseX !== null) {
      paddle.x = mouseX - paddle.w / 2;
    } else {
      if (keys.left) paddle.x -= PADDLE_SPEED * dt;
      if (keys.right) paddle.x += PADDLE_SPEED * dt;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function circleRectHit(cx, cy, r, rect) {
    const nx = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    const ny = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    const dx = cx - nx;
    const dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // 壁
    if (ball.x - BALL_R < 0) {
      ball.x = BALL_R;
      ball.vx = Math.abs(ball.vx);
    } else if (ball.x + BALL_R > W) {
      ball.x = W - BALL_R;
      ball.vx = -Math.abs(ball.vx);
    }
    if (ball.y - BALL_R < 0) {
      ball.y = BALL_R;
      ball.vy = Math.abs(ball.vy);
    }

    // パドル
    const pRect = { x: paddle.x, y: PADDLE_Y, w: paddle.w, h: PADDLE_H };
    if (ball.vy > 0 && circleRectHit(ball.x, ball.y, BALL_R, pRect)) {
      // 当たった位置で反射角を変える（-1 〜 1）
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const clamped = Math.max(-1, Math.min(1, hit));
      const angle = clamped * (Math.PI / 3); // 最大 60 度
      ball.vx = Math.sin(angle) * ball.speed;
      ball.vy = -Math.cos(angle) * ball.speed;
      ball.y = PADDLE_Y - BALL_R - 1;
    }

    // ブロック（1ステップで1つだけ処理）
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      if (!circleRectHit(ball.x, ball.y, BALL_R, b)) continue;

      // 侵入量が小さい方向で反射
      const overlapLeft = ball.x + BALL_R - b.x;
      const overlapRight = b.x + b.w - (ball.x - BALL_R);
      const overlapTop = ball.y + BALL_R - b.y;
      const overlapBottom = b.y + b.h - (ball.y - BALL_R);
      const minX = Math.min(overlapLeft, overlapRight);
      const minY = Math.min(overlapTop, overlapBottom);

      if (minX < minY) {
        if (overlapLeft < overlapRight) {
          ball.x = b.x - BALL_R;
          ball.vx = -Math.abs(ball.vx);
        } else {
          ball.x = b.x + b.w + BALL_R;
          ball.vx = Math.abs(ball.vx);
        }
      } else {
        if (overlapTop < overlapBottom) {
          ball.y = b.y - BALL_R;
          ball.vy = -Math.abs(ball.vy);
        } else {
          ball.y = b.y + b.h + BALL_R;
          ball.vy = Math.abs(ball.vy);
        }
      }

      b.hp--;
      if (b.hp <= 0) {
        score += 100 * b.maxHp;
        spawnParticles(b);
        bricks.splice(i, 1);
      } else {
        score += 20;
      }
      break;
    }

    // 落下
    if (ball.y - BALL_R > H) {
      lives--;
      if (lives <= 0) {
        state = "gameover";
      } else {
        resetBall();
      }
      return false;
    }

    // クリア判定
    if (bricks.length === 0) {
      if (levelIndex < LEVELS.length - 1) {
        state = "levelclear";
      } else {
        state = "win";
      }
      return false;
    }
    return true;
  }

  function updateBall(dt) {
    // トンネリング防止のため細かく分割して進める
    const dist = ball.speed * dt;
    const steps = Math.max(1, Math.ceil(dist / (BALL_R * 0.5)));
    const sub = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (!stepBall(sub)) break;
    }
  }

  function spawnParticles(b) {
    for (let i = 0; i < 12; i++) {
      particles.push({
        x: b.x + b.w / 2,
        y: b.y + b.h / 2,
        vx: (Math.random() - 0.5) * 300,
        vy: (Math.random() - 0.5) * 300,
        life: 0.5 + Math.random() * 0.3,
        color: b.color,
      });
    }
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 500 * dt;
      p.life -= dt;
    }
    particles = particles.filter((p) => p.life > 0);
  }

  function update(dt) {
    if (state === "paused" || state === "title") return;

    updatePaddle(dt);
    updateParticles(dt);

    if (state === "serve") {
      stickBallToPaddle();
    } else if (state === "play") {
      updateBall(dt);
    }
  }

  // ---- 描画 ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.fillRect(0, 0, W, 44);

    ctx.font = "bold 20px sans-serif";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#e8ecf4";
    ctx.textAlign = "left";
    ctx.fillText("スコア: " + score, 16, 22);

    ctx.textAlign = "center";
    ctx.fillText(LEVELS[levelIndex].name + " / " + LEVELS.length, W / 2, 22);

    ctx.textAlign = "right";
    ctx.fillText("ライフ:", W - 16 - MAX_LIVES * 24, 22);
    for (let i = 0; i < MAX_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (MAX_LIVES - 1 - i) * 24 - 9, 22, 8, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5c7a" : "rgba(255,255,255,0.15)";
      ctx.fill();
    }
  }

  function drawBricks() {
    for (const b of bricks) {
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.hp < b.maxHp ? 0.55 : 1;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.maxHp > 1) {
        ctx.strokeStyle = "rgba(255,255,255,0.85)";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
    }
  }

  function drawPaddle() {
    roundRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H, 7);
    const g = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
    g.addColorStop(0, "#d6e4ff");
    g.addColorStop(1, "#6f8cff");
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#9fc3ff";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.8);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawOverlay(title, lines) {
    ctx.fillStyle = "rgba(8,10,20,0.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 48px sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 50);
    ctx.font = "20px sans-serif";
    ctx.fillStyle = "#c8d0e8";
    lines.forEach((line, i) => ctx.fillText(line, W / 2, H / 2 + 10 + i * 32));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawParticles();
    drawPaddle();
    if (state !== "title") drawBall();
    drawHUD();

    if (state === "title") {
      drawOverlay("ブロック崩し", [
        "← → / A D キー または マウスでパドルを操作",
        "スペース / Enter / クリックでスタート",
      ]);
    } else if (state === "serve") {
      ctx.textAlign = "center";
      ctx.font = "18px sans-serif";
      ctx.fillStyle = "#c8d0e8";
      ctx.fillText("スペース / Enter / クリックで発射", W / 2, H / 2 + 80);
    } else if (state === "paused") {
      drawOverlay("一時停止", ["P / Esc / スペース / クリックで再開"]);
    } else if (state === "levelclear") {
      drawOverlay(LEVELS[levelIndex].name + " クリア！", [
        "スコア: " + score,
        "スペース / Enter / クリックで次のレベルへ",
      ]);
    } else if (state === "gameover") {
      drawOverlay("ゲームオーバー", [
        "スコア: " + score,
        "スペース / Enter / クリックでもう一度",
      ]);
    } else if (state === "win") {
      drawOverlay("全レベルクリア！", [
        "最終スコア: " + score + "（残りライフ " + lives + "）",
        "スペース / Enter / クリックでもう一度",
      ]);
    }
  }

  // ---- メインループ ----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  buildLevel(0);
  state = "title";
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
