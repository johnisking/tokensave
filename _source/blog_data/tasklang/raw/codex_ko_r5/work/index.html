<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브릭 브레이커</title>
<style>
:root{color-scheme:dark;--bg:#090d1b;--panel:#10182b;--line:#263451;--text:#eef4ff;--muted:#9aabc7;--cyan:#51e5ff;--pink:#ff668f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#18264a 0%,var(--bg) 60%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(900px,100%)}header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 14px}h1{font-size:clamp(25px,4vw,36px);margin:0;letter-spacing:-1.5px}h1 span{color:var(--cyan)}.tag{font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.stats{display:flex;gap:10px}.stat{background:#10182bdc;border:1px solid var(--line);border-radius:12px;padding:9px 15px;min-width:90px}.label{display:block;color:var(--muted);font-size:10px;letter-spacing:1.5px}.value{font-size:19px;font-weight:750;font-variant-numeric:tabular-nums}
.frame{position:relative;padding:10px;border:1px solid #31415e;border-radius:18px;background:linear-gradient(145deg,#17223a,#0a1020);box-shadow:0 24px 80px #0008, inset 0 1px #ffffff10}canvas{display:block;width:100%;height:auto;border-radius:10px;background:#0a1224;touch-action:none}.overlay{position:absolute;inset:10px;display:grid;place-items:center;border-radius:10px;background:#071022b8;backdrop-filter:blur(5px);text-align:center;padding:20px}.overlay.hidden{display:none}.card{max-width:440px}.card h2{font-size:clamp(26px,5vw,42px);margin:0 0 9px;letter-spacing:-1px}.card p{color:#b7c5dc;line-height:1.65;margin:0 0 21px}.card em{color:var(--cyan);font-style:normal}.btn{border:0;border-radius:10px;padding:12px 22px;background:linear-gradient(100deg,#42d9ff,#76f0d1);color:#081321;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 6px 22px #39dfff40}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.help{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;padding:14px 5px}.keys{color:#d5e2f6}.key{display:inline-block;border:1px solid #344560;border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:#f4f8ff;font-size:11px}
@media(max-width:540px){body{padding:14px}.stats{gap:6px}.stat{padding:7px 10px;min-width:65px}.value{font-size:16px}.tag{font-size:10px}header{align-items:center}}
</style>
</head>
<body>
<main>
<header><div><div class="tag">Arcade · 01 / 02</div><h1>BRICK <span>BREAKER</span></h1></div><div class="stats"><div class="stat"><span class="label">SCORE</span><span class="value" id="score">0000</span></div><div class="stat"><span class="label">LEVEL</span><span class="value" id="level">1 / 2</span></div><div class="stat"><span class="label">LIVES</span><span class="value" id="lives">♥ ♥ ♥</span></div></div></header>
<div class="frame"><canvas id="game" width="800" height="520" aria-label="벽돌깨기 게임"></canvas><div class="overlay" id="overlay"><div class="card"><h2 id="title">준비됐나요?</h2><p id="message">공을 튕겨 모든 벽돌을 깨 보세요.<br><em>마우스</em> 또는 <em>← → / A D</em> 로 패들을 움직입니다.</p><button class="btn" id="start">게임 시작</button></div></div></div>
<div class="help"><span class="keys"><span class="key">←</span> <span class="key">→</span> / <span class="key">A</span> <span class="key">D</span> 패들 이동 · 클릭으로 발사</span><span>공간을 클릭하거나 시작 버튼을 눌러요</span></div>
</main>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const scoreEl=document.querySelector('#score'),levelEl=document.querySelector('#level'),livesEl=document.querySelector('#lives'),overlay=document.querySelector('#overlay'),titleEl=document.querySelector('#title'),messageEl=document.querySelector('#message'),startBtn=document.querySelector('#start');
const W=canvas.width,H=canvas.height, paddle={x:W/2-53,y:H-38,w:106,h:12,speed:8},ball={x:W/2,y:H-55,r:8,vx:0,vy:0};
const colors=['#50dfff','#8c82ff','#ff6f9f','#ffc45e','#5ee1b5'];let bricks=[],score=0,lives=3,level=1,running=false,started=false,keys={},raf;
function makeBricks(){bricks=[];const rows=level===1?5:6,cols=10,bw=64,bh=19,gap=10,left=(W-(cols*bw+(cols-1)*gap))/2,top=65;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({x:left+c*(bw+gap),y:top+r*(bh+gap),w:bw,h:bh,alive:true,color:colors[(r+(level===2?2:0))%colors.length],hp:level===2&&r<2?2:1});}
function resetBall(){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;ball.vx=0;ball.vy=0;started=false}
function begin(){if(lives<=0||level>2){score=0;lives=3;level=1;makeBricks();updateHUD()}overlay.classList.add('hidden');running=true;if(!started)launch();cancelAnimationFrame(raf);loop()}
function launch(){if(started)return;started=true;ball.vx=(Math.random()>.5?1:-1)*3.6;ball.vy=-5.1}
function updateHUD(){scoreEl.textContent=String(score).padStart(4,'0');levelEl.textContent=level+' / 2';livesEl.textContent=Array.from({length:3},(_,i)=>i<lives?'♥':'♡').join(' ')}
function show(title,msg,button='다시 시작'){running=false;overlay.classList.remove('hidden');titleEl.textContent=title;messageEl.innerHTML=msg;startBtn.textContent=button}
function nextLevel(){if(level===1){level=2;makeBricks();resetBall();updateHUD();show('레벨 2','두꺼운 벽돌은 <em>두 번</em> 맞혀야 깨집니다. 준비되면 시작하세요!','레벨 2 시작')}else{level=3;updateHUD();show('완벽한 클리어!','두 레벨을 모두 통과했습니다.<br>최종 점수 <em>'+score+'</em>점','다시 플레이')}}
function loseLife(){lives--;updateHUD();if(lives<=0){show('게임 오버','최종 점수 <em>'+score+'</em>점 · 다시 도전해 보세요!','다시 시작')}else{resetBall();show('공을 놓쳤어요','남은 목숨 <em>'+lives+'</em>개 · 준비되면 다시 시작하세요','계속하기')}}
function loop(){if(!running)return;update();draw();raf=requestAnimationFrame(loop)}
function update(){if(keys.ArrowLeft||keys.a||keys.A)paddle.x-=paddle.speed;if(keys.ArrowRight||keys.d||keys.D)paddle.x+=paddle.speed;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));if(!started){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;return}ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){let hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*6.2;ball.vy=-Math.max(4.1,Math.sqrt(7.4*7.4-ball.vx*ball.vx));ball.y=paddle.y-ball.r-1}if(ball.y-ball.r>H){loseLife();return}for(const b of bricks){if(!b.alive)continue;if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.hp--;if(b.hp<=0){b.alive=false;score+=10*level}else score+=5;updateHUD();let ox=Math.min(ball.x+ball.r-b.x,b.x+b.w-(ball.x-ball.r)),oy=Math.min(ball.y+ball.r-b.y,b.y+b.h-(ball.y-ball.r));if(ox<oy)ball.vx*=-1;else ball.vy*=-1;break}}if(bricks.every(b=>!b.alive)){nextLevel()}}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0c1830');g.addColorStop(1,'#091022');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;for(let x=20;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(const b of bricks){if(!b.alive)continue;ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=13;ctx.fillStyle=b.color;roundRect(b.x,b.y,b.w,b.h,5);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffff35';roundRect(b.x+3,b.y+3,b.w-6,3,2);ctx.fill();if(b.hp>1){ctx.fillStyle='#102033';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('×2',b.x+b.w/2,b.y+14)}ctx.restore()}ctx.save();ctx.shadowColor='#51e5ff';ctx.shadowBlur=20;let pg=ctx.createLinearGradient(paddle.x,0,paddle.x+paddle.w,0);pg.addColorStop(0,'#41b8ff');pg.addColorStop(.5,'#7af5e0');pg.addColorStop(1,'#41b8ff');ctx.fillStyle=pg;roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fill();ctx.restore();ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=18;ctx.fillStyle='#f8ffff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.restore()}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
canvas.addEventListener('mousemove',e=>{let rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*W/rect.width;paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2))});canvas.addEventListener('touchmove',e=>{e.preventDefault();let rect=canvas.getBoundingClientRect(),x=(e.touches[0].clientX-rect.left)*W/rect.width;paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2))},{passive:false});canvas.addEventListener('click',()=>{if(running)launch()});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' '&&running)launch();if(e.key==='Enter'&&!running)begin()});window.addEventListener('keyup',e=>keys[e.key]=false);startBtn.addEventListener('click',begin);
makeBricks();resetBall();updateHUD();draw();
})();
</script>
</body>
</html>
