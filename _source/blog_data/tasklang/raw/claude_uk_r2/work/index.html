<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Арканоїд</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d0f1a;
    color: #e8ecff;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: 2px; }
  canvas {
    background: linear-gradient(#141833, #0a0c18);
    border: 2px solid #3a4280;
    border-radius: 6px;
    box-shadow: 0 0 30px rgba(80, 100, 255, 0.25);
    max-width: 96vw;
    max-height: 80vh;
    cursor: none;
  }
  .help { margin-top: 10px; font-size: 14px; color: #9aa3d0; text-align: center; }
  kbd {
    background: #252a4a; border: 1px solid #47507f; border-radius: 4px;
    padding: 1px 6px; font-family: inherit;
  }
</style>
</head>
<body>
<h1>АРКАНОЇД</h1>
<canvas id="game" width="800" height="600"></canvas>
<div class="help">
  Керування: <kbd>←</kbd> <kbd>→</kbd> або <kbd>A</kbd> <kbd>D</kbd> чи мишею ·
  <kbd>Пробіл</kbd> / клік — запуск м'яча · <kbd>P</kbd> — пауза · <kbd>R</kbd> — заново
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---------- Налаштування ----------
  const HUD_H = 40;
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 600;
  const BALL_R = 8;
  const START_LIVES = 3;

  const BRICK_ROWS_TOP = HUD_H + 30;
  const BRICK_W = 70, BRICK_H = 24, BRICK_GAP = 6;
  const COLS = 10;
  const BRICK_OFFSET_X = (W - (COLS * BRICK_W + (COLS - 1) * BRICK_GAP)) / 2;

  const ROW_COLORS = ['#ff5b6e', '#ff9f43', '#ffd84d', '#4cd97b', '#4cc3ff', '#9b7bff'];

  // Рівні: '.' — порожньо, '1' — звичайна цеглинка, '2' — міцна (2 удари), '3' — дуже міцна (3 удари)
  const LEVELS = [
    {
      name: 'Рівень 1',
      ballSpeed: 360,
      map: [
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
      ],
    },
    {
      name: 'Рівень 2',
      ballSpeed: 430,
      map: [
        '3.22222.3.',
        '.2111112..',
        '2.1.11.1.2',
        '2111..1112',
        '.21111112.',
        '2.2.33.2.2',
      ].map(r => r.padEnd(10, '.')),
    },
  ];

  // ---------- Стан гри ----------
  let state;          // 'ready' | 'playing' | 'paused' | 'levelClear' | 'gameOver' | 'win'
  let score, lives, levelIndex;
  let bricks = [];
  let paddle, ball;
  let particles = [];
  let stateTimer = 0;

  const keys = { left: false, right: false };
  let mouseX = null;

  function buildLevel(i) {
    bricks = [];
    const map = LEVELS[i].map;
    for (let r = 0; r < map.length; r++) {
      for (let c = 0; c < COLS; c++) {
        const ch = map[r][c];
        if (ch === '.' || ch === undefined) continue;
        const hp = parseInt(ch, 10);
        bricks.push({
          x: BRICK_OFFSET_X + c * (BRICK_W + BRICK_GAP),
          y: BRICK_ROWS_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H,
          hp, maxHp: hp,
          color: ROW_COLORS[r % ROW_COLORS.length],
          alive: true,
        });
      }
    }
  }

  function resetPaddleAndBall() {
    paddle = { x: W / 2 - PADDLE_W / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
    ball = { x: W / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, r: BALL_R, stuck: true };
  }

  function newGame() {
    score = 0;
    lives = START_LIVES;
    levelIndex = 0;
    particles = [];
    buildLevel(levelIndex);
    resetPaddleAndBall();
    state = 'ready';
  }

  function startLevel(i) {
    levelIndex = i;
    particles = [];
    buildLevel(i);
    resetPaddleAndBall();
    state = 'ready';
  }

  function launchBall() {
    if (!ball.stuck) return;
    const speed = LEVELS[levelIndex].ballSpeed;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    ball.stuck = false;
    state = 'playing';
  }

  // Головна дія (пробіл / клік) залежно від стану
  function primaryAction() {
    if (state === 'ready') launchBall();
    else if (state === 'paused') state = 'playing';
    else if (state === 'levelClear' && stateTimer <= 0) startLevel(levelIndex + 1);
    else if ((state === 'gameOver' || state === 'win') && stateTimer <= 0) newGame();
  }

  // ---------- Введення ----------
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A' || k === 'ф' || k === 'Ф') keys.left = true;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D' || k === 'в' || k === 'В') keys.right = true;
    else if (k === ' ' || k === 'Enter') primaryAction();
    else if (k === 'p' || k === 'P' || k === 'з' || k === 'З' || k === 'Escape') {
      if (state === 'playing') state = 'paused';
      else if (state === 'paused') state = 'playing';
    } else if (k === 'r' || k === 'R' || k === 'к' || k === 'К') newGame();
    else return;
    mouseX = null; // клавіатура має пріоритет, доки миша знову не рухнеться
    e.preventDefault();
  });
  document.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A' || k === 'ф' || k === 'Ф') keys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D' || k === 'в' || k === 'В') keys.right = false;
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  document.addEventListener('mousemove', e => { mouseX = canvasX(e.clientX); });
  canvas.addEventListener('mousedown', e => { mouseX = canvasX(e.clientX); primaryAction(); });
  canvas.addEventListener('touchmove', e => {
    mouseX = canvasX(e.touches[0].clientX); e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchstart', e => {
    mouseX = canvasX(e.touches[0].clientX); primaryAction(); e.preventDefault();
  }, { passive: false });
  window.addEventListener('blur', () => {
    keys.left = keys.right = false;
    if (state === 'playing') state = 'paused';
  });

  // ---------- Логіка ----------
  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  function updatePaddle(dt) {
    if (keys.left || keys.right) {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      paddle.x += dir * PADDLE_SPEED * dt;
    } else if (mouseX !== null) {
      paddle.x = mouseX - paddle.w / 2;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function circleRect(b, r) {
    const cx = Math.max(r.x, Math.min(b.x, r.x + r.w));
    const cy = Math.max(r.y, Math.min(b.y, r.y + r.h));
    const dx = b.x - cx, dy = b.y - cy;
    return dx * dx + dy * dy <= b.r * b.r;
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Стіни
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < HUD_H) { ball.y = HUD_H + ball.r; ball.vy = Math.abs(ball.vy); }

    // Ракетка
    if (ball.vy > 0 && circleRect(ball, paddle) && ball.y < paddle.y + paddle.h) {
      const speed = Math.hypot(ball.vx, ball.vy);
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const angle = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3);      // до 60°
      ball.vx = Math.sin(angle) * speed;
      ball.vy = -Math.cos(angle) * speed;
      ball.y = paddle.y - ball.r - 0.5;
    }

    // Цеглинки (одна за крок)
    for (const br of bricks) {
      if (!br.alive || !circleRect(ball, br)) continue;
      const overlapL = ball.x + ball.r - br.x;
      const overlapR = br.x + br.w - (ball.x - ball.r);
      const overlapT = ball.y + ball.r - br.y;
      const overlapB = br.y + br.h - (ball.y - ball.r);
      const minX = Math.min(overlapL, overlapR);
      const minY = Math.min(overlapT, overlapB);
      if (minX < minY) {
        ball.vx = overlapL < overlapR ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      } else {
        ball.vy = overlapT < overlapB ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      }
      br.hp--;
      if (br.hp <= 0) {
        br.alive = false;
        score += 10 * br.maxHp;
        spawnParticles(br.x + br.w / 2, br.y + br.h / 2, br.color);
      } else {
        score += 5;
      }
      // невелике прискорення
      const sp = Math.hypot(ball.vx, ball.vy);
      const maxSp = LEVELS[levelIndex].ballSpeed * 1.6;
      if (sp < maxSp) { ball.vx *= 1.01; ball.vy *= 1.01; }
      break;
    }

    // Падіння
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) {
        state = 'gameOver';
        stateTimer = 0.6;
      } else {
        resetPaddleAndBall();
        state = 'ready';
      }
      return false;
    }

    // Рівень пройдено
    if (bricks.every(b => !b.alive)) {
      score += lives * 100; // бонус за життя
      if (levelIndex + 1 < LEVELS.length) state = 'levelClear';
      else state = 'win';
      stateTimer = 0.6;
      return false;
    }
    return true;
  }

  function update(dt) {
    if (stateTimer > 0) stateTimer -= dt;

    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);

    if (state === 'paused' || state === 'gameOver' || state === 'win' || state === 'levelClear') return;

    updatePaddle(dt);

    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
      return;
    }

    // Підкроки, щоб м'яч не проскакував крізь цеглинки
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / (ball.r * 0.5)));
    for (let i = 0; i < steps; i++) {
      if (!stepBall(dt / steps)) break;
    }
  }

  // ---------- Малювання ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.strokeStyle = '#3a4280';
    ctx.beginPath(); ctx.moveTo(0, HUD_H); ctx.lineTo(W, HUD_H); ctx.stroke();

    ctx.font = 'bold 18px "Segoe UI", Arial, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e8ecff';
    ctx.textAlign = 'left';
    ctx.fillText('Рахунок: ' + score, 16, HUD_H / 2);
    ctx.textAlign = 'center';
    ctx.fillText(LEVELS[levelIndex].name + ' / ' + LEVELS.length, W / 2, HUD_H / 2);
    ctx.textAlign = 'right';
    ctx.fillText('Життя:', W - 16 - START_LIVES * 22, HUD_H / 2);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.fillStyle = i < lives ? '#ff5b6e' : '#3a3f63';
      ctx.beginPath();
      ctx.arc(W - 16 - (START_LIVES - 1 - i) * 22 - 8, HUD_H / 2, 7, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBricks() {
    for (const b of bricks) {
      if (!b.alive) continue;
      const alpha = 0.45 + 0.55 * (b.hp / b.maxHp);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = b.maxHp > 1 ? '#b8c0e0' : b.color;
      if (b.maxHp > 1) ctx.fillStyle = b.hp === 3 ? '#8f98c4' : b.hp === 2 ? '#c6cde8' : b.color;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
      if (b.maxHp > 1) {
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 2;
        roundRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2, 4);
        ctx.stroke();
        ctx.lineWidth = 1;
        ctx.fillStyle = '#1b1f3a';
        ctx.font = 'bold 13px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
    }
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, '#9fe6ff');
    g.addColorStop(1, '#2d8cff');
    ctx.fillStyle = g;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
  }

  function drawBall() {
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawOverlay(title, lines, color) {
    ctx.fillStyle = 'rgba(5, 6, 15, 0.7)';
    ctx.fillRect(0, HUD_H, W, H - HUD_H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color || '#ffffff';
    ctx.font = 'bold 48px "Segoe UI", Arial, sans-serif';
    ctx.fillText(title, W / 2, H / 2 - 40);
    ctx.fillStyle = '#c8cff5';
    ctx.font = '20px "Segoe UI", Arial, sans-serif';
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 15 + i * 30));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawParticles();
    drawPaddle();
    drawBall();
    drawHUD();

    if (state === 'ready') {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#e8ecff';
      ctx.font = 'bold 30px "Segoe UI", Arial, sans-serif';
      ctx.fillText(LEVELS[levelIndex].name, W / 2, H / 2 + 40);
      ctx.font = '18px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = '#9aa3d0';
      ctx.fillText('Натисніть Пробіл або клацніть, щоб запустити м\'яч', W / 2, H / 2 + 75);
    } else if (state === 'paused') {
      drawOverlay('ПАУЗА', ['Натисніть P, Пробіл або клацніть, щоб продовжити']);
    } else if (state === 'levelClear') {
      drawOverlay('Рівень пройдено!', [
        'Рахунок: ' + score,
        'Пробіл / клік — до рівня ' + (levelIndex + 2),
      ], '#4cd97b');
    } else if (state === 'gameOver') {
      drawOverlay('ГРА ЗАКІНЧЕНА', [
        'Ваш рахунок: ' + score,
        'Пробіл / клік — почати знову',
      ], '#ff5b6e');
    } else if (state === 'win') {
      drawOverlay('ПЕРЕМОГА!', [
        'Усі рівні пройдено. Рахунок: ' + score,
        'Пробіл / клік — зіграти ще раз',
      ], '#ffd84d');
    }
  }

  // ---------- Цикл ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
