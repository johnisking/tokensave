<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON BREAKER — ブロック崩し</title>
<style>
:root{color-scheme:dark;--cyan:#67f4ff;--pink:#ff67c4;--ink:#080a18}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0,#191b3c 0,#0c1024 48%,#070914 100%);color:#f3f5ff;font-family:Inter,"Segoe UI",system-ui,sans-serif}body{display:flex;justify-content:center;padding:28px 16px 32px}.shell{width:min(100%,790px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border:1px solid #75f5ff80;border-radius:13px;display:grid;place-items:center;color:var(--cyan);font-size:23px;box-shadow:0 0 22px #38dff733;background:#101b30}.eyebrow{font-size:10px;letter-spacing:.23em;color:#8994bc;font-weight:800}.title{font-size:19px;letter-spacing:.11em;font-weight:900;margin-top:2px}.title span{color:var(--cyan)}.sound{border:1px solid #ffffff22;background:#ffffff09;color:#cbd2f1;border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit;font-size:12px}.sound:hover{border-color:#67f4ff88;color:white}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}.stat{border:1px solid #ffffff13;background:linear-gradient(135deg,#ffffff0b,#ffffff04);padding:10px 13px;border-radius:12px;min-height:59px}.label{font-size:9px;color:#818bad;letter-spacing:.17em;font-weight:800}.value{font-size:19px;font-weight:850;letter-spacing:.04em;margin-top:2px;font-variant-numeric:tabular-nums}.value.cyan{color:var(--cyan)}.hearts{color:#ff74b8;letter-spacing:3px;font-size:16px}.board-wrap{border-radius:18px;border:1px solid #7ff6ff36;padding:7px;background:#080d1d;box-shadow:0 14px 65px #0008,0 0 35px #32e9ff12;position:relative}.board-wrap:before{content:"";position:absolute;inset:-1px;border-radius:19px;background:linear-gradient(135deg,#79f8ff55,transparent 34%,transparent 66%,#c968ff40);pointer-events:none;opacity:.6}.canvas-box{position:relative;border-radius:12px;overflow:hidden;background:#080b1b}canvas{display:block;width:100%;height:auto;aspect-ratio:760/500;touch-action:none}.hint{display:flex;justify-content:space-between;gap:16px;align-items:center;color:#8d96b8;font-size:11px;padding:13px 4px 0}.hint b{color:#cbd6f5;font-weight:650}.key{display:inline-block;border:1px solid #ffffff28;border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:#e4eaff;margin:0 2px;font-size:10px}.help{margin-top:12px;color:#737c9f;font-size:10px;line-height:1.65;text-align:center}.help strong{color:#aab3d5;font-weight:650}@media(max-width:520px){body{padding:17px 11px}.title{font-size:16px}.hud{gap:6px}.stat{padding:8px 9px;min-height:53px}.label{font-size:8px}.value{font-size:17px}.hint{font-size:10px;align-items:flex-start}.hint span:last-child{text-align:right}}
</style>
</head>
<body>
<main class="shell">
<header><div class="brand"><div class="mark">✳</div><div><div class="eyebrow">ARCADE / 001</div><div class="title">NEON <span>BREAKER</span></div></div></div><button class="sound" id="soundBtn" aria-label="サウンド切り替え">♫ サウンド ON</button></header>
<section class="hud" aria-label="ゲーム情報"><div class="stat"><div class="label">SCORE</div><div class="value cyan" id="score">000000</div></div><div class="stat"><div class="label">LEVEL</div><div class="value" id="level">01 <span style="font-size:11px;color:#818bad">/ 02</span></div></div><div class="stat"><div class="label">LIVES</div><div class="value hearts" id="lives">♥ ♥ ♥</div></div><div class="stat"><div class="label">BRICKS</div><div class="value" id="bricks">—</div></div></section>
<div class="board-wrap"><div class="canvas-box"><canvas id="game" width="760" height="500" aria-label="ブロック崩しゲーム画面"></canvas></div></div>
<div class="hint"><span><b>操作</b>　<span class="key">←</span><span class="key">→</span> または <span class="key">A</span><span class="key">D</span>　マウス移動</span><span><b>発射 / 再開</b>　<span class="key">Space</span> またはクリック</span></div>
<div class="help">パドルでボールを打ち返し、すべてのブロックを壊そう。<strong>2つのステージ</strong>をクリアすればゲームクリア！</div>
</main>
<script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height,scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),livesEl=document.getElementById('lives'),bricksEl=document.getElementById('bricks'),soundBtn=document.getElementById('soundBtn');let score=0,lives=3,level=1,bricks=[],keys={},pointerX=null,started=false,paused=true,ended=false,sound=true,audio=null,particles=[],last=0,ball,paddle;const colors=['#59efff','#7788ff','#c277ff','#ff67c4','#ff9c72'];
function makeLevel(n){bricks=[];const rows=n===1?5:6,cols=10,bw=62,bh=19,gap=8,left=(W-(cols*bw+(cols-1)*gap))/2,top=64;for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){if(n===2&&r===0&&(col===0||col===9))continue;bricks.push({x:left+col*(bw+gap),y:top+r*(bh+8),w:bw,h:bh,hp:n===2&&r>3?2:1,color:colors[(r+col+(n-1))%colors.length],alive:true})}bricksEl.textContent=bricks.length}
function resetBall(){paddle={x:W/2-51,y:H-42,w:102,h:12};ball={x:W/2,y:paddle.y-12,r:7,vx:3.1*(level===2?1.14:1),vy:-4.1*(level===2?1.14:1),stuck:true}}
function updateHud(){scoreEl.textContent=String(score).padStart(6,'0');levelEl.innerHTML=String(level).padStart(2,'0')+' <span style="font-size:11px;color:#818bad">/ 02</span>';livesEl.textContent=Array.from({length:3},(_,i)=>i<lives?'♥':'♡').join(' ')}
function beep(freq=480,dur=.055,type='sine'){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(_){}}
function launch(){if(ended){score=0;lives=3;level=1;ended=false;makeLevel(1);updateHud()}if(paused){paused=false;started=true;ball.stuck=false;beep(620,.08)}}
function setPaddle(x){paddle.x=Math.max(8,Math.min(W-paddle.w-8,x-paddle.w/2))}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','A','d','D'].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.code==='Space'){if(paused)launch()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();pointerX=(e.clientX-r.left)*W/r.width});c.addEventListener('pointerdown',()=>{if(paused)launch()});soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?'♫ サウンド ON':'♫ サウンド OFF';if(sound)beep(700)};
function burst(x,y,color){for(let i=0;i<8;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30,color})}}
function step(dt){const speed=7.5*dt;if(keys.arrowleft||keys.a)setPaddle(paddle.x+paddle.w/2-speed);if(keys.arrowright||keys.d)setPaddle(paddle.x+paddle.w/2+speed);if(pointerX!==null)setPaddle(pointerX);if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2}if(!paused&&!ball.stuck){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<ball.r+4){ball.x=ball.r+4;ball.vx=Math.abs(ball.vx);beep(300)}if(ball.x>W-ball.r-4){ball.x=W-ball.r-4;ball.vx=-Math.abs(ball.vx);beep(300)}if(ball.y<ball.r+4){ball.y=ball.r+4;ball.vy=Math.abs(ball.vy);beep(330)}if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*5.4;ball.vy=-Math.sqrt(Math.max(10,ball.vx*ball.vx+ball.vy*ball.vy));ball.y=paddle.y-ball.r;beep(520)}for(const b of bricks){if(!b.alive)continue;if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){ball.vy*=-1;b.hp--;if(b.hp<=0){b.alive=false;score+=level===2?150:100;burst(ball.x,ball.y,b.color);bricksEl.textContent=bricks.filter(x=>x.alive).length}else score+=25;updateHud();beep(650+Math.random()*200,.05,'triangle');break}}if(ball.y>H+12){lives--;updateHud();beep(170,.25,'sawtooth');if(lives<=0){ended=true;paused=true}else{paused=true;resetBall()}}if(bricks.every(b=>!b.alive)){if(level===1){level=2;makeLevel(2);resetBall();paused=true;updateHud()}else{ended=true;paused=true}}}particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0c1229');bg.addColorStop(1,'#080b1b');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#53689913';ctx.lineWidth=1;for(let x=20;x<W;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=12;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const b of bricks){if(!b.alive)continue;ctx.save();ctx.shadowBlur=13;ctx.shadowColor=b.color+'88';roundRect(b.x,b.y,b.w,b.h,5);ctx.fillStyle=b.color;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffff35';roundRect(b.x+2,b.y+2,b.w-4,4,3);ctx.fill();if(b.hp>1){ctx.fillStyle='#11142d';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('2',b.x+b.w/2,b.y+14)}ctx.restore()}ctx.save();ctx.shadowBlur=22;ctx.shadowColor='#55f4ff';roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7);const pg=ctx.createLinearGradient(paddle.x,0,paddle.x+paddle.w,0);pg.addColorStop(0,'#6b7dff');pg.addColorStop(.5,'#76f6ff');pg.addColorStop(1,'#bb79ff');ctx.fillStyle=pg;ctx.fill();ctx.restore();ctx.save();ctx.shadowBlur=20;ctx.shadowColor='#75f4ff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#f4ffff';ctx.fill();ctx.restore();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/30);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;if(paused){ctx.fillStyle='#060918aa';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.shadowBlur=20;ctx.shadowColor='#58ecff88';ctx.fillStyle='#f2f7ff';ctx.font='800 34px system-ui';const title=ended?(lives<=0?'GAME OVER':'ALL CLEAR!'):(level===2?'STAGE 02':'READY?');ctx.fillText(title,W/2,H/2-15);ctx.shadowBlur=0;ctx.fillStyle='#aab5dc';ctx.font='14px system-ui';ctx.fillText(ended?'クリック / Space で最初から':'クリック / Space でボール発射',W/2,H/2+22);if(level===2&&!ended){ctx.fillStyle='#69f3ff';ctx.font='11px system-ui';ctx.fillText('STAGE 2 — DOUBLE HIT BRICKS',W/2,H/2+48)}}}
function frame(t){const dt=Math.min(2,(t-last)/16.67||1);last=t;step(dt);draw();requestAnimationFrame(frame)}makeLevel(1);resetBall();updateHud();requestAnimationFrame(frame)})();
</script>
</body>
</html>
