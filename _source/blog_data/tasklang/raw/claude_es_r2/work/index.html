<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rompe Ladrillos</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111827;
    color: #e5e7eb;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #0b1020;
    border: 2px solid #374151;
    border-radius: 6px;
    cursor: none;
    max-width: 100vw;
  }
  p { margin: 10px 0 0; font-size: 14px; color: #9ca3af; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p>Teclado: ← → o A/D para mover, Espacio para lanzar, P para pausa · Ratón: mover y clic para lanzar</p>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const LEVELS = [
    // Nivel 1: filas simples (número = golpes necesarios)
    [
      '1111111111',
      '1111111111',
      '1111111111',
      '1111111111',
      '1111111111'
    ],
    // Nivel 2: patrón con ladrillos resistentes (2) y huecos (0)
    [
      '2222222222',
      '2111111112',
      '2102222012',
      '2100000012',
      '2111111112',
      '0222002220'
    ]
  ];

  const COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#a855f7'];
  const BRICK_COLS = 10, BRICK_W = 70, BRICK_H = 24, BRICK_PAD = 6;
  const BRICK_TOP = 70;
  const BRICK_LEFT = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_PAD)) / 2;

  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 9 };
  const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0, stuck: true };

  let bricks = [];
  let level = 0;
  let score = 0;
  let lives = 3;
  let state = 'start'; // start | playing | paused | levelClear | gameOver | win
  const keys = {};

  function baseSpeed() { return 5 + level * 1.2; }

  function buildLevel(n) {
    bricks = [];
    LEVELS[n].forEach((row, r) => {
      [...row].forEach((ch, c) => {
        const hits = parseInt(ch, 10);
        if (hits > 0) {
          bricks.push({
            x: BRICK_LEFT + c * (BRICK_W + BRICK_PAD),
            y: BRICK_TOP + r * (BRICK_H + BRICK_PAD),
            hits,
            maxHits: hits,
            color: COLORS[r % COLORS.length]
          });
        }
      });
    });
  }

  function resetBall() {
    ball.stuck = true;
    ball.vx = 0;
    ball.vy = 0;
    placeBallOnPaddle();
  }

  function placeBallOnPaddle() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launch() {
    if (!ball.stuck) return;
    const s = baseSpeed();
    const angle = (Math.random() * 0.6 - 0.3);
    ball.vx = s * Math.sin(angle);
    ball.vy = -s * Math.cos(angle);
    ball.stuck = false;
  }

  function newGame() {
    level = 0;
    score = 0;
    lives = 3;
    buildLevel(level);
    resetBall();
  }

  function primaryAction() {
    switch (state) {
      case 'start':
        state = 'playing';
        launch();
        break;
      case 'playing':
        launch();
        break;
      case 'paused':
        state = 'playing';
        break;
      case 'levelClear':
        level++;
        buildLevel(level);
        resetBall();
        state = 'playing';
        break;
      case 'gameOver':
      case 'win':
        newGame();
        state = 'start';
        break;
    }
  }

  // --- Entrada: teclado ---
  document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      primaryAction();
    } else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      if (state === 'playing') state = 'paused';
      else if (state === 'paused') state = 'playing';
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
  });
  document.addEventListener('keyup', e => { keys[e.key] = false; });

  // --- Entrada: ratón ---
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
  });
  canvas.addEventListener('mousedown', e => {
    e.preventDefault();
    primaryAction();
  });

  function update() {
    if (state !== 'playing' && state !== 'start') return;

    if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (ball.stuck) { placeBallOnPaddle(); return; }
    if (state !== 'playing') return;

    // Subpasos para evitar atravesar ladrillos a alta velocidad
    const steps = Math.ceil(Math.max(Math.abs(ball.vx), Math.abs(ball.vy)) / 4);
    for (let i = 0; i < steps; i++) {
      ball.x += ball.vx / steps;
      ball.y += ball.vy / steps;
      if (collide()) break;
    }
  }

  // Devuelve true si la pelota se perdió o el nivel terminó
  function collide() {
    // Paredes
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // Fondo: perder vida
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) {
        state = 'gameOver';
      } else {
        resetBall();
      }
      return true;
    }

    // Pala
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + ball.vy &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const clamped = Math.max(-1, Math.min(1, hit));
      const angle = clamped * (Math.PI / 3); // máx 60°
      const speed = Math.hypot(ball.vx, ball.vy);
      ball.vx = speed * Math.sin(angle);
      ball.vy = -speed * Math.cos(angle);
      ball.y = paddle.y - ball.r - 1;
    }

    // Ladrillos
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const nearestX = Math.max(b.x, Math.min(ball.x, b.x + BRICK_W));
      const nearestY = Math.max(b.y, Math.min(ball.y, b.y + BRICK_H));
      const dx = ball.x - nearestX, dy = ball.y - nearestY;
      if (dx * dx + dy * dy <= ball.r * ball.r) {
        // Decidir eje de rebote según penetración
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BRICK_W - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BRICK_H - (ball.y - ball.r));
        if (overlapX < overlapY) {
          ball.vx = ball.x < b.x + BRICK_W / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
        } else {
          ball.vy = ball.y < b.y + BRICK_H / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
        }
        b.hits--;
        if (b.hits <= 0) {
          score += 10 * b.maxHits * (level + 1);
          bricks.splice(i, 1);
        } else {
          score += 5;
        }
        // Acelerar ligeramente
        const speed = Math.hypot(ball.vx, ball.vy);
        const maxSpeed = baseSpeed() * 1.6;
        if (speed < maxSpeed) { ball.vx *= 1.01; ball.vy *= 1.01; }

        if (bricks.length === 0) {
          state = level < LEVELS.length - 1 ? 'levelClear' : 'win';
          if (state === 'win') score += lives * 500;
          return true;
        }
        break;
      }
    }
    return false;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawOverlay(title, subtitle) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 44px system-ui, sans-serif';
    ctx.fillText(title, W / 2, H / 2 - 10);
    ctx.font = '20px system-ui, sans-serif';
    ctx.fillStyle = '#d1d5db';
    ctx.fillText(subtitle, W / 2, H / 2 + 30);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // HUD
    ctx.fillStyle = '#e5e7eb';
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Puntos: ' + score, 20, 36);
    ctx.textAlign = 'center';
    ctx.fillText('Nivel ' + (level + 1) + ' / ' + LEVELS.length, W / 2, 36);
    ctx.textAlign = 'right';
    ctx.fillText('Vidas: ', W - 20 - 3 * 22, 36);
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(W - 20 - (2 - i) * 22 - 8, 29, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? '#f43f5e' : '#374151';
      ctx.fill();
    }

    // Ladrillos
    for (const b of bricks) {
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.maxHits > 1 && b.hits < b.maxHits ? 0.55 : 1;
      roundRect(b.x, b.y, BRICK_W, BRICK_H, 4);
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.maxHits > 1) {
        ctx.strokeStyle = '#f9fafb';
        ctx.lineWidth = 2;
        roundRect(b.x + 1, b.y + 1, BRICK_W - 2, BRICK_H - 2, 4);
        ctx.stroke();
      }
    }

    // Pala
    ctx.fillStyle = '#38bdf8';
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();

    // Pelota
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#f9fafb';
    ctx.fill();

    // Pantallas
    if (state === 'start') {
      drawOverlay('ROMPE LADRILLOS', 'Pulsa Espacio o haz clic para empezar');
    } else if (state === 'paused') {
      drawOverlay('PAUSA', 'Pulsa P, Espacio o haz clic para continuar');
    } else if (state === 'levelClear') {
      drawOverlay('¡Nivel ' + (level + 1) + ' superado!', 'Pulsa Espacio o haz clic para el nivel ' + (level + 2));
    } else if (state === 'gameOver') {
      drawOverlay('FIN DEL JUEGO', 'Puntos: ' + score + ' · Espacio o clic para reiniciar');
    } else if (state === 'win') {
      drawOverlay('¡HAS GANADO!', 'Puntos: ' + score + ' · Espacio o clic para jugar otra vez');
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  newGame();
  loop();
})();
</script>
</body>
</html>
