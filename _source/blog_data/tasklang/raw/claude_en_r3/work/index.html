<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    color: #e8ecf4;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #1a1f2e;
    border: 2px solid #3a4260;
    border-radius: 6px;
    max-width: 100vw;
    max-height: 88vh;
    cursor: none;
  }
  .help {
    margin-top: 10px;
    font-size: 14px;
    color: #9aa3bd;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div class="help">
  Move: ← → / A D or mouse &nbsp;|&nbsp; Launch: Space or click &nbsp;|&nbsp; Pause: P
</div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ---- Config ----
  const HUD_H = 40;
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 520;
  const BALL_R = 8;
  const BRICK_COLS = 10, BRICK_W = 70, BRICK_H = 24, BRICK_GAP = 6;
  const BRICK_OFFSET_X = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;
  const BRICK_OFFSET_Y = HUD_H + 40;
  const START_LIVES = 3;

  // Level layouts: '.' = empty, '1' = normal brick, '2' = tough brick (2 hits)
  const LEVELS = [
    {
      speed: 340,
      layout: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      speed: 410,
      layout: [
        ".22222222.",
        "2111111112",
        "21.2112.12",
        "2111111112",
        "1121111211",
        "1.1.11.1.1",
        "2222222222",
      ],
    },
  ];

  const ROW_COLORS = ["#ff5d73", "#ff9f43", "#feca57", "#1dd1a1", "#54a0ff", "#a29bfe", "#ff6bcb"];
  const TOUGH_COLOR = "#c8d0e0";

  // ---- State ----
  let state = "start"; // start | serve | play | paused | levelClear | gameOver | win
  let levelIndex = 0;
  let score = 0;
  let lives = START_LIVES;
  let bricks = [];
  let particles = [];
  const paddle = { x: (W - PADDLE_W) / 2, w: PADDLE_W, h: PADDLE_H };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R, speed: 0 };

  const keys = { left: false, right: false };
  let mouseX = null; // last mouse x in canvas coords; null = keyboard control

  function buildLevel(i) {
    bricks = [];
    const layout = LEVELS[i].layout;
    layout.forEach((row, r) => {
      for (let c = 0; c < BRICK_COLS; c++) {
        const ch = row[c];
        if (ch !== "1" && ch !== "2") continue;
        const hp = ch === "2" ? 2 : 1;
        bricks.push({
          x: BRICK_OFFSET_X + c * (BRICK_W + BRICK_GAP),
          y: BRICK_OFFSET_Y + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W,
          h: BRICK_H,
          hp,
          maxHp: hp,
          color: ROW_COLORS[r % ROW_COLORS.length],
          alive: true,
        });
      }
    });
    ball.speed = LEVELS[i].speed;
  }

  function resetBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = PADDLE_Y - ball.r - 1;
    ball.vx = 0;
    ball.vy = 0;
    state = "serve";
  }

  function launchBall() {
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    state = "play";
  }

  function newGame() {
    levelIndex = 0;
    score = 0;
    lives = START_LIVES;
    particles = [];
    paddle.x = (W - paddle.w) / 2;
    buildLevel(levelIndex);
    resetBall();
  }

  function nextLevel() {
    levelIndex++;
    particles = [];
    paddle.x = (W - paddle.w) / 2;
    buildLevel(levelIndex);
    resetBall();
  }

  // Primary action: Space / click
  function action() {
    switch (state) {
      case "start": newGame(); break;
      case "serve": launchBall(); break;
      case "paused": state = "play"; break;
      case "levelClear": nextLevel(); break;
      case "gameOver":
      case "win": newGame(); break;
    }
  }

  function togglePause() {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }

  // ---- Input ----
  window.addEventListener("keydown", (e) => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") { keys.left = true; mouseX = null; }
    else if (e.code === "ArrowRight" || e.code === "KeyD") { keys.right = true; mouseX = null; }
    else if (e.code === "Space" || e.code === "Enter") { if (!e.repeat) action(); }
    else if (e.code === "KeyP" || e.code === "Escape") togglePause();
    else return;
    e.preventDefault();
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
    else if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener("mousemove", (e) => { mouseX = canvasX(e.clientX); });
  canvas.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;
    mouseX = canvasX(e.clientX);
    action();
  });
  // Touch support as a bonus
  canvas.addEventListener("touchstart", (e) => {
    mouseX = canvasX(e.touches[0].clientX);
    action();
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("touchmove", (e) => {
    mouseX = canvasX(e.touches[0].clientX);
    e.preventDefault();
  }, { passive: false });

  // Auto-pause when the tab loses focus
  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state === "play") state = "paused";
  });

  // ---- Physics ----
  function updatePaddle(dt) {
    if (mouseX !== null) {
      paddle.x = mouseX - paddle.w / 2;
    } else {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      paddle.x += dir * PADDLE_SPEED * dt;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function circleRectHit(cx, cy, r, rect) {
    const nx = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    const ny = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 160;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  function stepBall(dt) {
    const prevX = ball.x, prevY = ball.y;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    else if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < HUD_H) { ball.y = HUD_H + ball.r; ball.vy = Math.abs(ball.vy); }

    // Paddle
    const pRect = { x: paddle.x, y: PADDLE_Y, w: paddle.w, h: paddle.h };
    if (ball.vy > 0 && circleRectHit(ball.x, ball.y, ball.r, pRect) && prevY < PADDLE_Y + paddle.h / 2) {
      // Angle depends on where the ball hits the paddle
      const rel = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const clamped = Math.max(-1, Math.min(1, rel));
      const angle = clamped * (Math.PI / 3); // up to 60° from vertical
      ball.vx = Math.sin(angle) * ball.speed;
      ball.vy = -Math.cos(angle) * ball.speed;
      ball.y = PADDLE_Y - ball.r - 0.5;
    }

    // Bricks (one hit per step)
    for (const b of bricks) {
      if (!b.alive) continue;
      if (!circleRectHit(ball.x, ball.y, ball.r, b)) continue;

      // Decide reflection axis using previous position
      const wasLeft = prevX + ball.r <= b.x;
      const wasRight = prevX - ball.r >= b.x + b.w;
      const wasAbove = prevY + ball.r <= b.y;
      const wasBelow = prevY - ball.r >= b.y + b.h;

      if (wasLeft || wasRight) {
        ball.vx = wasLeft ? -Math.abs(ball.vx) : Math.abs(ball.vx);
        ball.x = prevX;
      } else if (wasAbove || wasBelow) {
        ball.vy = wasAbove ? -Math.abs(ball.vy) : Math.abs(ball.vy);
        ball.y = prevY;
      } else {
        ball.vy = -ball.vy;
        ball.y = prevY;
      }

      b.hp--;
      if (b.hp <= 0) {
        b.alive = false;
        score += b.maxHp === 2 ? 25 : 10;
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.maxHp === 2 ? TOUGH_COLOR : b.color);
      } else {
        score += 5;
      }
      break;
    }

    // Fell below
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) {
        state = "gameOver";
      } else {
        resetBall();
      }
      return false;
    }

    if (bricks.every((b) => !b.alive)) {
      score += lives * 100; // bonus for remaining lives
      state = levelIndex + 1 < LEVELS.length ? "levelClear" : "win";
      return false;
    }
    return true;
  }

  function update(dt) {
    // Particles animate in all states
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 300 * dt;
      p.life -= dt;
    }
    particles = particles.filter((p) => p.life > 0);

    if (state === "paused" || state === "start") return;

    updatePaddle(dt);

    if (state === "serve") {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = PADDLE_Y - ball.r - 1;
      return;
    }
    if (state !== "play") return;

    // Sub-steps to avoid tunneling through bricks
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / (ball.r * 0.5)));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (!stepBall(sdt)) break;
    }
  }

  // ---- Rendering ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "#121624";
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.fillStyle = "#3a4260";
    ctx.fillRect(0, HUD_H - 2, W, 2);

    ctx.font = "bold 18px Segoe UI, Arial, sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#e8ecf4";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, HUD_H / 2);
    ctx.textAlign = "center";
    ctx.fillText("Level " + (levelIndex + 1) + " / " + LEVELS.length, W / 2, HUD_H / 2);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 16 - START_LIVES * 22, HUD_H / 2);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (START_LIVES - 1 - i) * 22 - 8, HUD_H / 2, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5d73" : "#3a4260";
      ctx.fill();
    }
  }

  function drawBricks() {
    for (const b of bricks) {
      if (!b.alive) continue;
      const tough = b.maxHp === 2;
      ctx.fillStyle = tough ? (b.hp === 2 ? TOUGH_COLOR : "#7d869c") : b.color;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
      if (tough && b.hp === 1) {
        // crack
        ctx.strokeStyle = "rgba(0,0,0,0.5)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x + b.w * 0.3, b.y + 2);
        ctx.lineTo(b.x + b.w * 0.45, b.y + b.h * 0.5);
        ctx.lineTo(b.x + b.w * 0.6, b.y + b.h * 0.4);
        ctx.lineTo(b.x + b.w * 0.7, b.y + b.h - 2);
        ctx.stroke();
      }
    }
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + paddle.h);
    g.addColorStop(0, "#7fd3ff");
    g.addColorStop(1, "#2e86de");
    ctx.fillStyle = g;
    roundRect(paddle.x, PADDLE_Y, paddle.w, paddle.h, 7);
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#7fd3ff";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawOverlay(title, lines) {
    ctx.fillStyle = "rgba(10, 12, 20, 0.72)";
    ctx.fillRect(0, HUD_H, W, H - HUD_H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 48px Segoe UI, Arial, sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 40);
    ctx.font = "20px Segoe UI, Arial, sans-serif";
    ctx.fillStyle = "#c5cce0";
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 15 + i * 30));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawParticles();
    if (state !== "start") {
      drawPaddle();
      if (state !== "gameOver" && state !== "win" && state !== "levelClear") drawBall();
    }
    drawHUD();

    switch (state) {
      case "start":
        drawOverlay("BRICK BREAKER", [
          "Move with ← → / A D or the mouse",
          "Press Space or click to start",
        ]);
        break;
      case "serve":
        ctx.textAlign = "center";
        ctx.fillStyle = "#c5cce0";
        ctx.font = "18px Segoe UI, Arial, sans-serif";
        ctx.fillText("Press Space or click to launch", W / 2, H / 2 + 80);
        break;
      case "paused":
        drawOverlay("PAUSED", ["Press P, Space or click to resume"]);
        break;
      case "levelClear":
        drawOverlay("LEVEL " + (levelIndex + 1) + " CLEAR!", [
          "Score: " + score,
          "Press Space or click for Level " + (levelIndex + 2),
        ]);
        break;
      case "gameOver":
        drawOverlay("GAME OVER", ["Final score: " + score, "Press Space or click to play again"]);
        break;
      case "win":
        drawOverlay("YOU WIN!", ["Final score: " + score, "Press Space or click to play again"]);
        break;
    }
  }

  // ---- Main loop ----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  buildLevel(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
