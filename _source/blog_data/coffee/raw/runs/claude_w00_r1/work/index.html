<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #e8ecf4;
  }
  #wrap { text-align: center; }
  canvas {
    display: block;
    background: linear-gradient(#1b2133, #0d1018);
    border: 2px solid #3a4560;
    border-radius: 6px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
  }
  p { margin: 10px 0 0; font-size: 14px; color: #8b95ad; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <p>Move: ← → / A D or mouse &nbsp;|&nbsp; Launch: Space or click &nbsp;|&nbsp; Pause: P</p>
</div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  const HUD_H = 40;
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 620;
  const BALL_R = 8;
  const BRICK_COLS = 10, BRICK_W = 70, BRICK_H = 24, BRICK_GAP = 6;
  const BRICK_LEFT = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;
  const BRICK_TOP = HUD_H + 40;

  // Level maps: '.' empty, digit = hits required (1-3)
  const LEVELS = [
    {
      speed: 380,
      map: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      speed: 450,
      map: [
        "3.3.33.3.3",
        "2222222222",
        ".22.11.22.",
        "1111111111",
        "2.1.22.1.2",
        "1111111111",
      ],
    },
  ];

  const COLORS = {
    1: ["#4fc3f7", "#81d4fa"],
    2: ["#ffb74d", "#ffcc80"],
    3: ["#e57373", "#ef9a9a"],
  };

  const keys = { left: false, right: false };
  let state;        // "ready" | "playing" | "paused" | "levelClear" | "gameOver" | "won"
  let score, lives, levelIndex, bricks, paddle, ball, mouseX = null, lastTime = 0;

  function newGame() {
    score = 0;
    lives = 3;
    levelIndex = 0;
    loadLevel();
  }

  function loadLevel() {
    bricks = [];
    LEVELS[levelIndex].map.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === ".") return;
        const hp = parseInt(ch, 10);
        bricks.push({
          x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H, hp, maxHp: hp,
        });
      });
    });
    paddle = { x: W / 2 - PADDLE_W / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
    resetBall();
  }

  function resetBall() {
    ball = { x: paddle.x + paddle.w / 2, y: paddle.y - BALL_R - 1, vx: 0, vy: 0, stuck: true };
    state = "ready";
  }

  function launch() {
    const speed = LEVELS[levelIndex].speed;
    const angle = (Math.random() * 0.6 - 0.3); // radians from vertical
    ball.vx = speed * Math.sin(angle);
    ball.vy = -speed * Math.cos(angle);
    ball.stuck = false;
    state = "playing";
  }

  // Primary action: Space / click
  function action() {
    switch (state) {
      case "ready": launch(); break;
      case "paused": state = "playing"; break;
      case "levelClear":
        levelIndex++;
        loadLevel();
        break;
      case "gameOver":
      case "won":
        newGame();
        break;
    }
  }

  // ---- Input ----
  document.addEventListener("keydown", e => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") { keys.left = true; mouseX = null; }
    else if (e.code === "ArrowRight" || e.code === "KeyD") { keys.right = true; mouseX = null; }
    else if (e.code === "Space" || e.code === "Enter") { action(); }
    else if (e.code === "KeyP" || e.code === "Escape") {
      if (state === "playing") state = "paused";
      else if (state === "paused") state = "playing";
    } else return;
    e.preventDefault();
  });
  document.addEventListener("keyup", e => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
  });
  canvas.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (W / rect.width);
  });
  canvas.addEventListener("mousedown", e => { e.preventDefault(); action(); });
  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state === "playing") state = "paused";
  });

  // ---- Update ----
  function update(dt) {
    if (state === "paused" || state === "gameOver" || state === "won" || state === "levelClear") return;

    // Paddle
    if (keys.left) paddle.x -= PADDLE_SPEED * dt;
    if (keys.right) paddle.x += PADDLE_SPEED * dt;
    if (mouseX !== null && !keys.left && !keys.right) paddle.x = mouseX - paddle.w / 2;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - BALL_R - 1;
      return;
    }

    // Sub-step movement to avoid tunneling
    const steps = Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / (BALL_R * 0.5));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (stepBall(sdt)) break;
    }
  }

  // Returns true if ball movement should stop this frame
  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - BALL_R < HUD_H) { ball.y = HUD_H + BALL_R; ball.vy = Math.abs(ball.vy); }

    // Bottom: lose a life
    if (ball.y - BALL_R > H) {
      lives--;
      if (lives <= 0) { lives = 0; state = "gameOver"; }
      else resetBall();
      return true;
    }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + BALL_R >= paddle.y && ball.y - BALL_R <= paddle.y + paddle.h &&
        ball.x + BALL_R >= paddle.x && ball.x - BALL_R <= paddle.x + paddle.w) {
      const speed = Math.hypot(ball.vx, ball.vy);
      const hit = ((ball.x - paddle.x) / paddle.w) * 2 - 1; // -1..1
      const angle = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3); // up to 60°
      ball.vx = speed * Math.sin(angle);
      ball.vy = -speed * Math.cos(angle);
      ball.y = paddle.y - BALL_R - 0.5;
    }

    // Bricks
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > BALL_R * BALL_R) continue;

      // Resolve on axis of least penetration
      const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + b.w - (ball.x - BALL_R));
      const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + b.h - (ball.y - BALL_R));
      if (overlapX < overlapY) {
        ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      } else {
        ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      }

      b.hp--;
      score += b.hp === 0 ? 10 * b.maxHp : 5;

      if (bricks.every(br => br.hp <= 0)) {
        score += lives * 50; // bonus for remaining lives
        state = levelIndex + 1 < LEVELS.length ? "levelClear" : "won";
        return true;
      }
      // Slight speed-up per hit, capped
      const speed = Math.hypot(ball.vx, ball.vy);
      const max = LEVELS[levelIndex].speed * 1.5;
      if (speed < max) { ball.vx *= 1.01; ball.vy *= 1.01; }
      break; // one brick per sub-step
    }
    return false;
  }

  // ---- Render ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // HUD
    ctx.fillStyle = "rgba(255,255,255,0.05)";
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.strokeStyle = "#3a4560";
    ctx.beginPath(); ctx.moveTo(0, HUD_H); ctx.lineTo(W, HUD_H); ctx.stroke();
    ctx.font = "bold 18px Segoe UI, Arial, sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#e8ecf4";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, HUD_H / 2);
    ctx.textAlign = "center";
    ctx.fillText("Level " + (levelIndex + 1) + " / " + LEVELS.length, W / 2, HUD_H / 2);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 16 - 3 * 22, HUD_H / 2);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < lives ? "#ff5c7a" : "#3a4560";
      ctx.beginPath();
      ctx.arc(W - 16 - 8 - (2 - i) * 22, HUD_H / 2, 7, 0, Math.PI * 2);
      ctx.fill();
    }

    // Bricks
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const [base, light] = COLORS[b.hp];
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = base;
      ctx.fill();
      ctx.fillStyle = light;
      ctx.fillRect(b.x + 4, b.y + 3, b.w - 8, 4);
      if (b.maxHp > 1) {
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.font = "bold 13px Segoe UI, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 2);
      }
    }

    // Paddle
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fillStyle = "#c5cae9";
    ctx.fill();

    // Ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = "#ff3b3b";
    ctx.fill();

    // Overlays
    if (state === "ready") {
      message("Level " + (levelIndex + 1), "Press Space or click to launch", false);
    } else if (state === "paused") {
      message("Paused", "Press P, Space or click to resume", true);
    } else if (state === "levelClear") {
      message("Level " + (levelIndex + 1) + " Cleared!", "Press Space or click for Level " + (levelIndex + 2), true);
    } else if (state === "gameOver") {
      message("Game Over", "Final score: " + score + "  —  Space or click to restart", true);
    } else if (state === "won") {
      message("You Win!", "Final score: " + score + "  —  Space or click to play again", true);
    }
  }

  function message(title, sub, dim) {
    if (dim) {
      ctx.fillStyle = "rgba(8,10,16,0.7)";
      ctx.fillRect(0, HUD_H, W, H - HUD_H);
    }
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 44px Segoe UI, Arial, sans-serif";
    ctx.fillText(title, W / 2, H / 2 + 40);
    ctx.font = "18px Segoe UI, Arial, sans-serif";
    ctx.fillStyle = "#b8c0d6";
    ctx.fillText(sub, W / 2, H / 2 + 85);
  }

  function loop(t) {
    const dt = Math.min(0.033, (t - lastTime) / 1000 || 0);
    lastTime = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
