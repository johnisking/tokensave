<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    color: #cfd6e6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  canvas {
    background: linear-gradient(#182033, #0d111b);
    border: 2px solid #2c3754;
    border-radius: 8px;
    max-width: 96vw;
    max-height: 82vh;
    cursor: none;
    touch-action: none;
  }
  .help {
    font-size: 14px;
    opacity: 0.8;
    text-align: center;
  }
  kbd {
    background: #232c42;
    border: 1px solid #3a4666;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div class="help">
  Move: <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> or mouse &nbsp;·&nbsp;
  Launch / continue: <kbd>Space</kbd> or click &nbsp;·&nbsp;
  Pause: <kbd>P</kbd> / <kbd>Esc</kbd>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---- Level definitions: '.' empty, '1' normal brick, '2' two-hit brick ----
  const LEVELS = [
    {
      name: 'Level 1',
      ballSpeed: 400,
      rows: [
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
      ],
    },
    {
      name: 'Level 2',
      ballSpeed: 480,
      rows: [
        '2.2.22.2.2',
        '1111111111',
        '.22222222.',
        '11.1111.11',
        '..222222..',
        '1111111111',
      ],
    },
  ];

  const ROW_COLORS = ['#ff5d73', '#ff9f43', '#feca57', '#1dd1a1', '#48dbfb', '#a29bfe'];
  const COLS = 10, MARGIN = 35, GAP = 6, TOP = 70, BRICK_H = 22;
  const BRICK_W = (W - MARGIN * 2 - GAP * (COLS - 1)) / COLS;
  const START_LIVES = 3;

  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 560 };
  const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0, speed: 360 };

  let bricks = [];
  let levelIndex = 0;
  let score = 0;
  let lives = START_LIVES;
  // states: serve, play, paused, levelClear, gameover, win
  let state = 'serve';
  let particles = [];

  const keys = { left: false, right: false };

  function buildLevel(i) {
    const def = LEVELS[i];
    bricks = [];
    def.rows.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === '.') return;
        const hp = ch === '2' ? 2 : 1;
        bricks.push({
          x: MARGIN + c * (BRICK_W + GAP),
          y: TOP + r * (BRICK_H + GAP),
          w: BRICK_W,
          h: BRICK_H,
          hp,
          maxHp: hp,
          color: ROW_COLORS[r % ROW_COLORS.length],
        });
      });
    });
    ball.speed = def.ballSpeed;
  }

  function resetBall() {
    state = 'serve';
    ball.vx = 0;
    ball.vy = 0;
    stickBall();
  }

  function stickBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launch() {
    const angle = (Math.random() * 0.6 - 0.3); // slight random angle
    ball.vx = ball.speed * Math.sin(angle);
    ball.vy = -ball.speed * Math.cos(angle);
    state = 'play';
  }

  function newGame() {
    score = 0;
    lives = START_LIVES;
    levelIndex = 0;
    particles = [];
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
  }

  // Primary action: Space or mouse click
  function action() {
    switch (state) {
      case 'serve': launch(); break;
      case 'paused': state = 'play'; break;
      case 'levelClear':
        levelIndex++;
        buildLevel(levelIndex);
        particles = [];
        paddle.x = W / 2 - paddle.w / 2;
        resetBall();
        break;
      case 'gameover':
      case 'win':
        newGame();
        break;
    }
  }

  function togglePause() {
    if (state === 'play') state = 'paused';
    else if (state === 'paused') state = 'play';
  }

  // ---- Input ----
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
    else if (k === ' ' || k === 'Spacebar' || k === 'Enter') { e.preventDefault(); if (!e.repeat) action(); }
    else if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); }
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });
  window.addEventListener('blur', () => {
    keys.left = keys.right = false;
    if (state === 'play') state = 'paused';
  });

  function pointerToCanvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener('mousemove', (e) => {
    if (state === 'paused') return;
    const x = pointerToCanvasX(e.clientX);
    paddle.x = clamp(x - paddle.w / 2, 0, W - paddle.w);
  });
  canvas.addEventListener('mousedown', (e) => {
    e.preventDefault();
    action();
  });

  // ---- Helpers ----
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  // ---- Update ----
  function update(dt) {
    // particles always animate (except while paused)
    if (state !== 'paused') {
      for (const p of particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 400 * dt;
        p.life -= dt;
      }
      particles = particles.filter(p => p.life > 0);
    }

    if (state !== 'play' && state !== 'serve') return;

    // Keyboard paddle movement
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir) paddle.x = clamp(paddle.x + dir * paddle.speed * dt, 0, W - paddle.w);

    if (state === 'serve') { stickBall(); return; }

    // Sub-step the ball movement to avoid tunnelling through bricks
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / (ball.r / 2)));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (!stepBall(sdt)) break;
    }
  }

  // Returns false if the ball step should stop (life lost / level cleared)
  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // Bottom: lose a life
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) {
        lives = 0;
        state = 'gameover';
      } else {
        resetBall();
      }
      return false;
    }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x + ball.r >= paddle.x &&
        ball.x - ball.r <= paddle.x + paddle.w) {
      const rel = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const angle = rel * (Math.PI / 3); // up to 60 degrees
      ball.vx = ball.speed * Math.sin(angle);
      ball.vy = -ball.speed * Math.cos(angle);
      ball.y = paddle.y - ball.r - 0.5;
    }

    // Bricks
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const cx = clamp(ball.x, b.x, b.x + b.w);
      const cy = clamp(ball.y, b.y, b.y + b.h);
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > ball.r * ball.r) continue;

      // Reflect along the axis of least penetration
      const bcx = b.x + b.w / 2, bcy = b.y + b.h / 2;
      const ox = ball.r + b.w / 2 - Math.abs(ball.x - bcx);
      const oy = ball.r + b.h / 2 - Math.abs(ball.y - bcy);
      if (ox < oy) {
        ball.vx = ball.x < bcx ? -Math.abs(ball.vx) : Math.abs(ball.vx);
        ball.x += ball.x < bcx ? -ox : ox;
      } else {
        ball.vy = ball.y < bcy ? -Math.abs(ball.vy) : Math.abs(ball.vy);
        ball.y += ball.y < bcy ? -oy : oy;
      }

      b.hp--;
      if (b.hp <= 0) {
        score += b.maxHp * 10 * (levelIndex + 1);
        spawnParticles(bcx, bcy, b.color);
        bricks.splice(i, 1);
      } else {
        score += 5;
      }

      if (bricks.length === 0) {
        score += lives * 100; // bonus for remaining lives
        state = levelIndex < LEVELS.length - 1 ? 'levelClear' : 'win';
        return false;
      }
      break; // one brick per sub-step
    }
    return true;
  }

  // ---- Render ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHeart(x, y, s, filled) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s / 16, s / 16);
    ctx.beginPath();
    ctx.moveTo(8, 14);
    ctx.bezierCurveTo(0, 8, 0, 2, 4.5, 2);
    ctx.bezierCurveTo(7, 2, 8, 4, 8, 5);
    ctx.bezierCurveTo(8, 4, 9, 2, 11.5, 2);
    ctx.bezierCurveTo(16, 2, 16, 8, 8, 14);
    ctx.closePath();
    if (filled) { ctx.fillStyle = '#ff5d73'; ctx.fill(); }
    else { ctx.strokeStyle = '#5a6380'; ctx.lineWidth = 1.5; ctx.stroke(); }
    ctx.restore();
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(0, 0, W, 44);
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#e8ecf5';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 18, 22);

    ctx.textAlign = 'center';
    ctx.fillText(LEVELS[levelIndex].name + ' / ' + LEVELS.length, W / 2, 22);

    ctx.textAlign = 'right';
    ctx.fillText('Lives', W - 18 - START_LIVES * 24, 22);
    for (let i = 0; i < START_LIVES; i++) {
      drawHeart(W - 18 - (START_LIVES - i) * 24 + 2, 12, 20, i < lives);
    }
  }

  function drawOverlay(title, subtitle) {
    ctx.fillStyle = 'rgba(8, 10, 18, 0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 48px system-ui, sans-serif';
    ctx.fillText(title, W / 2, H / 2 - 30);
    ctx.font = '20px system-ui, sans-serif';
    ctx.fillStyle = '#cfd6e6';
    subtitle.split('\n').forEach((line, i) => ctx.fillText(line, W / 2, H / 2 + 20 + i * 30));
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    // Bricks
    for (const b of bricks) {
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.hp < b.maxHp ? 0.55 : 1;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.maxHp > 1) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
        if (b.hp < b.maxHp) {
          // crack
          ctx.beginPath();
          ctx.moveTo(b.x + b.w * 0.3, b.y + 3);
          ctx.lineTo(b.x + b.w * 0.5, b.y + b.h * 0.6);
          ctx.lineTo(b.x + b.w * 0.65, b.y + b.h - 3);
          ctx.strokeStyle = 'rgba(0,0,0,0.6)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
    }

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Paddle
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    const grad = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    grad.addColorStop(0, '#9fb4ff');
    grad.addColorStop(1, '#5468d4');
    ctx.fillStyle = grad;
    ctx.fill();

    // Ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ff3b3b';
    ctx.shadowColor = '#ff7a7a';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;

    drawHUD();

    // State overlays
    if (state === 'serve') {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#cfd6e6';
      ctx.font = '20px system-ui, sans-serif';
      ctx.fillText('Press Space or click to launch', W / 2, H / 2 + 80);
    } else if (state === 'paused') {
      drawOverlay('Paused', 'Press P / Esc, Space or click to resume');
    } else if (state === 'levelClear') {
      drawOverlay(LEVELS[levelIndex].name + ' cleared!',
        'Score: ' + score + '\nPress Space or click for ' + LEVELS[levelIndex + 1].name);
    } else if (state === 'gameover') {
      drawOverlay('Game Over', 'Final score: ' + score + '\nPress Space or click to play again');
    } else if (state === 'win') {
      drawOverlay('You Win!', 'Final score: ' + score + '\nPress Space or click to play again');
    }
  }

  // ---- Main loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
