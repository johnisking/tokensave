<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f1020;
    color: #eee;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  canvas {
    background: linear-gradient(#1b1d3a, #0b0c1a);
    border: 2px solid #3a3f7a;
    border-radius: 6px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
  }
  p { margin: 10px 0 0; font-size: 14px; color: #9aa0d0; text-align: center; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p>Mouse: move paddle, click to launch &nbsp;|&nbsp; Keyboard: ← → / A D to move, Space to launch, P to pause, Enter to restart</p>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ---- Config ----
  const HUD_H = 40;
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 520;
  const BALL_R = 8;
  const BRICK_COLS = 10, BRICK_W = 68, BRICK_H = 22, BRICK_GAP = 6;
  const BRICK_TOP = HUD_H + 40;
  const BRICK_LEFT = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;
  const START_LIVES = 3;

  // Level layouts: '.' = empty, '1' = normal brick, '2' = tough brick (2 hits)
  const LEVELS = [
    {
      speed: 380,
      map: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      speed: 460,
      map: [
        "2.22222.2.",
        ".2111112.2",
        "2211..1122",
        "1111111111",
        "12.2112.21",
        "1111111111",
      ].map(r => r.padEnd(10, ".")),
    },
  ];
  const ROW_COLORS = ["#ff5d73", "#ff9f43", "#feca57", "#1dd1a1", "#54a0ff", "#a29bfe"];

  // ---- State ----
  let state; // "ready" | "playing" | "paused" | "levelclear" | "gameover" | "win"
  let score, lives, levelIndex, bricks, paddle, ball, ballSpeed;
  const keys = { left: false, right: false };
  let mouseActive = false;

  function newGame() {
    score = 0;
    lives = START_LIVES;
    levelIndex = 0;
    loadLevel();
  }

  function loadLevel() {
    const lvl = LEVELS[levelIndex];
    ballSpeed = lvl.speed;
    bricks = [];
    lvl.map.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === ".") return;
        const hp = ch === "2" ? 2 : 1;
        bricks.push({
          x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H,
          hp, maxHp: hp,
          color: ROW_COLORS[r % ROW_COLORS.length],
        });
      });
    });
    paddle = { x: (W - PADDLE_W) / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
    resetBall();
  }

  function resetBall() {
    ball = { x: paddle.x + paddle.w / 2, y: paddle.y - BALL_R - 1, vx: 0, vy: 0, stuck: true };
    state = "ready";
  }

  function launch() {
    if (!ball.stuck) return;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * ballSpeed;
    ball.vy = Math.sin(angle) * ballSpeed;
    ball.stuck = false;
    state = "playing";
  }

  // Primary action: Space / click
  function action() {
    if (state === "ready") launch();
    else if (state === "paused") state = "playing";
    else if (state === "levelclear") { levelIndex++; loadLevel(); }
    else if (state === "gameover" || state === "win") newGame();
  }

  function togglePause() {
    if (state === "playing") state = "paused";
    else if (state === "paused") state = "playing";
  }

  // ---- Input ----
  document.addEventListener("keydown", e => {
    switch (e.code) {
      case "ArrowLeft": case "KeyA": keys.left = true; mouseActive = false; e.preventDefault(); break;
      case "ArrowRight": case "KeyD": keys.right = true; mouseActive = false; e.preventDefault(); break;
      case "Space": action(); e.preventDefault(); break;
      case "KeyP": case "Escape": togglePause(); break;
      case "Enter": if (state === "gameover" || state === "win") newGame(); else action(); break;
    }
  });
  document.addEventListener("keyup", e => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  function movePaddleTo(x) {
    if (state === "paused") return;
    paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
  }
  canvas.addEventListener("mousemove", e => { mouseActive = true; movePaddleTo(canvasX(e.clientX)); });
  canvas.addEventListener("mousedown", e => { e.preventDefault(); action(); });
  // Basic touch support as a bonus
  canvas.addEventListener("touchmove", e => { e.preventDefault(); movePaddleTo(canvasX(e.touches[0].clientX)); }, { passive: false });
  canvas.addEventListener("touchstart", e => { e.preventDefault(); movePaddleTo(canvasX(e.touches[0].clientX)); action(); }, { passive: false });
  window.addEventListener("blur", () => { keys.left = keys.right = false; if (state === "playing") state = "paused"; });

  // ---- Update ----
  function update(dt) {
    if (state === "paused" || state === "gameover" || state === "win" || state === "levelclear") return;

    // Keyboard paddle movement
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir !== 0) {
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x + dir * PADDLE_SPEED * dt));
    }

    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - BALL_R - 1;
      return;
    }

    // Sub-step to avoid tunneling through bricks
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / (BALL_R * 0.5)));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (stepBall(sdt)) break;
    }
  }

  // Returns true if stepping should stop (life lost / level cleared)
  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - BALL_R < HUD_H) { ball.y = HUD_H + BALL_R; ball.vy = Math.abs(ball.vy); }

    // Bottom: lose life
    if (ball.y - BALL_R > H) {
      lives--;
      if (lives <= 0) { lives = 0; state = "gameover"; }
      else resetBall();
      return true;
    }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + BALL_R >= paddle.y && ball.y - BALL_R <= paddle.y + paddle.h &&
        ball.x + BALL_R >= paddle.x && ball.x - BALL_R <= paddle.x + paddle.w) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const clamped = Math.max(-1, Math.min(1, hit));
      const angle = clamped * (Math.PI / 3); // up to 60° from vertical
      const speed = Math.hypot(ball.vx, ball.vy);
      ball.vx = speed * Math.sin(angle);
      ball.vy = -speed * Math.cos(angle);
      ball.y = paddle.y - BALL_R - 0.5;
    }

    // Bricks (handle at most one per sub-step)
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > BALL_R * BALL_R) continue;

      // Determine bounce axis by smallest penetration
      const overlapL = ball.x + BALL_R - b.x;
      const overlapR = b.x + b.w - (ball.x - BALL_R);
      const overlapT = ball.y + BALL_R - b.y;
      const overlapB = b.y + b.h - (ball.y - BALL_R);
      const minX = Math.min(overlapL, overlapR);
      const minY = Math.min(overlapT, overlapB);
      if (minX < minY) {
        if (overlapL < overlapR) { ball.vx = -Math.abs(ball.vx); ball.x = b.x - BALL_R; }
        else { ball.vx = Math.abs(ball.vx); ball.x = b.x + b.w + BALL_R; }
      } else {
        if (overlapT < overlapB) { ball.vy = -Math.abs(ball.vy); ball.y = b.y - BALL_R; }
        else { ball.vy = Math.abs(ball.vy); ball.y = b.y + b.h + BALL_R; }
      }

      b.hp--;
      if (b.hp <= 0) {
        score += b.maxHp === 2 ? 25 : 10;
        bricks.splice(i, 1);
        // Slight speed-up per brick, capped
        const speed = Math.hypot(ball.vx, ball.vy);
        const newSpeed = Math.min(speed * 1.01, ballSpeed * 1.6);
        ball.vx *= newSpeed / speed;
        ball.vy *= newSpeed / speed;
      } else {
        score += 5;
      }

      if (bricks.length === 0) {
        state = levelIndex < LEVELS.length - 1 ? "levelclear" : "win";
        return true;
      }
      break;
    }

    // Prevent near-horizontal trajectories
    const speed = Math.hypot(ball.vx, ball.vy);
    if (Math.abs(ball.vy) < speed * 0.25) {
      ball.vy = Math.sign(ball.vy || -1) * speed * 0.25;
      ball.vx = Math.sign(ball.vx) * Math.sqrt(speed * speed - ball.vy * ball.vy);
    }
    return false;
  }

  // ---- Draw ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // HUD
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.fillStyle = "#3a3f7a";
    ctx.fillRect(0, HUD_H - 2, W, 2);
    ctx.font = "bold 18px 'Segoe UI', Arial, sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, HUD_H / 2);
    ctx.textAlign = "center";
    ctx.fillText("Level " + (levelIndex + 1) + " / " + LEVELS.length, W / 2, HUD_H / 2);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 16 - START_LIVES * 22, HUD_H / 2);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (START_LIVES - 1 - i) * 22 - 8, HUD_H / 2, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5d73" : "rgba(255,255,255,0.15)";
      ctx.fill();
    }

    // Bricks
    for (const b of bricks) {
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.hp < b.maxHp ? 0.55 : 1;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.maxHp === 2) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = b.hp === 2 ? "#ffffff" : "rgba(255,255,255,0.4)";
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
    }

    // Paddle
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, "#e0e6ff");
    g.addColorStop(1, "#7f8cff");
    ctx.fillStyle = g;
    ctx.fill();

    // Ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = "#ff3b3b";
    ctx.shadowColor = "#ff7b7b";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Overlays
    if (state === "ready") {
      hint("Click or press Space to launch");
    } else if (state === "paused") {
      overlay("Paused", "Press P, Space or click to resume");
    } else if (state === "levelclear") {
      overlay("Level " + (levelIndex + 1) + " Clear!", "Score: " + score + "  —  Click or press Space for Level " + (levelIndex + 2));
    } else if (state === "gameover") {
      overlay("Game Over", "Final score: " + score + "  —  Click or press Enter to play again");
    } else if (state === "win") {
      overlay("You Win!", "Final score: " + score + "  —  Click or press Enter to play again");
    }
  }

  function hint(text) {
    ctx.font = "18px 'Segoe UI', Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fillText(text, W / 2, H / 2 + 80);
  }

  function overlay(title, sub) {
    ctx.fillStyle = "rgba(8,8,20,0.72)";
    ctx.fillRect(0, HUD_H, W, H - HUD_H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 48px 'Segoe UI', Arial, sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 20);
    ctx.font = "18px 'Segoe UI', Arial, sans-serif";
    ctx.fillStyle = "#c8ccf0";
    ctx.fillText(sub, W / 2, H / 2 + 30);
  }

  // ---- Loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
