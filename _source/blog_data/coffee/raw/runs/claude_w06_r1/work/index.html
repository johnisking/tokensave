<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    color: #e8ecf4;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  canvas {
    background: linear-gradient(#1b2133, #0d1018);
    border: 2px solid #3a4560;
    border-radius: 8px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
    display: block;
  }
  p.help {
    margin: 10px 0 0;
    font-size: 14px;
    color: #9aa6c0;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p class="help">Move: Mouse or ← → / A D &nbsp;|&nbsp; Launch: Click or Space &nbsp;|&nbsp; Pause: P or Esc</p>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const HUD_H = 40;

  // ---- Level definitions ----
  // Digits = brick hit points (0 = empty). Level 2 adds tougher bricks and a faster ball.
  const LEVELS = [
    {
      ballSpeed: 400,
      rows: [
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
      ],
    },
    {
      ballSpeed: 475,
      rows: [
        '2222222222',
        '2111111112',
        '2102222012',
        '2111111112',
        '0222002220',
        '1111111111',
      ],
    },
  ];

  const BRICK_COLS = 10, BRICK_PAD = 6, BRICK_H = 22;
  const BRICK_TOP = HUD_H + 40, BRICK_SIDE = 30;
  const BRICK_W = (W - BRICK_SIDE * 2 - BRICK_PAD * (BRICK_COLS - 1)) / BRICK_COLS;
  const ROW_COLORS = ['#ff5e6c', '#ff9f43', '#feca57', '#1dd1a1', '#54a0ff', '#a29bfe'];

  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 560 };
  const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0, stuck: true };

  let bricks = [];
  let score = 0, lives = 3, level = 0;
  // states: 'ready' (ball on paddle), 'playing', 'paused', 'levelClear', 'gameOver', 'won'
  let state = 'ready';
  let keys = { left: false, right: false };
  let mouseX = null;
  let message = '';

  function buildLevel(idx) {
    bricks = [];
    LEVELS[idx].rows.forEach((row, r) => {
      for (let c = 0; c < BRICK_COLS; c++) {
        const hp = parseInt(row[c], 10) || 0;
        if (!hp) continue;
        bricks.push({
          x: BRICK_SIDE + c * (BRICK_W + BRICK_PAD),
          y: BRICK_TOP + r * (BRICK_H + BRICK_PAD),
          w: BRICK_W, h: BRICK_H,
          hp, maxHp: hp,
          color: ROW_COLORS[r % ROW_COLORS.length],
        });
      }
    });
  }

  function resetBall() {
    ball.stuck = true;
    ball.vx = 0; ball.vy = 0;
    placeBallOnPaddle();
  }

  function placeBallOnPaddle() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launchBall() {
    if (!ball.stuck) return;
    const speed = LEVELS[level].ballSpeed;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    ball.stuck = false;
    state = 'playing';
  }

  function newGame() {
    score = 0; lives = 3; level = 0;
    buildLevel(level);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = 'ready';
  }

  function startLevel(idx) {
    level = idx;
    buildLevel(level);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = 'ready';
  }

  // Primary action: Space / click / Enter
  function action() {
    switch (state) {
      case 'ready': launchBall(); break;
      case 'paused': state = ball.stuck ? 'ready' : 'playing'; break;
      case 'levelClear': startLevel(level + 1); break;
      case 'gameOver':
      case 'won': newGame(); break;
    }
  }

  function togglePause() {
    if (state === 'playing' || state === 'ready') state = 'paused';
    else if (state === 'paused') state = ball.stuck ? 'ready' : 'playing';
  }

  // ---- Input ----
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; mouseX = null; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; mouseX = null; e.preventDefault(); }
    else if (k === ' ' || k === 'Enter') { action(); e.preventDefault(); }
    else if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); e.preventDefault(); }
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });
  window.addEventListener('blur', () => {
    keys.left = keys.right = false;
    if (state === 'playing') state = 'paused';
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  window.addEventListener('mousemove', (e) => { mouseX = canvasX(e.clientX); });
  canvas.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    mouseX = canvasX(e.clientX);
    action();
  });
  // Touch support as a bonus
  canvas.addEventListener('touchstart', (e) => {
    mouseX = canvasX(e.touches[0].clientX);
    action();
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    mouseX = canvasX(e.touches[0].clientX);
    e.preventDefault();
  }, { passive: false });

  // ---- Update ----
  function updatePaddle(dt) {
    if (mouseX !== null) {
      paddle.x = mouseX - paddle.w / 2;
    } else {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      paddle.x += dir * paddle.speed * dt;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < HUD_H) { ball.y = HUD_H + ball.r; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 && circleRect(ball.x, ball.y, ball.r, paddle.x, paddle.y, paddle.w, paddle.h)) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const clamped = Math.max(-1, Math.min(1, hit));
      const maxAngle = Math.PI / 3; // 60 degrees from vertical
      const speed = Math.hypot(ball.vx, ball.vy);
      const a = clamped * maxAngle;
      ball.vx = Math.sin(a) * speed;
      ball.vy = -Math.cos(a) * speed;
      ball.y = paddle.y - ball.r - 0.5;
    }

    // Bricks (handle at most one per substep)
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      if (!circleRect(ball.x, ball.y, ball.r, b.x, b.y, b.w, b.h)) continue;

      // Determine collision side by smallest penetration
      const overlapL = ball.x + ball.r - b.x;
      const overlapR = b.x + b.w - (ball.x - ball.r);
      const overlapT = ball.y + ball.r - b.y;
      const overlapB = b.y + b.h - (ball.y - ball.r);
      const minX = Math.min(overlapL, overlapR);
      const minY = Math.min(overlapT, overlapB);
      if (minX < minY) {
        if (overlapL < overlapR) { ball.x -= overlapL; ball.vx = -Math.abs(ball.vx); }
        else { ball.x += overlapR; ball.vx = Math.abs(ball.vx); }
      } else {
        if (overlapT < overlapB) { ball.y -= overlapT; ball.vy = -Math.abs(ball.vy); }
        else { ball.y += overlapB; ball.vy = Math.abs(ball.vy); }
      }

      b.hp--;
      if (b.hp <= 0) {
        score += 10 * b.maxHp * (level + 1);
        bricks.splice(i, 1);
        // Slight speed-up for each brick destroyed, capped
        const speed = Math.hypot(ball.vx, ball.vy);
        const cap = LEVELS[level].ballSpeed * 1.5;
        if (speed < cap) {
          const f = Math.min(cap, speed * 1.01) / speed;
          ball.vx *= f; ball.vy *= f;
        }
      } else {
        score += 5;
      }
      break;
    }

    // Avoid near-horizontal trajectories that stall the game
    const speed = Math.hypot(ball.vx, ball.vy);
    const minVy = speed * 0.25;
    if (Math.abs(ball.vy) < minVy) {
      ball.vy = Math.sign(ball.vy || -1) * minVy;
      ball.vx = Math.sign(ball.vx || 1) * Math.sqrt(speed * speed - minVy * minVy);
    }

    // Bottom: lose life
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) {
        state = 'gameOver';
      } else {
        resetBall();
        state = 'ready';
      }
      return false;
    }

    if (bricks.length === 0) {
      state = level + 1 < LEVELS.length ? 'levelClear' : 'won';
      ball.stuck = true;
      return false;
    }
    return true;
  }

  function update(dt) {
    if (state === 'paused' || state === 'gameOver' || state === 'won' || state === 'levelClear') return;
    updatePaddle(dt);
    if (ball.stuck) { placeBallOnPaddle(); return; }

    // Substeps to prevent tunneling through bricks
    const speed = Math.hypot(ball.vx, ball.vy);
    const steps = Math.max(1, Math.ceil((speed * dt) / (ball.r * 0.5)));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (!stepBall(sdt)) break;
    }
  }

  // ---- Render ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.strokeStyle = '#3a4560';
    ctx.beginPath(); ctx.moveTo(0, HUD_H); ctx.lineTo(W, HUD_H); ctx.stroke();

    ctx.font = 'bold 20px "Segoe UI", Arial, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e8ecf4';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 16, HUD_H / 2);
    ctx.textAlign = 'center';
    ctx.fillText('Level ' + (level + 1) + ' / ' + LEVELS.length, W / 2, HUD_H / 2);
    ctx.textAlign = 'right';
    ctx.fillText('Lives:', W - 16 - 3 * 22, HUD_H / 2);
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - 8 - i * 22, HUD_H / 2, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? '#ff5e6c' : '#3a4560';
      ctx.fill();
    }
  }

  function drawBricks() {
    for (const b of bricks) {
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.hp < b.maxHp ? 0.55 : 1;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.maxHp > 1) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.lineWidth = 1;
      }
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
    }
  }

  function drawPaddle() {
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, '#9fd3ff');
    g.addColorStop(1, '#3d8bfd');
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ff2b2b';
    ctx.shadowColor = '#ff6b6b';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function overlay(title, sub) {
    ctx.fillStyle = 'rgba(8,10,16,0.7)';
    ctx.fillRect(0, HUD_H, W, H - HUD_H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 44px "Segoe UI", Arial, sans-serif';
    ctx.fillText(title, W / 2, H / 2 - 20);
    ctx.font = '20px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = '#c6cfe2';
    ctx.fillText(sub, W / 2, H / 2 + 26);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawPaddle();
    if (state !== 'gameOver') drawBall();
    drawHUD();

    if (state === 'ready') {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#c6cfe2';
      ctx.font = '20px "Segoe UI", Arial, sans-serif';
      ctx.fillText('Click or press Space to launch', W / 2, H / 2 + 60);
    } else if (state === 'paused') {
      overlay('Paused', 'Press P / Esc, Space or click to resume');
    } else if (state === 'levelClear') {
      overlay('Level ' + (level + 1) + ' Cleared!', 'Click or press Space for Level ' + (level + 2));
    } else if (state === 'gameOver') {
      overlay('Game Over', 'Final score: ' + score + ' — click or press Space to restart');
    } else if (state === 'won') {
      overlay('You Win!', 'Final score: ' + score + ' — click or press Space to play again');
    }
  }

  // ---- Main loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
