<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0f1a;
    color: #e8ecf5;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    max-width: 100vw;
    max-height: calc(100vh - 40px);
    background: #121829;
    border: 2px solid #2b3552;
    border-radius: 6px;
    cursor: none;
  }
  .help {
    margin-top: 8px;
    font-size: 13px;
    color: #8a94b3;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div class="help">Move: Mouse or ← → / A D &nbsp;|&nbsp; Launch: Click or Space &nbsp;|&nbsp; Pause: P or Esc</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  // ---- Configuration ----
  const HUD_HEIGHT = 44;
  const START_LIVES = 3;
  const PADDLE_W = 110;
  const PADDLE_H = 14;
  const PADDLE_Y = H - 40;
  const PADDLE_KEY_SPEED = 620;
  const BALL_R = 8;
  const MAX_BOUNCE_ANGLE = Math.PI / 3; // 60 degrees from vertical

  const BRICK_COLS = 10;
  const BRICK_GAP = 6;
  const BRICK_MARGIN = 35;
  const BRICK_TOP = HUD_HEIGHT + 30;
  const BRICK_H = 22;
  const BRICK_W = (W - BRICK_MARGIN * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;

  // Brick types: color, hits needed, points per destruction
  const BRICK_TYPES = {
    R: { color: "#ff5c6c", hits: 1, points: 50 },
    O: { color: "#ff9f43", hits: 1, points: 40 },
    Y: { color: "#ffd84d", hits: 1, points: 30 },
    G: { color: "#4cd98a", hits: 1, points: 20 },
    B: { color: "#4ab3ff", hits: 1, points: 10 },
    S: { color: "#aab4cc", hits: 2, points: 80 }
  };

  const LEVELS = [
    {
      name: "Level 1",
      ballSpeed: 375,
      maxSpeed: 570,
      layout: [
        "RRRRRRRRRR",
        "OOOOOOOOOO",
        "YYYYYYYYYY",
        "GGGGGGGGGG",
        "BBBBBBBBBB"
      ]
    },
    {
      name: "Level 2",
      ballSpeed: 430,
      maxSpeed: 660,
      layout: [
        "SS.SSSS.SS",
        "RRRRRRRRRR",
        "O.OOOOOO.O",
        "YYY.SS.YYY",
        "GGGGGGGGGG",
        "B.BB..BB.B",
        "SBSBSBSBSB"
      ]
    }
  ];

  // ---- Game state ----
  // states: "serve", "play", "paused", "levelClear", "gameOver", "win"
  let state = "serve";
  let levelIndex = 0;
  let score = 0;
  let lives = START_LIVES;
  let bricks = [];
  let speed = 0;

  const paddle = { x: (W - PADDLE_W) / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R };

  const keys = { left: false, right: false };

  function buildLevel(index) {
    const level = LEVELS[index];
    bricks = [];
    level.layout.forEach(function (row, r) {
      for (let c = 0; c < row.length; c++) {
        const type = BRICK_TYPES[row[c]];
        if (!type) continue;
        bricks.push({
          x: BRICK_MARGIN + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W,
          h: BRICK_H,
          type: type,
          hitsLeft: type.hits,
          alive: true
        });
      }
    });
  }

  function resetBallOnPaddle() {
    speed = LEVELS[levelIndex].ballSpeed;
    ball.vx = 0;
    ball.vy = 0;
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    state = "serve";
  }

  function startLevel(index) {
    levelIndex = index;
    buildLevel(index);
    paddle.x = (W - paddle.w) / 2;
    resetBallOnPaddle();
  }

  function newGame() {
    score = 0;
    lives = START_LIVES;
    startLevel(0);
  }

  function launchBall() {
    const angle = (Math.random() * 0.6 - 0.3); // slight random tilt
    ball.vx = speed * Math.sin(angle);
    ball.vy = -speed * Math.cos(angle);
    state = "play";
  }

  // Primary action: Space / click
  function action() {
    switch (state) {
      case "serve": launchBall(); break;
      case "paused": state = "play"; break;
      case "levelClear": startLevel(levelIndex + 1); break;
      case "gameOver":
      case "win": newGame(); break;
    }
  }

  function togglePause() {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }

  // ---- Input ----
  document.addEventListener("keydown", function (e) {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; e.preventDefault(); }
    else if (k === " " || k === "Spacebar" || k === "Enter" || k === "ArrowUp") {
      e.preventDefault();
      if (!e.repeat) action();
    }
    else if (k === "p" || k === "P" || k === "Escape") { togglePause(); }
  });

  document.addEventListener("keyup", function (e) {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }

  canvas.addEventListener("mousemove", function (e) {
    if (state === "paused") return;
    setPaddleCenter(canvasX(e.clientX));
  });

  canvas.addEventListener("mousedown", function (e) {
    e.preventDefault();
    action();
  });

  // Touch support as a bonus
  canvas.addEventListener("touchmove", function (e) {
    e.preventDefault();
    if (state !== "paused") setPaddleCenter(canvasX(e.touches[0].clientX));
  }, { passive: false });
  canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    setPaddleCenter(canvasX(e.touches[0].clientX));
    action();
  }, { passive: false });

  window.addEventListener("blur", function () {
    keys.left = keys.right = false;
    if (state === "play") state = "paused";
  });

  function setPaddleCenter(x) {
    paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
  }

  // ---- Update ----
  function update(dt) {
    if (state === "paused" || state === "gameOver" || state === "win" || state === "levelClear") return;

    // Keyboard paddle movement
    let dir = 0;
    if (keys.left) dir -= 1;
    if (keys.right) dir += 1;
    if (dir !== 0) {
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x + dir * PADDLE_KEY_SPEED * dt));
    }

    if (state === "serve") {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
      return;
    }

    // Move ball in small sub-steps to prevent tunneling
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / 4));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      ball.x += ball.vx * sdt;
      ball.y += ball.vy * sdt;
      if (!handleCollisions()) return;
    }
  }

  // Returns false if the ball's motion should stop for this frame
  function handleCollisions() {
    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < HUD_HEIGHT) { ball.y = HUD_HEIGHT + ball.r; ball.vy = Math.abs(ball.vy); }

    // Fell below the paddle
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) {
        lives = 0;
        state = "gameOver";
      } else {
        resetBallOnPaddle();
      }
      return false;
    }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x + ball.r >= paddle.x &&
        ball.x - ball.r <= paddle.x + paddle.w) {
      let hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      hit = Math.max(-1, Math.min(1, hit));
      const angle = hit * MAX_BOUNCE_ANGLE;
      ball.vx = speed * Math.sin(angle);
      ball.vy = -speed * Math.cos(angle);
      ball.y = paddle.y - ball.r;
    }

    // Bricks (handle at most one per sub-step)
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      if (!b.alive) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx;
      const dy = ball.y - cy;
      if (dx * dx + dy * dy > ball.r * ball.r) continue;

      // Decide bounce axis by smallest penetration
      const overlapLeft = ball.x + ball.r - b.x;
      const overlapRight = b.x + b.w - (ball.x - ball.r);
      const overlapTop = ball.y + ball.r - b.y;
      const overlapBottom = b.y + b.h - (ball.y - ball.r);
      const minX = Math.min(overlapLeft, overlapRight);
      const minY = Math.min(overlapTop, overlapBottom);

      if (minX < minY) {
        if (overlapLeft < overlapRight) { ball.x -= overlapLeft; ball.vx = -Math.abs(ball.vx); }
        else { ball.x += overlapRight; ball.vx = Math.abs(ball.vx); }
      } else {
        if (overlapTop < overlapBottom) { ball.y -= overlapTop; ball.vy = -Math.abs(ball.vy); }
        else { ball.y += overlapBottom; ball.vy = Math.abs(ball.vy); }
      }

      hitBrick(b);
      break;
    }

    if (bricks.every(function (b) { return !b.alive; })) {
      state = levelIndex + 1 < LEVELS.length ? "levelClear" : "win";
      return false;
    }
    return true;
  }

  function hitBrick(b) {
    b.hitsLeft--;
    if (b.hitsLeft <= 0) {
      b.alive = false;
      score += b.type.points;
    } else {
      score += 10;
    }
    // Gradually speed up the ball
    const maxSpeed = LEVELS[levelIndex].maxSpeed;
    speed = Math.min(maxSpeed, speed + 4);
    const cur = Math.hypot(ball.vx, ball.vy) || 1;
    ball.vx = ball.vx / cur * speed;
    ball.vy = ball.vy / cur * speed;
  }

  // ---- Rendering ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "#0e1322";
    ctx.fillRect(0, 0, W, HUD_HEIGHT);
    ctx.fillStyle = "#2b3552";
    ctx.fillRect(0, HUD_HEIGHT - 2, W, 2);

    ctx.font = "bold 20px 'Segoe UI', Arial, sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#e8ecf5";

    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, HUD_HEIGHT / 2);

    ctx.textAlign = "center";
    ctx.fillText(LEVELS[levelIndex].name + " / " + LEVELS.length, W / 2, HUD_HEIGHT / 2);

    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 16 - START_LIVES * 22, HUD_HEIGHT / 2);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (START_LIVES - 1 - i) * 22 - 8, HUD_HEIGHT / 2, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5c6c" : "#3a4360";
      ctx.fill();
    }
  }

  function drawBricks() {
    bricks.forEach(function (b) {
      if (!b.alive) return;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = b.type.color;
      ctx.fill();
      // Cracked look for damaged multi-hit bricks
      if (b.type.hits > 1 && b.hitsLeft < b.type.hits) {
        ctx.strokeStyle = "rgba(20,24,40,0.8)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x + b.w * 0.3, b.y);
        ctx.lineTo(b.x + b.w * 0.45, b.y + b.h * 0.5);
        ctx.lineTo(b.x + b.w * 0.35, b.y + b.h);
        ctx.moveTo(b.x + b.w * 0.45, b.y + b.h * 0.5);
        ctx.lineTo(b.x + b.w * 0.7, b.y + b.h * 0.4);
        ctx.stroke();
      } else if (b.type.hits > 1) {
        ctx.strokeStyle = "rgba(255,255,255,0.6)";
        ctx.lineWidth = 2;
        roundRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4, 3);
        ctx.stroke();
      }
      // highlight
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.fillRect(b.x + 3, b.y + 2, b.w - 6, 4);
    });
  }

  function drawPaddle() {
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, "#9fd3ff");
    g.addColorStop(1, "#3a8ee6");
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ff2b2b";
    ctx.shadowColor = "#ff6b6b";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawOverlay(title, subtitle) {
    ctx.fillStyle = "rgba(8, 11, 20, 0.7)";
    ctx.fillRect(0, HUD_HEIGHT, W, H - HUD_HEIGHT);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 44px 'Segoe UI', Arial, sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 24);
    ctx.font = "20px 'Segoe UI', Arial, sans-serif";
    ctx.fillStyle = "#b8c2de";
    ctx.fillText(subtitle, W / 2, H / 2 + 24);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawPaddle();
    drawBall();
    drawHUD();

    if (state === "serve") {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#b8c2de";
      ctx.font = "18px 'Segoe UI', Arial, sans-serif";
      ctx.fillText("Click or press Space to launch", W / 2, H / 2 + 60);
    } else if (state === "paused") {
      drawOverlay("Paused", "Press P / Esc, Space or click to resume");
    } else if (state === "levelClear") {
      drawOverlay(LEVELS[levelIndex].name + " Complete!", "Click or press Space for " + LEVELS[levelIndex + 1].name);
    } else if (state === "gameOver") {
      drawOverlay("Game Over", "Final score: " + score + "  —  Click or press Space to play again");
    } else if (state === "win") {
      drawOverlay("You Win!", "Final score: " + score + "  —  Click or press Space to play again");
    }
  }

  // ---- Main loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
