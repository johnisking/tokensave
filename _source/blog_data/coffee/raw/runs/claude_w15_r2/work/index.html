<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f1226;
    color: #e8ebff;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    user-select: none;
  }
  canvas {
    background: linear-gradient(#1a1f45, #0b0e22);
    border: 2px solid #3a4285;
    border-radius: 8px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
    touch-action: none;
  }
  p.help {
    margin: 10px 0 0;
    font-size: 14px;
    opacity: 0.75;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p class="help">Move: ← → / A D or mouse &nbsp;|&nbsp; Launch: Space or click &nbsp;|&nbsp; Pause: P or Esc</p>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ---- Config ----
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 620;
  const BALL_R = 8;
  const BRICK_W = 64, BRICK_H = 24, BRICK_GAP = 6, BRICK_TOP = 70;
  const START_LIVES = 3;

  // Level layouts: digits = brick hit points, "." = empty
  const LEVELS = [
    {
      name: "Level 1",
      speed: 400,
      rows: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      name: "Level 2",
      speed: 475,
      rows: [
        "3.3.33.3.3",
        "2222222222",
        ".22.22.22.",
        "1111111111",
        "2.2.22.2.2",
        "1111111111",
      ],
    },
  ];

  const COLORS = {
    1: ["#4fd1c5", "#2c9c92"],
    2: ["#f6ad55", "#c27a24"],
    3: ["#fc5c7d", "#b8304f"],
  };

  // ---- State ----
  let state;          // "ready" | "playing" | "paused" | "levelClear" | "gameOver" | "win"
  let levelIndex, score, lives, bricks, particles;
  const paddle = { x: W / 2 - PADDLE_W / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R, speed: 0 };
  const keys = { left: false, right: false };
  let mouseX = null;
  let stateTimer = 0;

  function newGame() {
    levelIndex = 0;
    score = 0;
    lives = START_LIVES;
    loadLevel();
  }

  function loadLevel() {
    const level = LEVELS[levelIndex];
    bricks = [];
    particles = [];
    const cols = level.rows[0].length;
    const totalW = cols * BRICK_W + (cols - 1) * BRICK_GAP;
    const offsetX = (W - totalW) / 2;
    level.rows.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === ".") return;
        const hp = parseInt(ch, 10);
        bricks.push({
          x: offsetX + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H,
          hp, maxHp: hp,
        });
      });
    });
    ball.speed = level.speed;
    resetBall();
  }

  function resetBall() {
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    ball.vx = 0;
    ball.vy = 0;
    state = "ready";
  }

  function launch() {
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    state = "playing";
  }

  // Primary action: Space / click
  function action() {
    if (state === "ready") launch();
    else if (state === "paused") state = "playing";
    else if (state === "gameOver" || state === "win") newGame();
    else if (state === "levelClear" && stateTimer <= 0) nextLevel();
  }

  function nextLevel() {
    levelIndex++;
    if (levelIndex >= LEVELS.length) {
      state = "win";
    } else {
      loadLevel();
    }
  }

  function togglePause() {
    if (state === "playing") state = "paused";
    else if (state === "paused") state = "playing";
  }

  // ---- Input ----
  window.addEventListener("keydown", (e) => {
    switch (e.code) {
      case "ArrowLeft": case "KeyA": keys.left = true; mouseX = null; e.preventDefault(); break;
      case "ArrowRight": case "KeyD": keys.right = true; mouseX = null; e.preventDefault(); break;
      case "Space": case "Enter": action(); e.preventDefault(); break;
      case "KeyP": case "Escape": togglePause(); e.preventDefault(); break;
    }
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
  });

  function toCanvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener("mousemove", (e) => { mouseX = toCanvasX(e.clientX); });
  canvas.addEventListener("mousedown", (e) => { mouseX = toCanvasX(e.clientX); action(); e.preventDefault(); });
  canvas.addEventListener("touchstart", (e) => { mouseX = toCanvasX(e.touches[0].clientX); action(); e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchmove", (e) => { mouseX = toCanvasX(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  window.addEventListener("blur", () => { keys.left = keys.right = false; if (state === "playing") state = "paused"; });

  // ---- Update ----
  function updatePaddle(dt) {
    if (keys.left || keys.right) {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      paddle.x += dir * PADDLE_SPEED * dt;
    } else if (mouseX !== null) {
      paddle.x = mouseX - paddle.w / 2;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function circleRect(cx, cy, r, rect) {
    const nx = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    const ny = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 && circleRect(ball.x, ball.y, ball.r, paddle)) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const clamped = Math.max(-1, Math.min(1, hit));
      const angle = clamped * (Math.PI / 3); // up to 60° from vertical
      ball.vx = Math.sin(angle) * ball.speed;
      ball.vy = -Math.cos(angle) * ball.speed;
      ball.y = paddle.y - ball.r - 0.5;
    }

    // Bricks (one hit per step)
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      if (!circleRect(ball.x, ball.y, ball.r, b)) continue;

      // Resolve along axis of least penetration
      const overlapL = ball.x + ball.r - b.x;
      const overlapR = b.x + b.w - (ball.x - ball.r);
      const overlapT = ball.y + ball.r - b.y;
      const overlapB = b.y + b.h - (ball.y - ball.r);
      const minX = Math.min(overlapL, overlapR);
      const minY = Math.min(overlapT, overlapB);
      if (minX < minY) {
        if (overlapL < overlapR) { ball.x -= overlapL; ball.vx = -Math.abs(ball.vx); }
        else { ball.x += overlapR; ball.vx = Math.abs(ball.vx); }
      } else {
        if (overlapT < overlapB) { ball.y -= overlapT; ball.vy = -Math.abs(ball.vy); }
        else { ball.y += overlapB; ball.vy = Math.abs(ball.vy); }
      }

      b.hp--;
      score += 10;
      if (b.hp <= 0) {
        score += 10 * b.maxHp;
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, COLORS[b.maxHp][0]);
        bricks.splice(i, 1);
      }
      break;
    }

    // Lost ball
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) {
        lives = 0;
        state = "gameOver";
      } else {
        resetBall();
      }
      return false;
    }

    if (bricks.length === 0) {
      score += lives * 100;
      state = "levelClear";
      stateTimer = 0.6;
      return false;
    }
    return true;
  }

  function update(dt) {
    if (state === "paused") return;

    updatePaddle(dt);

    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);

    if (stateTimer > 0) stateTimer -= dt;

    if (state === "ready") {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
    } else if (state === "playing") {
      // Sub-step to avoid tunneling through bricks
      const dist = ball.speed * dt;
      const steps = Math.max(1, Math.ceil(dist / (ball.r * 0.5)));
      const sdt = dt / steps;
      for (let i = 0; i < steps; i++) {
        if (!stepBall(sdt)) break;
      }
    }
  }

  // ---- Render ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(0, 0, W, 40);
    ctx.font = "bold 20px Segoe UI, Arial";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#e8ebff";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, 20);
    ctx.textAlign = "center";
    ctx.fillText(LEVELS[Math.min(levelIndex, LEVELS.length - 1)].name + " / " + LEVELS.length, W / 2, 20);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 16 - START_LIVES * 22, 20);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (START_LIVES - 1 - i) * 22 - 8, 20, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#fc5c7d" : "rgba(255,255,255,0.15)";
      ctx.fill();
    }
  }

  function drawOverlay(title, sub) {
    ctx.fillStyle = "rgba(5,7,20,0.6)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 48px Segoe UI, Arial";
    ctx.fillText(title, W / 2, H / 2 - 30);
    ctx.font = "20px Segoe UI, Arial";
    ctx.fillStyle = "#c5cbf5";
    sub.split("\n").forEach((line, i) => ctx.fillText(line, W / 2, H / 2 + 20 + i * 28));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Bricks
    for (const b of bricks) {
      const [c1, c2] = COLORS[b.hp];
      const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
      g.addColorStop(0, c1);
      g.addColorStop(1, c2);
      ctx.fillStyle = g;
      roundRect(b.x, b.y, b.w, b.h, 5);
      ctx.fill();
      if (b.maxHp > 1) {
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.font = "bold 13px Segoe UI, Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
    }

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Paddle
    const pg = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    pg.addColorStop(0, "#a3b4ff");
    pg.addColorStop(1, "#5a6fe0");
    ctx.fillStyle = pg;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();

    // Ball
    if (state !== "gameOver" && state !== "win") {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = "#ff3b3b";
      ctx.shadowColor = "#ff7a7a";
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    drawHUD();

    if (state === "ready") {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#e8ebff";
      ctx.font = "bold 24px Segoe UI, Arial";
      ctx.fillText(LEVELS[levelIndex].name, W / 2, H / 2 + 40);
      ctx.font = "18px Segoe UI, Arial";
      ctx.fillText("Press Space or click to launch", W / 2, H / 2 + 72);
    } else if (state === "paused") {
      drawOverlay("Paused", "Press P / Esc, Space or click to resume");
    } else if (state === "levelClear") {
      drawOverlay(LEVELS[levelIndex].name + " Cleared!",
        "Score: " + score + "\nPress Space or click for the next level");
    } else if (state === "gameOver") {
      drawOverlay("Game Over", "Final score: " + score + "\nPress Space or click to play again");
    } else if (state === "win") {
      drawOverlay("You Win!", "Final score: " + score + "\nPress Space or click to play again");
    }
  }

  // ---- Loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
