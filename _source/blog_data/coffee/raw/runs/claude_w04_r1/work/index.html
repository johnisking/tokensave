<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f1020;
    color: #eee;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  canvas {
    background: linear-gradient(#1b1d3a, #0b0c1a);
    border: 2px solid #3a3f7a;
    border-radius: 6px;
    max-width: 98vw;
    max-height: 88vh;
    cursor: none;
  }
  p { margin: 10px 0 0; font-size: 14px; color: #aab; text-align: center; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p>Mouse: move paddle, click to launch &nbsp;|&nbsp; Keyboard: ← → or A / D to move, Space to launch &nbsp;|&nbsp; P to pause</p>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ----- Config -----
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 520;
  const BALL_R = 8;
  const BRICK_ROWS_TOP = 70, BRICK_H = 24, BRICK_GAP = 6, BRICK_COLS = 10, SIDE_PAD = 25;
  const BRICK_W = (W - SIDE_PAD * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;
  const START_LIVES = 3;

  // Level layouts: '.' = empty, '1' = 1 hit, '2' = 2 hits, '3' = 3 hits
  const LEVELS = [
    {
      speed: 390,
      map: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      speed: 460,
      map: [
        "3.3.33.3.3",
        "2222222222",
        "1221111221",
        ".11.22.11.",
        "2222222222",
        "1.1.11.1.1",
      ],
    },
  ];

  const COLORS = {
    1: ["#4fc3f7", "#81d4fa"],
    2: ["#ffb74d", "#ffcc80"],
    3: ["#e57373", "#ef9a9a"],
  };

  // ----- State -----
  let state;          // "ready" | "playing" | "paused" | "levelClear" | "gameOver" | "win"
  let score, lives, levelIndex, bricks, paddle, ball, particles;
  const keys = { left: false, right: false };
  let mouseX = null;

  function newGame() {
    score = 0;
    lives = START_LIVES;
    levelIndex = 0;
    loadLevel();
  }

  function loadLevel() {
    bricks = [];
    LEVELS[levelIndex].map.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === ".") return;
        const hp = Number(ch);
        bricks.push({
          x: SIDE_PAD + c * (BRICK_W + BRICK_GAP),
          y: BRICK_ROWS_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H, hp, maxHp: hp,
        });
      });
    });
    particles = [];
    paddle = { x: W / 2 - PADDLE_W / 2, w: PADDLE_W };
    resetBall();
  }

  function resetBall() {
    ball = { x: paddle.x + paddle.w / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, stuck: true };
    state = "ready";
  }

  function launch() {
    if (!ball.stuck) return;
    const speed = LEVELS[levelIndex].speed;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    ball.stuck = false;
    state = "playing";
  }

  // Primary action: Space / click
  function action() {
    if (state === "ready") launch();
    else if (state === "paused") state = "playing";
    else if (state === "levelClear") { levelIndex++; loadLevel(); }
    else if (state === "gameOver" || state === "win") newGame();
  }

  function togglePause() {
    if (state === "playing") state = "paused";
    else if (state === "paused") state = "playing";
  }

  // ----- Input -----
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; mouseX = null; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; mouseX = null; e.preventDefault(); }
    else if (k === " " || k === "Enter") { action(); e.preventDefault(); }
    else if (k === "p" || k === "P" || k === "Escape") togglePause();
  });
  document.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });
  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener("mousemove", (e) => { mouseX = canvasX(e.clientX); });
  canvas.addEventListener("mousedown", (e) => { mouseX = canvasX(e.clientX); action(); e.preventDefault(); });
  canvas.addEventListener("touchmove", (e) => { mouseX = canvasX(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchstart", (e) => { mouseX = canvasX(e.touches[0].clientX); action(); e.preventDefault(); }, { passive: false });
  window.addEventListener("blur", () => { keys.left = keys.right = false; if (state === "playing") state = "paused"; });

  // ----- Update -----
  function updatePaddle(dt) {
    if (keys.left || keys.right) {
      paddle.x += ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * PADDLE_SPEED * dt;
    } else if (mouseX !== null) {
      paddle.x = mouseX - paddle.w / 2;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, color });
    }
  }

  function stepBall(dt) {
    const prevX = ball.x, prevY = ball.y;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 && circleRect(ball.x, ball.y, BALL_R, paddle.x, PADDLE_Y, paddle.w, PADDLE_H)) {
      const speed = Math.hypot(ball.vx, ball.vy);
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const angle = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3);      // up to 60 degrees
      ball.vx = Math.sin(angle) * speed;
      ball.vy = -Math.abs(Math.cos(angle) * speed);
      ball.y = PADDLE_Y - BALL_R - 0.5;
    }

    // Bricks (one collision per step)
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      if (!circleRect(ball.x, ball.y, BALL_R, b.x, b.y, b.w, b.h)) continue;

      // Decide bounce axis from previous position
      const wasLeft = prevX + BALL_R <= b.x, wasRight = prevX - BALL_R >= b.x + b.w;
      const wasAbove = prevY + BALL_R <= b.y, wasBelow = prevY - BALL_R >= b.y + b.h;
      if (wasLeft || wasRight) {
        ball.vx = wasLeft ? -Math.abs(ball.vx) : Math.abs(ball.vx);
        ball.x = prevX;
      } else if (wasAbove || wasBelow) {
        ball.vy = wasAbove ? -Math.abs(ball.vy) : Math.abs(ball.vy);
        ball.y = prevY;
      } else {
        ball.vy = -ball.vy;
        ball.y = prevY;
      }

      b.hp--;
      if (b.hp <= 0) {
        score += 10 * b.maxHp;
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, COLORS[b.maxHp][0]);
        // Speed up slightly as bricks are destroyed
        const sp = Math.hypot(ball.vx, ball.vy);
        const max = LEVELS[levelIndex].speed * 1.5;
        if (sp < max) { ball.vx *= 1.01; ball.vy *= 1.01; }
      } else {
        score += 5;
      }
      break;
    }

    // Lost ball
    if (ball.y - BALL_R > H) {
      lives--;
      if (lives <= 0) { state = "gameOver"; }
      else resetBall();
      return false;
    }

    if (bricks.every(b => b.hp <= 0)) {
      state = levelIndex + 1 < LEVELS.length ? "levelClear" : "win";
      return false;
    }
    return true;
  }

  function update(dt) {
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);

    if (state !== "playing" && state !== "ready") return;
    updatePaddle(dt);

    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = PADDLE_Y - BALL_R - 1;
      return;
    }

    // Sub-steps to avoid tunnelling through bricks
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / (BALL_R / 2)));
    for (let i = 0; i < steps; i++) {
      if (!stepBall(dt / steps)) break;
    }
  }

  // ----- Draw -----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(0, 0, W, 44);
    ctx.font = "bold 20px Segoe UI, Arial";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, 22);
    ctx.textAlign = "center";
    ctx.fillText("Level " + (levelIndex + 1) + " / " + LEVELS.length, W / 2, 22);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 16 - START_LIVES * 22, 22);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (START_LIVES - 1 - i) * 22 - 8, 22, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5370" : "rgba(255,255,255,0.15)";
      ctx.fill();
    }
  }

  function drawOverlay(title, sub) {
    ctx.fillStyle = "rgba(5,6,15,0.65)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 48px Segoe UI, Arial";
    ctx.fillText(title, W / 2, H / 2 - 30);
    ctx.font = "20px Segoe UI, Arial";
    ctx.fillStyle = "#ccd";
    ctx.fillText(sub, W / 2, H / 2 + 25);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Bricks
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const [base, light] = COLORS[b.hp];
      const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
      g.addColorStop(0, light);
      g.addColorStop(1, base);
      ctx.fillStyle = g;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      if (b.maxHp > 1) {
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.font = "bold 13px Segoe UI, Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
    }

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.5);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Paddle
    const pg = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
    pg.addColorStop(0, "#c5cae9");
    pg.addColorStop(1, "#7986cb");
    ctx.fillStyle = pg;
    roundRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H, 7);
    ctx.fill();

    // Ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = "#ff2a2a";
    ctx.shadowColor = "#ff7070";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;

    drawHUD();

    if (state === "ready") {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#dde";
      ctx.font = "20px Segoe UI, Arial";
      ctx.fillText("Press Space or Click to launch", W / 2, H / 2 + 60);
    } else if (state === "paused") {
      drawOverlay("Paused", "Press P, Space or Click to resume");
    } else if (state === "levelClear") {
      drawOverlay("Level " + (levelIndex + 1) + " Clear!", "Press Space or Click for Level " + (levelIndex + 2));
    } else if (state === "gameOver") {
      drawOverlay("Game Over", "Final score: " + score + "  —  Space or Click to restart");
    } else if (state === "win") {
      drawOverlay("You Win!", "Final score: " + score + "  —  Space or Click to play again");
    }
  }

  // ----- Loop -----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
