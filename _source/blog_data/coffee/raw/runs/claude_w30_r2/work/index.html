<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0e1020;
    color: #e8e8f0;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  canvas {
    background: linear-gradient(#151935, #0b0d1c);
    border: 2px solid #3a3f6b;
    border-radius: 6px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
  }
  #help {
    margin-top: 10px;
    font-size: 14px;
    color: #9aa0c8;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div id="help">
  Mouse: move paddle, click to launch &nbsp;|&nbsp;
  Keyboard: ← → or A / D to move, Space to launch, P to pause, Enter to restart
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---------- Config ----------
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 520;
  const BALL_R = 8;
  const BRICK_COLS = 10, BRICK_W = 70, BRICK_H = 24, BRICK_GAP = 6;
  const BRICK_TOP = 70;
  const BRICK_LEFT = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;
  const START_LIVES = 3;

  // Level layouts: '.' = empty, '1' = 1-hit brick, '2' = 2-hit brick, '3' = 3-hit brick
  const LEVELS = [
    {
      speed: 380,
      map: [
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
      ],
    },
    {
      speed: 450,
      map: [
        '3.3.33.3.3',
        '2222222222',
        '12.2112.21',
        '2222222222',
        '1.111111.1',
        '1111111111',
      ],
    },
  ];

  const COLORS = {
    1: ['#4fc3f7', '#81d4fa'],
    2: ['#ffb74d', '#ffe0b2'],
    3: ['#e57373', '#ffcdd2'],
  };

  // ---------- State ----------
  let state;          // 'ready' | 'playing' | 'paused' | 'levelClear' | 'gameOver' | 'won'
  let score, lives, levelIndex;
  let paddle, ball, bricks;
  let keys = { left: false, right: false };
  let stateTimer = 0;

  function newGame() {
    score = 0;
    lives = START_LIVES;
    levelIndex = 0;
    loadLevel(levelIndex);
  }

  function loadLevel(i) {
    bricks = [];
    const map = LEVELS[i].map;
    for (let r = 0; r < map.length; r++) {
      for (let c = 0; c < BRICK_COLS; c++) {
        const ch = map[r][c];
        if (ch === '.' || ch === undefined) continue;
        const hp = parseInt(ch, 10);
        bricks.push({
          x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H,
          hp, maxHp: hp, alive: true,
        });
      }
    }
    paddle = { x: (W - PADDLE_W) / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
    resetBall();
  }

  function resetBall() {
    ball = { x: paddle.x + paddle.w / 2, y: paddle.y - BALL_R - 1, vx: 0, vy: 0, r: BALL_R, stuck: true };
    state = 'ready';
  }

  function launch() {
    if (state !== 'ready') return;
    const speed = LEVELS[levelIndex].speed;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    ball.stuck = false;
    state = 'playing';
  }

  function primaryAction() {
    if (state === 'ready') launch();
    else if (state === 'paused') state = 'playing';
    else if (state === 'gameOver' || state === 'won') newGame();
  }

  // ---------- Input ----------
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
    else if (k === ' ' || k === 'Spacebar') { primaryAction(); e.preventDefault(); }
    else if (k === 'Enter') {
      if (state === 'gameOver' || state === 'won') newGame();
      else primaryAction();
      e.preventDefault();
    }
    else if (k === 'p' || k === 'P' || k === 'Escape') {
      if (state === 'playing') state = 'paused';
      else if (state === 'paused') state = 'playing';
    }
  });
  document.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });
  window.addEventListener('blur', () => {
    keys.left = keys.right = false;
    if (state === 'playing') state = 'paused';
  });

  canvas.addEventListener('mousemove', e => {
    if (state === 'paused') return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = clamp(mx - paddle.w / 2, 0, W - paddle.w);
  });
  canvas.addEventListener('mousedown', e => { e.preventDefault(); primaryAction(); });

  // ---------- Helpers ----------
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function circleRect(b, r) {
    const cx = clamp(b.x, r.x, r.x + r.w);
    const cy = clamp(b.y, r.y, r.y + r.h);
    const dx = b.x - cx, dy = b.y - cy;
    return dx * dx + dy * dy <= b.r * b.r;
  }

  // ---------- Update ----------
  function update(dt) {
    // Paddle via keyboard
    if (state === 'playing' || state === 'ready') {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      if (dir) paddle.x = clamp(paddle.x + dir * PADDLE_SPEED * dt, 0, W - paddle.w);
    }

    if (state === 'ready') {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
      return;
    }

    if (state === 'levelClear') {
      stateTimer -= dt;
      if (stateTimer <= 0) {
        levelIndex++;
        loadLevel(levelIndex);
      }
      return;
    }

    if (state !== 'playing') return;

    // Sub-step to avoid tunnelling
    const speed = Math.hypot(ball.vx, ball.vy);
    const steps = Math.max(1, Math.ceil((speed * dt) / (ball.r * 0.5)));
    const sdt = dt / steps;
    for (let i = 0; i < steps && state === 'playing'; i++) step(sdt);
  }

  function step(dt) {
    const prevX = ball.x, prevY = ball.y;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // Bottom: lose a life
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) { lives = 0; state = 'gameOver'; }
      else resetBall();
      return;
    }

    // Paddle
    if (ball.vy > 0 && circleRect(ball, paddle)) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const angle = clamp(hit, -1, 1) * (Math.PI / 3); // up to 60deg from vertical
      const sp = Math.hypot(ball.vx, ball.vy);
      ball.vx = Math.sin(angle) * sp;
      ball.vy = -Math.cos(angle) * sp;
      ball.y = paddle.y - ball.r - 0.5;
    }

    // Bricks
    for (const br of bricks) {
      if (!br.alive || !circleRect(ball, br)) continue;

      // Determine collision side using previous position
      const wasLeft = prevX < br.x, wasRight = prevX > br.x + br.w;
      const wasAbove = prevY < br.y, wasBelow = prevY > br.y + br.h;
      if ((wasAbove || wasBelow) && !(wasLeft || wasRight)) {
        ball.vy = -ball.vy;
      } else if ((wasLeft || wasRight) && !(wasAbove || wasBelow)) {
        ball.vx = -ball.vx;
      } else {
        // Corner: reflect along the axis with smaller penetration
        const ox = Math.min(Math.abs(ball.x + ball.r - br.x), Math.abs(br.x + br.w - (ball.x - ball.r)));
        const oy = Math.min(Math.abs(ball.y + ball.r - br.y), Math.abs(br.y + br.h - (ball.y - ball.r)));
        if (ox < oy) ball.vx = -ball.vx; else ball.vy = -ball.vy;
      }
      ball.x = prevX; ball.y = prevY;

      br.hp--;
      if (br.hp <= 0) {
        br.alive = false;
        score += 10 * br.maxHp * (levelIndex + 1);
      } else {
        score += 5;
      }

      // Speed up slightly as the game goes on
      const sp = Math.hypot(ball.vx, ball.vy);
      const maxSp = LEVELS[levelIndex].speed * 1.5;
      if (sp < maxSp) { ball.vx *= 1.01; ball.vy *= 1.01; }

      if (bricks.every(b => !b.alive)) {
        if (levelIndex < LEVELS.length - 1) {
          state = 'levelClear';
          stateTimer = 2;
        } else {
          state = 'won';
        }
      }
      break; // one brick per step
    }
  }

  // ---------- Render ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // HUD
    ctx.fillStyle = '#e8e8f0';
    ctx.font = 'bold 20px "Segoe UI", Arial, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 16, 28);
    ctx.textAlign = 'center';
    ctx.fillText('Level ' + (levelIndex + 1) + ' / ' + LEVELS.length, W / 2, 28);
    ctx.textAlign = 'right';
    ctx.fillText('Lives:', W - 16 - START_LIVES * 22, 28);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (START_LIVES - 1 - i) * 22 - 8, 28, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? '#ff5c8a' : '#3a3f6b';
      ctx.fill();
    }
    ctx.strokeStyle = '#2a2f55';
    ctx.beginPath(); ctx.moveTo(0, 50); ctx.lineTo(W, 50); ctx.stroke();

    // Bricks
    for (const br of bricks) {
      if (!br.alive) continue;
      const [base, light] = COLORS[br.hp];
      const g = ctx.createLinearGradient(0, br.y, 0, br.y + br.h);
      g.addColorStop(0, light);
      g.addColorStop(1, base);
      ctx.fillStyle = g;
      roundRect(br.x, br.y, br.w, br.h, 4);
      ctx.fill();
      if (br.maxHp > 1) {
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.font = 'bold 13px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(br.hp, br.x + br.w / 2, br.y + br.h / 2 + 1);
      }
    }

    // Paddle
    const pg = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    pg.addColorStop(0, '#d1c4e9');
    pg.addColorStop(1, '#7e57c2');
    ctx.fillStyle = pg;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();

    // Ball
    if (state !== 'gameOver') {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = '#ff2b2b';
      ctx.shadowColor = '#ff6b6b';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Overlays
    if (state === 'ready') {
      message('Level ' + (levelIndex + 1), 'Click or press Space to launch');
    } else if (state === 'paused') {
      overlay();
      message('Paused', 'Press P or click to resume');
    } else if (state === 'levelClear') {
      overlay();
      message('Level ' + (levelIndex + 1) + ' Cleared!', 'Get ready for level ' + (levelIndex + 2) + '...');
    } else if (state === 'gameOver') {
      overlay();
      message('Game Over', 'Final score: ' + score + '  —  Click or press Enter to play again');
    } else if (state === 'won') {
      overlay();
      message('You Win!', 'Final score: ' + score + '  —  Click or press Enter to play again');
    }
  }

  function overlay() {
    ctx.fillStyle = 'rgba(5, 6, 15, 0.65)';
    ctx.fillRect(0, 0, W, H);
  }

  function message(title, sub) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 44px "Segoe UI", Arial, sans-serif';
    ctx.fillText(title, W / 2, H / 2 + 40);
    ctx.fillStyle = '#b8bde6';
    ctx.font = '20px "Segoe UI", Arial, sans-serif';
    ctx.fillText(sub, W / 2, H / 2 + 85);
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
