<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #e8ecf5;
    overflow: hidden;
  }
  #wrap { text-align: center; }
  canvas {
    display: block;
    background: linear-gradient(#1b2133, #0d1018);
    border: 2px solid #3a4562;
    border-radius: 8px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
  }
  #help { margin-top: 8px; font-size: 14px; color: #9aa6c4; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <div id="help">Mouse or ←/→ (A/D) to move · Click or Space to launch · P to pause · Enter/click to restart</div>
</div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ---- Configuration ----
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 600;
  const BALL_R = 8;
  const START_LIVES = 3;
  const BRICK_COLS = 10, BRICK_W = 68, BRICK_H = 24, BRICK_GAP = 8;
  const BRICK_TOP = 70;
  const BRICK_LEFT = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;

  // Level maps: digit = brick hit points, '.' = empty
  const LEVELS = [
    {
      speed: 380,
      map: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      speed: 450,
      map: [
        "3.2222222.3",
        "22..33..22",
        "2211111122",
        "1.111111.1",
        "2222..2222",
        "1111111111",
      ].map(r => r.slice(0, BRICK_COLS).padEnd(BRICK_COLS, ".")),
    },
  ];

  const COLORS = { 1: ["#4fc3f7", "#0288d1"], 2: ["#ffb74d", "#ef6c00"], 3: ["#e57373", "#c62828"] };
  const ROW_HUES = ["#ef5350", "#ffa726", "#ffee58", "#66bb6a", "#42a5f5", "#ab47bc"];

  // ---- State ----
  let state; // "serve" | "play" | "paused" | "levelclear" | "gameover" | "win"
  let score, lives, levelIndex, bricks, paddle, ball, particles, levelTimer;
  const keys = { left: false, right: false };
  let mouseActive = false;

  function buildLevel(idx) {
    bricks = [];
    LEVELS[idx].map.forEach((row, r) => {
      for (let c = 0; c < BRICK_COLS; c++) {
        const ch = row[c];
        if (ch && ch !== ".") {
          const hp = parseInt(ch, 10);
          bricks.push({
            x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP),
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            w: BRICK_W, h: BRICK_H,
            hp, maxHp: hp, row: r, alive: true,
          });
        }
      }
    });
  }

  function resetBall() {
    ball = { x: paddle.x + paddle.w / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, speed: LEVELS[levelIndex].speed };
    state = "serve";
  }

  function newGame() {
    score = 0;
    lives = START_LIVES;
    levelIndex = 0;
    particles = [];
    paddle = { x: W / 2 - PADDLE_W / 2, w: PADDLE_W, h: PADDLE_H };
    buildLevel(levelIndex);
    resetBall();
  }

  function launch() {
    if (state !== "serve") return;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    state = "play";
  }

  function nextLevel() {
    levelIndex++;
    if (levelIndex >= LEVELS.length) {
      state = "win";
      return;
    }
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
  }

  function primaryAction() {
    if (state === "serve") launch();
    else if (state === "gameover" || state === "win") newGame();
    else if (state === "paused") state = "play";
  }

  // ---- Input ----
  document.addEventListener("keydown", e => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; mouseActive = false; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; mouseActive = false; e.preventDefault(); }
    else if (k === " " || k === "Spacebar") { e.preventDefault(); primaryAction(); }
    else if (k === "Enter") { if (state === "gameover" || state === "win") newGame(); else primaryAction(); }
    else if (k === "p" || k === "P" || k === "Escape") {
      if (state === "play") state = "paused";
      else if (state === "paused") state = "play";
    }
  });
  document.addEventListener("keyup", e => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener("mousemove", e => {
    mouseActive = true;
    if (state === "paused") return;
    movePaddleTo(canvasX(e.clientX));
  });
  canvas.addEventListener("mousedown", e => { e.preventDefault(); primaryAction(); });
  canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    if (state !== "paused") movePaddleTo(canvasX(e.touches[0].clientX));
  }, { passive: false });
  canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    movePaddleTo(canvasX(e.touches[0].clientX));
    primaryAction();
  }, { passive: false });
  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state === "play") state = "paused";
  });

  function movePaddleTo(x) {
    paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
  }

  // ---- Physics ----
  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  function brickColor(b) {
    if (b.maxHp > 1) return COLORS[b.hp][0];
    return ROW_HUES[b.row % ROW_HUES.length];
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + BALL_R >= PADDLE_Y && ball.y - BALL_R <= PADDLE_Y + paddle.h &&
        ball.x + BALL_R >= paddle.x && ball.x - BALL_R <= paddle.x + paddle.w) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const clamped = Math.max(-1, Math.min(1, hit));
      const angle = clamped * (Math.PI / 3); // up to 60deg from vertical
      ball.vx = Math.sin(angle) * ball.speed;
      ball.vy = -Math.cos(angle) * ball.speed;
      ball.y = PADDLE_Y - BALL_R - 0.5;
    }

    // Bricks (one collision per sub-step)
    for (const b of bricks) {
      if (!b.alive) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy <= BALL_R * BALL_R) {
        // Decide reflection axis by penetration depth
        const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + b.w - (ball.x - BALL_R));
        const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + b.h - (ball.y - BALL_R));
        if (overlapX < overlapY) {
          ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
        } else {
          ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
        }
        b.hp--;
        if (b.hp <= 0) {
          b.alive = false;
          score += 10 * b.maxHp;
          spawnParticles(b.x + b.w / 2, b.y + b.h / 2, brickColor({ ...b, hp: 1 }));
        } else {
          score += 5;
        }
        // Slightly speed up the ball as the game progresses
        ball.speed = Math.min(ball.speed * 1.01, LEVELS[levelIndex].speed * 1.6);
        const mag = Math.hypot(ball.vx, ball.vy);
        ball.vx = ball.vx / mag * ball.speed;
        ball.vy = ball.vy / mag * ball.speed;
        break;
      }
    }

    // Lost ball
    if (ball.y - BALL_R > H) {
      lives--;
      if (lives <= 0) { state = "gameover"; }
      else { resetBall(); }
      return false;
    }

    if (bricks.every(b => !b.alive)) {
      score += 100 * (levelIndex + 1);
      state = "levelclear";
      levelTimer = 2;
      return false;
    }
    return true;
  }

  function update(dt) {
    // Paddle keyboard movement
    if (state === "play" || state === "serve") {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      if (dir !== 0) paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x + dir * PADDLE_SPEED * dt));
    }

    if (state === "serve") {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = PADDLE_Y - BALL_R - 1;
    } else if (state === "play") {
      const steps = Math.ceil((ball.speed * dt) / (BALL_R * 0.5));
      const sdt = dt / steps;
      for (let i = 0; i < steps; i++) {
        if (!stepBall(sdt)) break;
      }
    } else if (state === "levelclear") {
      levelTimer -= dt;
      if (levelTimer <= 0) nextLevel();
    }

    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  // ---- Rendering ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(0, 0, W, 40);
    ctx.font = "bold 20px 'Segoe UI', Arial, sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#e8ecf5";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, 20);
    ctx.textAlign = "center";
    ctx.fillText("Level " + (Math.min(levelIndex, LEVELS.length - 1) + 1) + " / " + LEVELS.length, W / 2, 20);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 16 - START_LIVES * 22, 20);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (START_LIVES - 1 - i) * 22 - 8, 20, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5370" : "#3a4562";
      ctx.fill();
    }
  }

  function drawOverlay(title, sub) {
    ctx.fillStyle = "rgba(8,10,16,0.65)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 48px 'Segoe UI', Arial, sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 24);
    ctx.font = "20px 'Segoe UI', Arial, sans-serif";
    ctx.fillStyle = "#b8c2dc";
    ctx.fillText(sub, W / 2, H / 2 + 26);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      const base = brickColor(b);
      const grad = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
      grad.addColorStop(0, base);
      grad.addColorStop(1, b.maxHp > 1 ? COLORS[b.hp][1] : "rgba(0,0,0,0.35)");
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = base;
      ctx.fill();
      ctx.fillStyle = grad;
      ctx.fill();
      if (b.maxHp > 1) {
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.font = "bold 14px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
    }

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Paddle
    const pg = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + paddle.h);
    pg.addColorStop(0, "#e0f7fa");
    pg.addColorStop(1, "#26c6da");
    roundRect(paddle.x, PADDLE_Y, paddle.w, paddle.h, 7);
    ctx.fillStyle = pg;
    ctx.fill();

    // Ball
    if (state !== "gameover" && state !== "win") {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = "#ff3b3b";
      ctx.shadowColor = "#ff3b3b";
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    drawHUD();

    if (state === "serve") {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#b8c2dc";
      ctx.font = "18px 'Segoe UI', Arial, sans-serif";
      ctx.fillText("Click or press Space to launch", W / 2, H / 2 + 60);
    } else if (state === "paused") {
      drawOverlay("Paused", "Press P or click to resume");
    } else if (state === "levelclear") {
      drawOverlay("Level " + (levelIndex + 1) + " Clear!",
        levelIndex + 1 < LEVELS.length ? "Get ready for level " + (levelIndex + 2) : "Final level complete!");
    } else if (state === "gameover") {
      drawOverlay("Game Over", "Final score: " + score + "  ·  Click or press Enter to play again");
    } else if (state === "win") {
      drawOverlay("You Win!", "Final score: " + score + "  ·  Click or press Enter to play again");
    }
  }

  // ---- Main loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
