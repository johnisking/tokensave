<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10121a;
    color: #eee;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  canvas {
    background: linear-gradient(#1b1f2e, #0d0f17);
    border: 2px solid #3a4060;
    border-radius: 6px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
  }
  p { margin: 10px 0 0; font-size: 14px; color: #9aa3c0; text-align: center; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p>Mouse or ←/→ (A/D) to move · Click or Space to launch · P to pause · Enter/click to restart after game over</p>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ---- Config ----
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 520;
  const BALL_R = 8;
  const BRICK_W = 68, BRICK_H = 24, BRICK_GAP = 6, BRICK_TOP = 70;
  const HUD_H = 40;

  // Level layouts: digit = brick hit points (0 = empty)
  const LEVELS = [
    {
      speed: 380,
      rows: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      speed: 450,
      rows: [
        "2222222222",
        "2100000012",
        "2103333012",
        "2100000012",
        "2211111122",
        "0110000110",
      ],
    },
  ];
  const ROW_COLORS = ["#ff5f6d", "#ffa94d", "#ffd43b", "#69db7c", "#4dabf7", "#b197fc"];

  // ---- State ----
  const keys = {};
  let paddle, ball, bricks, score, lives, level, state, lastTime;
  // state: "serve" | "play" | "paused" | "levelclear" | "gameover" | "win"

  function buildLevel(idx) {
    const rows = LEVELS[idx].rows;
    const cols = rows[0].length;
    const totalW = cols * BRICK_W + (cols - 1) * BRICK_GAP;
    const left = (W - totalW) / 2;
    bricks = [];
    rows.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        const hp = parseInt(ch, 10);
        if (hp > 0) {
          bricks.push({
            x: left + c * (BRICK_W + BRICK_GAP),
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            w: BRICK_W, h: BRICK_H,
            hp, maxHp: hp,
            color: ROW_COLORS[r % ROW_COLORS.length],
          });
        }
      });
    });
  }

  function resetBall() {
    ball = { x: paddle.x + paddle.w / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, r: BALL_R };
    state = "serve";
  }

  function launchBall() {
    if (state !== "serve") return;
    const speed = LEVELS[level].speed;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    state = "play";
  }

  function newGame() {
    score = 0;
    lives = 3;
    level = 0;
    paddle = { x: (W - PADDLE_W) / 2, w: PADDLE_W, h: PADDLE_H };
    buildLevel(level);
    resetBall();
  }

  function nextLevel() {
    level++;
    buildLevel(level);
    paddle.x = (W - paddle.w) / 2;
    resetBall();
  }

  // ---- Input ----
  window.addEventListener("keydown", (e) => {
    keys[e.key] = true;
    if (["ArrowLeft", "ArrowRight", " ", "ArrowUp", "ArrowDown"].includes(e.key)) e.preventDefault();
    if (e.key === " " || e.key === "ArrowUp") primaryAction();
    if (e.key === "Enter") primaryAction();
    if (e.key === "p" || e.key === "P") {
      if (state === "play") state = "paused";
      else if (state === "paused") { state = "play"; lastTime = performance.now(); }
    }
  });
  window.addEventListener("keyup", (e) => { keys[e.key] = false; });

  function primaryAction() {
    if (state === "serve") launchBall();
    else if (state === "levelclear") nextLevel();
    else if (state === "gameover" || state === "win") newGame();
    else if (state === "paused") { state = "play"; lastTime = performance.now(); }
  }

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener("mousemove", (e) => {
    if (state === "paused") return;
    paddle.x = clamp(canvasX(e.clientX) - paddle.w / 2, 0, W - paddle.w);
  });
  canvas.addEventListener("mousedown", (e) => { e.preventDefault(); primaryAction(); });
  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    paddle.x = clamp(canvasX(e.touches[0].clientX) - paddle.w / 2, 0, W - paddle.w);
  }, { passive: false });
  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); primaryAction(); }, { passive: false });

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  // ---- Update ----
  function update(dt) {
    if (state === "paused" || state === "gameover" || state === "win" || state === "levelclear") return;

    // Keyboard paddle movement
    let dir = 0;
    if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dir -= 1;
    if (keys["ArrowRight"] || keys["d"] || keys["D"]) dir += 1;
    paddle.x = clamp(paddle.x + dir * PADDLE_SPEED * dt, 0, W - paddle.w);

    if (state === "serve") {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = PADDLE_Y - ball.r - 1;
      return;
    }

    // Sub-step to avoid tunneling
    const steps = Math.ceil((Math.hypot(ball.vx, ball.vy) * dt) / (ball.r * 0.5)) || 1;
    const sdt = dt / steps;
    for (let i = 0; i < steps && state === "play"; i++) step(sdt);
  }

  function step(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < HUD_H) { ball.y = HUD_H + ball.r; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + ball.r >= PADDLE_Y && ball.y - ball.r <= PADDLE_Y + paddle.h &&
        ball.x + ball.r >= paddle.x && ball.x - ball.r <= paddle.x + paddle.w) {
      const hit = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const angle = hit * (Math.PI / 3); // up to 60° from vertical
      const speed = Math.hypot(ball.vx, ball.vy);
      ball.vx = Math.sin(angle) * speed;
      ball.vy = -Math.cos(angle) * speed;
      ball.y = PADDLE_Y - ball.r;
    }

    // Bricks
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const cx = clamp(ball.x, b.x, b.x + b.w);
      const cy = clamp(ball.y, b.y, b.y + b.h);
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy <= ball.r * ball.r) {
        // Decide bounce axis by penetration depth
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (overlapX < overlapY) {
          ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
        } else {
          ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
        }
        b.hp--;
        score += b.hp === 0 ? 10 * b.maxHp : 5;
        // Slight speed-up per hit, capped
        const speed = Math.hypot(ball.vx, ball.vy);
        const newSpeed = Math.min(speed * 1.01, LEVELS[level].speed * 1.6);
        ball.vx *= newSpeed / speed; ball.vy *= newSpeed / speed;
        break;
      }
    }

    if (bricks.every(b => b.hp <= 0)) {
      state = level + 1 < LEVELS.length ? "levelclear" : "win";
      return;
    }

    // Lost ball
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) state = "gameover";
      else resetBall();
    }
  }

  // ---- Render ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // HUD
    ctx.fillStyle = "rgba(255,255,255,0.05)";
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.fillStyle = "#3a4060";
    ctx.fillRect(0, HUD_H - 2, W, 2);
    ctx.font = "bold 18px Segoe UI, Arial";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, HUD_H / 2);
    ctx.textAlign = "center";
    ctx.fillText("Level " + (level + 1) + " / " + LEVELS.length, W / 2, HUD_H / 2);
    ctx.textAlign = "right";
    ctx.fillText("Lives: ", W - 16 - 3 * 22, HUD_H / 2);
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (2 - i) * 22 - 8, HUD_H / 2, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff6b81" : "#444a63";
      ctx.fill();
    }

    // Bricks
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.maxHp > 1 ? 0.45 + 0.55 * (b.hp / b.maxHp) : 1;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.maxHp > 1) {
        ctx.strokeStyle = "rgba(255,255,255,0.8)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.font = "bold 13px Segoe UI, Arial";
        ctx.textAlign = "center";
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
    }

    // Paddle
    roundRect(paddle.x, PADDLE_Y, paddle.w, paddle.h, 7);
    const g = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + paddle.h);
    g.addColorStop(0, "#e9ecff");
    g.addColorStop(1, "#7f8cff");
    ctx.fillStyle = g;
    ctx.fill();

    // Ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ff3b3b";
    ctx.shadowColor = "#ff8080";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Overlays
    if (state === "serve") {
      message(level === 0 && lives === 3 && score === 0 ? "BRICK BREAKER" : "Level " + (level + 1),
              "Click or press Space to launch", false);
    } else if (state === "paused") {
      message("PAUSED", "Press P or click to resume", true);
    } else if (state === "levelclear") {
      message("LEVEL " + (level + 1) + " CLEAR!", "Click or press Enter for Level " + (level + 2), true);
    } else if (state === "gameover") {
      message("GAME OVER", "Final score: " + score + "  ·  Click or press Enter to play again", true);
    } else if (state === "win") {
      message("YOU WIN!", "Final score: " + score + "  ·  Click or press Enter to play again", true);
    }
  }

  function message(title, sub, dim) {
    if (dim) {
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(0, HUD_H, W, H - HUD_H);
    }
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 44px Segoe UI, Arial";
    ctx.fillText(title, W / 2, H / 2 + 40);
    ctx.font = "18px Segoe UI, Arial";
    ctx.fillStyle = "#c5cbe8";
    ctx.fillText(sub, W / 2, H / 2 + 80);
  }

  // ---- Loop ----
  function loop(t) {
    const dt = Math.min((t - lastTime) / 1000, 0.05);
    lastTime = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  newGame();
  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
