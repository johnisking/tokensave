<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d0f1a;
    color: #e8ecff;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  canvas {
    background: linear-gradient(#161a2e, #0b0d18);
    border: 2px solid #3a4170;
    border-radius: 8px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
    touch-action: none;
  }
  .help {
    margin-top: 10px;
    font-size: 14px;
    color: #9aa3d0;
    text-align: center;
  }
  kbd {
    background: #252a48;
    border: 1px solid #454c80;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div class="help">
  Move: <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> or mouse &nbsp;|&nbsp;
  Launch: <kbd>Space</kbd> or click &nbsp;|&nbsp; Pause: <kbd>P</kbd> / <kbd>Esc</kbd>
</div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ---- Config ----
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 620;
  const BALL_R = 8;
  const BRICK_W = 70, BRICK_H = 24, BRICK_GAP = 6, BRICK_TOP = 80;
  const COLS = 10;
  const BRICK_LEFT = (W - (COLS * BRICK_W + (COLS - 1) * BRICK_GAP)) / 2;
  const START_LIVES = 3;

  // Level layouts: '.' = empty, 1 = normal brick, 2 = tough brick (2 hits), 3 = very tough (3 hits)
  const LEVELS = [
    {
      name: "Level 1",
      speed: 400,
      rows: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      name: "Level 2",
      speed: 480,
      rows: [
        "3.3.33.3.3",
        "2222222222",
        "12.2112.21",
        "2222222222",
        "1.111111.1",
        "..222222..",
        "1111111111",
      ],
    },
  ];

  const ROW_COLORS = ["#ff5a7a", "#ff9f43", "#feca57", "#4cd97b", "#48dbfb", "#6c8cff", "#b06cff"];

  // ---- State ----
  let state = "title"; // title | serve | play | paused | levelClear | gameOver | win
  let levelIndex = 0;
  let score = 0;
  let lives = START_LIVES;
  let bricks = [];
  let particles = [];
  let messageTimer = 0;

  const paddle = { x: W / 2 - PADDLE_W / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R, speed: 360 };

  const keys = { left: false, right: false };
  let mouseX = null;

  // ---- Setup ----
  function buildLevel(i) {
    bricks = [];
    const layout = LEVELS[i].rows;
    layout.forEach((row, r) => {
      for (let c = 0; c < COLS; c++) {
        const ch = row[c];
        if (!ch || ch === ".") continue;
        const hp = parseInt(ch, 10);
        bricks.push({
          x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W,
          h: BRICK_H,
          hp,
          maxHp: hp,
          color: ROW_COLORS[r % ROW_COLORS.length],
        });
      }
    });
    ball.speed = LEVELS[i].speed;
  }

  function resetBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    ball.vx = 0;
    ball.vy = 0;
    state = "serve";
  }

  function launchBall() {
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    state = "play";
  }

  function newGame() {
    score = 0;
    lives = START_LIVES;
    levelIndex = 0;
    particles = [];
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
  }

  // ---- Input ----
  function primaryAction() {
    if (state === "title" || state === "gameOver" || state === "win") {
      newGame();
    } else if (state === "serve") {
      launchBall();
    } else if (state === "paused") {
      state = "play";
    } else if (state === "levelClear" && messageTimer <= 0) {
      nextLevel();
    }
  }

  function togglePause() {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }

  window.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; mouseX = null; }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; mouseX = null; }
    else if (k === " " || k === "Enter") primaryAction();
    else if (k === "p" || k === "P" || k === "Escape") togglePause();
    else return;
    e.preventDefault();
  });

  window.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }

  canvas.addEventListener("mousemove", (e) => { mouseX = canvasX(e.clientX); });
  canvas.addEventListener("mousedown", (e) => { mouseX = canvasX(e.clientX); primaryAction(); });
  canvas.addEventListener("touchstart", (e) => {
    mouseX = canvasX(e.touches[0].clientX); primaryAction(); e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("touchmove", (e) => {
    mouseX = canvasX(e.touches[0].clientX); e.preventDefault();
  }, { passive: false });
  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state === "play") state = "paused";
  });

  // ---- Logic ----
  function nextLevel() {
    levelIndex++;
    if (levelIndex >= LEVELS.length) {
      state = "win";
      return;
    }
    buildLevel(levelIndex);
    particles = [];
    resetBall();
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  function updatePaddle(dt) {
    if (keys.left || keys.right) {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      paddle.x += dir * PADDLE_SPEED * dt;
    } else if (mouseX !== null) {
      paddle.x = mouseX - paddle.w / 2;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function circleRectHit(b, r) {
    const cx = Math.max(r.x, Math.min(b.x, r.x + r.w));
    const cy = Math.max(r.y, Math.min(b.y, r.y + r.h));
    const dx = b.x - cx, dy = b.y - cy;
    return dx * dx + dy * dy <= b.r * b.r;
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 && circleRectHit(ball, paddle)) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const clamped = Math.max(-1, Math.min(1, hit));
      const angle = clamped * (Math.PI / 3); // up to 60° from vertical
      ball.vx = Math.sin(angle) * ball.speed;
      ball.vy = -Math.cos(angle) * ball.speed;
      ball.y = paddle.y - ball.r - 0.5;
    }

    // Bricks (one per step)
    for (let i = 0; i < bricks.length; i++) {
      const br = bricks[i];
      if (!circleRectHit(ball, br)) continue;

      // Determine reflection axis by penetration depth
      const overlapX = Math.min(ball.x + ball.r - br.x, br.x + br.w - (ball.x - ball.r));
      const overlapY = Math.min(ball.y + ball.r - br.y, br.y + br.h - (ball.y - ball.r));
      if (overlapX < overlapY) {
        ball.vx = ball.x < br.x + br.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      } else {
        ball.vy = ball.y < br.y + br.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      }

      br.hp--;
      if (br.hp <= 0) {
        score += 10 * br.maxHp * (levelIndex + 1);
        spawnParticles(br.x + br.w / 2, br.y + br.h / 2, br.color);
        bricks.splice(i, 1);
      } else {
        score += 5;
      }
      break;
    }

    // Fell below
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) {
        state = "gameOver";
      } else {
        resetBall();
      }
      return false;
    }

    if (bricks.length === 0) {
      state = "levelClear";
      messageTimer = 0.8;
      return false;
    }
    return true;
  }

  function update(dt) {
    // Particles always animate
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
    if (messageTimer > 0) messageTimer -= dt;

    if (state === "paused" || state === "title") return;

    if (state === "serve" || state === "play" ) updatePaddle(dt);

    if (state === "serve") {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
    } else if (state === "play") {
      // Sub-step to avoid tunneling
      const dist = ball.speed * dt;
      const steps = Math.max(1, Math.ceil(dist / (ball.r * 0.5)));
      const sdt = dt / steps;
      for (let s = 0; s < steps; s++) {
        if (!stepBall(sdt)) break;
      }
    }
  }

  // ---- Rendering ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "#e8ecff";
    ctx.font = "bold 20px 'Segoe UI', Arial, sans-serif";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 20, 30);
    ctx.textAlign = "center";
    ctx.fillText(LEVELS[Math.min(levelIndex, LEVELS.length - 1)].name + " / " + LEVELS.length, W / 2, 30);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 20 - START_LIVES * 22, 30);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 20 - (START_LIVES - 1 - i) * 22 - 8, 30, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5a7a" : "#3a3f63";
      ctx.fill();
    }
    ctx.strokeStyle = "#2a3058";
    ctx.beginPath();
    ctx.moveTo(0, 55); ctx.lineTo(W, 55);
    ctx.stroke();
  }

  function drawBricks() {
    for (const b of bricks) {
      ctx.globalAlpha = 0.45 + 0.55 * (b.hp / b.maxHp);
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
      if (b.maxHp > 1) {
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.font = "bold 14px 'Segoe UI', Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
    }
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, "#9fb4ff");
    g.addColorStop(1, "#4a63d8");
    ctx.fillStyle = g;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ff3030";
    ctx.shadowColor = "#ff8080";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function overlay(title, sub, sub2) {
    ctx.fillStyle = "rgba(8,10,20,0.7)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 52px 'Segoe UI', Arial, sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 40);
    ctx.font = "22px 'Segoe UI', Arial, sans-serif";
    ctx.fillStyle = "#c9d0ff";
    if (sub) ctx.fillText(sub, W / 2, H / 2 + 15);
    if (sub2) ctx.fillText(sub2, W / 2, H / 2 + 50);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawHUD();
    drawBricks();
    drawParticles();
    drawPaddle();
    if (state !== "title") drawBall();

    switch (state) {
      case "title":
        overlay("BRICK BREAKER", "Press Space or click to start", "Arrows / A-D or mouse to move");
        break;
      case "serve":
        ctx.textAlign = "center";
        ctx.fillStyle = "#c9d0ff";
        ctx.font = "20px 'Segoe UI', Arial, sans-serif";
        ctx.fillText("Press Space or click to launch", W / 2, H / 2 + 60);
        break;
      case "paused":
        overlay("PAUSED", "Press P / Esc, Space or click to resume");
        break;
      case "levelClear":
        overlay(LEVELS[levelIndex].name + " cleared!", "Score: " + score,
          messageTimer <= 0 ? "Press Space or click for the next level" : "");
        break;
      case "gameOver":
        overlay("GAME OVER", "Final score: " + score, "Press Space or click to play again");
        break;
      case "win":
        overlay("YOU WIN!", "All levels cleared — final score: " + score, "Press Space or click to play again");
        break;
    }
  }

  // ---- Main loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  buildLevel(0);
  resetBall();
  state = "title";
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
