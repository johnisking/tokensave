<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d1021;
    color: #e8ecff;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #wrap { text-align: center; }
  canvas {
    display: block;
    background: linear-gradient(#161a36, #0b0e1f);
    border: 2px solid #3a4280;
    border-radius: 8px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
    touch-action: none;
  }
  #help { margin-top: 8px; font-size: 14px; color: #9aa3d6; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <div id="help">Mouse or ←/→ (A/D) to move · Click or Space to launch · P to pause · Enter/click to restart</div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---------- Config ----------
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 520;
  const BALL_R = 8;
  const BRICK_COLS = 10, BRICK_W = 70, BRICK_H = 22, BRICK_GAP = 6;
  const BRICK_OFFSET_X = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;
  const BRICK_OFFSET_Y = 70;
  const START_LIVES = 3;

  // Level layouts: '.' = empty, '1' = 1-hit, '2' = 2-hit, '3' = 3-hit
  const LEVELS = [
    {
      speed: 380,
      map: [
        '1111111111',
        '1111111111',
        '2222222222',
        '1111111111',
        '1111111111',
      ],
    },
    {
      speed: 460,
      map: [
        '3..3333..3',
        '2222222222',
        '2.2.22.2.2',
        '1111111111',
        '.11111111.',
        '..111111..',
      ],
    },
  ];

  const COLORS = {
    1: ['#4fd1c5', '#38b2ac'],
    2: ['#f6ad55', '#dd6b20'],
    3: ['#fc8181', '#c53030'],
  };

  // ---------- State ----------
  let state; // 'ready' | 'playing' | 'paused' | 'levelclear' | 'gameover' | 'win'
  let score, lives, levelIndex, bricks, paddle, ball, particles, stateTimer;
  const keys = { left: false, right: false };
  let mouseX = null;

  function newGame() {
    score = 0;
    lives = START_LIVES;
    levelIndex = 0;
    loadLevel();
  }

  function loadLevel() {
    const lvl = LEVELS[levelIndex];
    bricks = [];
    lvl.map.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === '.') return;
        const hp = parseInt(ch, 10);
        bricks.push({
          x: BRICK_OFFSET_X + c * (BRICK_W + BRICK_GAP),
          y: BRICK_OFFSET_Y + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H, hp, maxHp: hp, alive: true,
        });
      });
    });
    paddle = { x: W / 2 - PADDLE_W / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
    particles = [];
    resetBall();
  }

  function resetBall() {
    ball = { x: paddle.x + paddle.w / 2, y: paddle.y - BALL_R - 1, vx: 0, vy: 0, stuck: true };
    state = 'ready';
  }

  function launch() {
    if (!ball.stuck) return;
    const speed = LEVELS[levelIndex].speed;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    ball.stuck = false;
    state = 'playing';
  }

  // Primary action: launch / restart / continue
  function action() {
    if (state === 'ready') launch();
    else if (state === 'gameover' || state === 'win') newGame();
    else if (state === 'paused') state = 'playing';
  }

  function togglePause() {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }

  // ---------- Input ----------
  document.addEventListener('keydown', (e) => {
    switch (e.code) {
      case 'ArrowLeft': case 'KeyA': keys.left = true; mouseX = null; e.preventDefault(); break;
      case 'ArrowRight': case 'KeyD': keys.right = true; mouseX = null; e.preventDefault(); break;
      case 'Space': action(); e.preventDefault(); break;
      case 'Enter': if (state === 'gameover' || state === 'win') newGame(); else action(); break;
      case 'KeyP': case 'Escape': togglePause(); break;
    }
  });
  document.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener('mousemove', (e) => { mouseX = canvasX(e.clientX); });
  canvas.addEventListener('mousedown', (e) => { mouseX = canvasX(e.clientX); action(); });
  canvas.addEventListener('touchstart', (e) => { mouseX = canvasX(e.touches[0].clientX); action(); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { mouseX = canvasX(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  window.addEventListener('blur', () => { keys.left = keys.right = false; if (state === 'playing') state = 'paused'; });

  // ---------- Update ----------
  function update(dt) {
    updateParticles(dt);

    if (state === 'levelclear') {
      stateTimer -= dt;
      if (stateTimer <= 0) { levelIndex++; loadLevel(); }
      return;
    }
    if (state !== 'playing' && state !== 'ready') return;

    // Paddle movement
    if (keys.left) paddle.x -= PADDLE_SPEED * dt;
    if (keys.right) paddle.x += PADDLE_SPEED * dt;
    if (mouseX !== null && !keys.left && !keys.right) paddle.x = mouseX - paddle.w / 2;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - BALL_R - 1;
      return;
    }

    // Sub-step to avoid tunnelling
    const speed = Math.hypot(ball.vx, ball.vy);
    const steps = Math.max(1, Math.ceil((speed * dt) / (BALL_R * 0.75)));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (stepBall(sdt)) break;
    }
  }

  // Returns true if the ball step should stop (life lost / level cleared)
  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    // Bottom - lose a life
    if (ball.y - BALL_R > H) {
      lives--;
      if (lives <= 0) { lives = 0; state = 'gameover'; }
      else resetBall();
      return true;
    }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + BALL_R >= paddle.y && ball.y - BALL_R <= paddle.y + paddle.h &&
        ball.x + BALL_R >= paddle.x && ball.x - BALL_R <= paddle.x + paddle.w) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const clamped = Math.max(-1, Math.min(1, hit));
      const maxAngle = Math.PI / 3; // 60 degrees from vertical
      const angle = clamped * maxAngle;
      const speed = Math.hypot(ball.vx, ball.vy);
      ball.vx = Math.sin(angle) * speed;
      ball.vy = -Math.cos(angle) * speed;
      ball.y = paddle.y - BALL_R - 0.5;
    }

    // Bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > BALL_R * BALL_R) continue;

      // Determine bounce axis by smallest penetration
      const overlapL = ball.x + BALL_R - b.x;
      const overlapR = b.x + b.w - (ball.x - BALL_R);
      const overlapT = ball.y + BALL_R - b.y;
      const overlapB = b.y + b.h - (ball.y - BALL_R);
      const minX = Math.min(overlapL, overlapR);
      const minY = Math.min(overlapT, overlapB);
      if (minX < minY) {
        if (overlapL < overlapR) { ball.x = b.x - BALL_R; ball.vx = -Math.abs(ball.vx); }
        else { ball.x = b.x + b.w + BALL_R; ball.vx = Math.abs(ball.vx); }
      } else {
        if (overlapT < overlapB) { ball.y = b.y - BALL_R; ball.vy = -Math.abs(ball.vy); }
        else { ball.y = b.y + b.h + BALL_R; ball.vy = Math.abs(ball.vy); }
      }

      b.hp--;
      score += 10;
      if (b.hp <= 0) {
        b.alive = false;
        score += 10 * b.maxHp;
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, COLORS[b.maxHp][0]);
      }

      // Slight speed-up per hit, capped
      const sp = Math.hypot(ball.vx, ball.vy);
      const target = Math.min(sp * 1.01, LEVELS[levelIndex].speed * 1.6);
      ball.vx *= target / sp; ball.vy *= target / sp;

      // Prevent near-horizontal loops
      const minVy = target * 0.25;
      if (Math.abs(ball.vy) < minVy) {
        ball.vy = Math.sign(ball.vy || -1) * minVy;
        ball.vx = Math.sign(ball.vx || 1) * Math.sqrt(target * target - minVy * minVy);
      }

      if (bricks.every(br => !br.alive)) {
        score += lives * 100;
        if (levelIndex < LEVELS.length - 1) { state = 'levelclear'; stateTimer = 2; }
        else state = 'win';
        return true;
      }
      break; // one brick per sub-step
    }
    return false;
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }
  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  // ---------- Render ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // HUD
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(0, 0, W, 44);
    ctx.font = 'bold 20px "Segoe UI", Arial, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e8ecff';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 16, 22);
    ctx.textAlign = 'center';
    ctx.fillText('Level ' + (levelIndex + 1) + ' / ' + LEVELS.length, W / 2, 22);
    ctx.textAlign = 'right';
    ctx.fillText('Lives:', W - 16 - START_LIVES * 22, 22);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (START_LIVES - 1 - i) * 22 - 8, 22, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? '#ff5d8f' : 'rgba(255,255,255,0.15)';
      ctx.fill();
    }

    // Bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      const [c1, c2] = COLORS[b.hp];
      const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
      g.addColorStop(0, c1); g.addColorStop(1, c2);
      ctx.fillStyle = g;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      if (b.maxHp > 1) {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.font = 'bold 13px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
    }

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Paddle
    const pg = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    pg.addColorStop(0, '#a3bffa'); pg.addColorStop(1, '#5a67d8');
    ctx.fillStyle = pg;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();

    // Ball
    if (state !== 'gameover') {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = '#ff3b3b';
      ctx.shadowColor = '#ff7070'; ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Overlays
    if (state === 'ready') {
      message('Level ' + (levelIndex + 1), 'Click or press Space to launch');
    } else if (state === 'paused') {
      overlay(); message('Paused', 'Press P or click to resume');
    } else if (state === 'levelclear') {
      overlay(); message('Level ' + (levelIndex + 1) + ' Cleared!', 'Get ready for level ' + (levelIndex + 2) + '...');
    } else if (state === 'gameover') {
      overlay(); message('Game Over', 'Final score: ' + score + '  ·  Click or press Enter to play again');
    } else if (state === 'win') {
      overlay(); message('You Win!', 'Final score: ' + score + '  ·  Click or press Enter to play again');
    }
  }

  function overlay() {
    ctx.fillStyle = 'rgba(5,7,20,0.65)';
    ctx.fillRect(0, 0, W, H);
  }
  function message(title, sub) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 44px "Segoe UI", Arial, sans-serif';
    ctx.fillText(title, W / 2, H / 2 + 40);
    ctx.font = '18px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = '#c3cbf5';
    ctx.fillText(sub, W / 2, H / 2 + 84);
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
