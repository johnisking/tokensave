<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0e1a; color: #e8ecff;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  canvas {
    background: linear-gradient(#141a33, #0d1124);
    border: 2px solid #2c3766; border-radius: 6px;
    box-shadow: 0 0 30px rgba(80, 120, 255, 0.25);
    max-width: 96vw; max-height: 88vh;
    touch-action: none; cursor: none;
  }
  #help { font-size: 13px; color: #8a93c0; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <div id="help">Arrows / A-D or mouse/touch: move &nbsp;|&nbsp; Space / click: launch &amp; start &nbsp;|&nbsp; P: pause</div>
</div>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;

  // ---------- Config ----------
  var HUD_H = 40;
  var PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 620;
  var BALL_R = 7;
  var MAX_STEP = 3; // max px per collision substep (well below ball radius)
  var START_LIVES = 3;

  var BRICK_COLS = 10;
  var BRICK_GAP = 6;
  var BRICK_MARGIN_X = 30;
  var BRICK_TOP = HUD_H + 40;
  var BRICK_H = 22;
  var BRICK_W = (W - BRICK_MARGIN_X * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;

  // Layout legend: '.' = empty, '1' = 1-hit brick, '2' = 2-hit brick, '3' = 3-hit brick
  var LEVELS = [
    {
      name: "Level 1",
      ballSpeed: 380,
      colors: ["#ff5c7a", "#ff9f43", "#feca57", "#1dd1a1", "#54a0ff", "#a29bfe"],
      layout: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111"
      ]
    },
    {
      name: "Level 2",
      ballSpeed: 450,
      colors: ["#00d2d3", "#5f27cd", "#ee5253", "#10ac84", "#f368e0", "#ff9ff3", "#48dbfb"],
      layout: [
        "3.3.33.3.3",
        "2222222222",
        ".22.11.22.",
        "1111111111",
        "2.1.22.1.2",
        ".11111111.",
        "22......22"
      ]
    }
  ];

  // ---------- State ----------
  // states: start, serve, play, paused, levelclear, gameover, win
  var state = "start";
  var score = 0, lives = START_LIVES, levelIndex = 0;
  var bricks = [];
  var transitionTimer = 0;
  var particles = [];

  var paddle = { x: W / 2 - PADDLE_W / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
  var ball = { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R, speed: 380 };

  var keys = { left: false, right: false };
  var mouseTargetX = null; // paddle center target from mouse/touch

  // ---------- Level setup ----------
  function loadLevel(i) {
    levelIndex = i;
    var lvl = LEVELS[i];
    bricks = [];
    for (var r = 0; r < lvl.layout.length; r++) {
      var row = lvl.layout[r];
      for (var c = 0; c < BRICK_COLS; c++) {
        var ch = row.charAt(c);
        if (ch === "." || ch === "") continue;
        var hp = parseInt(ch, 10);
        bricks.push({
          x: BRICK_MARGIN_X + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H,
          hp: hp, maxHp: hp,
          color: lvl.colors[r % lvl.colors.length],
          alive: true
        });
      }
    }
    ball.speed = lvl.ballSpeed;
    resetBall();
  }

  function resetBall() {
    paddle.w = PADDLE_W;
    ball.vx = 0; ball.vy = 0;
    stickBall();
    state = "serve";
  }

  function stickBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launchBall() {
    if (state !== "serve") return;
    // slight random angle, upward
    var angle = (Math.random() * 0.5 - 0.25); // radians from vertical
    ball.vx = ball.speed * Math.sin(angle);
    ball.vy = -ball.speed * Math.cos(angle);
    state = "play";
  }

  function newGame() {
    score = 0;
    lives = START_LIVES;
    particles = [];
    loadLevel(0);
  }

  // Primary action: Space / click / tap
  function primaryAction() {
    if (state === "start" || state === "gameover" || state === "win") {
      newGame();
    } else if (state === "serve") {
      launchBall();
    } else if (state === "paused") {
      state = "play";
    }
  }

  function togglePause() {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }

  // ---------- Input ----------
  window.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; mouseTargetX = null; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; mouseTargetX = null; e.preventDefault(); }
    else if (k === " " || k === "Spacebar" || e.code === "Space") {
      e.preventDefault();
      if (!e.repeat) primaryAction();
    }
    else if (k === "p" || k === "P") { if (!e.repeat) togglePause(); }
  });
  window.addEventListener("keyup", function (e) {
    var k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });
  window.addEventListener("blur", function () {
    keys.left = keys.right = false;
    if (state === "play") state = "paused";
  });

  function canvasX(clientX) {
    var rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }

  canvas.addEventListener("mousemove", function (e) {
    mouseTargetX = canvasX(e.clientX);
  });
  canvas.addEventListener("mousedown", function (e) {
    e.preventDefault();
    mouseTargetX = canvasX(e.clientX);
    primaryAction();
  });
  canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    if (e.touches.length > 0) mouseTargetX = canvasX(e.touches[0].clientX);
    primaryAction();
  }, { passive: false });
  canvas.addEventListener("touchmove", function (e) {
    e.preventDefault();
    if (e.touches.length > 0) mouseTargetX = canvasX(e.touches[0].clientX);
  }, { passive: false });

  // ---------- Update ----------
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function updatePaddle(dt) {
    var dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir !== 0) {
      paddle.x += dir * PADDLE_SPEED * dt;
    } else if (mouseTargetX !== null) {
      paddle.x = mouseTargetX - paddle.w / 2;
    }
    paddle.x = clamp(paddle.x, 0, W - paddle.w);
  }

  function spawnParticles(x, y, color) {
    for (var i = 0; i < 10; i++) {
      var a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160;
      particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.3, color: color });
    }
  }

  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += 400 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  // Keep a minimum vertical component so the ball never goes near-horizontal forever
  function normalizeBallVelocity() {
    var sp = ball.speed;
    var minVy = sp * 0.25;
    if (Math.abs(ball.vy) < minVy) {
      ball.vy = (ball.vy < 0 ? -1 : 1) * minVy;
    }
    var len = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy) || 1;
    ball.vx = ball.vx / len * sp;
    ball.vy = ball.vy / len * sp;
  }

  // Circle-rect overlap test
  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    var nx = clamp(cx, rx, rx + rw);
    var ny = clamp(cy, ry, ry + rh);
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function hitBrick(b) {
    b.hp--;
    if (b.hp <= 0) {
      b.alive = false;
      score += 10 * b.maxHp;
      spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);
    } else {
      score += 5;
    }
  }

  // One substep of ball movement + collisions. Returns false if ball was lost.
  function stepBall(dt) {
    var px = ball.x, py = ball.y;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    var r = ball.r;

    // Walls
    if (ball.x - r < 0) { ball.x = r; ball.vx = Math.abs(ball.vx); }
    else if (ball.x + r > W) { ball.x = W - r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - r < HUD_H) { ball.y = HUD_H + r; ball.vy = Math.abs(ball.vy); }

    // Paddle (only when moving downward)
    if (ball.vy > 0 && circleRect(ball.x, ball.y, r, paddle.x, paddle.y, paddle.w, paddle.h) &&
        py <= paddle.y + paddle.h / 2) {
      var center = paddle.x + paddle.w / 2;
      var hit = clamp((ball.x - center) / (paddle.w / 2 + r), -1, 1);
      var maxAngle = Math.PI / 3; // 60 degrees from vertical
      var angle = hit * maxAngle;
      ball.vx = ball.speed * Math.sin(angle);
      ball.vy = -ball.speed * Math.cos(angle);
      ball.y = paddle.y - r - 0.01;
    }

    // Bricks: resolve at most one brick per substep (closest to previous pos)
    var best = null, bestD = Infinity;
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (circleRect(ball.x, ball.y, r, b.x, b.y, b.w, b.h)) {
        var bx = b.x + b.w / 2, by = b.y + b.h / 2;
        var d = (bx - px) * (bx - px) + (by - py) * (by - py);
        if (d < bestD) { bestD = d; best = b; }
      }
    }
    if (best) {
      var b2 = best;
      // Determine reflection axis from where the ball was before this substep
      var wasLeft = px < b2.x, wasRight = px > b2.x + b2.w;
      var wasAbove = py < b2.y, wasBelow = py > b2.y + b2.h;
      var horiz = wasLeft || wasRight;
      var vert = wasAbove || wasBelow;
      if (horiz && vert) {
        // Corner approach: pick axis with smaller penetration
        var penX = wasLeft ? (ball.x + r - b2.x) : (b2.x + b2.w - (ball.x - r));
        var penY = wasAbove ? (ball.y + r - b2.y) : (b2.y + b2.h - (ball.y - r));
        if (penX < penY) vert = false; else horiz = false;
      } else if (!horiz && !vert) {
        // Center was inside the rect (shouldn't happen with small substeps): use velocity
        if (Math.abs(ball.vx) > Math.abs(ball.vy)) { horiz = true; wasLeft = ball.vx > 0; wasRight = !wasLeft; }
        else { vert = true; wasAbove = ball.vy > 0; wasBelow = !wasAbove; }
      }
      if (horiz) {
        if (wasLeft) { ball.vx = -Math.abs(ball.vx); ball.x = b2.x - r - 0.01; }
        else { ball.vx = Math.abs(ball.vx); ball.x = b2.x + b2.w + r + 0.01; }
      } else {
        if (wasAbove) { ball.vy = -Math.abs(ball.vy); ball.y = b2.y - r - 0.01; }
        else { ball.vy = Math.abs(ball.vy); ball.y = b2.y + b2.h + r + 0.01; }
      }
      hitBrick(b2);
      normalizeBallVelocity();
    }

    // Lost ball
    if (ball.y - r > H) return false;
    return true;
  }

  function aliveCount() {
    var n = 0;
    for (var i = 0; i < bricks.length; i++) if (bricks[i].alive) n++;
    return n;
  }

  function updateBall(dt) {
    var dist = ball.speed * dt;
    var steps = Math.max(1, Math.ceil(dist / MAX_STEP));
    var sdt = dt / steps;
    for (var s = 0; s < steps; s++) {
      if (!stepBall(sdt)) {
        lives--;
        if (lives <= 0) {
          lives = 0;
          state = "gameover";
        } else {
          resetBall();
        }
        return;
      }
      if (aliveCount() === 0) {
        if (levelIndex < LEVELS.length - 1) {
          state = "levelclear";
          transitionTimer = 1.8;
        } else {
          state = "win";
        }
        return;
      }
    }
  }

  function update(dt) {
    updateParticles(dt);
    if (state === "paused" || state === "start") return;
    if (state === "levelclear") {
      transitionTimer -= dt;
      if (transitionTimer <= 0) loadLevel(levelIndex + 1);
      return;
    }
    if (state === "gameover" || state === "win") return;
    updatePaddle(dt);
    if (state === "serve") {
      stickBall();
    } else if (state === "play") {
      updateBall(dt);
    }
  }

  // ---------- Render ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "rgba(10, 14, 30, 0.9)";
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.strokeStyle = "#2c3766";
    ctx.beginPath(); ctx.moveTo(0, HUD_H + 0.5); ctx.lineTo(W, HUD_H + 0.5); ctx.stroke();

    ctx.font = "bold 18px Segoe UI, Arial, sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#e8ecff";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, HUD_H / 2);
    ctx.textAlign = "center";
    ctx.fillText("Level " + (levelIndex + 1) + " / " + LEVELS.length, W / 2, HUD_H / 2);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 16 - START_LIVES * 20, HUD_H / 2);
    for (var i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (START_LIVES - 1 - i) * 20 - 7, HUD_H / 2, 6, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5c7a" : "#3a4170";
      ctx.fill();
    }
  }

  function shade(hex, f) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.round(clamp(r * f, 0, 255)); g = Math.round(clamp(g * f, 0, 255)); b = Math.round(clamp(b * f, 0, 255));
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function drawBricks() {
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      var f = b.maxHp > 1 ? 0.45 + 0.55 * (b.hp / b.maxHp) : 1;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = shade(b.color, f);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
      if (b.maxHp > 1) {
        ctx.strokeStyle = "rgba(255,255,255,0.7)";
        ctx.lineWidth = 1.5;
        roundRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2, 4);
        ctx.stroke();
        ctx.lineWidth = 1;
        ctx.fillStyle = "#fff";
        ctx.font = "bold 12px Segoe UI, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(b.hp), b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
    }
  }

  function drawPaddle() {
    var g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, "#9fb4ff");
    g.addColorStop(1, "#4b63d8");
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#9fd0ff";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = clamp(p.life / 0.6, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function overlay(title, lines, titleColor) {
    ctx.fillStyle = "rgba(5, 8, 20, 0.75)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = titleColor || "#ffffff";
    ctx.font = "bold 52px Segoe UI, Arial, sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 40 - lines.length * 12);
    ctx.fillStyle = "#c9d1ff";
    ctx.font = "20px Segoe UI, Arial, sans-serif";
    for (var i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], W / 2, H / 2 + 10 - lines.length * 12 + i * 30);
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    if (state !== "start") {
      drawBricks();
      drawParticles();
      drawPaddle();
      drawBall();
    }
    drawHUD();

    if (state === "start") {
      overlay("BRICK BREAKER", [
        "Move: Left/Right arrows, A/D, or the mouse / touch",
        "Launch ball: Space or click / tap",
        "Pause: P",
        "Clear 2 levels. You have 3 lives.",
        "",
        "Press Space or click to start"
      ], "#7fd1ff");
    } else if (state === "serve") {
      ctx.fillStyle = "rgba(232,236,255,0.85)";
      ctx.font = "18px Segoe UI, Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Press Space or click to launch", W / 2, H / 2 + 80);
    } else if (state === "paused") {
      overlay("PAUSED", ["Press P (or Space / click) to resume"]);
    } else if (state === "levelclear") {
      overlay("LEVEL " + (levelIndex + 1) + " CLEAR!", ["Score: " + score, "Get ready for Level " + (levelIndex + 2) + "..."], "#1dd1a1");
    } else if (state === "gameover") {
      overlay("GAME OVER", ["Final score: " + score, "Press Space or click to restart"], "#ff5c7a");
    } else if (state === "win") {
      overlay("YOU WIN!", ["Final score: " + score, "Lives left: " + lives, "Press Space or click to play again"], "#feca57");
    }
  }

  // ---------- Main loop ----------
  var last = null;
  function frame(t) {
    if (last === null) last = t;
    var dt = (t - last) / 1000;
    last = t;
    dt = clamp(dt, 0, 1 / 30); // clamp large frame gaps (tab switches etc.)
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // Initial setup for the start screen (bricks loaded so level indicator is valid)
  loadLevel(0);
  state = "start";
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
