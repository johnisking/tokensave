<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0f1020;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif; color: #ddd;
    user-select: none;
  }
  canvas {
    background: linear-gradient(#1a1b3a, #0b0c1c);
    border: 2px solid #3b3d7a; border-radius: 6px;
    max-width: 96vw; max-height: 86vh;
    cursor: none;
  }
  p { margin: 10px 0 0; font-size: 14px; color: #9a9cc8; text-align: center; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p>Move: mouse or ← → / A D &nbsp;|&nbsp; Launch / continue: click or Space &nbsp;|&nbsp; Pause: P or Esc</p>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---------- Level definitions ----------
  // '1' = normal brick (1 hit), '2' = strong brick (2 hits), '.' = empty
  const LEVELS = [
    {
      ballSpeed: 360,
      rows: [
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
      ],
    },
    {
      ballSpeed: 420,
      rows: [
        '2222222222',
        '2111111112',
        '21.1221.12',
        '21.1221.12',
        '2111111112',
        '1111111111',
        '.1.1..1.1.',
      ],
    },
  ];
  const ROW_COLORS = ['#ff5c7a', '#ff9f43', '#feca57', '#1dd1a1', '#54a0ff', '#a29bfe', '#ff6bcb'];
  const COLS = 10, BRICK_GAP = 6, BRICK_H = 24, BRICK_TOP = 70, SIDE = 30;
  const BRICK_W = (W - SIDE * 2 - BRICK_GAP * (COLS - 1)) / COLS;

  // ---------- Game state ----------
  const paddle = { w: 110, h: 14, x: (W - 110) / 2, y: H - 40, speed: 560 };
  const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0, speed: 360 };
  let bricks = [];
  let score = 0, lives = 3, levelIndex = 0;
  let state = 'serve'; // serve | play | paused | levelclear | gameover | win
  const keys = { left: false, right: false };

  function loadLevel(i) {
    levelIndex = i;
    bricks = [];
    LEVELS[i].rows.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === '.') return;
        const hp = Number(ch);
        bricks.push({
          x: SIDE + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H,
          hp, maxHp: hp,
          color: ROW_COLORS[r % ROW_COLORS.length],
        });
      });
    });
    resetBall();
  }

  function resetBall() {
    ball.speed = LEVELS[levelIndex].ballSpeed;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
    state = 'serve';
    stickBall();
  }

  function stickBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launch() {
    const angle = (Math.random() * 0.6 - 0.3); // radians off vertical
    ball.vx = ball.speed * Math.sin(angle);
    ball.vy = -ball.speed * Math.cos(angle);
    state = 'play';
  }

  function newGame() {
    score = 0; lives = 3;
    loadLevel(0);
  }

  // Primary action (Space / Enter / click)
  function action() {
    switch (state) {
      case 'serve': launch(); break;
      case 'paused': state = 'play'; break;
      case 'levelclear': loadLevel(levelIndex + 1); break;
      case 'gameover':
      case 'win': newGame(); break;
    }
  }

  function togglePause() {
    if (state === 'play') state = 'paused';
    else if (state === 'paused') state = 'play';
  }

  // ---------- Input ----------
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
    else if (k === ' ' || k === 'Enter') { if (!e.repeat) action(); e.preventDefault(); }
    else if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); e.preventDefault(); }
  });
  document.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });
  window.addEventListener('blur', () => {
    keys.left = keys.right = false;
    if (state === 'play') state = 'paused';
  });

  canvas.addEventListener('mousemove', e => {
    if (state === 'paused') return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
  });
  canvas.addEventListener('mousedown', e => { e.preventDefault(); action(); });

  // ---------- Update ----------
  function update(dt) {
    if (state === 'paused' || state === 'gameover' || state === 'win' || state === 'levelclear') return;

    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x + dir * paddle.speed * dt));

    if (state === 'serve') { stickBall(); return; }

    // Sub-step movement to avoid tunnelling through bricks
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / (ball.r * 0.5)));
    const sdt = dt / steps;
    for (let i = 0; i < steps && state === 'play'; i++) step(sdt);
  }

  function step(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // Bottom: lose a life
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) { lives = 0; state = 'gameover'; }
      else resetBall();
      return;
    }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x + ball.r >= paddle.x && ball.x - ball.r <= paddle.x + paddle.w) {
      const hit = Math.max(-1, Math.min(1, (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2)));
      const angle = hit * (Math.PI / 3); // up to 60° from vertical
      ball.speed = Math.min(ball.speed * 1.01, LEVELS[levelIndex].ballSpeed * 1.35);
      ball.vx = ball.speed * Math.sin(angle);
      ball.vy = -ball.speed * Math.cos(angle);
      ball.y = paddle.y - ball.r;
    }

    // Bricks (one collision per sub-step)
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > ball.r * ball.r) continue;

      const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
      const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
      if (overlapX < overlapY) {
        ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      } else {
        ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      }

      b.hp--;
      if (b.hp <= 0) score += b.maxHp === 2 ? 30 : 10;
      else score += 5;

      if (bricks.every(br => br.hp <= 0)) {
        state = levelIndex < LEVELS.length - 1 ? 'levelclear' : 'win';
      }
      break;
    }
  }

  // ---------- Render ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHeart(x, y, s, filled) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.3);
    ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
    ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
    ctx.fillStyle = filled ? '#ff5c7a' : 'rgba(255,255,255,0.15)';
    ctx.fill();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    // HUD
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(0, 0, W, 44);
    ctx.font = 'bold 20px "Segoe UI", Arial';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText(`Score: ${score}`, 16, 22);
    ctx.textAlign = 'center';
    ctx.fillText(`Level ${levelIndex + 1} / ${LEVELS.length}`, W / 2, 22);
    ctx.textAlign = 'right';
    ctx.fillText('Lives:', W - 100, 22);
    for (let i = 0; i < 3; i++) drawHeart(W - 80 + i * 26, 12, 20, i < lives);

    // Bricks
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.hp < b.maxHp ? 0.55 : 1;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.maxHp === 2) {
        ctx.lineWidth = 3;
        ctx.strokeStyle = b.hp === 2 ? '#ffffff' : 'rgba(255,255,255,0.4)';
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(b.x + 4, b.y + 3, b.w - 8, 4);
    }

    // Paddle
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, '#9fe8ff');
    g.addColorStop(1, '#3a8dde');
    ctx.fillStyle = g;
    ctx.fill();

    // Ball
    if (state !== 'gameover') {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#9fe8ff';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Overlays
    if (state === 'serve') {
      message(null, 'Click or press Space to launch');
    } else if (state === 'paused') {
      message('Paused', 'Press P / Esc / Space or click to resume');
    } else if (state === 'levelclear') {
      message(`Level ${levelIndex + 1} cleared!`, 'Click or press Space for the next level');
    } else if (state === 'gameover') {
      message('Game Over', `Final score: ${score} — click or press Space to play again`);
    } else if (state === 'win') {
      message('You Win!', `Final score: ${score} — click or press Space to play again`);
    }
  }

  function message(title, sub) {
    if (title) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 48px "Segoe UI", Arial';
      ctx.fillText(title, W / 2, H / 2 - 20);
    }
    ctx.textAlign = 'center';
    ctx.font = '20px "Segoe UI", Arial';
    ctx.fillStyle = '#cfd2ff';
    ctx.fillText(sub, W / 2, title ? H / 2 + 30 : H / 2 + 80);
  }

  // ---------- Main loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
