<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1220; color: #e8ecff; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  canvas { background: #161a2e; border: 2px solid #2e3558; border-radius: 6px; max-width: 96vw; max-height: 86vh; cursor: none; }
  .help { font-size: 13px; opacity: 0.7; text-align: center; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div class="help">Move: Mouse or ←/→ (A/D) &nbsp;|&nbsp; Launch: Click or Space &nbsp;|&nbsp; Pause: P or Esc</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ----- Config -----
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 620;
  const BALL_R = 8;
  const BRICK_COLS = 10, BRICK_W = 70, BRICK_H = 24, BRICK_GAP = 6;
  const BRICK_TOP = 70;
  const BRICK_LEFT = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;
  const START_LIVES = 3;

  // Level layouts: '.' = empty, '1' = normal brick, '2' = tough brick (2 hits)
  const LEVELS = [
    {
      speed: 340,
      map: [
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
      ],
    },
    {
      speed: 410,
      map: [
        '2222222222',
        '2.111111.2',
        '21.2112.12',
        '2111221112',
        '1.2.11.2.1',
        '1111111111',
        '2111111121',
      ],
    },
  ];

  const ROW_COLORS = ['#ff5d73', '#ff9f43', '#feca57', '#1dd1a1', '#54a0ff', '#a29bfe', '#ff6b9a'];

  // ----- State -----
  let state;            // 'ready' | 'playing' | 'paused' | 'levelClear' | 'gameOver' | 'win'
  let score, lives, levelIndex;
  let paddle, ball, bricks;
  let keys = { left: false, right: false };
  let mouseX = null;
  let stateTimer = 0;

  function newGame() {
    score = 0;
    lives = START_LIVES;
    levelIndex = 0;
    loadLevel(levelIndex);
  }

  function loadLevel(i) {
    const lvl = LEVELS[i];
    bricks = [];
    lvl.map.forEach((row, r) => {
      for (let c = 0; c < BRICK_COLS; c++) {
        const ch = row[c];
        if (ch !== '1' && ch !== '2') continue;
        const hp = ch === '2' ? 2 : 1;
        bricks.push({
          x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H,
          hp, maxHp: hp,
          color: ROW_COLORS[r % ROW_COLORS.length],
        });
      }
    });
    paddle = { x: W / 2 - PADDLE_W / 2, w: PADDLE_W };
    resetBall();
  }

  function resetBall() {
    ball = { x: paddle.x + paddle.w / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, stuck: true };
    state = 'ready';
  }

  function launch() {
    if (!ball.stuck) return;
    const speed = LEVELS[levelIndex].speed;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    ball.stuck = false;
    state = 'playing';
  }

  // Primary action (Space / click / Enter) depends on the current state
  function action() {
    if (state === 'ready') launch();
    else if (state === 'paused') state = ball.stuck ? 'ready' : 'playing';
    else if (state === 'gameOver' || state === 'win') newGame();
    else if (state === 'levelClear' && stateTimer <= 0) nextLevel();
  }

  function nextLevel() {
    levelIndex++;
    if (levelIndex >= LEVELS.length) { state = 'win'; return; }
    loadLevel(levelIndex);
  }

  function togglePause() {
    if (state === 'playing' || state === 'ready') {
      state = 'paused';
    } else if (state === 'paused') {
      state = ball.stuck ? 'ready' : 'playing';
    }
  }

  // ----- Input -----
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; mouseX = null; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; mouseX = null; e.preventDefault(); }
    else if (k === ' ' || k === 'Enter') { action(); e.preventDefault(); }
    else if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); e.preventDefault(); }
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });
  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener('mousemove', (e) => { mouseX = canvasX(e.clientX); });
  canvas.addEventListener('mousedown', (e) => { mouseX = canvasX(e.clientX); action(); e.preventDefault(); });
  canvas.addEventListener('touchmove', (e) => { mouseX = canvasX(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchstart', (e) => { mouseX = canvasX(e.touches[0].clientX); action(); e.preventDefault(); }, { passive: false });
  window.addEventListener('blur', () => { keys.left = keys.right = false; if (state === 'playing') togglePause(); });

  // ----- Update -----
  function update(dt) {
    if (state === 'levelClear') {
      stateTimer -= dt;
      return;
    }
    if (state !== 'playing' && state !== 'ready') return;

    // Paddle movement
    if (keys.left) paddle.x -= PADDLE_SPEED * dt;
    if (keys.right) paddle.x += PADDLE_SPEED * dt;
    if (mouseX !== null && !keys.left && !keys.right) paddle.x = mouseX - paddle.w / 2;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = PADDLE_Y - BALL_R - 1;
      return;
    }

    // Sub-step to avoid tunneling
    const speed = Math.hypot(ball.vx, ball.vy);
    const steps = Math.max(1, Math.ceil((speed * dt) / (BALL_R * 0.5)));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (stepBall(sdt)) break;
    }
  }

  // Returns true if the ball's step ended something (life lost / level cleared)
  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    // Bottom: lose a life
    if (ball.y - BALL_R > H) {
      lives--;
      if (lives <= 0) { state = 'gameOver'; }
      else resetBall();
      return true;
    }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + BALL_R >= PADDLE_Y && ball.y - BALL_R <= PADDLE_Y + PADDLE_H &&
        ball.x + BALL_R >= paddle.x && ball.x - BALL_R <= paddle.x + paddle.w) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const clamped = Math.max(-1, Math.min(1, hit));
      const maxAngle = Math.PI / 3; // 60 degrees from vertical
      const angle = clamped * maxAngle;
      const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.01, LEVELS[levelIndex].speed * 1.5);
      ball.vx = Math.sin(angle) * speed;
      ball.vy = -Math.cos(angle) * speed;
      ball.y = PADDLE_Y - BALL_R - 0.5;
    }

    // Bricks (handle the single closest collision per sub-step)
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > BALL_R * BALL_R) continue;

      // Decide bounce axis by penetration depth
      const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + b.w - (ball.x - BALL_R));
      const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + b.h - (ball.y - BALL_R));
      if (overlapX < overlapY) {
        ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      } else {
        ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      }

      b.hp--;
      if (b.hp <= 0) {
        score += b.maxHp === 2 ? 25 : 10;
        bricks.splice(i, 1);
      } else {
        score += 5;
      }

      if (bricks.length === 0) {
        score += 100 * (levelIndex + 1) + lives * 50;
        if (levelIndex + 1 >= LEVELS.length) {
          state = 'win';
        } else {
          state = 'levelClear';
          stateTimer = 0.6;
        }
        return true;
      }
      break;
    }
    return false;
  }

  // ----- Draw -----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // HUD
    ctx.fillStyle = '#e8ecff';
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 20, 30);
    ctx.textAlign = 'center';
    ctx.fillText('Level ' + Math.min(levelIndex + 1, LEVELS.length) + ' / ' + LEVELS.length, W / 2, 30);
    ctx.textAlign = 'right';
    ctx.fillText('Lives:', W - 20 - START_LIVES * 22, 30);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 20 - (START_LIVES - 1 - i) * 22 - 7, 30, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? '#ff5d73' : '#3a4066';
      ctx.fill();
    }
    ctx.strokeStyle = '#2e3558';
    ctx.beginPath(); ctx.moveTo(0, 55); ctx.lineTo(W, 55); ctx.stroke();

    // Bricks
    for (const b of bricks) {
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.hp < b.maxHp ? 0.5 : 1;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.maxHp === 2) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
        ctx.lineWidth = 1;
      }
    }

    // Paddle
    roundRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H, 7);
    ctx.fillStyle = '#c8d6ff';
    ctx.fill();

    // Ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    // Overlays
    if (state === 'ready') {
      message('Level ' + (levelIndex + 1), 'Click or press Space to launch');
    } else if (state === 'paused') {
      overlay();
      message('Paused', 'Press P, Space or click to resume');
    } else if (state === 'levelClear') {
      overlay();
      message('Level ' + (levelIndex + 1) + ' Cleared!', stateTimer <= 0 ? 'Click or press Space for the next level' : '');
    } else if (state === 'gameOver') {
      overlay();
      message('Game Over', 'Final score: ' + score + '  —  Click or press Space to play again');
    } else if (state === 'win') {
      overlay();
      message('You Win!', 'Final score: ' + score + '  —  Click or press Space to play again');
    }
  }

  function overlay() {
    ctx.fillStyle = 'rgba(10, 12, 25, 0.7)';
    ctx.fillRect(0, 0, W, H);
  }

  function message(title, sub) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 44px system-ui, sans-serif';
    ctx.fillText(title, W / 2, H / 2 + 20);
    if (sub) {
      ctx.font = '18px system-ui, sans-serif';
      ctx.fillStyle = '#c8d0f0';
      ctx.fillText(sub, W / 2, H / 2 + 65);
    }
  }

  // ----- Loop -----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
