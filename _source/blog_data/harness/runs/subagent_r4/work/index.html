<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 30%, #1d2340 0%, #0b0e1a 70%);
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    color: #e8ecff;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 22px;
    letter-spacing: 6px;
    font-weight: 600;
    color: #9fb2ff;
    text-transform: uppercase;
  }
  #game {
    display: block;
    background: #10142a;
    border-radius: 10px;
    box-shadow: 0 0 0 2px #2b3566, 0 20px 60px rgba(0,0,0,0.6);
    max-width: 96vw;
    max-height: 84vh;
    cursor: none;
  }
  .hint {
    margin-top: 10px;
    font-size: 13px;
    color: #7c88b8;
  }
</style>
</head>
<body>
<h1>Brick Breaker</h1>
<canvas id="game" width="800" height="600"></canvas>
<div class="hint">Arrows / A-D or Mouse to move &middot; Space / Click to launch &middot; P to pause</div>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = canvas.width;
  var H = canvas.height;

  // ---------- Constants ----------
  var HUD_H = 40;
  var PADDLE_W = 110;
  var PADDLE_H = 14;
  var PADDLE_Y = H - 40;
  var PADDLE_SPEED = 620; // px/s
  var BALL_R = 8;
  var MAX_BOUNCE_ANGLE = Math.PI / 3; // 60 degrees from vertical
  var START_LIVES = 3;

  var BRICK_COLS = 10;
  var BRICK_GAP = 6;
  var BRICK_MARGIN_X = 30;
  var BRICK_TOP = HUD_H + 40;
  var BRICK_H = 22;
  var BRICK_W = (W - BRICK_MARGIN_X * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;

  // Level layouts: each char is a brick: '.' = empty, '1'..'3' = hits required.
  var LEVELS = [
    {
      name: "Level 1",
      ballSpeed: 380,
      layout: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111"
      ]
    },
    {
      name: "Level 2",
      ballSpeed: 470,
      layout: [
        "3333333333",
        "2.222222.2",
        "2212112122",
        "1111111111",
        "1.11..11.1",
        "1111111111",
        "2121212121"
      ]
    }
  ];

  var ROW_COLORS = ["#ff5d73", "#ff9f43", "#feca57", "#1dd1a1", "#48dbfb", "#54a0ff", "#a29bfe"];
  var HIT_COLORS = { 2: "#c8d0e8", 3: "#8a93b8" }; // tint overlay for multi-hit

  // ---------- State ----------
  var state = "start"; // start | ready | playing | paused | levelclear | gameover | win
  var pausedFrom = null;
  var score = 0;
  var lives = START_LIVES;
  var levelIndex = 0;
  var bricks = [];
  var levelClearTimer = 0;

  var paddle = { x: W / 2 - PADDLE_W / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
  var ball = { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R, speed: 0 };

  var keys = { left: false, right: false };

  // ---------- Setup ----------
  function buildLevel(idx) {
    var lvl = LEVELS[idx];
    bricks = [];
    for (var r = 0; r < lvl.layout.length; r++) {
      var row = lvl.layout[r];
      for (var c = 0; c < BRICK_COLS; c++) {
        var ch = row.charAt(c);
        if (ch === "." || ch === "") continue;
        var hits = parseInt(ch, 10);
        if (!(hits > 0)) continue;
        bricks.push({
          x: BRICK_MARGIN_X + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W,
          h: BRICK_H,
          hits: hits,
          maxHits: hits,
          color: ROW_COLORS[r % ROW_COLORS.length],
          alive: true
        });
      }
    }
    ball.speed = lvl.ballSpeed;
  }

  function resetBallOnPaddle() {
    ball.vx = 0;
    ball.vy = 0;
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function newGame() {
    score = 0;
    lives = START_LIVES;
    levelIndex = 0;
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBallOnPaddle();
    state = "ready";
  }

  function launchBall() {
    // Launch slightly angled based on random small offset
    var angle = (Math.random() * 0.5 - 0.25) * MAX_BOUNCE_ANGLE;
    ball.vx = ball.speed * Math.sin(angle);
    ball.vy = -ball.speed * Math.cos(angle);
    state = "playing";
  }

  function remainingBricks() {
    var n = 0;
    for (var i = 0; i < bricks.length; i++) if (bricks[i].alive) n++;
    return n;
  }

  // ---------- Input ----------
  function primaryAction() {
    if (state === "start" || state === "gameover" || state === "win") {
      newGame();
    } else if (state === "ready") {
      launchBall();
    } else if (state === "paused") {
      togglePause();
    }
  }

  function togglePause() {
    if (state === "playing" || state === "ready") {
      pausedFrom = state;
      state = "paused";
    } else if (state === "paused") {
      state = pausedFrom || "playing";
      pausedFrom = null;
    }
  }

  window.addEventListener("keydown", function (e) {
    var k = e.key;
    var code = e.code;
    if (k === "ArrowLeft" || k === "ArrowRight" || k === "ArrowUp" || k === "ArrowDown" || k === " " || code === "Space") {
      e.preventDefault();
    }
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = true;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = true;
    else if (k === " " || code === "Space") {
      if (!e.repeat) primaryAction();
    } else if (k === "p" || k === "P") {
      if (!e.repeat) togglePause();
    }
  });

  window.addEventListener("keyup", function (e) {
    var k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });

  window.addEventListener("blur", function () {
    keys.left = keys.right = false;
    if (state === "playing") togglePause();
  });

  function canvasX(clientX) {
    var rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }

  canvas.addEventListener("mousemove", function (e) {
    if (state === "paused") return;
    setPaddleCenter(canvasX(e.clientX));
  });

  canvas.addEventListener("mousedown", function (e) {
    e.preventDefault();
    if (e.button !== 0) return;
    if (state !== "paused") setPaddleCenter(canvasX(e.clientX));
    primaryAction();
  });

  function setPaddleCenter(cx) {
    paddle.x = cx - paddle.w / 2;
    clampPaddle();
  }

  function clampPaddle() {
    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.w > W) paddle.x = W - paddle.w;
  }

  // ---------- Collision helpers ----------
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // Returns true if collided with a brick (and handled reflection)
  function collideBricks() {
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      var cx = clamp(ball.x, b.x, b.x + b.w);
      var cy = clamp(ball.y, b.y, b.y + b.h);
      var dx = ball.x - cx;
      var dy = ball.y - cy;
      if (dx * dx + dy * dy > ball.r * ball.r) continue;

      // Determine penetration depth on each axis to decide reflection side.
      var overlapLeft = (ball.x + ball.r) - b.x;
      var overlapRight = (b.x + b.w) - (ball.x - ball.r);
      var overlapTop = (ball.y + ball.r) - b.y;
      var overlapBottom = (b.y + b.h) - (ball.y - ball.r);
      var minX = Math.min(overlapLeft, overlapRight);
      var minY = Math.min(overlapTop, overlapBottom);

      if (minX < minY) {
        // Side hit
        if (overlapLeft < overlapRight) {
          ball.x = b.x - ball.r;
          ball.vx = -Math.abs(ball.vx);
        } else {
          ball.x = b.x + b.w + ball.r;
          ball.vx = Math.abs(ball.vx);
        }
      } else {
        if (overlapTop < overlapBottom) {
          ball.y = b.y - ball.r;
          ball.vy = -Math.abs(ball.vy);
        } else {
          ball.y = b.y + b.h + ball.r;
          ball.vy = Math.abs(ball.vy);
        }
      }

      b.hits--;
      if (b.hits <= 0) {
        b.alive = false;
        score += 10 * b.maxHits;
      } else {
        score += 2;
      }
      return true;
    }
    return false;
  }

  function collidePaddle() {
    if (ball.vy <= 0) return false;
    var cx = clamp(ball.x, paddle.x, paddle.x + paddle.w);
    var cy = clamp(ball.y, paddle.y, paddle.y + paddle.h);
    var dx = ball.x - cx;
    var dy = ball.y - cy;
    if (dx * dx + dy * dy > ball.r * ball.r) return false;
    // Only bounce if ball center is above paddle bottom (avoid weird side-catches from below)
    if (ball.y > paddle.y + paddle.h) return false;

    var rel = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
    rel = clamp(rel, -1, 1);
    var angle = rel * MAX_BOUNCE_ANGLE;
    ball.vx = ball.speed * Math.sin(angle);
    ball.vy = -ball.speed * Math.cos(angle);
    ball.y = paddle.y - ball.r - 0.01;
    return true;
  }

  // ---------- Update ----------
  function update(dt) {
    // Paddle keyboard movement (allowed in ready & playing)
    if (state === "playing" || state === "ready") {
      var dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      if (dir !== 0) {
        paddle.x += dir * PADDLE_SPEED * dt;
        clampPaddle();
      }
    }

    if (state === "ready") {
      resetBallOnPaddle();
      return;
    }

    if (state === "levelclear") {
      levelClearTimer -= dt;
      if (levelClearTimer <= 0) {
        levelIndex++;
        buildLevel(levelIndex);
        resetBallOnPaddle();
        state = "ready";
      }
      return;
    }

    if (state !== "playing") return;

    // Sub-step movement to prevent tunneling: max step = r/2
    var dist = ball.speed * dt;
    var steps = Math.max(1, Math.ceil(dist / (ball.r * 0.5)));
    var sdt = dt / steps;

    for (var s = 0; s < steps; s++) {
      ball.x += ball.vx * sdt;
      ball.y += ball.vy * sdt;

      // Walls
      if (ball.x - ball.r < 0) {
        ball.x = ball.r;
        ball.vx = Math.abs(ball.vx);
      } else if (ball.x + ball.r > W) {
        ball.x = W - ball.r;
        ball.vx = -Math.abs(ball.vx);
      }
      if (ball.y - ball.r < HUD_H) {
        ball.y = HUD_H + ball.r;
        ball.vy = Math.abs(ball.vy);
      }

      collidePaddle();

      if (collideBricks()) {
        if (remainingBricks() === 0) {
          if (levelIndex < LEVELS.length - 1) {
            state = "levelclear";
            levelClearTimer = 1.6;
          } else {
            state = "win";
          }
          return;
        }
      }

      // Lost ball
      if (ball.y - ball.r > H) {
        lives--;
        if (lives <= 0) {
          lives = 0;
          state = "gameover";
        } else {
          resetBallOnPaddle();
          state = "ready";
        }
        return;
      }
    }
  }

  // ---------- Render ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "#171c38";
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.fillStyle = "#2b3566";
    ctx.fillRect(0, HUD_H - 2, W, 2);

    ctx.font = "bold 18px 'Segoe UI', Helvetica, Arial, sans-serif";
    ctx.textBaseline = "middle";

    ctx.textAlign = "left";
    ctx.fillStyle = "#e8ecff";
    ctx.fillText("Score: " + score, 16, HUD_H / 2);

    ctx.textAlign = "center";
    ctx.fillStyle = "#9fb2ff";
    ctx.fillText("Level " + (levelIndex + 1) + " / " + LEVELS.length, W / 2, HUD_H / 2);

    ctx.textAlign = "right";
    ctx.fillStyle = "#e8ecff";
    ctx.fillText("Lives:", W - 16 - START_LIVES * 22, HUD_H / 2);
    for (var i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (START_LIVES - 1 - i) * 22 - 8, HUD_H / 2, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5d73" : "#3a4170";
      ctx.fill();
    }
  }

  function drawBricks() {
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = b.color;
      ctx.fill();
      if (b.hits > 1) {
        ctx.fillStyle = HIT_COLORS[b.hits] || "#8a93b8";
        ctx.globalAlpha = 0.55;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = "#10142a";
        ctx.font = "bold 13px 'Segoe UI', Helvetica, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(b.hits), b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
      // highlight
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.fillRect(b.x + 3, b.y + 2, b.w - 6, 3);
    }
  }

  function drawPaddle() {
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    var g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, "#c7d2ff");
    g.addColorStop(1, "#6c7fe0");
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "rgba(160,190,255,0.9)";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function overlay(title, lines, titleColor) {
    ctx.fillStyle = "rgba(8,10,22,0.72)";
    ctx.fillRect(0, HUD_H, W, H - HUD_H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = titleColor || "#ffffff";
    ctx.font = "bold 52px 'Segoe UI', Helvetica, Arial, sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 70);
    ctx.font = "18px 'Segoe UI', Helvetica, Arial, sans-serif";
    ctx.fillStyle = "#c9d1f5";
    for (var i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], W / 2, H / 2 - 10 + i * 30);
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#10142a";
    ctx.fillRect(0, 0, W, H);

    drawHUD();
    drawBricks();
    drawPaddle();
    if (state !== "start") drawBall();

    if (state === "start") {
      overlay("BRICK BREAKER", [
        "Move: Left / Right arrows, A / D, or the mouse",
        "Launch: Space or Click      Pause: P",
        "Clear all bricks in 2 levels. You have 3 lives.",
        "",
        "Press Space or Click to start"
      ], "#9fb2ff");
    } else if (state === "ready") {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#c9d1f5";
      ctx.font = "18px 'Segoe UI', Helvetica, Arial, sans-serif";
      ctx.fillText(LEVELS[levelIndex].name + " - Press Space or Click to launch", W / 2, H / 2 + 60);
    } else if (state === "paused") {
      overlay("PAUSED", ["Press P to resume"], "#feca57");
    } else if (state === "levelclear") {
      overlay("LEVEL CLEAR!", ["Score: " + score, "Get ready for " + LEVELS[levelIndex + 1].name + "..."], "#1dd1a1");
    } else if (state === "gameover") {
      overlay("GAME OVER", ["Final score: " + score, "", "Press Space or Click to restart"], "#ff5d73");
    } else if (state === "win") {
      overlay("YOU WIN!", ["Final score: " + score + "   Lives left: " + lives, "", "Press Space or Click to play again"], "#1dd1a1");
    }
  }

  // ---------- Main loop ----------
  var last = null;
  function frame(ts) {
    if (last === null) last = ts;
    var dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05; // clamp after tab switches / hitches
    if (dt < 0) dt = 0;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  buildLevel(0);
  resetBallOnPaddle();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
