<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    color: #e8ecf4;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    user-select: none;
  }
  canvas {
    background: linear-gradient(#1b2133, #0d1018);
    border: 2px solid #3a4560;
    border-radius: 8px;
    max-width: 100vw;
    max-height: 88vh;
    cursor: none;
    touch-action: none;
  }
  p { margin: 10px 0 0; font-size: 14px; color: #8f9ab3; text-align: center; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p>Mouse: move to steer, click to launch &nbsp;|&nbsp; Keyboard: ← → or A / D to steer, Space to launch &nbsp;|&nbsp; P: pause</p>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const HUD_H = 40;

  // ---------- Level definitions ----------
  // Digits = brick hit points (0 = empty). Level 2 adds tougher bricks.
  const LEVELS = [
    {
      name: "Level 1",
      speed: 5,
      layout: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      name: "Level 2",
      speed: 6,
      layout: [
        "3000000003",
        "2222222222",
        "1121111211",
        "2112222112",
        "1211001121",
        "2222222222",
        "0111111110",
      ],
    },
  ];

  const ROW_COLORS = ["#ff5d73", "#ff9f43", "#feca57", "#1dd1a1", "#54a0ff", "#a29bfe", "#ff7eb6"];
  const BRICK_COLS = 10, BRICK_GAP = 6, BRICK_H = 22, BRICK_TOP = HUD_H + 40, SIDE = 30;
  const BRICK_W = (W - SIDE * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;

  // ---------- State ----------
  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 9 };
  const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0, stuck: true };
  let bricks = [];
  let score = 0, lives = 3, levelIndex = 0;
  let state = "start"; // start | playing | paused | levelClear | gameOver | win
  const keys = { left: false, right: false };
  let particles = [];

  function buildLevel(i) {
    bricks = [];
    LEVELS[i].layout.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        const hp = parseInt(ch, 10);
        if (hp > 0) {
          bricks.push({
            x: SIDE + c * (BRICK_W + BRICK_GAP),
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            w: BRICK_W, h: BRICK_H,
            hp, maxHp: hp,
            color: ROW_COLORS[r % ROW_COLORS.length],
          });
        }
      });
    });
  }

  function resetBall() {
    ball.stuck = true;
    ball.vx = 0; ball.vy = 0;
    placeBallOnPaddle();
  }

  function placeBallOnPaddle() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launchBall() {
    if (!ball.stuck) return;
    const speed = LEVELS[levelIndex].speed;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    ball.stuck = false;
  }

  function newGame() {
    score = 0; lives = 3; levelIndex = 0;
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = "playing";
  }

  function nextLevel() {
    levelIndex++;
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = "playing";
  }

  // Primary action: Space / click / Enter
  function action() {
    switch (state) {
      case "start":
      case "gameOver":
      case "win":
        newGame();
        break;
      case "levelClear":
        nextLevel();
        break;
      case "paused":
        state = "playing";
        break;
      case "playing":
        launchBall();
        break;
    }
  }

  // ---------- Input ----------
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; e.preventDefault(); }
    else if (k === " " || k === "Enter") { e.preventDefault(); if (!e.repeat) action(); }
    else if (k === "p" || k === "P" || k === "Escape") {
      if (state === "playing") state = "paused";
      else if (state === "paused") state = "playing";
    }
  });
  document.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });

  function pointerToCanvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  function movePaddleTo(x) {
    if (state !== "playing") return;
    paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
  }
  canvas.addEventListener("mousemove", (e) => movePaddleTo(pointerToCanvasX(e.clientX)));
  canvas.addEventListener("mousedown", (e) => { e.preventDefault(); action(); });
  canvas.addEventListener("touchmove", (e) => { e.preventDefault(); movePaddleTo(pointerToCanvasX(e.touches[0].clientX)); }, { passive: false });
  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); movePaddleTo(pointerToCanvasX(e.touches[0].clientX)); action(); }, { passive: false });
  window.addEventListener("blur", () => { keys.left = keys.right = false; if (state === "playing") state = "paused"; });

  // ---------- Physics ----------
  function circleRectHit(b, r) {
    const cx = Math.max(r.x, Math.min(b.x, r.x + r.w));
    const cy = Math.max(r.y, Math.min(b.y, r.y + r.h));
    const dx = b.x - cx, dy = b.y - cy;
    return dx * dx + dy * dy <= b.r * b.r;
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6,
        life: 30 + Math.random() * 15,
        color,
      });
    }
  }

  function step() {
    // Keyboard paddle movement
    if (keys.left) paddle.x -= paddle.speed;
    if (keys.right) paddle.x += paddle.speed;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (ball.stuck) { placeBallOnPaddle(); return; }

    // Sub-steps to avoid tunneling through bricks
    const speed = Math.hypot(ball.vx, ball.vy);
    const steps = Math.ceil(speed / (ball.r * 0.5));
    for (let s = 0; s < steps; s++) {
      if (moveBall(1 / steps)) return;
    }
  }

  // Returns true if the ball was lost or the level ended during this sub-step
  function moveBall(f) {
    const prevX = ball.x, prevY = ball.y;
    ball.x += ball.vx * f;
    ball.y += ball.vy * f;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < HUD_H) { ball.y = HUD_H + ball.r; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 && circleRectHit(ball, paddle) && prevY <= paddle.y + paddle.h / 2) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const clamped = Math.max(-1, Math.min(1, hit));
      const angle = clamped * (Math.PI / 3); // up to 60° from vertical
      const sp = Math.hypot(ball.vx, ball.vy);
      ball.vx = Math.sin(angle) * sp;
      ball.vy = -Math.cos(angle) * sp;
      ball.y = paddle.y - ball.r - 0.5;
    }

    // Bricks (one per sub-step)
    for (let i = 0; i < bricks.length; i++) {
      const br = bricks[i];
      if (!circleRectHit(ball, br)) continue;

      // Decide bounce axis from where the ball came from
      const wasLeft = prevX + ball.r <= br.x, wasRight = prevX - ball.r >= br.x + br.w;
      const wasAbove = prevY + ball.r <= br.y, wasBelow = prevY - ball.r >= br.y + br.h;
      if ((wasLeft || wasRight) && !(wasAbove || wasBelow)) ball.vx = -ball.vx;
      else if ((wasAbove || wasBelow) && !(wasLeft || wasRight)) ball.vy = -ball.vy;
      else { ball.vx = -ball.vx; ball.vy = -ball.vy; }
      ball.x = prevX; ball.y = prevY;

      br.hp--;
      if (br.hp <= 0) {
        score += 10 * br.maxHp;
        spawnParticles(br.x + br.w / 2, br.y + br.h / 2, br.color);
        bricks.splice(i, 1);
      } else {
        score += 5;
      }

      if (bricks.length === 0) {
        score += lives * 100; // bonus for remaining lives
        state = levelIndex < LEVELS.length - 1 ? "levelClear" : "win";
        return true;
      }
      break;
    }

    // Ball lost
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) { state = "gameOver"; }
      else { resetBall(); }
      return true;
    }
    return false;
  }

  function updateParticles() {
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; });
    particles = particles.filter(p => p.life > 0);
  }

  // ---------- Rendering ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.fillStyle = "#3a4560";
    ctx.fillRect(0, HUD_H - 2, W, 2);

    ctx.font = "bold 20px 'Segoe UI', Arial, sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#e8ecf4";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, HUD_H / 2);
    ctx.textAlign = "center";
    ctx.fillText(LEVELS[levelIndex].name + " / " + LEVELS.length, W / 2, HUD_H / 2);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 80, HUD_H / 2);
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(W - 62 + i * 22, HUD_H / 2, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5d73" : "#3a4560";
      ctx.fill();
    }
  }

  function drawBricks() {
    bricks.forEach(br => {
      ctx.globalAlpha = br.maxHp > 1 ? 0.45 + 0.55 * (br.hp / br.maxHp) : 1;
      roundRect(br.x, br.y, br.w, br.h, 4);
      ctx.fillStyle = br.color;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(br.x + 3, br.y + 3, br.w - 6, 4);
      if (br.hp > 1) {
        ctx.fillStyle = "#10131c";
        ctx.font = "bold 13px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(br.hp, br.x + br.w / 2, br.y + br.h / 2 + 1);
      }
    });
  }

  function drawPaddle() {
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, "#9fd8ff");
    g.addColorStop(1, "#2e86de");
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#9fd8ff";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / 45);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    });
    ctx.globalAlpha = 1;
  }

  function drawOverlay(title, lines) {
    ctx.fillStyle = "rgba(8,10,16,0.72)";
    ctx.fillRect(0, HUD_H, W, H - HUD_H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 52px 'Segoe UI', Arial, sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 50);
    ctx.font = "20px 'Segoe UI', Arial, sans-serif";
    ctx.fillStyle = "#c5cde0";
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 10 + i * 32));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawParticles();
    drawPaddle();
    drawBall();
    drawHUD();

    if (state === "playing" && ball.stuck) {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "18px 'Segoe UI', Arial, sans-serif";
      ctx.fillStyle = "#c5cde0";
      ctx.fillText("Press Space or click to launch", W / 2, H / 2 + 60);
    }

    if (state === "start") {
      drawOverlay("BRICK BREAKER", [
        "Move: mouse or ← → / A D",
        "Launch: click or Space   •   Pause: P",
        "Click or press Space to start",
      ]);
    } else if (state === "paused") {
      drawOverlay("PAUSED", ["Press P, Space or click to resume"]);
    } else if (state === "levelClear") {
      drawOverlay("LEVEL CLEAR!", ["Score: " + score, "Click or press Space for " + LEVELS[levelIndex + 1].name]);
    } else if (state === "gameOver") {
      drawOverlay("GAME OVER", ["Final score: " + score, "Click or press Space to play again"]);
    } else if (state === "win") {
      drawOverlay("YOU WIN!", ["All levels cleared — final score: " + score, "Click or press Space to play again"]);
    }
  }

  // ---------- Main loop (fixed 60 Hz timestep) ----------
  const STEP_MS = 1000 / 60;
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(now - last, 250);
    last = now;
    while (acc >= STEP_MS) {
      if (state === "playing") step();
      updateParticles();
      acc -= STEP_MS;
    }
    draw();
    requestAnimationFrame(loop);
  }

  buildLevel(0);
  resetBall();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
