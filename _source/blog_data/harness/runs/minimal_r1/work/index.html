<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brick Breaker</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#eee;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;flex-direction:column}
  canvas{background:#000;border:2px solid #444;cursor:none;max-width:100%}
  p{margin:8px;font-size:14px;color:#aaa}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<p>Move: Mouse or ←/→ (A/D) &nbsp;|&nbsp; Launch: Click or Space &nbsp;|&nbsp; Pause: P</p>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const LEVELS = [
  // Level 1: simple rows
  [
    "1111111111",
    "1111111111",
    "2222222222",
    "2222222222",
    "3333333333"
  ],
  // Level 2: pattern with tougher bricks (numbers = hits needed)
  [
    "3330000333",
    "3222222223",
    "0211331120",
    "0211331120",
    "3222222223",
    "1110000111"
  ]
];
const COLORS = {1:'#4caf50', 2:'#2196f3', 3:'#e91e63'};

const paddle = {w:110, h:14, x:W/2-55, y:H-40, speed:9};
const ball = {x:0, y:0, r:8, vx:0, vy:0, stuck:true};
let bricks = [];
let level = 0, score = 0, lives = 3;
let state = 'start'; // start, play, paused, levelup, over, win
const keys = {};

function loadLevel(n){
  bricks = [];
  const map = LEVELS[n];
  const cols = map[0].length, pad = 6, top = 60, side = 30;
  const bw = (W - side*2 - pad*(cols-1)) / cols, bh = 22;
  map.forEach((row, r) => {
    [...row].forEach((ch, c) => {
      const hp = +ch;
      if (hp > 0) bricks.push({x: side + c*(bw+pad), y: top + r*(bh+pad), w: bw, h: bh, hp, max: hp});
    });
  });
  resetBall();
}

function resetBall(){
  paddle.x = W/2 - paddle.w/2;
  ball.stuck = true;
  ball.vx = 0; ball.vy = 0;
  placeBallOnPaddle();
}
function placeBallOnPaddle(){
  ball.x = paddle.x + paddle.w/2;
  ball.y = paddle.y - ball.r - 1;
}

function baseSpeed(){ return 5.5 + level * 1.0; }

function launch(){
  if (state === 'start' || state === 'levelup') { state = 'play'; }
  else if (state === 'over' || state === 'win') { newGame(); state = 'play'; return; }
  if (state === 'paused') return;
  if (ball.stuck) {
    ball.stuck = false;
    const s = baseSpeed();
    const a = (Math.random()*0.6 - 0.3);
    ball.vx = s * Math.sin(a);
    ball.vy = -s * Math.cos(a);
  }
}

function newGame(){
  level = 0; score = 0; lives = 3;
  loadLevel(0);
}

// Input
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); launch(); }
  if (e.key === 'p' || e.key === 'P') {
    if (state === 'play') state = 'paused';
    else if (state === 'paused') state = 'play';
  }
  if (['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
cv.addEventListener('mousemove', e => {
  const rect = cv.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w/2));
});
cv.addEventListener('mousedown', e => { e.preventDefault(); launch(); });

function update(){
  if (state !== 'play') { if (ball.stuck) placeBallOnPaddle(); return; }

  if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (ball.stuck) { placeBallOnPaddle(); return; }

  // Substeps to avoid tunneling
  const steps = 4;
  for (let i = 0; i < steps; i++) {
    ball.x += ball.vx / steps;
    ball.y += ball.vy / steps;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + ball.vy &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2); // -1..1
      const ang = Math.max(-1, Math.min(1, hit)) * (Math.PI/3);
      const s = Math.hypot(ball.vx, ball.vy);
      ball.vx = s * Math.sin(ang);
      ball.vy = -s * Math.cos(ang);
      ball.y = paddle.y - ball.r;
    }

    // Bricks
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx*dx + dy*dy <= ball.r*ball.r) {
        // Determine side by penetration
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (overlapX < overlapY) {
          ball.vx = ball.x < b.x + b.w/2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
        } else {
          ball.vy = ball.y < b.y + b.h/2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
        }
        b.hp--;
        score += b.hp <= 0 ? 10 * b.max : 5;
        // Slight speed up
        const s = Math.hypot(ball.vx, ball.vy);
        const ns = Math.min(s * 1.01, baseSpeed() * 1.6);
        ball.vx *= ns / s; ball.vy *= ns / s;
        break;
      }
    }

    // Fell out
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) { state = 'over'; }
      resetBall();
      return;
    }
  }

  // Level complete
  if (bricks.every(b => b.hp <= 0)) {
    if (level < LEVELS.length - 1) {
      level++;
      loadLevel(level);
      state = 'levelup';
    } else {
      state = 'win';
      ball.stuck = true;
    }
  }
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function draw(){
  ctx.clearRect(0, 0, W, H);

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px Arial';
  ctx.textAlign = 'left';
  ctx.fillText('Score: ' + score, 16, 32);
  ctx.textAlign = 'center';
  ctx.fillText('Level ' + (level+1) + ' / ' + LEVELS.length, W/2, 32);
  ctx.textAlign = 'right';
  ctx.fillText('Lives: ' + '♥'.repeat(Math.max(0, lives)), W - 16, 32);

  // Bricks
  for (const b of bricks) {
    if (b.hp <= 0) continue;
    ctx.fillStyle = COLORS[b.hp];
    ctx.globalAlpha = 0.55 + 0.45 * (b.hp / b.max);
    roundRect(b.x, b.y, b.w, b.h, 4);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.stroke();
  }

  // Paddle
  ctx.fillStyle = '#ffeb3b';
  roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
  ctx.fill();

  // Ball
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fill();

  // Overlays
  const msg = {
    start: ['BRICK BREAKER', 'Click or press Space to start'],
    levelup: ['LEVEL ' + (level+1), 'Click or press Space to continue'],
    paused: ['PAUSED', 'Press P to resume'],
    over: ['GAME OVER', 'Score: ' + score + ' — Click or Space to restart'],
    win: ['YOU WIN!', 'Score: ' + score + ' — Click or Space to play again']
  }[state];
  if (msg) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, H/2 - 80, W, 160);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px Arial';
    ctx.fillText(msg[0], W/2, H/2 - 10);
    ctx.font = '20px Arial';
    ctx.fillText(msg[1], W/2, H/2 + 35);
  } else if (ball.stuck && state === 'play') {
    ctx.fillStyle = '#aaa';
    ctx.textAlign = 'center';
    ctx.font = '16px Arial';
    ctx.fillText('Click or press Space to launch', W/2, H/2 + 100);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

newGame();
loop();
</script>
</body>
</html>
