<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brick Breaker</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { background: #000; border: 2px solid #444; cursor: none; max-width: 100%; }
  p { margin: 8px; font-size: 14px; color: #aaa; }
</style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<p>Move: ← → / A D or mouse &nbsp;|&nbsp; Launch: Space or click &nbsp;|&nbsp; Pause: P</p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const LEVELS = [
  // Level 1: simple rows
  [
    "1111111111",
    "1111111111",
    "2222222222",
    "2222222222",
  ],
  // Level 2: pattern with tougher bricks (3 = two hits)
  [
    "3330000333",
    "3222222223",
    "0211111120",
    "0213333120",
    "0211111120",
    "3222222223",
  ],
];
const COLORS = { 1: '#4fc3f7', 2: '#81c784', 3: '#ff8a65' };
const COLS = 10, BRICK_W = 58, BRICK_H = 20, GAP = 4, TOP = 50;
const OFFSET_X = (W - (COLS * BRICK_W + (COLS - 1) * GAP)) / 2;

const paddle = { w: 90, h: 12, x: W / 2 - 45, y: H - 30, speed: 7 };
const ball = { x: 0, y: 0, r: 7, dx: 0, dy: 0, stuck: true };
let bricks = [], score = 0, lives = 3, level = 0;
let state = 'start'; // start | play | paused | levelclear | gameover | win
const keys = {};

function loadLevel(n) {
  bricks = [];
  LEVELS[n].forEach((row, r) => {
    [...row].forEach((c, col) => {
      const hp = +c;
      if (hp > 0) bricks.push({
        x: OFFSET_X + col * (BRICK_W + GAP),
        y: TOP + r * (BRICK_H + GAP),
        hp, type: hp
      });
    });
  });
  resetBall();
}

function resetBall() {
  ball.stuck = true;
  ball.dx = 0; ball.dy = 0;
  paddle.x = W / 2 - paddle.w / 2;
}

function launch() {
  if (!ball.stuck) return;
  const speed = 5 + level * 1.2;
  const angle = (Math.random() * 0.6 - 0.3) - Math.PI / 2;
  ball.dx = speed * Math.cos(angle);
  ball.dy = speed * Math.sin(angle);
  ball.stuck = false;
}

function newGame() {
  score = 0; lives = 3; level = 0;
  loadLevel(0);
  state = 'play';
}

function action() {
  if (state === 'start' || state === 'gameover' || state === 'win') newGame();
  else if (state === 'levelclear') { level++; loadLevel(level); state = 'play'; }
  else if (state === 'play') launch();
}

// Input
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); action(); }
  if (e.key === 'p' || e.key === 'P') {
    if (state === 'play') state = 'paused';
    else if (state === 'paused') state = 'play';
  }
  if (e.key.startsWith('Arrow')) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = mx - paddle.w / 2;
  clampPaddle();
});
canvas.addEventListener('click', action);

function clampPaddle() {
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
}

function update() {
  if (state !== 'play') return;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
  clampPaddle();

  if (ball.stuck) {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    return;
  }

  // Sub-step movement to avoid tunneling
  const steps = Math.ceil(Math.hypot(ball.dx, ball.dy) / 3);
  for (let i = 0; i < steps; i++) {
    ball.x += ball.dx / steps;
    ball.y += ball.dy / steps;
    if (stepCollisions()) break;
  }
}

function stepCollisions() {
  // Walls
  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
  if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

  // Bottom: lose life
  if (ball.y - ball.r > H) {
    lives--;
    if (lives <= 0) state = 'gameover';
    else resetBall();
    return true;
  }

  // Paddle
  if (ball.dy > 0 &&
      ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + ball.dy &&
      ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
    const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
    const speed = Math.hypot(ball.dx, ball.dy);
    const angle = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3);
    ball.dx = speed * Math.sin(angle);
    ball.dy = -speed * Math.cos(angle);
    ball.y = paddle.y - ball.r;
  }

  // Bricks
  for (const b of bricks) {
    if (b.hp <= 0) continue;
    const cx = Math.max(b.x, Math.min(ball.x, b.x + BRICK_W));
    const cy = Math.max(b.y, Math.min(ball.y, b.y + BRICK_H));
    const ddx = ball.x - cx, ddy = ball.y - cy;
    if (ddx * ddx + ddy * ddy <= ball.r * ball.r) {
      // Decide bounce axis by overlap
      const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BRICK_W - (ball.x - ball.r));
      const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BRICK_H - (ball.y - ball.r));
      if (overlapX < overlapY) ball.dx = -ball.dx; else ball.dy = -ball.dy;
      b.hp--;
      score += b.hp <= 0 ? 10 * b.type : 5;
      if (bricks.every(br => br.hp <= 0)) {
        state = level + 1 < LEVELS.length ? 'levelclear' : 'win';
        if (state === 'win') score += lives * 100;
      }
      return true;
    }
  }
  return false;
}

function drawText(t, y, size = 28, color = '#fff') {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(t, W / 2, y);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '18px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Score: ' + score, 12, 28);
  ctx.textAlign = 'center';
  ctx.fillText('Level ' + (level + 1) + ' / ' + LEVELS.length, W / 2, 28);
  ctx.textAlign = 'right';
  ctx.fillText('Lives: ' + '❤'.repeat(Math.max(0, lives)), W - 12, 28);

  // Bricks
  for (const b of bricks) {
    if (b.hp <= 0) continue;
    ctx.fillStyle = (b.type === 3 && b.hp < 3) ? (b.hp === 1 ? '#ffccbc' : '#ffab91') : COLORS[b.type];
    if (b.type === 2 && b.hp === 1) ctx.fillStyle = '#c8e6c9';
    ctx.fillRect(b.x, b.y, BRICK_W, BRICK_H);
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, BRICK_W - 1, BRICK_H - 1);
  }

  // Paddle
  ctx.fillStyle = '#eee';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

  // Ball
  if (state === 'play' || state === 'paused') {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffeb3b';
    ctx.fill();
  }

  // Overlays
  const sub = 'Press Space or Click';
  if (state === 'start') {
    drawText('BRICK BREAKER', H / 2 - 20, 40);
    drawText(sub + ' to start', H / 2 + 25, 18, '#aaa');
  } else if (state === 'paused') {
    drawText('PAUSED', H / 2, 36);
  } else if (state === 'levelclear') {
    drawText('LEVEL ' + (level + 1) + ' CLEAR!', H / 2 - 10, 36, '#81c784');
    drawText(sub + ' for next level', H / 2 + 30, 18, '#aaa');
  } else if (state === 'gameover') {
    drawText('GAME OVER', H / 2 - 10, 40, '#e57373');
    drawText('Final score: ' + score + ' — ' + sub + ' to restart', H / 2 + 30, 18, '#aaa');
  } else if (state === 'win') {
    drawText('YOU WIN!', H / 2 - 10, 40, '#ffeb3b');
    drawText('Final score: ' + score + ' — ' + sub + ' to play again', H / 2 + 30, 18, '#aaa');
  } else if (state === 'play' && ball.stuck) {
    drawText(sub + ' to launch', H / 2 + 60, 16, '#888');
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loadLevel(0);
loop();
</script>
</body>
</html>
