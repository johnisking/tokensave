<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brick Breaker</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#eee;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;flex-direction:column}
  canvas{background:#000;border:2px solid #444;cursor:none;max-width:100%}
  p{font-size:14px;color:#aaa}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<p>Move: Mouse or ←/→ (A/D) &nbsp;|&nbsp; Launch: Click or Space &nbsp;|&nbsp; Pause: P</p>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const LEVELS = [
  // Level 1: simple rows
  [
    "1111111111",
    "1111111111",
    "2222222222",
    "2222222222",
    "3333333333"
  ],
  // Level 2: pattern with tougher bricks (numbers = hits needed)
  [
    "3.3.33.3.3",
    "2222222222",
    ".33333333.",
    "2.2.22.2.2",
    "3333333333",
    ".1.1111.1."
  ]
];
const COLORS = {1:'#4fc3f7', 2:'#81c784', 3:'#ff8a65'};

const paddle = {w:110, h:14, x:W/2-55, y:H-40, speed:9};
const ball = {r:8, x:0, y:0, vx:0, vy:0, stuck:true};
let bricks = [], level = 0, score = 0, lives = 3;
let state = 'start'; // start, play, paused, levelclear, over, win
const keys = {};

function loadLevel(n){
  bricks = [];
  const map = LEVELS[n];
  const cols = 10, pad = 6, top = 60, side = 30;
  const bw = (W - side*2 - pad*(cols-1)) / cols, bh = 22;
  map.forEach((row, r) => {
    [...row].forEach((ch, c) => {
      if (ch === '.') return;
      const hp = +ch;
      bricks.push({x: side + c*(bw+pad), y: top + r*(bh+pad), w: bw, h: bh, hp, max: hp});
    });
  });
  resetBall();
}

function resetBall(){
  ball.stuck = true;
  ball.vx = 0; ball.vy = 0;
  placeBallOnPaddle();
}
function placeBallOnPaddle(){
  ball.x = paddle.x + paddle.w/2;
  ball.y = paddle.y - ball.r - 1;
}
function ballSpeed(){ return 6 + level*1.2; }

function launch(){
  if (state === 'start') { state = 'play'; }
  else if (state === 'levelclear') { level++; loadLevel(level); state = 'play'; return; }
  else if (state === 'over' || state === 'win') { newGame(); state = 'play'; return; }
  if (state === 'play' && ball.stuck){
    ball.stuck = false;
    const ang = (Math.random()*0.6 - 0.3);
    const s = ballSpeed();
    ball.vx = s*Math.sin(ang);
    ball.vy = -s*Math.cos(ang);
  }
}

function newGame(){
  level = 0; score = 0; lives = 3;
  paddle.x = W/2 - paddle.w/2;
  loadLevel(0);
}

// Input
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); launch(); }
  if (e.key === 'p' || e.key === 'P'){
    if (state === 'play') state = 'paused';
    else if (state === 'paused') state = 'play';
  }
  if (['ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
cv.addEventListener('mousemove', e => {
  const rect = cv.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w/2));
});
cv.addEventListener('mousedown', e => { e.preventDefault(); launch(); });

function update(){
  if (state !== 'play') { if (ball.stuck) placeBallOnPaddle(); return; }

  if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (ball.stuck){ placeBallOnPaddle(); return; }

  // Substeps to avoid tunneling
  const steps = 4;
  for (let i = 0; i < steps; i++){
    ball.x += ball.vx/steps;
    ball.y += ball.vy/steps;

    // Walls
    if (ball.x - ball.r < 0){ ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W){ ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0){ ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + ball.vy &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r){
      const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2); // -1..1
      const ang = Math.max(-1, Math.min(1, hit)) * (Math.PI/3);
      const s = Math.hypot(ball.vx, ball.vy);
      ball.vx = s*Math.sin(ang);
      ball.vy = -s*Math.cos(ang);
      ball.y = paddle.y - ball.r;
    }

    // Bricks
    for (const b of bricks){
      if (b.hp <= 0) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx*dx + dy*dy <= ball.r*ball.r){
        // Determine side by overlap
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (overlapX < overlapY){
          ball.vx = ball.x < b.x + b.w/2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
        } else {
          ball.vy = ball.y < b.y + b.h/2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
        }
        b.hp--;
        score += b.hp <= 0 ? 10 * b.max : 5;
        break;
      }
    }

    // Lost ball
    if (ball.y - ball.r > H){
      lives--;
      if (lives <= 0){ state = 'over'; }
      resetBall();
      return;
    }
  }

  if (bricks.every(b => b.hp <= 0)){
    if (level < LEVELS.length - 1) state = 'levelclear';
    else state = 'win';
    resetBall();
  }
}

function drawCenterText(lines){
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, H/2 - 80, W, 160);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  lines.forEach((t, i) => {
    ctx.font = i === 0 ? 'bold 40px Arial' : '20px Arial';
    ctx.fillText(t, W/2, H/2 - 20 + i*40);
  });
}

function draw(){
  ctx.clearRect(0, 0, W, H);

  // Bricks
  for (const b of bricks){
    if (b.hp <= 0) continue;
    ctx.fillStyle = COLORS[b.hp];
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
  }

  // Paddle
  ctx.fillStyle = '#eee';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

  // Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fillStyle = '#ffeb3b';
  ctx.fill();

  // HUD
  ctx.font = 'bold 20px Arial';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText('Score: ' + score, 15, 30);
  ctx.textAlign = 'center';
  ctx.fillText('Level ' + (level + 1) + ' / ' + LEVELS.length, W/2, 30);
  ctx.textAlign = 'right';
  ctx.fillText('Lives: ' + '♥'.repeat(Math.max(0, lives)), W - 15, 30);

  if (state === 'start') drawCenterText(['BRICK BREAKER', 'Click or press Space to start']);
  else if (state === 'paused') drawCenterText(['PAUSED', 'Press P to resume']);
  else if (state === 'levelclear') drawCenterText(['LEVEL ' + (level+1) + ' CLEAR!', 'Click or press Space for Level ' + (level+2)]);
  else if (state === 'over') drawCenterText(['GAME OVER', 'Score: ' + score + ' — Click or Space to restart']);
  else if (state === 'win') drawCenterText(['YOU WIN!', 'Score: ' + score + ' — Click or Space to play again']);
  else if (ball.stuck){
    ctx.font = '18px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#ccc';
    ctx.fillText('Click or press Space to launch', W/2, H/2 + 60);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

newGame();
loop();
</script>
</body>
</html>
