<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0d1020;
    color: #e8ecff;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    position: relative;
    width: min(96vw, calc(88vh * 4 / 3));
    aspect-ratio: 4 / 3;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #141833;
    border: 2px solid #3a4280;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(80, 100, 255, 0.25);
    cursor: none;
    box-sizing: border-box;
  }
  #hint {
    margin-top: 8px;
    font-size: 13px;
    color: #8890c0;
    text-align: center;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
</div>
<div id="hint">Arrows / A-D or mouse to move &middot; Space / Click to launch &middot; P to pause</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = canvas.width;
  var H = canvas.height;

  // ---------- Config ----------
  var PADDLE_W = 110;
  var PADDLE_H = 14;
  var PADDLE_Y = H - 40;
  var PADDLE_SPEED = 620; // px/s
  var BALL_R = 8;
  var MAX_BOUNCE_ANGLE = Math.PI / 3; // 60 degrees from vertical
  var START_LIVES = 3;
  var HUD_H = 40;

  var BRICK_COLORS = ["#ff5c7a", "#ff9f43", "#ffd93d", "#6bdb7c", "#4fc3f7", "#7c8cff", "#c07cff"];

  // Level definitions. Each char in a row: '.' empty, '1'-'3' hit points.
  var LEVELS = [
    {
      name: "Level 1",
      ballSpeed: 360,
      layout: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111"
      ]
    },
    {
      name: "Level 2",
      ballSpeed: 460,
      layout: [
        "3332222333",
        "2222222222",
        "1121111211",
        "1.111111.1",
        "2211..1122",
        "1111111111",
        "12.1221.21"
      ]
    }
  ];

  // ---------- State ----------
  // states: start, serve, play, paused, levelclear, gameover, win
  var state = "start";
  var levelIndex = 0;
  var score = 0;
  var lives = START_LIVES;
  var bricks = [];
  var paddle = { x: W / 2 - PADDLE_W / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
  var ball = { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R, speed: 360 };
  var keys = { left: false, right: false };
  var mouseX = null; // target x for paddle center, set by mouse movement
  var stateBeforePause = "play";
  var messageTimer = 0;

  // ---------- Level setup ----------
  function buildLevel(idx) {
    var lvl = LEVELS[idx];
    bricks = [];
    var rows = lvl.layout.length;
    var cols = lvl.layout[0].length;
    var marginX = 30;
    var gap = 6;
    var top = HUD_H + 30;
    var bw = (W - marginX * 2 - gap * (cols - 1)) / cols;
    var bh = 22;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var ch = lvl.layout[r].charAt(c);
        if (ch === ".") continue;
        var hp = parseInt(ch, 10) || 1;
        bricks.push({
          x: marginX + c * (bw + gap),
          y: top + r * (bh + gap),
          w: bw,
          h: bh,
          hp: hp,
          maxHp: hp,
          color: BRICK_COLORS[r % BRICK_COLORS.length],
          alive: true
        });
      }
    }
    ball.speed = lvl.ballSpeed;
  }

  function resetBallOnPaddle() {
    ball.vx = 0;
    ball.vy = 0;
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function newGame() {
    score = 0;
    lives = START_LIVES;
    levelIndex = 0;
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBallOnPaddle();
    state = "serve";
  }

  function launchBall() {
    // Launch slightly angled based on random small offset
    var angle = (Math.random() * 0.5 - 0.25) * MAX_BOUNCE_ANGLE;
    ball.vx = ball.speed * Math.sin(angle);
    ball.vy = -ball.speed * Math.cos(angle);
    state = "play";
  }

  // ---------- Input actions ----------
  function primaryAction() {
    switch (state) {
      case "start":
        newGame();
        break;
      case "serve":
        launchBall();
        break;
      case "paused":
        state = stateBeforePause;
        break;
      case "levelclear":
        startNextLevel();
        break;
      case "gameover":
      case "win":
        newGame();
        break;
    }
  }

  function togglePause() {
    if (state === "play" || state === "serve") {
      stateBeforePause = state;
      state = "paused";
    } else if (state === "paused") {
      state = stateBeforePause;
    }
  }

  function startNextLevel() {
    levelIndex++;
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBallOnPaddle();
    state = "serve";
  }

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") {
      keys.left = true;
      mouseX = null;
      e.preventDefault();
    } else if (k === "ArrowRight" || k === "d" || k === "D") {
      keys.right = true;
      mouseX = null;
      e.preventDefault();
    } else if (k === " " || k === "Spacebar" || e.code === "Space") {
      e.preventDefault();
      if (!e.repeat) primaryAction();
    } else if (k === "p" || k === "P") {
      if (!e.repeat) togglePause();
    }
  });

  document.addEventListener("keyup", function (e) {
    var k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });

  function canvasX(clientX) {
    var rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }

  canvas.addEventListener("mousemove", function (e) {
    mouseX = canvasX(e.clientX);
  });

  canvas.addEventListener("mousedown", function (e) {
    e.preventDefault();
    mouseX = canvasX(e.clientX);
    primaryAction();
  });

  window.addEventListener("blur", function () {
    keys.left = keys.right = false;
    if (state === "play" || state === "serve") togglePause();
  });

  // ---------- Physics ----------
  function clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
  }

  function updatePaddle(dt) {
    if (mouseX !== null) {
      paddle.x = mouseX - paddle.w / 2;
    } else {
      var dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      paddle.x += dir * PADDLE_SPEED * dt;
    }
    paddle.x = clamp(paddle.x, 0, W - paddle.w);
  }

  function setBallVelocityFromAngle(angle) {
    ball.vx = ball.speed * Math.sin(angle);
    ball.vy = -ball.speed * Math.cos(angle);
  }

  // Circle vs AABB; returns collision info or null
  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    var nx = clamp(cx, rx, rx + rw);
    var ny = clamp(cy, ry, ry + rh);
    var dx = cx - nx;
    var dy = cy - ny;
    var d2 = dx * dx + dy * dy;
    if (d2 > r * r) return null;
    return { nx: nx, ny: ny, dx: dx, dy: dy, d2: d2 };
  }

  function stepBall(h) {
    ball.x += ball.vx * h;
    ball.y += ball.vy * h;

    // Walls
    if (ball.x - ball.r < 0) {
      ball.x = ball.r;
      ball.vx = Math.abs(ball.vx);
    } else if (ball.x + ball.r > W) {
      ball.x = W - ball.r;
      ball.vx = -Math.abs(ball.vx);
    }
    if (ball.y - ball.r < HUD_H) {
      ball.y = HUD_H + ball.r;
      ball.vy = Math.abs(ball.vy);
    }

    // Paddle (only when moving downward)
    if (ball.vy > 0) {
      var hit = circleRect(ball.x, ball.y, ball.r, paddle.x, paddle.y, paddle.w, paddle.h);
      if (hit && ball.y < paddle.y + paddle.h / 2) {
        var rel = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        rel = clamp(rel, -1, 1);
        setBallVelocityFromAngle(rel * MAX_BOUNCE_ANGLE);
        ball.y = paddle.y - ball.r - 0.5;
      }
    }

    // Bricks: resolve against the most-penetrating brick only per substep
    var best = null;
    var bestBrick = null;
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      var c = circleRect(ball.x, ball.y, ball.r, b.x, b.y, b.w, b.h);
      if (c && (best === null || c.d2 < best.d2)) {
        best = c;
        bestBrick = b;
      }
    }
    if (bestBrick) {
      var b2 = bestBrick;
      // Determine side of impact via penetration depth on each axis
      var overlapLeft = ball.x + ball.r - b2.x;
      var overlapRight = b2.x + b2.w - (ball.x - ball.r);
      var overlapTop = ball.y + ball.r - b2.y;
      var overlapBottom = b2.y + b2.h - (ball.y - ball.r);
      var minX = Math.min(overlapLeft, overlapRight);
      var minY = Math.min(overlapTop, overlapBottom);

      if (minX < minY) {
        if (overlapLeft < overlapRight) {
          ball.x = b2.x - ball.r;
          ball.vx = -Math.abs(ball.vx);
        } else {
          ball.x = b2.x + b2.w + ball.r;
          ball.vx = Math.abs(ball.vx);
        }
      } else {
        if (overlapTop < overlapBottom) {
          ball.y = b2.y - ball.r;
          ball.vy = -Math.abs(ball.vy);
        } else {
          ball.y = b2.y + b2.h + ball.r;
          ball.vy = Math.abs(ball.vy);
        }
      }

      b2.hp--;
      if (b2.hp <= 0) {
        b2.alive = false;
        score += 10 * b2.maxHp * (levelIndex + 1);
      } else {
        score += 5;
      }
    }

    // Ensure ball never goes too horizontal (avoid endless side bouncing)
    var minVy = ball.speed * 0.25;
    if (Math.abs(ball.vy) < minVy) {
      ball.vy = (ball.vy < 0 ? -1 : 1) * minVy;
      ball.vx = (ball.vx < 0 ? -1 : 1) * Math.sqrt(Math.max(0, ball.speed * ball.speed - minVy * minVy));
    }
  }

  function updateBall(dt) {
    var dist = ball.speed * dt;
    // Substep so ball moves at most ~ 1/3 radius per step: prevents tunneling
    var steps = Math.max(1, Math.ceil(dist / (ball.r / 3)));
    var h = dt / steps;
    for (var s = 0; s < steps; s++) {
      stepBall(h);
      if (state !== "play") return;
      if (ball.y - ball.r > H) {
        loseLife();
        return;
      }
      if (allCleared()) {
        levelCleared();
        return;
      }
    }
  }

  function allCleared() {
    for (var i = 0; i < bricks.length; i++) {
      if (bricks[i].alive) return false;
    }
    return true;
  }

  function loseLife() {
    lives--;
    if (lives <= 0) {
      lives = 0;
      state = "gameover";
    } else {
      resetBallOnPaddle();
      state = "serve";
      messageTimer = 1.2;
    }
  }

  function levelCleared() {
    if (levelIndex >= LEVELS.length - 1) {
      state = "win";
    } else {
      state = "levelclear";
    }
  }

  function update(dt) {
    if (messageTimer > 0) messageTimer -= dt;
    if (state === "play") {
      updatePaddle(dt);
      updateBall(dt);
    } else if (state === "serve") {
      updatePaddle(dt);
      resetBallOnPaddle();
    }
  }

  // ---------- Rendering ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "#0f1228";
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.strokeStyle = "#3a4280";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, HUD_H);
    ctx.lineTo(W, HUD_H);
    ctx.stroke();

    ctx.font = "bold 18px Segoe UI, Arial, sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#e8ecff";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, HUD_H / 2);

    ctx.textAlign = "center";
    var lvlName = state === "start" ? "" : LEVELS[levelIndex].name;
    ctx.fillText(lvlName, W / 2, HUD_H / 2);

    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 16 - START_LIVES * 22, HUD_H / 2);
    for (var i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (START_LIVES - 1 - i) * 22 - 8, HUD_H / 2, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5c7a" : "#3a3f66";
      ctx.fill();
    }
  }

  function shade(hex, factor) {
    var n = parseInt(hex.slice(1), 16);
    var r = Math.round(((n >> 16) & 255) * factor);
    var g = Math.round(((n >> 8) & 255) * factor);
    var b = Math.round((n & 255) * factor);
    return "rgb(" + Math.min(255, r) + "," + Math.min(255, g) + "," + Math.min(255, b) + ")";
  }

  function drawBricks() {
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      var f = b.maxHp > 1 ? 0.55 + 0.45 * (b.hp / b.maxHp) : 1;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = shade(b.color, f);
      ctx.fill();
      if (b.maxHp > 1) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();
        ctx.fillStyle = "#10132a";
        ctx.font = "bold 13px Segoe UI, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(b.hp), b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.fillRect(b.x + 3, b.y + 2, b.w - 6, 4);
    }
  }

  function drawPaddle() {
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    var g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, "#9fb0ff");
    g.addColorStop(1, "#4a5bd6");
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#9fd8ff";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function overlay(title, lines, titleColor) {
    ctx.fillStyle = "rgba(8, 10, 24, 0.78)";
    ctx.fillRect(0, HUD_H, W, H - HUD_H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = titleColor || "#ffffff";
    ctx.font = "bold 52px Segoe UI, Arial, sans-serif";
    var y = H / 2 - 30 - lines.length * 14;
    ctx.fillText(title, W / 2, y);
    ctx.font = "20px Segoe UI, Arial, sans-serif";
    ctx.fillStyle = "#cfd5ff";
    for (var i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], W / 2, y + 60 + i * 30);
    }
  }

  function centerText(text, y, size, color) {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold " + size + "px Segoe UI, Arial, sans-serif";
    ctx.fillStyle = color;
    ctx.fillText(text, W / 2, y);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#141833";
    ctx.fillRect(0, 0, W, H);

    drawHUD();

    if (state === "start") {
      overlay("BRICK BREAKER", [
        "Break all the bricks across 2 levels to win.",
        "Move: Left/Right arrows, A/D, or the mouse",
        "Launch ball: Space or Click",
        "Pause: P",
        "You have 3 lives. Level 2 has tougher bricks and a faster ball.",
        "",
        "Press Space or Click to start"
      ], "#ffd93d");
      return;
    }

    drawBricks();
    drawPaddle();
    drawBall();

    if (state === "serve") {
      if (messageTimer > 0) centerText("Life lost!", H / 2 + 20, 28, "#ff5c7a");
      centerText(LEVELS[levelIndex].name + " - Press Space or Click to launch", H / 2 + 60, 20, "#cfd5ff");
    } else if (state === "paused") {
      overlay("PAUSED", ["Press P, Space or Click to resume"], "#4fc3f7");
    } else if (state === "levelclear") {
      overlay("LEVEL CLEAR!", [
        "Score: " + score,
        "Next: " + LEVELS[levelIndex + 1].name + " (harder bricks, faster ball)",
        "Press Space or Click to continue"
      ], "#6bdb7c");
    } else if (state === "gameover") {
      overlay("GAME OVER", [
        "Final score: " + score,
        "Press Space or Click to restart"
      ], "#ff5c7a");
    } else if (state === "win") {
      overlay("YOU WIN!", [
        "You cleared both levels!",
        "Final score: " + score,
        "Press Space or Click to play again"
      ], "#ffd93d");
    }
  }

  // ---------- Main loop ----------
  var last = performance.now();
  function frame(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (!(dt > 0)) dt = 0;
    dt = Math.min(dt, 1 / 30); // clamp large frame gaps
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  buildLevel(0);
  resetBallOnPaddle();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
