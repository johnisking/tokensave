<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    color: #e8ecf4;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: linear-gradient(#1b2133, #0d1018);
    border: 2px solid #3a4560;
    border-radius: 6px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
    touch-action: none;
  }
  p.help {
    margin: 10px 0 0;
    font-size: 14px;
    color: #9aa6c0;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p class="help">Move: Mouse or ← → / A D &nbsp;|&nbsp; Launch: Click or Space &nbsp;|&nbsp; Pause: P or Esc</p>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ---------- Config ----------
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 560;
  const BALL_R = 8;
  const BRICK_COLS = 10, BRICK_W = 68, BRICK_H = 22, BRICK_GAP = 6;
  const BRICK_TOP = 70;
  const BRICK_LEFT = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;
  const START_LIVES = 3;

  // Level layouts: '.' = empty, 1 = normal brick, 2 = tough brick (2 hits), 3 = 3 hits
  const LEVELS = [
    {
      speed: 340,
      rows: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      speed: 400,
      rows: [
        "3.3.33.3.3",
        "2222222222",
        "1212112121",
        ".22222222.",
        "1111111111",
        "..111111..",
      ],
    },
  ];

  const ROW_COLORS = ["#ff5f6d", "#ffa94d", "#ffd43b", "#69db7c", "#4dabf7", "#b197fc"];

  // ---------- State ----------
  let state = "title"; // title | serve | play | paused | levelclear | gameover | win
  let score = 0, lives = START_LIVES, levelIndex = 0;
  let paddle = { x: (W - PADDLE_W) / 2, w: PADDLE_W };
  let ball = { x: 0, y: 0, vx: 0, vy: 0, speed: 0 };
  let bricks = [];
  let particles = [];
  let stateTimer = 0;
  const keys = { left: false, right: false };
  let mouseX = null;

  function buildLevel(i) {
    bricks = [];
    LEVELS[i].rows.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === ".") return;
        const hp = parseInt(ch, 10);
        bricks.push({
          x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H,
          hp, maxHp: hp,
          color: ROW_COLORS[r % ROW_COLORS.length],
        });
      });
    });
  }

  function resetBall() {
    ball.speed = LEVELS[levelIndex].speed;
    ball.x = paddle.x + paddle.w / 2;
    ball.y = PADDLE_Y - BALL_R - 1;
    ball.vx = 0; ball.vy = 0;
    state = "serve";
  }

  function launchBall() {
    const angle = (Math.random() * 0.6 - 0.3); // radians from vertical
    ball.vx = ball.speed * Math.sin(angle);
    ball.vy = -ball.speed * Math.cos(angle);
    state = "play";
  }

  function newGame() {
    score = 0; lives = START_LIVES; levelIndex = 0;
    paddle.x = (W - PADDLE_W) / 2;
    particles = [];
    buildLevel(levelIndex);
    resetBall();
  }

  function nextLevel() {
    levelIndex++;
    particles = [];
    buildLevel(levelIndex);
    paddle.x = (W - PADDLE_W) / 2;
    resetBall();
  }

  // ---------- Primary action (space / click) ----------
  function action() {
    switch (state) {
      case "title": newGame(); break;
      case "serve": launchBall(); break;
      case "paused": state = "play"; break;
      case "levelclear": if (stateTimer <= 0) nextLevel(); break;
      case "gameover":
      case "win": if (stateTimer <= 0) newGame(); break;
    }
  }

  function togglePause() {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }

  // ---------- Input ----------
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; mouseX = null; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; mouseX = null; e.preventDefault(); }
    else if (k === " " || k === "Enter" || k === "ArrowUp") { if (!e.repeat) action(); e.preventDefault(); }
    else if (k === "p" || k === "P" || k === "Escape") togglePause();
  });
  document.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });

  function pointerToCanvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener("mousemove", (e) => { mouseX = pointerToCanvasX(e.clientX); });
  canvas.addEventListener("mousedown", (e) => { mouseX = pointerToCanvasX(e.clientX); action(); });
  canvas.addEventListener("touchstart", (e) => { mouseX = pointerToCanvasX(e.touches[0].clientX); action(); e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchmove", (e) => { mouseX = pointerToCanvasX(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  window.addEventListener("blur", () => { keys.left = keys.right = false; if (state === "play") state = "paused"; });

  // ---------- Physics helpers ----------
  function circleRect(cx, cy, r, rect) {
    const nx = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    const ny = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  function hitBrick(b) {
    b.hp--;
    if (b.hp <= 0) {
      score += 10 * b.maxHp * (levelIndex + 1);
      spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);
    } else {
      score += 5;
    }
  }

  // Move ball one axis at a time so we know which velocity component to flip.
  function moveBall(dt) {
    // X axis
    ball.x += ball.vx * dt;
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    for (const b of bricks) {
      if (b.hp > 0 && circleRect(ball.x, ball.y, BALL_R, b)) {
        hitBrick(b);
        if (ball.vx > 0) ball.x = b.x - BALL_R; else ball.x = b.x + b.w + BALL_R;
        ball.vx = -ball.vx;
        break;
      }
    }

    // Y axis
    ball.y += ball.vy * dt;
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }
    for (const b of bricks) {
      if (b.hp > 0 && circleRect(ball.x, ball.y, BALL_R, b)) {
        hitBrick(b);
        if (ball.vy > 0) ball.y = b.y - BALL_R; else ball.y = b.y + b.h + BALL_R;
        ball.vy = -ball.vy;
        break;
      }
    }

    // Paddle
    const pr = { x: paddle.x, y: PADDLE_Y, w: paddle.w, h: PADDLE_H };
    if (ball.vy > 0 && circleRect(ball.x, ball.y, BALL_R, pr)) {
      const rel = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const angle = Math.max(-1, Math.min(1, rel)) * (Math.PI / 3);      // up to 60°
      ball.vx = ball.speed * Math.sin(angle);
      ball.vy = -ball.speed * Math.cos(angle);
      ball.y = PADDLE_Y - BALL_R - 0.5;
    }
  }

  // ---------- Update ----------
  function update(dt) {
    if (stateTimer > 0) stateTimer -= dt;

    // particles always animate
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);

    if (state !== "serve" && state !== "play") return;

    // Paddle movement
    if (keys.left) paddle.x -= PADDLE_SPEED * dt;
    if (keys.right) paddle.x += PADDLE_SPEED * dt;
    if (mouseX !== null && !keys.left && !keys.right) paddle.x = mouseX - paddle.w / 2;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (state === "serve") {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = PADDLE_Y - BALL_R - 1;
      return;
    }

    // Sub-step the ball to avoid tunnelling
    const steps = Math.ceil((ball.speed * dt) / (BALL_R * 0.5));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      moveBall(sdt);
      if (ball.y - BALL_R > H) break;
    }

    // Ball lost
    if (ball.y - BALL_R > H) {
      lives--;
      if (lives <= 0) { state = "gameover"; stateTimer = 0.8; }
      else resetBall();
      return;
    }

    // Level cleared
    if (bricks.every(b => b.hp <= 0)) {
      score += lives * 100; // bonus for remaining lives
      if (levelIndex + 1 < LEVELS.length) { state = "levelclear"; }
      else { state = "win"; }
      stateTimer = 0.8;
    }
  }

  // ---------- Render ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "#e8ecf4";
    ctx.font = "bold 20px Segoe UI, Arial";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, 26);
    ctx.textAlign = "center";
    ctx.fillText("Level " + (levelIndex + 1) + " / " + LEVELS.length, W / 2, 26);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 16 - 3 * 22, 26);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - 8 - i * 22, 26, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff6b81" : "#3a4560";
      ctx.fill();
    }
    ctx.strokeStyle = "#2a3248";
    ctx.beginPath(); ctx.moveTo(0, 48); ctx.lineTo(W, 48); ctx.stroke();
  }

  function drawOverlay(title, sub) {
    ctx.fillStyle = "rgba(8, 10, 16, 0.65)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 48px Segoe UI, Arial";
    ctx.fillText(title, W / 2, H / 2 - 30);
    ctx.font = "20px Segoe UI, Arial";
    ctx.fillStyle = "#c5cee0";
    sub.split("\n").forEach((line, i) => ctx.fillText(line, W / 2, H / 2 + 25 + i * 30));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Bricks
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      ctx.globalAlpha = 0.45 + 0.55 * (b.hp / b.maxHp);
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = b.color;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.maxHp > 1) {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = b.hp >= 2 ? 2 : 1;
        ctx.stroke();
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.font = "bold 13px Segoe UI, Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
    }
    ctx.lineWidth = 1;

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    if (state !== "title") {
      // Paddle
      roundRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H, 7);
      const g = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
      g.addColorStop(0, "#e0e7ff"); g.addColorStop(1, "#748ffc");
      ctx.fillStyle = g;
      ctx.fill();

      // Ball
      if (state === "serve" || state === "play" || state === "paused") {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "#a5d8ff"; ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    drawHUD();

    switch (state) {
      case "title":
        drawOverlay("BRICK BREAKER", "Click or press Space to start\nMouse or ← → to move the paddle");
        break;
      case "serve":
        ctx.textAlign = "center"; ctx.fillStyle = "#c5cee0"; ctx.font = "18px Segoe UI, Arial";
        ctx.fillText("Click or press Space to launch", W / 2, H / 2 + 80);
        break;
      case "paused":
        drawOverlay("PAUSED", "Press P / Esc or click to resume");
        break;
      case "levelclear":
        drawOverlay("LEVEL " + (levelIndex + 1) + " CLEAR!", "Score: " + score + "\nClick or press Space for Level " + (levelIndex + 2));
        break;
      case "gameover":
        drawOverlay("GAME OVER", "Final score: " + score + "\nClick or press Space to play again");
        break;
      case "win":
        drawOverlay("YOU WIN!", "Final score: " + score + "\nClick or press Space to play again");
        break;
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  buildLevel(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
