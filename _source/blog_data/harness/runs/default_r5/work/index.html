<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d1020;
    color: #e8ecff;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: min(800px, 96vw, calc((100vh - 60px) * 4 / 3));
    height: auto;
    background: linear-gradient(#141a35, #0b0e1d);
    border: 2px solid #3a4580;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(80, 110, 255, 0.25);
    cursor: none;
  }
  .help {
    margin-top: 10px;
    font-size: 14px;
    color: #9aa4d6;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div class="help">
  Move: Mouse or ← → / A D &nbsp;|&nbsp; Launch: Click or Space &nbsp;|&nbsp; Pause: P / Esc
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---------- Level definitions ----------
  // '.' = empty, '1'..'3' = hits needed
  const LEVELS = [
    {
      name: 'Level 1',
      speed: 380,
      layout: [
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
      ],
    },
    {
      name: 'Level 2',
      speed: 450,
      layout: [
        '3.3.33.3.3',
        '2222222222',
        '2.111111.2',
        '2.1.22.1.2',
        '2.111111.2',
        '2222222222',
        '1.1.11.1.1',
      ],
    },
  ];

  const COLS = 10;
  const MARGIN_X = 35;
  const GAP = 6;
  const BRICK_W = (W - MARGIN_X * 2 - GAP * (COLS - 1)) / COLS;
  const BRICK_H = 22;
  const TOP = 70;

  const ROW_COLORS = ['#ff5d73', '#ff9f43', '#feca57', '#1dd1a1', '#54a0ff', '#a29bfe', '#ff6bcb'];
  const HP_COLORS = { 2: '#8395a7', 3: '#576574' };

  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 650;
  const BALL_R = 8;
  const START_LIVES = 3;

  // ---------- Game state ----------
  let state;      // 'serve' | 'play' | 'paused' | 'levelclear' | 'gameover' | 'win'
  let levelIndex, score, lives, bricks, particles;
  const paddle = { x: (W - PADDLE_W) / 2, w: PADDLE_W, h: PADDLE_H };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, speed: 0 };
  const keys = { left: false, right: false };

  function loadLevel(i) {
    levelIndex = i;
    const lvl = LEVELS[i];
    bricks = [];
    lvl.layout.forEach((row, r) => {
      for (let c = 0; c < COLS; c++) {
        const ch = row[c];
        if (ch && ch !== '.') {
          const hp = parseInt(ch, 10);
          bricks.push({
            x: MARGIN_X + c * (BRICK_W + GAP),
            y: TOP + r * (BRICK_H + GAP),
            w: BRICK_W, h: BRICK_H,
            hp, maxHp: hp,
            color: ROW_COLORS[r % ROW_COLORS.length],
          });
        }
      }
    });
    ball.speed = lvl.speed;
    particles = [];
    resetBall();
  }

  function resetBall() {
    paddle.w = PADDLE_W;
    state = 'serve';
    ball.vx = 0; ball.vy = 0;
    stickBall();
  }

  function stickBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = PADDLE_Y - BALL_R - 1;
  }

  function newGame() {
    score = 0;
    lives = START_LIVES;
    paddle.x = (W - PADDLE_W) / 2;
    loadLevel(0);
  }

  function launch() {
    const angle = (Math.random() * 0.6 - 0.3); // radians off vertical
    ball.vx = ball.speed * Math.sin(angle);
    ball.vy = -ball.speed * Math.cos(angle);
    state = 'play';
  }

  // Primary action: Space / Enter / click
  function action() {
    switch (state) {
      case 'serve': launch(); break;
      case 'paused': state = 'play'; break;
      case 'levelclear': loadLevel(levelIndex + 1); break;
      case 'gameover':
      case 'win': newGame(); break;
    }
  }

  function togglePause() {
    if (state === 'play') state = 'paused';
    else if (state === 'paused') state = 'play';
  }

  // ---------- Input ----------
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
    else if (k === ' ' || k === 'Enter') { if (!e.repeat) action(); e.preventDefault(); }
    else if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); e.preventDefault(); }
  });
  document.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });
  window.addEventListener('blur', () => {
    keys.left = keys.right = false;
    if (state === 'play') state = 'paused';
  });

  function pointerToCanvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener('mousemove', e => {
    if (state === 'paused') return;
    paddle.x = clampPaddle(pointerToCanvasX(e.clientX) - paddle.w / 2);
  });
  canvas.addEventListener('mousedown', e => {
    e.preventDefault();
    action();
  });
  // Basic touch support as a bonus
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (state === 'paused') return;
    paddle.x = clampPaddle(pointerToCanvasX(e.touches[0].clientX) - paddle.w / 2);
  }, { passive: false });
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    paddle.x = clampPaddle(pointerToCanvasX(e.touches[0].clientX) - paddle.w / 2);
    action();
  }, { passive: false });

  function clampPaddle(x) {
    return Math.max(0, Math.min(W - paddle.w, x));
  }

  // ---------- Update ----------
  function update(dt) {
    updateParticles(dt);
    if (state === 'paused' || state === 'gameover' || state === 'win' || state === 'levelclear') return;

    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir) paddle.x = clampPaddle(paddle.x + dir * PADDLE_SPEED * dt);

    if (state === 'serve') { stickBall(); return; }

    // Sub-step the movement to avoid tunneling through bricks
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / 4));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (!stepBall(sdt)) break;
    }
  }

  // Returns false if the ball stopped (life lost / level cleared)
  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    // Bottom: lose a life
    if (ball.y - BALL_R > H) {
      lives--;
      if (lives <= 0) { state = 'gameover'; }
      else resetBall();
      return false;
    }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + BALL_R >= PADDLE_Y && ball.y - BALL_R <= PADDLE_Y + paddle.h &&
        ball.x + BALL_R >= paddle.x && ball.x - BALL_R <= paddle.x + paddle.w) {
      const hit = Math.max(-1, Math.min(1, (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2)));
      const angle = hit * (Math.PI / 3); // up to 60° from vertical
      ball.vx = ball.speed * Math.sin(angle);
      ball.vy = -ball.speed * Math.cos(angle);
      ball.y = PADDLE_Y - BALL_R;
    }

    // Bricks (handle at most one per sub-step)
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > BALL_R * BALL_R) continue;

      const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + b.w - (ball.x - BALL_R));
      const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + b.h - (ball.y - BALL_R));
      if (overlapX < overlapY) {
        if (ball.x < b.x + b.w / 2) { ball.vx = -Math.abs(ball.vx); ball.x = b.x - BALL_R; }
        else { ball.vx = Math.abs(ball.vx); ball.x = b.x + b.w + BALL_R; }
      } else {
        if (ball.y < b.y + b.h / 2) { ball.vy = -Math.abs(ball.vy); ball.y = b.y - BALL_R; }
        else { ball.vy = Math.abs(ball.vy); ball.y = b.y + b.h + BALL_R; }
      }

      b.hp--;
      score += 10;
      if (b.hp <= 0) {
        score += 40 * b.maxHp;
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);
        bricks.splice(i, 1);
        if (bricks.length === 0) {
          score += lives * 100; // bonus for remaining lives
          state = levelIndex + 1 < LEVELS.length ? 'levelclear' : 'win';
          return false;
        }
      }
      break;
    }

    // Keep the ball from becoming too horizontal (prevents endless side bouncing)
    const minVy = ball.speed * 0.3;
    if (Math.abs(ball.vy) < minVy) {
      ball.vy = Math.sign(ball.vy || -1) * minVy;
      ball.vx = Math.sign(ball.vx || 1) * Math.sqrt(ball.speed * ball.speed - minVy * minVy);
    }
    return true;
  }

  // ---------- Particles ----------
  function spawnParticles(x, y, color) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, max: 0.6, color });
    }
  }
  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ---------- Render ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // HUD
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(0, 0, W, 44);
    ctx.font = 'bold 20px "Segoe UI", Arial, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e8ecff';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 16, 22);
    ctx.textAlign = 'center';
    ctx.fillText(LEVELS[levelIndex].name + ' / ' + LEVELS.length, W / 2, 22);
    ctx.textAlign = 'right';
    ctx.fillText('Lives:', W - 16 - START_LIVES * 22, 22);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (START_LIVES - 1 - i) * 22 - 8, 22, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? '#ff5d73' : 'rgba(255,255,255,0.15)';
      ctx.fill();
    }

    // Bricks
    for (const b of bricks) {
      ctx.fillStyle = b.hp > 1 ? HP_COLORS[b.hp] : b.color;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
      if (b.hp > 1) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px "Segoe UI", Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
    }

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Paddle
    const grad = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + paddle.h);
    grad.addColorStop(0, '#9fb4ff');
    grad.addColorStop(1, '#4f6bff');
    ctx.fillStyle = grad;
    roundRect(paddle.x, PADDLE_Y, paddle.w, paddle.h, 7);
    ctx.fill();

    // Ball
    if (state !== 'gameover') {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#9fb4ff';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Overlays
    if (state === 'serve') {
      message(LEVELS[levelIndex].name, 'Click or press Space to launch', false);
    } else if (state === 'paused') {
      message('Paused', 'Press P / Esc, Space or click to resume', true);
    } else if (state === 'levelclear') {
      message('Level Cleared!', 'Score: ' + score + '  —  Click or press Space for ' + LEVELS[levelIndex + 1].name, true);
    } else if (state === 'gameover') {
      message('Game Over', 'Final score: ' + score + '  —  Click or press Space to play again', true);
    } else if (state === 'win') {
      message('You Win!', 'Final score: ' + score + '  —  Click or press Space to play again', true);
    }
  }

  function message(title, sub, dim) {
    if (dim) {
      ctx.fillStyle = 'rgba(5, 8, 20, 0.7)';
      ctx.fillRect(0, 44, W, H - 44);
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 44px "Segoe UI", Arial, sans-serif';
    ctx.fillText(title, W / 2, H / 2 + 20);
    ctx.fillStyle = '#c3cbf5';
    ctx.font = '20px "Segoe UI", Arial, sans-serif';
    ctx.fillText(sub, W / 2, H / 2 + 64);
  }

  // ---------- Main loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
