<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d1020;
    color: #e8ecff;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    background: linear-gradient(#141a35, #0a0d1c);
    border: 2px solid #2d3770;
    border-radius: 8px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
    box-shadow: 0 0 40px rgba(80, 110, 255, 0.25);
  }
  #help {
    margin-top: 10px;
    font-size: 14px;
    color: #9aa3d0;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div id="help">Move: Mouse or ← → / A D &nbsp;|&nbsp; Launch: Click or Space &nbsp;|&nbsp; Pause: P or Esc</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---- Level definitions: '1' = 1-hit brick, '2' = 2-hit brick, '.' = empty ----
  const LEVELS = [
    {
      speed: 380,
      rows: [
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111'
      ]
    },
    {
      speed: 450,
      rows: [
        '2222222222',
        '1.1.11.1.1',
        '2211..1122',
        '1111111111',
        '1.2.22.2.1',
        '2111111112'
      ]
    }
  ];

  const ROW_COLORS = ['#ff5d73', '#ff9f43', '#ffd93d', '#6bcB77', '#4d96ff', '#b07cff'];
  const COLS = 10, MARGIN = 30, GAP = 6, TOP = 70, BRICK_H = 22;
  const BRICK_W = (W - MARGIN * 2 - GAP * (COLS - 1)) / COLS;
  const MAX_LIVES = 3;
  const PADDLE_SPEED = 650;

  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40 };
  const ball = { x: 0, y: 0, r: 8, vx: 0, vy: 0, speed: 380 };

  let bricks = [];
  let score = 0;
  let lives = MAX_LIVES;
  let level = 0;
  // states: 'start', 'serve', 'play', 'paused', 'levelclear', 'gameover', 'win'
  let state = 'start';
  let stateTimer = 0;

  const keys = { left: false, right: false };

  function buildLevel(index) {
    const def = LEVELS[index];
    bricks = [];
    def.rows.forEach((row, r) => {
      for (let c = 0; c < COLS; c++) {
        const ch = row[c];
        if (ch === '1' || ch === '2') {
          const hp = Number(ch);
          bricks.push({
            x: MARGIN + c * (BRICK_W + GAP),
            y: TOP + r * (BRICK_H + GAP),
            w: BRICK_W,
            h: BRICK_H,
            hp,
            maxHp: hp,
            color: ROW_COLORS[r % ROW_COLORS.length]
          });
        }
      }
    });
    ball.speed = def.speed;
  }

  function resetBallOnPaddle() {
    ball.vx = 0;
    ball.vy = 0;
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function newGame() {
    score = 0;
    lives = MAX_LIVES;
    level = 0;
    buildLevel(level);
    paddle.x = W / 2 - paddle.w / 2;
    resetBallOnPaddle();
    state = 'serve';
  }

  function launch() {
    const angle = (Math.random() * 0.6 - 0.3); // radians from vertical
    ball.vx = ball.speed * Math.sin(angle);
    ball.vy = -ball.speed * Math.cos(angle);
    state = 'play';
  }

  // Primary action: Space or mouse click
  function action() {
    switch (state) {
      case 'start':
      case 'gameover':
      case 'win':
        newGame();
        break;
      case 'serve':
        launch();
        break;
      case 'paused':
        state = 'play';
        break;
      case 'levelclear':
        if (stateTimer <= 0) nextLevel();
        break;
    }
  }

  function togglePause() {
    if (state === 'play') state = 'paused';
    else if (state === 'paused') state = 'play';
  }

  function nextLevel() {
    level++;
    buildLevel(level);
    resetBallOnPaddle();
    state = 'serve';
  }

  // ---- Input ----
  window.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
    else if (k === ' ' || k === 'Enter') { if (!e.repeat) action(); e.preventDefault(); }
    else if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });
  window.addEventListener('blur', () => {
    keys.left = keys.right = false;
    if (state === 'play') state = 'paused';
  });

  function pointerToCanvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  window.addEventListener('mousemove', e => {
    if (state === 'paused') return;
    const mx = pointerToCanvasX(e.clientX);
    paddle.x = clamp(mx - paddle.w / 2, 0, W - paddle.w);
  });
  canvas.addEventListener('mousedown', e => {
    if (e.button === 0) action();
  });
  // Touch support as a bonus
  canvas.addEventListener('touchmove', e => {
    const mx = pointerToCanvasX(e.touches[0].clientX);
    paddle.x = clamp(mx - paddle.w / 2, 0, W - paddle.w);
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchstart', e => { action(); e.preventDefault(); }, { passive: false });

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ---- Update ----
  function update(dt) {
    if (state === 'levelclear') {
      stateTimer -= dt;
      return;
    }
    if (state === 'paused' || state === 'start' || state === 'gameover' || state === 'win') return;

    // Keyboard paddle movement
    let dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir) paddle.x = clamp(paddle.x + dir * PADDLE_SPEED * dt, 0, W - paddle.w);

    if (state === 'serve') {
      resetBallOnPaddle();
      return;
    }

    // Sub-step physics to prevent tunneling
    const steps = Math.max(1, Math.ceil((ball.speed * dt) / (ball.r * 0.5)));
    const sdt = dt / steps;
    for (let i = 0; i < steps && state === 'play'; i++) step(sdt);
  }

  function step(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x + ball.r >= paddle.x &&
        ball.x - ball.r <= paddle.x + paddle.w) {
      const rel = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const angle = rel * (Math.PI / 3); // up to 60 degrees
      ball.vx = ball.speed * Math.sin(angle);
      ball.vy = -ball.speed * Math.cos(angle);
      ball.y = paddle.y - ball.r - 0.5;
    }

    // Bricks (resolve at most one per sub-step)
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const cx = clamp(ball.x, b.x, b.x + b.w);
      const cy = clamp(ball.y, b.y, b.y + b.h);
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > ball.r * ball.r) continue;

      // Determine collision side by minimal penetration
      const overlapLeft = ball.x + ball.r - b.x;
      const overlapRight = b.x + b.w - (ball.x - ball.r);
      const overlapTop = ball.y + ball.r - b.y;
      const overlapBottom = b.y + b.h - (ball.y - ball.r);
      const minX = Math.min(overlapLeft, overlapRight);
      const minY = Math.min(overlapTop, overlapBottom);
      if (minX < minY) {
        if (overlapLeft < overlapRight) { ball.x = b.x - ball.r; ball.vx = -Math.abs(ball.vx); }
        else { ball.x = b.x + b.w + ball.r; ball.vx = Math.abs(ball.vx); }
      } else {
        if (overlapTop < overlapBottom) { ball.y = b.y - ball.r; ball.vy = -Math.abs(ball.vy); }
        else { ball.y = b.y + b.h + ball.r; ball.vy = Math.abs(ball.vy); }
      }

      b.hp--;
      score += 10 * (level + 1);
      if (b.hp <= 0) score += 5 * b.maxHp;
      break;
    }

    // Level cleared?
    if (bricks.every(b => b.hp <= 0)) {
      if (level + 1 < LEVELS.length) {
        state = 'levelclear';
        stateTimer = 0.6;
      } else {
        state = 'win';
      }
      return;
    }

    // Ball lost
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) {
        state = 'gameover';
      } else {
        resetBallOnPaddle();
        state = 'serve';
      }
    }
  }

  // ---- Render ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHeart(x, y, s, filled) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, s * 0.3);
    ctx.bezierCurveTo(0, 0, -s * 0.5, 0, -s * 0.5, s * 0.3);
    ctx.bezierCurveTo(-s * 0.5, s * 0.6, 0, s * 0.8, 0, s);
    ctx.bezierCurveTo(0, s * 0.8, s * 0.5, s * 0.6, s * 0.5, s * 0.3);
    ctx.bezierCurveTo(s * 0.5, 0, 0, 0, 0, s * 0.3);
    ctx.fillStyle = filled ? '#ff4d6d' : 'rgba(255,255,255,0.15)';
    ctx.fill();
    ctx.restore();
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(0, 0, W, 44);
    ctx.font = 'bold 20px "Segoe UI", Arial, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e8ecff';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 20, 22);
    ctx.textAlign = 'center';
    ctx.fillText('Level ' + (level + 1) + ' / ' + LEVELS.length, W / 2, 22);
    ctx.textAlign = 'right';
    ctx.fillText('Lives:', W - 100, 22);
    for (let i = 0; i < MAX_LIVES; i++) {
      drawHeart(W - 80 + i * 26, 12, 20, i < lives);
    }
  }

  function drawBricks() {
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      ctx.globalAlpha = b.maxHp > 1 && b.hp === 1 ? 0.55 : 1;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
      if (b.maxHp > 1) {
        ctx.strokeStyle = b.hp > 1 ? '#ffffff' : 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 2;
        roundRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2, 4);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, '#9fb4ff');
    g.addColorStop(1, '#4d6bff');
    ctx.fillStyle = g;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#9fb4ff';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function overlay(title, lines) {
    ctx.fillStyle = 'rgba(5, 8, 20, 0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 48px "Segoe UI", Arial, sans-serif';
    ctx.fillText(title, W / 2, H / 2 - 40);
    ctx.font = '20px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = '#c4cbf0';
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 15 + i * 30));
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawPaddle();
    drawBall();
    drawHUD();

    if (state === 'start') {
      overlay('BRICK BREAKER', ['Click or press Space to start', 'Mouse or ← → / A D to move']);
    } else if (state === 'serve') {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#c4cbf0';
      ctx.font = '18px "Segoe UI", Arial, sans-serif';
      ctx.fillText('Click or press Space to launch', W / 2, H / 2 + 80);
    } else if (state === 'paused') {
      overlay('PAUSED', ['Press P / Esc, Space or click to resume']);
    } else if (state === 'levelclear') {
      overlay('LEVEL ' + (level + 1) + ' CLEAR!', ['Score: ' + score, 'Click or press Space for Level ' + (level + 2)]);
    } else if (state === 'gameover') {
      overlay('GAME OVER', ['Final score: ' + score, 'Click or press Space to play again']);
    } else if (state === 'win') {
      overlay('YOU WIN!', ['All levels cleared — final score: ' + score, 'Click or press Space to play again']);
    }
  }

  // ---- Main loop ----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  buildLevel(0);
  resetBallOnPaddle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
