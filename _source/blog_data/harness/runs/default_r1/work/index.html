<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    color: #e8ecf4;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #hud {
    width: 800px;
    max-width: 100vw;
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    padding: 6px 4px;
    box-sizing: border-box;
  }
  #hud span b { color: #ffd166; }
  canvas {
    background: #1b2030;
    border: 2px solid #3a4560;
    border-radius: 6px;
    max-width: 100vw;
    cursor: none;
  }
  #help {
    margin-top: 8px;
    font-size: 14px;
    color: #9aa6c0;
    text-align: center;
  }
</style>
</head>
<body>
<div id="hud">
  <span>Score: <b id="score">0</b></span>
  <span>Level: <b id="level">1</b> / 2</span>
  <span>Lives: <b id="lives">3</b></span>
</div>
<canvas id="game" width="800" height="600"></canvas>
<div id="help">
  Keyboard: ← / → or A / D to move, Space to launch, P to pause &nbsp;|&nbsp;
  Mouse: move to steer, click to launch
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById("score");
  const levelEl = document.getElementById("level");
  const livesEl = document.getElementById("lives");

  // ---- Level layouts ----
  // Digits = brick hit points (0 = empty). Level 2 has tougher bricks.
  const LEVELS = [
    [
      "1111111111",
      "1111111111",
      "1111111111",
      "1111111111",
      "1111111111",
    ],
    [
      "2222222222",
      "2100000012",
      "2102222012",
      "2101111012",
      "2100000012",
      "2222222222",
    ],
  ];

  const BRICK_COLS = 10;
  const BRICK_W = 70, BRICK_H = 24, BRICK_GAP = 6;
  const BRICK_TOP = 60;
  const BRICK_LEFT = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;
  const ROW_COLORS = ["#ef476f", "#f78c6b", "#ffd166", "#06d6a0", "#118ab2", "#8d6cff"];

  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_SPEED = 520;
  const BALL_R = 8;
  const BASE_SPEED = [360, 430]; // ball speed per level (px/s)

  // ---- State ----
  let state = "ready"; // ready | playing | paused | levelClear | gameOver | win
  let score = 0, lives = 3, levelIndex = 0;
  let bricks = [];
  const paddle = { x: W / 2 - PADDLE_W / 2, y: H - 40, w: PADDLE_W, h: PADDLE_H };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R, stuck: true };
  const keys = { left: false, right: false };
  let mouseX = null;

  function buildLevel(i) {
    bricks = [];
    LEVELS[i].forEach((row, r) => {
      for (let c = 0; c < row.length; c++) {
        const hp = parseInt(row[c], 10);
        if (hp > 0) {
          bricks.push({
            x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP),
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            w: BRICK_W, h: BRICK_H,
            hp, maxHp: hp,
            color: ROW_COLORS[r % ROW_COLORS.length],
          });
        }
      }
    });
  }

  function resetBall() {
    ball.stuck = true;
    ball.vx = 0;
    ball.vy = 0;
    placeBallOnPaddle();
  }

  function placeBallOnPaddle() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launchBall() {
    if (!ball.stuck) return;
    const speed = BASE_SPEED[levelIndex];
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    ball.stuck = false;
  }

  function startLevel(i) {
    levelIndex = i;
    buildLevel(i);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = "ready";
    updateHud();
  }

  function newGame() {
    score = 0;
    lives = 3;
    startLevel(0);
  }

  function updateHud() {
    scoreEl.textContent = score;
    levelEl.textContent = levelIndex + 1;
    livesEl.textContent = lives;
  }

  // ---- Primary action (Space / click) ----
  function action() {
    switch (state) {
      case "ready":
        state = "playing";
        launchBall();
        break;
      case "playing":
        launchBall();
        break;
      case "paused":
        state = "playing";
        break;
      case "levelClear":
        startLevel(levelIndex + 1);
        break;
      case "gameOver":
      case "win":
        newGame();
        break;
    }
  }

  function togglePause() {
    if (state === "playing") state = "paused";
    else if (state === "paused") state = "playing";
  }

  // ---- Input ----
  window.addEventListener("keydown", (e) => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") { keys.left = true; mouseX = null; e.preventDefault(); }
    else if (e.code === "ArrowRight" || e.code === "KeyD") { keys.right = true; mouseX = null; e.preventDefault(); }
    else if (e.code === "Space" || e.code === "Enter") { if (!e.repeat) action(); e.preventDefault(); }
    else if (e.code === "KeyP" || e.code === "Escape") { togglePause(); }
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
    else if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener("mousemove", (e) => { mouseX = canvasX(e.clientX); });
  canvas.addEventListener("mousedown", (e) => { mouseX = canvasX(e.clientX); action(); });
  canvas.addEventListener("touchmove", (e) => { mouseX = canvasX(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchstart", (e) => { mouseX = canvasX(e.touches[0].clientX); action(); e.preventDefault(); }, { passive: false });
  window.addEventListener("blur", () => { keys.left = keys.right = false; if (state === "playing") state = "paused"; });

  // ---- Physics ----
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function movePaddle(dt) {
    if (keys.left || keys.right) {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      paddle.x += dir * PADDLE_SPEED * dt;
    } else if (mouseX !== null) {
      paddle.x = mouseX - paddle.w / 2;
    }
    paddle.x = clamp(paddle.x, 0, W - paddle.w);
  }

  function circleRectHit(b, r) {
    const cx = clamp(b.x, r.x, r.x + r.w);
    const cy = clamp(b.y, r.y, r.y + r.h);
    const dx = b.x - cx, dy = b.y - cy;
    return dx * dx + dy * dy <= b.r * b.r;
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 && circleRectHit(ball, paddle)) {
      const speed = Math.hypot(ball.vx, ball.vy);
      const hit = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const angle = hit * (Math.PI / 3); // up to 60° from vertical
      ball.vx = Math.sin(angle) * speed;
      ball.vy = -Math.cos(angle) * speed;
      ball.y = paddle.y - ball.r - 0.5;
    }

    // Bricks (handle at most one per substep)
    for (const br of bricks) {
      if (br.hp <= 0 || !circleRectHit(ball, br)) continue;

      const overlapL = (ball.x + ball.r) - br.x;
      const overlapR = (br.x + br.w) - (ball.x - ball.r);
      const overlapT = (ball.y + ball.r) - br.y;
      const overlapB = (br.y + br.h) - (ball.y - ball.r);
      const minX = Math.min(overlapL, overlapR);
      const minY = Math.min(overlapT, overlapB);

      if (minX < minY) {
        ball.vx = overlapL < overlapR ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      } else {
        ball.vy = overlapT < overlapB ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      }

      br.hp--;
      score += br.hp === 0 ? 10 * br.maxHp : 5;
      updateHud();
      break;
    }

    bricks = bricks.filter(b => b.hp > 0);

    // Bottom: lose a life
    if (ball.y - ball.r > H) {
      lives--;
      updateHud();
      if (lives <= 0) {
        state = "gameOver";
      } else {
        resetBall();
        state = "ready";
      }
      return;
    }

    if (bricks.length === 0) {
      score += 100 * (levelIndex + 1); // level bonus
      updateHud();
      state = levelIndex + 1 < LEVELS.length ? "levelClear" : "win";
      resetBall();
    }
  }

  function update(dt) {
    if (state === "paused" || state === "gameOver" || state === "win" || state === "levelClear") return;
    movePaddle(dt);
    if (ball.stuck) {
      placeBallOnPaddle();
      return;
    }
    // Substeps prevent tunnelling through bricks at high speed
    const steps = Math.ceil((Math.hypot(ball.vx, ball.vy) * dt) / (ball.r * 0.75)) || 1;
    for (let i = 0; i < steps && state === "playing" && !ball.stuck; i++) {
      stepBall(dt / steps);
    }
  }

  // ---- Rendering ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBricks() {
    for (const br of bricks) {
      roundRect(br.x, br.y, br.w, br.h, 4);
      ctx.fillStyle = br.color;
      ctx.globalAlpha = br.hp < br.maxHp ? 0.55 : 1;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (br.maxHp > 1) {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = br.hp < br.maxHp ? 1 : 2;
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(br.x + 3, br.y + 3, br.w - 6, 4);
    }
  }

  function drawPaddle() {
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, "#9ad1ff");
    g.addColorStop(1, "#3a86ff");
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawLivesIcons() {
    for (let i = 0; i < lives; i++) {
      ctx.beginPath();
      ctx.arc(W - 20 - i * 22, 22, 7, 0, Math.PI * 2);
      ctx.fillStyle = "#ef476f";
      ctx.fill();
    }
    ctx.fillStyle = "#e8ecf4";
    ctx.font = "bold 18px Segoe UI, Arial";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(`Score: ${score}   Level ${levelIndex + 1}`, 14, 22);
  }

  function overlay(title, sub) {
    ctx.fillStyle = "rgba(10, 12, 20, 0.7)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffd166";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold 48px Segoe UI, Arial";
    ctx.fillText(title, W / 2, H / 2 - 30);
    ctx.fillStyle = "#e8ecf4";
    ctx.font = "20px Segoe UI, Arial";
    sub.split("\n").forEach((line, i) => ctx.fillText(line, W / 2, H / 2 + 20 + i * 28));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawPaddle();
    drawBall();
    drawLivesIcons();

    if (state === "ready") {
      ctx.fillStyle = "#e8ecf4";
      ctx.textAlign = "center";
      ctx.font = "20px Segoe UI, Arial";
      ctx.fillText(`Level ${levelIndex + 1} — press Space or click to launch`, W / 2, H / 2 + 80);
    } else if (state === "paused") {
      overlay("Paused", "Press P, Space or click to resume");
    } else if (state === "levelClear") {
      overlay(`Level ${levelIndex + 1} Clear!`, `Score: ${score}\nPress Space or click for Level ${levelIndex + 2}`);
    } else if (state === "gameOver") {
      overlay("Game Over", `Final score: ${score}\nPress Space or click to play again`);
    } else if (state === "win") {
      overlay("You Win!", `Final score: ${score}\nPress Space or click to play again`);
    }
  }

  // ---- Main loop ----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
