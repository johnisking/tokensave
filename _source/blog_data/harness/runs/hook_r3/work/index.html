<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #10131c;
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif; color: #e8ecf5;
  }
  #wrap { text-align: center; }
  canvas {
    display: block;
    width: min(96vw, calc((96vh - 40px) * 4 / 3));
    aspect-ratio: 4 / 3;
    background: linear-gradient(#1a2033, #0d1018);
    border: 2px solid #3a4466; border-radius: 6px;
    cursor: none;
  }
  #help { margin-top: 8px; font-size: 14px; color: #8a93ad; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <div id="help">Mouse or ← → / A D to move &nbsp;·&nbsp; Click or Space to launch &nbsp;·&nbsp; P to pause</div>
</div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const HUD_H = 40;

  // Level layouts: digit = brick hit points, "." = empty.
  const LEVELS = [
    {
      speed: 330,
      rows: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      speed: 400,
      rows: [
        "2.222222.2",
        "2222222222",
        ".11.22.11.",
        "1111111111",
        "2.111111.2",
        ".22222222.",
      ],
    },
  ];
  const COLORS = ["#ff5d6c", "#ff9f43", "#feca57", "#1dd1a1", "#54a0ff", "#a29bfe"];

  const BRICK_COLS = 10, BRICK_H = 22, BRICK_GAP = 6, BRICK_TOP = HUD_H + 40, SIDE = 30;
  const BRICK_W = (W - SIDE * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;

  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 560 };
  const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0, speed: 330 };

  let bricks = [];
  let score = 0, lives = 3, level = 0;
  // state: "serve" | "play" | "paused" | "levelclear" | "gameover" | "win"
  let state = "serve";
  const keys = { left: false, right: false };
  let mouseActive = false;

  function buildLevel(n) {
    bricks = [];
    const L = LEVELS[n];
    L.rows.forEach((row, r) => {
      for (let c = 0; c < BRICK_COLS; c++) {
        const ch = row[c];
        if (!ch || ch === ".") continue;
        const hp = parseInt(ch, 10);
        bricks.push({
          x: SIDE + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H,
          hp, maxHp: hp,
          color: COLORS[r % COLORS.length],
        });
      }
    });
    ball.speed = L.speed;
  }

  function resetBall() {
    state = "serve";
    ball.vx = 0; ball.vy = 0;
    stickBall();
  }

  function stickBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launch() {
    if (state !== "serve") return;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    state = "play";
  }

  function newGame() {
    score = 0; lives = 3; level = 0;
    buildLevel(level);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
  }

  function nextLevel() {
    level++;
    buildLevel(level);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
  }

  // Primary action: launch / continue / restart.
  function action() {
    if (state === "serve") launch();
    else if (state === "levelclear") nextLevel();
    else if (state === "gameover" || state === "win") newGame();
    else if (state === "paused") state = "play";
  }

  function togglePause() {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }

  // ---------- Input ----------
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; mouseActive = false; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; mouseActive = false; e.preventDefault(); }
    else if (k === " " || k === "Enter") { action(); e.preventDefault(); }
    else if (k === "p" || k === "P" || k === "Escape") togglePause();
  });
  document.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });
  canvas.addEventListener("mousemove", (e) => {
    if (state === "paused") return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = clamp(mx - paddle.w / 2, 0, W - paddle.w);
    mouseActive = true;
  });
  canvas.addEventListener("mousedown", (e) => { e.preventDefault(); action(); });
  window.addEventListener("blur", () => { keys.left = keys.right = false; if (state === "play") state = "paused"; });

  // ---------- Update ----------
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function update(dt) {
    if (state === "paused" || state === "gameover" || state === "win" || state === "levelclear") return;

    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir) paddle.x = clamp(paddle.x + dir * paddle.speed * dt, 0, W - paddle.w);

    if (state === "serve") { stickBall(); return; }

    // Sub-step to avoid tunneling through bricks.
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / (ball.r * 0.5)));
    const sdt = dt / steps;
    for (let i = 0; i < steps && state === "play"; i++) stepBall(sdt);
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < HUD_H) { ball.y = HUD_H + ball.r; ball.vy = Math.abs(ball.vy); }

    // Bottom: lose a life
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) { lives = 0; state = "gameover"; }
      else resetBall();
      return;
    }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x + ball.r >= paddle.x && ball.x - ball.r <= paddle.x + paddle.w) {
      const hit = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const angle = hit * (Math.PI / 3); // up to 60° from vertical
      const sp = Math.hypot(ball.vx, ball.vy);
      ball.vx = Math.sin(angle) * sp;
      ball.vy = -Math.cos(angle) * sp;
      ball.y = paddle.y - ball.r - 0.5;
    }

    // Bricks (one collision per sub-step)
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const nx = clamp(ball.x, b.x, b.x + b.w);
      const ny = clamp(ball.y, b.y, b.y + b.h);
      const dx = ball.x - nx, dy = ball.y - ny;
      if (dx * dx + dy * dy > ball.r * ball.r) continue;

      // Decide bounce axis by smallest penetration.
      const overlapL = ball.x + ball.r - b.x;
      const overlapR = b.x + b.w - (ball.x - ball.r);
      const overlapT = ball.y + ball.r - b.y;
      const overlapB = b.y + b.h - (ball.y - ball.r);
      const minX = Math.min(overlapL, overlapR);
      const minY = Math.min(overlapT, overlapB);
      if (minX < minY) {
        ball.vx = overlapL < overlapR ? -Math.abs(ball.vx) : Math.abs(ball.vx);
        ball.x += overlapL < overlapR ? -minX : minX;
      } else {
        ball.vy = overlapT < overlapB ? -Math.abs(ball.vy) : Math.abs(ball.vy);
        ball.y += overlapT < overlapB ? -minY : minY;
      }

      b.hp--;
      if (b.hp <= 0) {
        score += 10 * b.maxHp * (level + 1);
        bricks.splice(i, 1);
      } else {
        score += 5;
      }

      // Slight speed-up per hit, capped.
      const sp = Math.hypot(ball.vx, ball.vy);
      const target = Math.min(sp * 1.01, LEVELS[level].speed * 1.6);
      ball.vx *= target / sp; ball.vy *= target / sp;

      if (bricks.length === 0) {
        state = level < LEVELS.length - 1 ? "levelclear" : "win";
      }
      break;
    }
  }

  // ---------- Render ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHeart(x, y, s, filled) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, s * 0.3);
    ctx.bezierCurveTo(0, 0, -s * 0.5, 0, -s * 0.5, s * 0.3);
    ctx.bezierCurveTo(-s * 0.5, s * 0.6, 0, s * 0.8, 0, s);
    ctx.bezierCurveTo(0, s * 0.8, s * 0.5, s * 0.6, s * 0.5, s * 0.3);
    ctx.bezierCurveTo(s * 0.5, 0, 0, 0, 0, s * 0.3);
    ctx.fillStyle = filled ? "#ff5d6c" : "#3a4466";
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // HUD
    ctx.fillStyle = "#141a2b";
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.fillStyle = "#3a4466";
    ctx.fillRect(0, HUD_H - 2, W, 2);
    ctx.font = "bold 20px Segoe UI, Arial";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#e8ecf5";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, HUD_H / 2);
    ctx.textAlign = "center";
    ctx.fillText("Level " + (level + 1) + " / " + LEVELS.length, W / 2, HUD_H / 2);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 96, HUD_H / 2);
    for (let i = 0; i < 3; i++) drawHeart(W - 76 + i * 26, HUD_H / 2 - 9, 18, i < lives);

    // Bricks
    for (const b of bricks) {
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.hp < b.maxHp ? 0.55 : 1;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.maxHp > 1) {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
    }

    // Paddle
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, "#dfe6ff");
    g.addColorStop(1, "#7f8fd1");
    ctx.fillStyle = g;
    ctx.fill();

    // Ball
    if (state !== "gameover") {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#9fb4ff";
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Overlays
    if (state === "serve") {
      message("Level " + (level + 1), "Click or press Space to launch");
    } else if (state === "paused") {
      message("Paused", "Press P, Space or click to resume");
    } else if (state === "levelclear") {
      message("Level " + (level + 1) + " Clear!", "Click or press Space for Level " + (level + 2));
    } else if (state === "gameover") {
      message("Game Over", "Final score: " + score + "  ·  Click or press Space to restart");
    } else if (state === "win") {
      message("You Win!", "Final score: " + score + "  ·  Click or press Space to play again");
    }
  }

  function message(title, sub) {
    const dim = state !== "serve";
    if (dim) {
      ctx.fillStyle = "rgba(10,12,20,0.65)";
      ctx.fillRect(0, HUD_H, W, H - HUD_H);
    }
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 44px Segoe UI, Arial";
    ctx.fillText(title, W / 2, H / 2 + 40);
    ctx.font = "18px Segoe UI, Arial";
    ctx.fillStyle = "#c5cce0";
    ctx.fillText(sub, W / 2, H / 2 + 84);
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
