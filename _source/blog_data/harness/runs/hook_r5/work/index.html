<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    color: #e8ecf4;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #1a1f2e;
    border: 2px solid #2e3650;
    border-radius: 6px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
    touch-action: none;
  }
  p.help {
    margin: 10px 0 0;
    font-size: 14px;
    color: #9aa3b8;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p class="help">Move: ← → / A D or mouse &nbsp;·&nbsp; Launch: Space or click &nbsp;·&nbsp; Pause: P</p>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ---------- Config ----------
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 520;
  const BALL_R = 8;
  const BRICK_COLS = 10, BRICK_H = 22, BRICK_GAP = 6, BRICK_TOP = 70, BRICK_SIDE = 30;
  const BRICK_W = (W - BRICK_SIDE * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;
  const START_LIVES = 3;

  // Level layouts: digit = brick hit points (0 = empty)
  const LEVELS = [
    {
      speed: 340,
      map: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      speed: 400,
      map: [
        "2222222222",
        "2111111112",
        "2120000212",
        "2120330212",
        "2120000212",
        "2111111112",
        "2222222222",
      ],
    },
  ];

  const COLORS = { 1: ["#4fc3f7", "#81d4fa"], 2: ["#ffb74d", "#ffd54f"], 3: ["#e57373", "#ef9a9a"] };

  // ---------- State ----------
  let state = "title"; // title | serve | play | paused | levelclear | gameover | win
  let levelIndex = 0, score = 0, lives = START_LIVES;
  let bricks = [];
  const paddle = { x: W / 2 - PADDLE_W / 2, w: PADDLE_W };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, speed: 0 };
  const keys = { left: false, right: false };
  let mouseX = null;
  let particles = [];

  function buildLevel(i) {
    bricks = [];
    LEVELS[i].map.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        const hp = parseInt(ch, 10);
        if (hp > 0) {
          bricks.push({
            x: BRICK_SIDE + c * (BRICK_W + BRICK_GAP),
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            w: BRICK_W, h: BRICK_H, hp, maxHp: hp,
          });
        }
      });
    });
  }

  function resetBall() {
    ball.speed = LEVELS[levelIndex].speed;
    ball.vx = 0; ball.vy = 0;
    stickBall();
  }

  function stickBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = PADDLE_Y - BALL_R - 1;
  }

  function launch() {
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    state = "play";
  }

  function newGame() {
    levelIndex = 0; score = 0; lives = START_LIVES;
    buildLevel(levelIndex);
    resetBall();
    state = "serve";
  }

  function nextLevel() {
    levelIndex++;
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = "serve";
  }

  // Primary action (Space / click)
  function action() {
    switch (state) {
      case "title": newGame(); break;
      case "serve": launch(); break;
      case "paused": state = "play"; break;
      case "levelclear": nextLevel(); break;
      case "gameover":
      case "win": newGame(); break;
    }
  }

  // ---------- Input ----------
  window.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; mouseX = null; }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; mouseX = null; }
    else if (k === " " || k === "Enter") { action(); }
    else if (k === "p" || k === "P" || k === "Escape") {
      if (state === "play") state = "paused";
      else if (state === "paused") state = "play";
    } else return;
    e.preventDefault();
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener("mousemove", (e) => { mouseX = canvasX(e.clientX); });
  canvas.addEventListener("mousedown", (e) => { mouseX = canvasX(e.clientX); action(); });
  canvas.addEventListener("touchstart", (e) => { mouseX = canvasX(e.touches[0].clientX); action(); e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchmove", (e) => { mouseX = canvasX(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  window.addEventListener("blur", () => { keys.left = keys.right = false; if (state === "play") state = "paused"; });

  // ---------- Update ----------
  function updatePaddle(dt) {
    if (keys.left || keys.right) {
      paddle.x += ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * PADDLE_SPEED * dt;
    } else if (mouseX !== null) {
      paddle.x = mouseX - paddle.w / 2;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function circleRect(cx, cy, r, rect) {
    const nx = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    const ny = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function hitBrick(b) {
    b.hp--;
    if (b.hp <= 0) {
      score += 10 * b.maxHp;
      spawnParticles(b.x + b.w / 2, b.y + b.h / 2, COLORS[b.maxHp][0]);
    } else {
      score += 5;
    }
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  function moveBallAxis(dt, axis) {
    if (axis === "x") ball.x += ball.vx * dt; else ball.y += ball.vy * dt;
    for (const b of bricks) {
      if (b.hp > 0 && circleRect(ball.x, ball.y, BALL_R, b)) {
        // Back out along this axis and reflect
        if (axis === "x") { ball.x -= ball.vx * dt; ball.vx = -ball.vx; }
        else { ball.y -= ball.vy * dt; ball.vy = -ball.vy; }
        hitBrick(b);
        return;
      }
    }
  }

  function updateBall(dt) {
    // Sub-step to avoid tunnelling at high speed
    const steps = Math.ceil((ball.speed * dt) / (BALL_R * 0.75));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      moveBallAxis(sdt, "x");
      moveBallAxis(sdt, "y");

      // Walls
      if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
      if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
      if (ball.y < BALL_R) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

      // Paddle
      const pr = { x: paddle.x, y: PADDLE_Y, w: paddle.w, h: PADDLE_H };
      if (ball.vy > 0 && circleRect(ball.x, ball.y, BALL_R, pr)) {
        const rel = ((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2));
        const clamped = Math.max(-1, Math.min(1, rel));
        const angle = clamped * (Math.PI / 3); // up to 60° from vertical
        ball.speed = Math.min(ball.speed * 1.015, LEVELS[levelIndex].speed * 1.6);
        ball.vx = Math.sin(angle) * ball.speed;
        ball.vy = -Math.cos(angle) * ball.speed;
        ball.y = PADDLE_Y - BALL_R - 0.5;
      }

      // Fell off
      if (ball.y - BALL_R > H) {
        lives--;
        if (lives <= 0) { state = "gameover"; }
        else { resetBall(); state = "serve"; }
        return;
      }

      if (bricks.every((b) => b.hp <= 0)) {
        state = levelIndex + 1 < LEVELS.length ? "levelclear" : "win";
        return;
      }
    }
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt;
    }
    particles = particles.filter((p) => p.life > 0);
  }

  // ---------- Draw ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "#e8ecf4";
    ctx.font = "bold 20px system-ui, sans-serif";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 20, 30);
    ctx.textAlign = "center";
    ctx.fillText("Level " + (levelIndex + 1) + " / " + LEVELS.length, W / 2, 30);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 20 - START_LIVES * 22, 30);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 20 - (START_LIVES - 1 - i) * 22 - 8, 30, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff6b81" : "#3a4260";
      ctx.fill();
    }
    ctx.strokeStyle = "#2e3650";
    ctx.beginPath(); ctx.moveTo(0, 52); ctx.lineTo(W, 52); ctx.stroke();
  }

  function drawBricks() {
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const [base, light] = COLORS[b.hp];
      const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
      g.addColorStop(0, light); g.addColorStop(1, base);
      ctx.fillStyle = g;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      if (b.hp < b.maxHp) {
        ctx.strokeStyle = "rgba(0,0,0,0.35)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x + b.w * 0.3, b.y + 3);
        ctx.lineTo(b.x + b.w * 0.5, b.y + b.h * 0.6);
        ctx.lineTo(b.x + b.w * 0.7, b.y + b.h - 3);
        ctx.stroke();
        ctx.lineWidth = 1;
      }
    }
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
    g.addColorStop(0, "#c5cae9"); g.addColorStop(1, "#7986cb");
    ctx.fillStyle = g;
    roundRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H, 7);
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function overlay(title, sub) {
    ctx.fillStyle = "rgba(10,12,20,0.7)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 48px system-ui, sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 30);
    ctx.font = "20px system-ui, sans-serif";
    ctx.fillStyle = "#c0c8dc";
    sub.split("\n").forEach((line, i) => ctx.fillText(line, W / 2, H / 2 + 25 + i * 30));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawHUD();
    drawBricks();
    drawParticles();
    drawPaddle();
    drawBall();

    switch (state) {
      case "title":
        overlay("BRICK BREAKER", "Arrow keys / A D or mouse to move\nPress Space or click to start");
        break;
      case "serve":
        ctx.textAlign = "center"; ctx.fillStyle = "#c0c8dc"; ctx.font = "18px system-ui, sans-serif";
        ctx.fillText("Press Space or click to launch", W / 2, H / 2 + 80);
        break;
      case "paused":
        overlay("PAUSED", "Press P, Space or click to resume");
        break;
      case "levelclear":
        overlay("LEVEL " + (levelIndex + 1) + " CLEAR!", "Score: " + score + "\nPress Space or click for Level " + (levelIndex + 2));
        break;
      case "gameover":
        overlay("GAME OVER", "Final score: " + score + "\nPress Space or click to play again");
        break;
      case "win":
        overlay("YOU WIN!", "Final score: " + score + "\nPress Space or click to play again");
        break;
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;

    if (state === "serve" || state === "play" || state === "title") updatePaddle(dt);
    if (state === "serve" || state === "title") stickBall();
    if (state === "play") updateBall(dt);
    updateParticles(dt);

    draw();
    requestAnimationFrame(frame);
  }

  buildLevel(0);
  resetBall();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
