<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brick Breaker</title>
<style>
  html,body{margin:0;height:100%;background:#111;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;color:#eee}
  #wrap{text-align:center}
  canvas{background:#000;border:2px solid #444;display:block;cursor:none;max-width:100vw;max-height:90vh}
  p{margin:6px 0;font-size:13px;color:#999}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="800" height="600"></canvas>
<p>Mouse or ←/→ (A/D) to move · Click or Space to launch · P to pause · Enter/click to restart</p>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const LEVELS = [
    // Level 1: digits = hit points, '.' = empty
    [
      "1111111111",
      "1111111111",
      "1111111111",
      "1111111111",
      "1111111111"
    ],
    // Level 2: tougher bricks and gaps
    [
      "2222222222",
      "2.1111111.2",
      "2121..1212",
      "1212..2121",
      "2.111111.2",
      "2222222222"
    ]
  ];
  const COLORS = { 1: ['#4fc3f7', '#29b6f6'], 2: ['#ef5350', '#ff8a65'] };
  const COLS = 10, BW = 70, BH = 22, GAP = 6, TOP = 70;
  const LEFT = (W - (COLS * BW + (COLS - 1) * GAP)) / 2;

  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 9 };
  const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0, stuck: true };
  const BASE_SPEED = [6, 7.2];

  let bricks = [], score = 0, lives = 3, level = 0;
  let state = 'play'; // play | paused | gameover | win | levelclear
  let stateTimer = 0;
  const keys = {};

  function buildLevel(n) {
    bricks = [];
    LEVELS[n].forEach((row, r) => {
      for (let c = 0; c < COLS; c++) {
        const ch = row[c];
        const hp = parseInt(ch, 10);
        if (!hp) continue;
        bricks.push({ x: LEFT + c * (BW + GAP), y: TOP + r * (BH + GAP), w: BW, h: BH, hp, maxHp: hp });
      }
    });
  }

  function resetBall() {
    ball.stuck = true;
    ball.vx = ball.vy = 0;
    placeBallOnPaddle();
  }
  function placeBallOnPaddle() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launch() {
    if (state === 'gameover' || state === 'win') { newGame(); return; }
    if (state !== 'play' || !ball.stuck) return;
    const s = BASE_SPEED[level];
    const ang = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(ang) * s;
    ball.vy = Math.sin(ang) * s;
    ball.stuck = false;
  }

  function newGame() {
    score = 0; lives = 3; level = 0;
    buildLevel(level);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = 'play';
  }

  // ---------- Input ----------
  document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); launch(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
    if (e.key === 'p' || e.key === 'P') {
      if (state === 'play') state = 'paused';
      else if (state === 'paused') state = 'play';
    }
    if (e.key === 'Enter' && (state === 'gameover' || state === 'win')) newGame();
  });
  document.addEventListener('keyup', e => { keys[e.key] = false; });

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
  });
  canvas.addEventListener('mousedown', e => { e.preventDefault(); launch(); });

  // ---------- Update ----------
  function update(dt) {
    if (state === 'levelclear') {
      stateTimer -= dt;
      if (stateTimer <= 0) {
        level++;
        buildLevel(level);
        resetBall();
        state = 'play';
      }
      return;
    }
    if (state !== 'play') return;

    // keyboard paddle
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed * dt;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed * dt;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (ball.stuck) { placeBallOnPaddle(); return; }

    // sub-step to avoid tunneling
    const steps = Math.ceil(Math.max(Math.abs(ball.vx), Math.abs(ball.vy)) * dt / 4);
    for (let i = 0; i < steps; i++) {
      if (stepBall(dt / steps)) break;
    }
  }

  // returns true if ball lost / level ended
  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // bottom
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) { state = 'gameover'; }
      else resetBall();
      return true;
    }

    // paddle
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x + ball.r >= paddle.x && ball.x - ball.r <= paddle.x + paddle.w) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const clamped = Math.max(-1, Math.min(1, hit));
      const speed = Math.hypot(ball.vx, ball.vy);
      const ang = clamped * (Math.PI / 3); // up to 60deg
      ball.vx = speed * Math.sin(ang);
      ball.vy = -speed * Math.cos(ang);
      ball.y = paddle.y - ball.r - 0.1;
    }

    // bricks
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy <= ball.r * ball.r) {
        // determine bounce axis by penetration depth
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (overlapX < overlapY) {
          ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
        } else {
          ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
        }
        b.hp--;
        if (b.hp <= 0) {
          score += 10 * b.maxHp * (level + 1);
          bricks.splice(i, 1);
        } else {
          score += 5;
        }
        // slight speed-up
        const sp = Math.hypot(ball.vx, ball.vy);
        const max = BASE_SPEED[level] * 1.6;
        if (sp < max) { ball.vx *= 1.01; ball.vy *= 1.01; }

        if (bricks.length === 0) {
          if (level < LEVELS.length - 1) { state = 'levelclear'; stateTimer = 120; }
          else state = 'win';
          return true;
        }
        break; // one brick per step
      }
    }
    return false;
  }

  // ---------- Draw ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 16, 32);
    ctx.textAlign = 'center';
    ctx.fillText('Level ' + (level + 1) + ' / ' + LEVELS.length, W / 2, 32);
    ctx.textAlign = 'right';
    ctx.fillText('Lives: ', W - 16 - 3 * 22, 32);
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - 8 - i * 22, 25, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? '#ff5252' : '#333';
      ctx.fill();
    }
    ctx.strokeStyle = '#333';
    ctx.beginPath(); ctx.moveTo(0, 48); ctx.lineTo(W, 48); ctx.stroke();

    // bricks
    for (const b of bricks) {
      const col = COLORS[b.maxHp] || COLORS[1];
      ctx.fillStyle = b.hp > 1 ? col[0] : col[b.maxHp > 1 ? 1 : 0];
      if (b.maxHp > 1 && b.hp === 1) ctx.globalAlpha = 0.6;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
    }

    // paddle
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, '#fff176'); g.addColorStop(1, '#f9a825');
    ctx.fillStyle = g;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();

    // ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // overlays
    ctx.textAlign = 'center';
    if (state === 'play' && ball.stuck) {
      ctx.fillStyle = '#ccc';
      ctx.font = '18px Arial';
      ctx.fillText('Click or press Space to launch', W / 2, H / 2 + 60);
    }
    if (state === 'paused') overlay('PAUSED', 'Press P to resume');
    if (state === 'levelclear') overlay('LEVEL ' + (level + 1) + ' CLEAR!', 'Get ready for level ' + (level + 2));
    if (state === 'gameover') overlay('GAME OVER', 'Score: ' + score + ' — Click or press Enter to restart');
    if (state === 'win') overlay('YOU WIN!', 'Final score: ' + score + ' — Click or press Enter to play again');
  }

  function overlay(title, sub) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px Arial';
    ctx.fillText(title, W / 2, H / 2 - 10);
    ctx.font = '20px Arial';
    ctx.fillText(sub, W / 2, H / 2 + 30);
  }

  // ---------- Loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(3, (now - last) / (1000 / 60)); // 1 = one 60fps frame
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
