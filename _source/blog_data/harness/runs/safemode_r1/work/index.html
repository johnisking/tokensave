<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brick Breaker</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; display: flex; align-items: center; justify-content: center; font-family: sans-serif; color: #eee; }
  canvas { background: #000; border: 2px solid #444; cursor: none; }
  #help { position: fixed; bottom: 8px; width: 100%; text-align: center; font-size: 13px; color: #888; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div id="help">Move: Mouse or ←/→ (A/D) &nbsp;|&nbsp; Launch: Click or Space &nbsp;|&nbsp; Pause: P</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const LEVELS = [
  // 1 = normal brick, 2 = two-hit brick, 0 = empty
  [
    "1111111111",
    "1111111111",
    "1111111111",
    "1111111111",
    "1111111111"
  ],
  [
    "2222222222",
    "2111111112",
    "2101111012",
    "2111001112",
    "2101111012",
    "2111111112",
    "2222222222"
  ]
];
const COLORS = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#1abc9c'];

const BRICK_COLS = 10, BRICK_W = 70, BRICK_H = 22, BRICK_GAP = 6;
const BRICK_OFFSET_X = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;
const BRICK_OFFSET_Y = 70;

const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 9 };
const ball = { x: 0, y: 0, r: 8, dx: 0, dy: 0, stuck: true };

let bricks = [];
let level = 0, score = 0, lives = 3;
let state = 'start'; // start | playing | paused | levelclear | gameover | win
const keys = {};

function loadLevel(n) {
  bricks = [];
  LEVELS[n].forEach((row, r) => {
    [...row].forEach((c, col) => {
      const hp = +c;
      if (hp > 0) bricks.push({
        x: BRICK_OFFSET_X + col * (BRICK_W + BRICK_GAP),
        y: BRICK_OFFSET_Y + r * (BRICK_H + BRICK_GAP),
        hp, maxHp: hp, color: COLORS[r % COLORS.length]
      });
    });
  });
  resetBall();
}

function resetBall() {
  paddle.x = W / 2 - paddle.w / 2;
  ball.stuck = true;
  ball.dx = 0; ball.dy = 0;
  placeBallOnPaddle();
}

function placeBallOnPaddle() {
  ball.x = paddle.x + paddle.w / 2;
  ball.y = paddle.y - ball.r - 1;
}

function launch() {
  if (!ball.stuck) return;
  const speed = 5.5 + level * 1.2;
  const angle = (Math.random() * 0.6 - 0.3) - Math.PI / 2;
  ball.dx = Math.cos(angle) * speed;
  ball.dy = Math.sin(angle) * speed;
  ball.stuck = false;
}

function newGame() {
  level = 0; score = 0; lives = 3;
  loadLevel(level);
  state = 'playing';
}

function action() {
  if (state === 'start' || state === 'gameover' || state === 'win') newGame();
  else if (state === 'levelclear') { level++; loadLevel(level); state = 'playing'; }
  else if (state === 'playing') launch();
  else if (state === 'paused') state = 'playing';
}

// Input
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); action(); }
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }
  if (['ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
});
canvas.addEventListener('mousedown', e => { e.preventDefault(); action(); });

function update() {
  if (state !== 'playing') return;

  if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (ball.stuck) { placeBallOnPaddle(); return; }

  // Sub-step to avoid tunneling
  const steps = Math.ceil(Math.max(Math.abs(ball.dx), Math.abs(ball.dy)) / 4);
  for (let s = 0; s < steps; s++) {
    ball.x += ball.dx / steps;
    ball.y += ball.dy / steps;
    if (collide()) break;
  }
}

function collide() {
  // Walls
  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
  if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

  // Bottom: lose life
  if (ball.y - ball.r > H) {
    lives--;
    if (lives <= 0) state = 'gameover';
    else resetBall();
    return true;
  }

  // Paddle
  if (ball.dy > 0 &&
      ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + ball.dy &&
      ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
    const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
    const clamped = Math.max(-1, Math.min(1, hit));
    const speed = Math.hypot(ball.dx, ball.dy);
    const angle = clamped * (Math.PI / 3); // up to 60deg
    ball.dx = Math.sin(angle) * speed;
    ball.dy = -Math.cos(angle) * speed;
    ball.y = paddle.y - ball.r;
    return true;
  }

  // Bricks
  for (let i = 0; i < bricks.length; i++) {
    const b = bricks[i];
    const cx = Math.max(b.x, Math.min(ball.x, b.x + BRICK_W));
    const cy = Math.max(b.y, Math.min(ball.y, b.y + BRICK_H));
    const ddx = ball.x - cx, ddy = ball.y - cy;
    if (ddx * ddx + ddy * ddy <= ball.r * ball.r) {
      // Determine bounce axis by penetration
      const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BRICK_W - (ball.x - ball.r));
      const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BRICK_H - (ball.y - ball.r));
      if (overlapX < overlapY) ball.dx = -ball.dx; else ball.dy = -ball.dy;

      b.hp--;
      if (b.hp <= 0) {
        score += 10 * b.maxHp * (level + 1);
        bricks.splice(i, 1);
      } else {
        score += 5;
      }
      if (bricks.length === 0) {
        state = level < LEVELS.length - 1 ? 'levelclear' : 'win';
      }
      return true;
    }
  }
  return false;
}

function drawRoundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

function drawOverlay(title, sub) {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 48px sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 10);
  ctx.font = '20px sans-serif';
  ctx.fillText(sub, W / 2, H / 2 + 30);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '20px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Score: ' + score, 16, 32);
  ctx.textAlign = 'center';
  ctx.fillText('Level ' + (level + 1) + ' / ' + LEVELS.length, W / 2, 32);
  ctx.textAlign = 'right';
  ctx.fillText('Lives: ' + '♥'.repeat(Math.max(0, lives)), W - 16, 32);

  // Bricks
  for (const b of bricks) {
    ctx.fillStyle = b.color;
    ctx.globalAlpha = b.hp < b.maxHp ? 0.5 : 1;
    drawRoundRect(b.x, b.y, BRICK_W, BRICK_H, 4);
    if (b.maxHp > 1 && b.hp === b.maxHp) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x + 3, b.y + 3, BRICK_W - 6, BRICK_H - 6);
    }
    ctx.globalAlpha = 1;
  }

  // Paddle
  ctx.fillStyle = '#ecf0f1';
  drawRoundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);

  // Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  if (state === 'playing' && ball.stuck) {
    ctx.fillStyle = '#aaa';
    ctx.textAlign = 'center';
    ctx.font = '18px sans-serif';
    ctx.fillText('Click or press Space to launch', W / 2, H / 2 + 80);
  }

  if (state === 'start') drawOverlay('BRICK BREAKER', 'Click or press Space to start');
  else if (state === 'paused') drawOverlay('PAUSED', 'Press P or click to resume');
  else if (state === 'levelclear') drawOverlay('LEVEL ' + (level + 1) + ' CLEAR!', 'Click or press Space for level ' + (level + 2));
  else if (state === 'gameover') drawOverlay('GAME OVER', 'Score: ' + score + ' — Click or press Space to restart');
  else if (state === 'win') drawOverlay('YOU WIN!', 'Final score: ' + score + ' — Click or press Space to play again');
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loadLevel(0);
loop();
</script>
</body>
</html>
