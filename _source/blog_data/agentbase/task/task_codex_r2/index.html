<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Breaker</title>
<style>
  :root { color-scheme: dark; --ink:#eff7ff; --muted:#9eb4d1; --panel:#101a31; }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:22px; color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 50% 0%,#1a3560 0,#0b1224 52%,#070b16 100%); }
  .game { width:min(100%,800px); }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:0 2px 14px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .mark { width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#55f0d2,#40a8ff);color:#081629;font-size:22px;font-weight:900;box-shadow:0 0 28px #48caff55; }
  h1 { margin:0;font-size:clamp(20px,4vw,28px);letter-spacing:.02em; }
  .subtitle { color:var(--muted);font-size:12px;margin-top:2px; }
  .stats { display:flex;gap:8px; }
  .stat { min-width:76px;padding:8px 12px;border:1px solid #ffffff15;border-radius:12px;background:#101a31cc;text-align:center; }
  .stat span { display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.13em; }
  .stat strong { display:block;margin-top:2px;font-variant-numeric:tabular-nums;font-size:18px; }
  .board { position:relative;overflow:hidden;border:1px solid #8bb6ff35;border-radius:18px;background:#090f20;box-shadow:0 24px 80px #0008,0 0 40px #388dff15; }
  canvas { display:block;width:100%;height:auto;aspect-ratio:800/540;touch-action:none; }
  .overlay { position:absolute;inset:0;display:grid;place-items:center;background:#081020b8;backdrop-filter:blur(5px);transition:opacity .2s; }
  .overlay.hidden { opacity:0;pointer-events:none; }
  .card { width:min(88%,390px);padding:26px;text-align:center;border:1px solid #a8c8ff35;border-radius:18px;background:linear-gradient(145deg,#172542f2,#0e172bf2);box-shadow:0 18px 60px #0008; }
  .card h2 { margin:0 0 9px;font-size:26px; }
  .card p { margin:0 0 20px;color:#b7c7df;line-height:1.55;font-size:14px; }
  button { border:0;border-radius:10px;padding:12px 22px;background:linear-gradient(100deg,#52e4ca,#62baff);color:#071525;font:700 14px inherit;cursor:pointer; }
  button:hover { filter:brightness(1.1);transform:translateY(-1px); }
  .help { display:flex;justify-content:space-between;gap:12px;margin:12px 3px 0;color:var(--muted);font-size:12px; }
  .keys { display:flex;gap:6px;align-items:center; }
  kbd { padding:3px 7px;border:1px solid #ffffff26;border-radius:5px;background:#ffffff0b;color:#dce8f8;font:inherit;font-size:11px; }
  @media(max-width:560px) { body{padding:12px}.subtitle{display:none}.stat{min-width:58px;padding:7px 8px}.help{font-size:11px;flex-direction:column;align-items:center}.card{padding:20px} }
</style>
</head>
<body>
<main class="game">
  <header>
    <div class="brand"><div class="mark">✦</div><div><h1>NEON BREAKER</h1><div class="subtitle">Clear the field. Keep the ball in play.</div></div></div>
    <div class="stats" aria-live="polite">
      <div class="stat"><span>Score</span><strong id="score">0</strong></div>
      <div class="stat"><span>Lives</span><strong id="lives">♥ ♥ ♥</strong></div>
      <div class="stat"><span>Level</span><strong id="level">1 / 2</strong></div>
    </div>
  </header>
  <section class="board" aria-label="Brick breaker game">
    <canvas id="game" width="800" height="540" aria-label="Game field. Move the paddle with the arrow keys or mouse."></canvas>
    <div class="overlay" id="overlay"><div class="card"><h2 id="messageTitle">Ready?</h2><p id="messageText">Break every brick across two levels. Move with your mouse or the ← → keys. Press Space to launch.</p><button id="startButton">Start game</button></div></div>
  </section>
  <div class="help"><span class="keys"><kbd>←</kbd><kbd>→</kbd> or mouse to move <kbd>Space</kbd> to launch / pause</span><span>Clear all bricks to advance · You have 3 lives</span></div>
</main>
<script>
(() => {
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const W=canvas.width,H=canvas.height, scoreEl=document.getElementById('score'), livesEl=document.getElementById('lives'), levelEl=document.getElementById('level');
  const overlay=document.getElementById('overlay'), titleEl=document.getElementById('messageTitle'), textEl=document.getElementById('messageText'), button=document.getElementById('startButton');
  const paddle={w:112,h:13,x:(W-112)/2,y:H-38,speed:7};
  const ball={x:W/2,y:paddle.y-12,r:8,vx:3.1,vy:-4.6};
  let score=0,lives=3,level=1,bricks=[],running=false,launched=false,keys={};
  const palettes=[['#58e6d0','#51c6ec','#5c9dff','#9a81ff'],['#ffdf70','#ffab63','#ff7e9a','#d880ff']];
  function buildLevel(n){
    bricks=[]; const rows=n===1?5:6,cols=10,gap=8,bw=65,bh=21,left=(W-(cols*bw+(cols-1)*gap))/2,top=72;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
      if(n===2 && r>1 && (c===0||c===cols-1) && r%2===0) continue;
      bricks.push({x:left+c*(bw+gap),y:top+r*(bh+gap),w:bw,h:bh,hp:n===2&&r<2?2:1,color:palettes[n-1][r%4],flash:0});
    }
    levelEl.textContent=n+' / 2';
  }
  function resetBall(){ launched=false; ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-1;ball.vx=(Math.random()>.5?1:-1)*3.1;ball.vy=-4.6; }
  function setOverlay(title,text,buttonText){ titleEl.textContent=title;textEl.textContent=text;button.textContent=buttonText;overlay.classList.remove('hidden'); }
  function hideOverlay(){overlay.classList.add('hidden')}
  function start(){ if(lives<=0||level>2){score=0;lives=3;level=1;buildLevel(level);updateHud()} hideOverlay();running=true;resetBall(); }
  function updateHud(){scoreEl.textContent=score;livesEl.textContent='♥ '.repeat(lives).trim()||'—';levelEl.textContent=Math.min(level,2)+' / 2';}
  button.addEventListener('click',start);
  document.addEventListener('keydown',e=>{ if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Space'){if(!running)start();else if(!launched)launched=true;} });
  document.addEventListener('keyup',e=>{keys[e.code]=false});
  canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();paddle.x=(e.clientX-r.left)*W/r.width-paddle.w/2;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));if(!launched){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-1;}});
  canvas.addEventListener('pointerdown',()=>{if(running&&!launched)launched=true});
  function end(title,msg,btn){running=false;setOverlay(title,msg,btn)}
  function tick(){
    if(running){
      if(keys.ArrowLeft||keys.KeyA)paddle.x-=paddle.speed;
      if(keys.ArrowRight||keys.KeyD)paddle.x+=paddle.speed;
      paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
      if(!launched){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-1;}
      else {
        ball.x+=ball.vx;ball.y+=ball.vy;
        if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx)} if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)} if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}
        if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){
          const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*5.5;ball.vy=-Math.sqrt(Math.max(14,ball.vx*ball.vx+ball.vy*ball.vy));ball.y=paddle.y-ball.r;
        }
        for(let i=bricks.length-1;i>=0;i--){const b=bricks[i];if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
          const px=ball.x-ball.vx,py=ball.y-ball.vy;if(px+ball.r<=b.x||px-ball.r>=b.x+b.w)ball.vx*=-1;else ball.vy*=-1;
          b.hp--;b.flash=7;score+=b.hp===0?10:5;if(b.hp===0)bricks.splice(i,1);scoreEl.textContent=score;break;
        }}
        if(ball.y-ball.r>H){lives--;updateHud();if(lives<=0)end('Game over','Your final score is '+score+'. Ready for another round?','Play again');else resetBall();}
        if(bricks.length===0){if(level===1){level=2;buildLevel(level);resetBall();setOverlay('Level 1 cleared!','Nice work. Level 2 has tougher bricks. Press Space or tap to launch.','Continue');running=false;}else{level=3;updateHud();end('You win!','You cleared both levels with a score of '+score+'.','Play again');}}
      }
    }
    draw();requestAnimationFrame(tick);
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101a30');g.addColorStop(1,'#091020');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(142,180,255,.045)';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    for(const b of bricks){ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=12;ctx.fillStyle=b.hp===2?'#fff0b2':b.color;roundRect(b.x,b.y,b.w,b.h,6);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffff35';roundRect(b.x+3,b.y+3,b.w-6,4,2);ctx.fill();ctx.restore()}
    ctx.save();ctx.shadowColor='#60e8dc';ctx.shadowBlur=18;const pg=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x,paddle.y+paddle.h);pg.addColorStop(0,'#b5fff2');pg.addColorStop(1,'#42b9f2');ctx.fillStyle=pg;roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fill();ctx.restore();
    ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=18;const bg=ctx.createRadialGradient(ball.x-2,ball.y-3,1,ball.x,ball.y,ball.r);bg.addColorStop(0,'#fff');bg.addColorStop(1,'#71caff');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.restore();
    if(running&&!launched){ctx.fillStyle='#adc0dc';ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillText('PRESS SPACE OR TAP TO LAUNCH',W/2,H-82)}
  }
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
  buildLevel(1);updateHud();draw();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
