<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d1021;
    color: #e8ecff;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #hud {
    width: 800px;
    max-width: 100vw;
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    font-weight: bold;
    padding: 6px 0;
    box-sizing: border-box;
  }
  canvas {
    background: linear-gradient(#141a38, #0a0d1c);
    border: 2px solid #3a4580;
    border-radius: 6px;
    max-width: 100vw;
    max-height: calc(100vh - 90px);
    cursor: none;
    touch-action: none;
  }
  #help {
    font-size: 13px;
    opacity: 0.7;
    padding-top: 6px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="hud">
  <span id="score">Score: 0</span>
  <span id="level">Level: 1 / 2</span>
  <span id="lives">Lives: ❤❤❤</span>
</div>
<canvas id="game" width="800" height="600"></canvas>
<div id="help">
  Mouse: move paddle, click to launch &nbsp;|&nbsp; Keyboard: ← → or A / D to move, Space to launch, P to pause, Enter to restart
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById("score");
  const levelEl = document.getElementById("level");
  const livesEl = document.getElementById("lives");

  // ---------- Level definitions ----------
  // Digits = brick hit points (1-3), "." = empty
  const LEVELS = [
    {
      speed: 330,
      rows: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      speed: 400,
      rows: [
        "3.3.33.3.3",
        "2222222222",
        "22.2..2.22",
        "1111111111",
        ".11.11.11.",
        "1111111111",
        "2.2.2.2.2.",
      ],
    },
  ];

  const COLORS = {
    1: ["#4fd1c5", "#2c9c92"],
    2: ["#f6ad55", "#c27a24"],
    3: ["#fc5c7d", "#b8304f"],
  };

  const BRICK_COLS = 10;
  const BRICK_GAP = 6;
  const BRICK_TOP = 60;
  const BRICK_SIDE = 30;
  const BRICK_H = 22;
  const BRICK_W = (W - BRICK_SIDE * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;

  // ---------- Game state ----------
  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 560 };
  const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0, stuck: true };
  let bricks = [];
  let score = 0;
  let lives = 3;
  let levelIndex = 0;
  let state = "ready"; // ready | playing | paused | levelComplete | gameOver | win
  let ballSpeed = LEVELS[0].speed;
  let particles = [];

  const keys = { left: false, right: false };
  let mouseX = null;

  function buildLevel(i) {
    bricks = [];
    const rows = LEVELS[i].rows;
    rows.forEach((row, r) => {
      for (let c = 0; c < BRICK_COLS; c++) {
        const ch = row[c];
        if (ch && ch !== ".") {
          const hp = parseInt(ch, 10);
          bricks.push({
            x: BRICK_SIDE + c * (BRICK_W + BRICK_GAP),
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            w: BRICK_W,
            h: BRICK_H,
            hp,
            maxHp: hp,
          });
        }
      }
    });
    ballSpeed = LEVELS[i].speed;
  }

  function resetBall() {
    ball.stuck = true;
    ball.vx = 0;
    ball.vy = 0;
    placeBallOnPaddle();
  }

  function placeBallOnPaddle() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launchBall() {
    if (!ball.stuck) return;
    ball.stuck = false;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * ballSpeed;
    ball.vy = Math.sin(angle) * ballSpeed;
  }

  function newGame() {
    score = 0;
    lives = 3;
    levelIndex = 0;
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    particles = [];
    state = "ready";
    updateHud();
  }

  function startLevel(i) {
    levelIndex = i;
    buildLevel(i);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    particles = [];
    state = "ready";
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = "Score: " + score;
    levelEl.textContent = "Level: " + (levelIndex + 1) + " / " + LEVELS.length;
    livesEl.textContent = "Lives: " + (lives > 0 ? "❤".repeat(lives) : "—");
  }

  // ---------- Primary action (Space / click) ----------
  function primaryAction() {
    switch (state) {
      case "ready":
        state = "playing";
        launchBall();
        break;
      case "playing":
        launchBall();
        break;
      case "paused":
        state = "playing";
        break;
      case "levelComplete":
        startLevel(levelIndex + 1);
        break;
      case "gameOver":
      case "win":
        newGame();
        break;
    }
  }

  // ---------- Input ----------
  window.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; mouseX = null; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; mouseX = null; e.preventDefault(); }
    else if (k === " " || k === "Spacebar") { e.preventDefault(); if (!e.repeat) primaryAction(); }
    else if (k === "p" || k === "P" || k === "Escape") {
      if (state === "playing") state = "paused";
      else if (state === "paused") state = "playing";
    }
    else if (k === "Enter") {
      if (state === "gameOver" || state === "win") newGame();
      else if (state === "levelComplete") startLevel(levelIndex + 1);
      else if (state === "ready") primaryAction();
    }
  });

  window.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });

  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state === "playing") state = "paused";
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }

  canvas.addEventListener("mousemove", (e) => { mouseX = canvasX(e.clientX); });
  canvas.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;
    mouseX = canvasX(e.clientX);
    primaryAction();
  });
  // Touch support as a bonus
  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    mouseX = canvasX(e.touches[0].clientX);
    primaryAction();
  }, { passive: false });
  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    mouseX = canvasX(e.touches[0].clientX);
  }, { passive: false });

  // ---------- Update ----------
  function updatePaddle(dt) {
    if (mouseX !== null) {
      paddle.x = mouseX - paddle.w / 2;
    } else {
      let dir = 0;
      if (keys.left) dir -= 1;
      if (keys.right) dir += 1;
      paddle.x += dir * paddle.speed * dt;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.3, color });
    }
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 400 * dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function hitBrick(b) {
    b.hp--;
    if (b.hp <= 0) {
      score += 10 * b.maxHp;
      spawnParticles(b.x + b.w / 2, b.y + b.h / 2, COLORS[b.maxHp][0]);
    } else {
      score += 5;
    }
    updateHud();
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x + ball.r >= paddle.x &&
        ball.x - ball.r <= paddle.x + paddle.w) {
      // Bounce angle depends on where the ball hits the paddle
      const rel = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const clamped = Math.max(-1, Math.min(1, rel));
      const maxAngle = Math.PI / 3; // 60 degrees
      const angle = clamped * maxAngle;
      const speed = Math.hypot(ball.vx, ball.vy);
      ball.vx = Math.sin(angle) * speed;
      ball.vy = -Math.cos(angle) * speed;
      ball.y = paddle.y - ball.r - 0.5;
    }

    // Bricks (handle at most one collision per substep)
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const nearestX = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const nearestY = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - nearestX;
      const dy = ball.y - nearestY;
      if (dx * dx + dy * dy <= ball.r * ball.r) {
        // Determine collision side by penetration depth
        const overlapLeft = ball.x + ball.r - b.x;
        const overlapRight = b.x + b.w - (ball.x - ball.r);
        const overlapTop = ball.y + ball.r - b.y;
        const overlapBottom = b.y + b.h - (ball.y - ball.r);
        const minX = Math.min(overlapLeft, overlapRight);
        const minY = Math.min(overlapTop, overlapBottom);
        if (minX < minY) {
          if (overlapLeft < overlapRight) { ball.x = b.x - ball.r; ball.vx = -Math.abs(ball.vx); }
          else { ball.x = b.x + b.w + ball.r; ball.vx = Math.abs(ball.vx); }
        } else {
          if (overlapTop < overlapBottom) { ball.y = b.y - ball.r; ball.vy = -Math.abs(ball.vy); }
          else { ball.y = b.y + b.h + ball.r; ball.vy = Math.abs(ball.vy); }
        }
        hitBrick(b);
        // Gradually speed up
        const speed = Math.hypot(ball.vx, ball.vy);
        const newSpeed = Math.min(speed * 1.01, ballSpeed * 1.6);
        ball.vx *= newSpeed / speed;
        ball.vy *= newSpeed / speed;
        break;
      }
    }

    // Prevent near-horizontal trajectories
    const speed = Math.hypot(ball.vx, ball.vy);
    if (Math.abs(ball.vy) < speed * 0.25) {
      ball.vy = Math.sign(ball.vy || -1) * speed * 0.25;
      ball.vx = Math.sign(ball.vx || 1) * Math.sqrt(speed * speed - ball.vy * ball.vy);
    }

    // Fell below
    if (ball.y - ball.r > H) {
      lives--;
      updateHud();
      if (lives <= 0) {
        state = "gameOver";
      } else {
        resetBall();
        state = "ready";
      }
      return false;
    }
    return true;
  }

  function update(dt) {
    updateParticles(dt);
    if (state === "paused" || state === "gameOver" || state === "win" || state === "levelComplete") return;

    updatePaddle(dt);

    if (ball.stuck) {
      placeBallOnPaddle();
      return;
    }

    // Substeps to avoid tunnelling
    const steps = Math.ceil((Math.hypot(ball.vx, ball.vy) * dt) / (ball.r * 0.5)) || 1;
    const sub = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (!stepBall(sub)) return;
    }

    bricks = bricks.filter(b => b.hp > 0);
    if (bricks.length === 0) {
      score += lives * 100; // bonus for remaining lives
      updateHud();
      if (levelIndex + 1 < LEVELS.length) state = "levelComplete";
      else state = "win";
    }
  }

  // ---------- Render ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBricks() {
    for (const b of bricks) {
      const [light, dark] = COLORS[b.hp];
      const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
      g.addColorStop(0, light);
      g.addColorStop(1, dark);
      ctx.fillStyle = g;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      if (b.maxHp > 1) {
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.font = "bold 13px Segoe UI, Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
    }
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, "#a3bffa");
    g.addColorStop(1, "#5a67d8");
    ctx.fillStyle = g;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
  }

  function drawBall() {
    ctx.shadowColor = "#fff";
    ctx.shadowBlur = 12;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.8);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawOverlay(title, subtitle) {
    ctx.fillStyle = "rgba(5, 8, 20, 0.65)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold 48px Segoe UI, Arial";
    ctx.fillText(title, W / 2, H / 2 - 30);
    ctx.font = "20px Segoe UI, Arial";
    ctx.fillStyle = "#c3cbff";
    ctx.fillText(subtitle, W / 2, H / 2 + 25);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawParticles();
    drawPaddle();
    drawBall();

    if (state === "ready") {
      ctx.fillStyle = "#c3cbff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 24px Segoe UI, Arial";
      ctx.fillText("Level " + (levelIndex + 1), W / 2, H / 2 + 20);
      ctx.font = "18px Segoe UI, Arial";
      ctx.fillText("Press Space or click to launch", W / 2, H / 2 + 52);
    } else if (state === "paused") {
      drawOverlay("Paused", "Press P or Space to resume");
    } else if (state === "levelComplete") {
      drawOverlay("Level " + (levelIndex + 1) + " Complete!", "Score: " + score + "  —  Press Space or click for Level " + (levelIndex + 2));
    } else if (state === "gameOver") {
      drawOverlay("Game Over", "Final score: " + score + "  —  Press Space / Enter or click to restart");
    } else if (state === "win") {
      drawOverlay("You Win!", "Final score: " + score + "  —  Press Space / Enter or click to play again");
    }
  }

  // ---------- Main loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
