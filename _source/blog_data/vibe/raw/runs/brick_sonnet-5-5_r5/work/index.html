<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brick Breaker</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #hud { width: 640px; max-width: 100vw; display: flex; justify-content: space-between; padding: 6px 4px; font-size: 18px; box-sizing: border-box; }
  canvas { background: #1b1b2f; border: 2px solid #444; max-width: 100vw; cursor: none; }
  #help { font-size: 13px; color: #999; margin-top: 6px; }
</style>
</head>
<body>
<div id="hud">
  <span id="score">Score: 0</span>
  <span id="level">Level 1</span>
  <span id="lives">Lives: ♥♥♥</span>
</div>
<canvas id="c" width="640" height="480"></canvas>
<div id="help">Move: mouse or ←/→ (A/D) · Launch/Start: click or Space · Pause: P</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const COLORS = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6'];

const LEVELS = [
  { rows: 4, cols: 10, speed: 5, pw: 100, pattern: () => true },
  { rows: 6, cols: 10, speed: 6, pw: 80, pattern: (r, c) => (r + c) % 5 !== 4 || r === 0 }
];

let state = 'ready'; // ready, playing, paused, over, won, between
let score, lives, levelIdx, bricks, paddle, ball, keys = {}, message = '';

function buildLevel(i) {
  const L = LEVELS[i];
  bricks = [];
  const bw = 56, bh = 20, gap = 4;
  const ox = (W - (L.cols * (bw + gap) - gap)) / 2;
  for (let r = 0; r < L.rows; r++)
    for (let c = 0; c < L.cols; c++)
      if (L.pattern(r, c))
        bricks.push({ x: ox + c * (bw + gap), y: 50 + r * (bh + gap), w: bw, h: bh, color: COLORS[r % COLORS.length], hits: (i === 1 && r < 2) ? 2 : 1 });
  paddle = { w: L.pw, h: 12, x: (W - L.pw) / 2, y: H - 30 };
  resetBall();
}
function resetBall() {
  ball = { x: paddle.x + paddle.w / 2, y: paddle.y - 8, r: 7, vx: 0, vy: 0, stuck: true };
}
function newGame() {
  score = 0; lives = 3; levelIdx = 0;
  buildLevel(0); state = 'playing'; updateHud();
}
function launch() {
  if (!ball.stuck) return;
  const s = LEVELS[levelIdx].speed;
  const a = (Math.random() * 0.6 - 0.3);
  ball.vx = s * Math.sin(a); ball.vy = -s * Math.cos(a); ball.stuck = false;
}
function updateHud() {
  document.getElementById('score').textContent = 'Score: ' + score;
  document.getElementById('level').textContent = 'Level ' + (levelIdx + 1) + ' / ' + LEVELS.length;
  document.getElementById('lives').textContent = 'Lives: ' + '♥'.repeat(Math.max(lives, 0));
}
function action() {
  if (state === 'ready' || state === 'over' || state === 'won') newGame();
  else if (state === 'between') { state = 'playing'; }
  else if (state === 'playing') launch();
}

addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' || e.key === 'Enter') action();
  if (e.key.toLowerCase() === 'p') {
    if (state === 'playing') state = 'paused'; else if (state === 'paused') state = 'playing';
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function mouseMove(clientX) {
  if (state !== 'playing' && state !== 'between') return;
  const rect = cv.getBoundingClientRect();
  const x = (clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
}
cv.addEventListener('mousemove', e => mouseMove(e.clientX));
cv.addEventListener('mousedown', action);
cv.addEventListener('touchmove', e => { e.preventDefault(); mouseMove(e.touches[0].clientX); }, { passive: false });
cv.addEventListener('touchstart', e => { e.preventDefault(); action(); }, { passive: false });

function update() {
  if (state !== 'playing') return;
  const pspeed = 8;
  if (keys['arrowleft'] || keys['a']) paddle.x -= pspeed;
  if (keys['arrowright'] || keys['d']) paddle.x += pspeed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (ball.stuck) { ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - ball.r - 1; return; }

  // substeps to avoid tunneling
  const steps = 3;
  for (let s = 0; s < steps; s++) {
    ball.x += ball.vx / steps; ball.y += ball.vy / steps;

    if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // paddle
    if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 8 &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const ang = hit * 1.05; // radians from vertical
      const sp = Math.min(Math.hypot(ball.vx, ball.vy) * 1.01, LEVELS[levelIdx].speed * 1.6);
      ball.vx = sp * Math.sin(ang); ball.vy = -sp * Math.cos(ang);
      ball.y = paddle.y - ball.r;
    }

    // bricks
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const nx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const ny = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - nx, dy = ball.y - ny;
      if (dx * dx + dy * dy <= ball.r * ball.r) {
        const ox = ball.r - Math.abs(dx), oy = ball.r - Math.abs(dy);
        if (dx === 0 && dy === 0) ball.vy = -ball.vy;
        else if (Math.abs(dx) > Math.abs(dy)) ball.vx = dx > 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
        else ball.vy = dy > 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
        b.hits--;
        score += 10 * (levelIdx + 1);
        if (b.hits <= 0) bricks.splice(i, 1);
        updateHud();
        break;
      }
    }
  }

  if (bricks.length === 0) {
    if (levelIdx + 1 < LEVELS.length) {
      levelIdx++; buildLevel(levelIdx); state = 'between'; updateHud();
    } else { state = 'won'; }
    return;
  }
  if (ball.y - ball.r > H) {
    lives--; updateHud();
    if (lives <= 0) state = 'over'; else resetBall();
  }
}

function overlay(title, sub) {
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = 'bold 40px system-ui'; ctx.fillText(title, W / 2, H / 2 - 10);
  ctx.font = '18px system-ui'; ctx.fillText(sub, W / 2, H / 2 + 28);
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (bricks) {
    for (const b of bricks) {
      ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h);
      if (b.hits > 1) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2); }
    }
    ctx.fillStyle = '#ecf0f1'; ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
    if (ball.stuck && state === 'playing') {
      ctx.fillStyle = '#aaa'; ctx.font = '16px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('Click or press Space to launch', W / 2, H / 2 + 60);
    }
  }
  if (state === 'ready') overlay('BRICK BREAKER', 'Click or press Space to start');
  else if (state === 'paused') overlay('Paused', 'Press P to resume');
  else if (state === 'between') overlay('Level ' + (levelIdx + 1), 'Click or press Space to continue');
  else if (state === 'over') overlay('Game Over', 'Score ' + score + ' — click or Space to retry');
  else if (state === 'won') overlay('You Win!', 'Score ' + score + ' — click or Space to play again');
}
function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
