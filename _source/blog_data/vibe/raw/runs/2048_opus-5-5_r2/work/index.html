<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
    background: #faf8ef;
    color: #776e65;
    display: flex;
    justify-content: center;
  }
  .container { width: 440px; padding: 24px 0; }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  h1 { font-size: 64px; margin: 0; color: #776e65; }
  .score-box {
    background: #bbada0;
    color: #fff;
    border-radius: 6px;
    padding: 6px 18px;
    text-align: center;
    min-width: 90px;
  }
  .score-box .label { font-size: 13px; text-transform: uppercase; color: #eee4da; }
  .score-box .value { font-size: 24px; font-weight: bold; }
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  button {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 6px;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #9f8b77; }
  .board-wrap { position: relative; }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 12px;
    padding: 12px;
    background: #bbada0;
    border-radius: 8px;
    width: 440px;
    height: 440px;
  }
  .tile {
    background: rgba(238, 228, 218, 0.35);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 44px;
    user-select: none;
  }
  .tile.new { animation: pop 0.15s ease; }
  .tile.merged { animation: bump 0.15s ease; }
  @keyframes pop { from { transform: scale(0.3); } to { transform: scale(1); } }
  @keyframes bump { 50% { transform: scale(1.12); } }
  .t2    { background: #eee4da; color: #776e65; }
  .t4    { background: #ede0c8; color: #776e65; }
  .t8    { background: #f2b179; color: #f9f6f2; }
  .t16   { background: #f59563; color: #f9f6f2; }
  .t32   { background: #f67c5f; color: #f9f6f2; }
  .t64   { background: #f65e3b; color: #f9f6f2; }
  .t128  { background: #edcf72; color: #f9f6f2; font-size: 38px; }
  .t256  { background: #edcc61; color: #f9f6f2; font-size: 38px; }
  .t512  { background: #edc850; color: #f9f6f2; font-size: 38px; }
  .t1024 { background: #edc53f; color: #f9f6f2; font-size: 30px; }
  .t2048 { background: #edc22e; color: #f9f6f2; font-size: 30px; }
  .tbig  { background: #3c3a32; color: #f9f6f2; font-size: 26px; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.75);
    border-radius: 8px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .overlay.show { display: flex; }
  .overlay p { font-size: 48px; font-weight: bold; margin: 0; color: #776e65; }
  .hint { margin-top: 16px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>2048</h1>
    <div class="score-box">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>
  </div>
  <div class="controls">
    <span>Join the tiles, get to <strong>2048!</strong></span>
    <button id="new-game">New Game</button>
  </div>
  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <p>Game Over!</p>
      <div>No moves left. Final score: <strong id="final-score">0</strong></div>
      <button id="retry">Try Again</button>
    </div>
  </div>
  <div class="hint">Use the <strong>arrow keys</strong> to move the tiles.</div>
</div>

<script>
  const SIZE = 4;
  const boardEl = document.getElementById("board");
  const scoreEl = document.getElementById("score");
  const overlayEl = document.getElementById("overlay");
  const finalScoreEl = document.getElementById("final-score");

  let grid, score, over;
  let newCell = null;
  let mergedCells = new Set();

  // Create the 16 tile elements once.
  const tiles = [];
  for (let i = 0; i < SIZE * SIZE; i++) {
    const el = document.createElement("div");
    el.className = "tile";
    boardEl.appendChild(el);
    tiles.push(el);
  }

  function newGame() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    over = false;
    mergedCells = new Set();
    addRandomTile();
    addRandomTile();
    overlayEl.classList.remove("show");
    render();
  }

  function addRandomTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) empty.push([r, c]);
    if (empty.length === 0) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    newCell = r * SIZE + c;
  }

  // Slide and merge a single line toward index 0.
  // Returns the new line plus the indices where merges happened.
  function slideLine(line) {
    const nums = line.filter(v => v !== 0);
    const result = [];
    const merges = [];
    for (let i = 0; i < nums.length; i++) {
      if (i + 1 < nums.length && nums[i] === nums[i + 1]) {
        const v = nums[i] * 2;
        result.push(v);
        score += v;
        merges.push(result.length - 1);
        i++;
      } else {
        result.push(nums[i]);
      }
    }
    while (result.length < SIZE) result.push(0);
    return { result, merges };
  }

  // Coordinates of line `i`, ordered from the edge tiles move toward.
  function lineCoords(dir, i) {
    const coords = [];
    for (let j = 0; j < SIZE; j++) {
      if (dir === "left") coords.push([i, j]);
      else if (dir === "right") coords.push([i, SIZE - 1 - j]);
      else if (dir === "up") coords.push([j, i]);
      else coords.push([SIZE - 1 - j, i]);
    }
    return coords;
  }

  function move(dir) {
    if (over) return;
    let moved = false;
    mergedCells = new Set();
    for (let i = 0; i < SIZE; i++) {
      const coords = lineCoords(dir, i);
      const line = coords.map(([r, c]) => grid[r][c]);
      const { result, merges } = slideLine(line);
      coords.forEach(([r, c], k) => {
        if (grid[r][c] !== result[k]) moved = true;
        grid[r][c] = result[k];
      });
      merges.forEach(k => mergedCells.add(coords[k][0] * SIZE + coords[k][1]));
    }
    if (!moved) return;
    addRandomTile();
    render();
    if (!canMove()) {
      over = true;
      finalScoreEl.textContent = score;
      overlayEl.classList.add("show");
    }
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        if (v === 0) return true;
        if (c + 1 < SIZE && grid[r][c + 1] === v) return true;
        if (r + 1 < SIZE && grid[r + 1][c] === v) return true;
      }
    }
    return false;
  }

  function render() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const idx = r * SIZE + c;
        const v = grid[r][c];
        const el = tiles[idx];
        el.className = "tile";
        el.textContent = v ? v : "";
        if (v) {
          el.classList.add(v <= 2048 ? "t" + v : "tbig");
          if (idx === newCell) el.classList.add("new");
          else if (mergedCells.has(idx)) el.classList.add("merged");
        }
      }
    }
    newCell = null;
    scoreEl.textContent = score;
  }

  const KEYS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
  document.addEventListener("keydown", e => {
    const dir = KEYS[e.key];
    if (!dir) return;
    e.preventDefault();
    move(dir);
  });

  document.getElementById("new-game").addEventListener("click", newGame);
  document.getElementById("retry").addEventListener("click", newGame);

  newGame();
</script>
</body>
</html>
