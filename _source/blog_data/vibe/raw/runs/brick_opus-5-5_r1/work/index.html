<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    color: #e8ecf4;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  canvas {
    background: linear-gradient(#1b2133, #0d1018);
    border: 2px solid #3a4560;
    border-radius: 6px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
  }
  #help {
    margin-top: 10px;
    font-size: 14px;
    color: #8b95ad;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div id="help">
  Move: Mouse or &larr; &rarr; / A D &nbsp;|&nbsp; Launch: Click or Space &nbsp;|&nbsp; Pause: P or Esc
</div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ---- Config ----
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 620;
  const BALL_R = 8;
  const BRICK_COLS = 10, BRICK_W = 70, BRICK_H = 24, BRICK_GAP = 6;
  const BRICK_OFFSET_X = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;
  const BRICK_OFFSET_Y = 70;
  const START_LIVES = 3;

  // Level layouts: '.' = empty, '1' = 1-hit brick, '2' = 2-hit brick, '3' = 3-hit brick
  const LEVELS = [
    {
      name: "Level 1",
      speed: 360,
      map: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      name: "Level 2",
      speed: 430,
      map: [
        "3.3.33.3.3",
        "2222222222",
        "1221111221",
        "..222222..",
        "1111111111",
        "2.1.22.1.2",
      ],
    },
  ];

  const COLORS = {
    1: ["#4fc3f7", "#29b6f6"],
    2: ["#ffb74d", "#ffa726"],
    3: ["#e57373", "#ef5350"],
  };

  // ---- State ----
  let state = "start"; // start | serve | playing | paused | levelClear | gameOver | win
  let levelIndex = 0;
  let score = 0;
  let lives = START_LIVES;
  let bricks = [];
  let particles = [];
  const paddle = { x: W / 2 - PADDLE_W / 2, w: PADDLE_W };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, speed: 0 };
  const keys = { left: false, right: false };
  let mouseActive = false;

  function buildLevel(i) {
    bricks = [];
    LEVELS[i].map.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        const hp = parseInt(ch, 10);
        if (!hp) return;
        bricks.push({
          x: BRICK_OFFSET_X + c * (BRICK_W + BRICK_GAP),
          y: BRICK_OFFSET_Y + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H,
          hp, maxHp: hp, alive: true,
        });
      });
    });
  }

  function resetBall() {
    ball.speed = LEVELS[levelIndex].speed;
    ball.vx = 0; ball.vy = 0;
    stickBall();
  }

  function stickBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = PADDLE_Y - BALL_R - 1;
  }

  function launch() {
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    state = "playing";
  }

  function newGame() {
    levelIndex = 0; score = 0; lives = START_LIVES;
    particles = [];
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = "serve";
  }

  function nextLevel() {
    levelIndex++;
    particles = [];
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = "serve";
  }

  // Primary action (Space / click) depends on the current state
  function action() {
    switch (state) {
      case "start": newGame(); break;
      case "serve": launch(); break;
      case "paused": state = "playing"; break;
      case "levelClear": nextLevel(); break;
      case "gameOver":
      case "win": newGame(); break;
    }
  }

  function togglePause() {
    if (state === "playing") state = "paused";
    else if (state === "paused") state = "playing";
  }

  // ---- Input ----
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; mouseActive = false; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; mouseActive = false; e.preventDefault(); }
    else if (k === " " || k === "Enter") { action(); e.preventDefault(); }
    else if (k === "p" || k === "P" || k === "Escape") { togglePause(); e.preventDefault(); }
  });
  document.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener("mousemove", (e) => {
    mouseActive = true;
    if (state === "paused") return;
    paddle.x = clamp(canvasX(e.clientX) - paddle.w / 2, 0, W - paddle.w);
  });
  canvas.addEventListener("mousedown", (e) => {
    if (e.button === 0) action();
  });
  canvas.addEventListener("touchmove", (e) => {
    if (state !== "paused") paddle.x = clamp(canvasX(e.touches[0].clientX) - paddle.w / 2, 0, W - paddle.w);
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("touchstart", (e) => { action(); e.preventDefault(); }, { passive: false });
  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state === "playing") state = "paused";
  });

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ---- Physics ----
  function update(dt) {
    // Paddle via keyboard
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir !== 0 && (state === "playing" || state === "serve")) {
      paddle.x = clamp(paddle.x + dir * PADDLE_SPEED * dt, 0, W - paddle.w);
    }

    updateParticles(dt);

    if (state === "serve") { stickBall(); return; }
    if (state !== "playing") return;

    // Sub-step to avoid tunnelling through bricks
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / (BALL_R * 0.5)));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (!stepBall(sdt)) break;
    }
  }

  // Returns false if stepping should stop (life lost / level cleared)
  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    // Bottom: lose life
    if (ball.y - BALL_R > H) {
      lives--;
      if (lives <= 0) { state = "gameOver"; }
      else { resetBall(); state = "serve"; }
      return false;
    }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + BALL_R >= PADDLE_Y && ball.y - BALL_R <= PADDLE_Y + PADDLE_H &&
        ball.x >= paddle.x - BALL_R && ball.x <= paddle.x + paddle.w + BALL_R) {
      // Bounce angle depends on where the ball hits the paddle
      const hit = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const angle = hit * (Math.PI / 3); // up to 60 degrees from vertical
      ball.vx = Math.sin(angle) * ball.speed;
      ball.vy = -Math.cos(angle) * ball.speed;
      ball.y = PADDLE_Y - BALL_R - 0.5;
    }

    // Bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      const nx = clamp(ball.x, b.x, b.x + b.w);
      const ny = clamp(ball.y, b.y, b.y + b.h);
      const dx = ball.x - nx, dy = ball.y - ny;
      if (dx * dx + dy * dy > BALL_R * BALL_R) continue;

      // Determine bounce axis by smallest penetration
      const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + b.w - (ball.x - BALL_R));
      const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + b.h - (ball.y - BALL_R));
      if (overlapX < overlapY) {
        ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      } else {
        ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      }

      hitBrick(b);
      if (bricks.every((br) => !br.alive)) {
        if (levelIndex + 1 < LEVELS.length) {
          score += 500; // level clear bonus
          state = "levelClear";
        } else {
          score += 1000;
          state = "win";
        }
        return false;
      }
      break; // one brick per sub-step
    }
    return true;
  }

  function hitBrick(b) {
    b.hp--;
    if (b.hp <= 0) {
      b.alive = false;
      score += 100 * b.maxHp;
      spawnParticles(b.x + b.w / 2, b.y + b.h / 2, COLORS[b.maxHp][0]);
      // Speed up slightly as bricks break
      ball.speed = Math.min(ball.speed * 1.01, LEVELS[levelIndex].speed * 1.5);
      const s = Math.hypot(ball.vx, ball.vy);
      ball.vx = ball.vx / s * ball.speed;
      ball.vy = ball.vy / s * ball.speed;
    } else {
      score += 20;
    }
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.6, color });
    }
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 400 * dt;
      p.life -= dt;
    }
    particles = particles.filter((p) => p.life > 0);
  }

  // ---- Rendering ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // HUD
    ctx.fillStyle = "#e8ecf4";
    ctx.font = "bold 20px Segoe UI, Arial";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 20, 30);
    ctx.textAlign = "center";
    ctx.fillText(LEVELS[levelIndex].name + " / " + LEVELS.length, W / 2, 30);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 20 - START_LIVES * 22, 30);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 20 - (START_LIVES - 1 - i) * 22 - 8, 30, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5c7a" : "#3a4560";
      ctx.fill();
    }
    ctx.strokeStyle = "#2a3248";
    ctx.beginPath(); ctx.moveTo(0, 52); ctx.lineTo(W, 52); ctx.stroke();

    // Bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      const [c1, c2] = COLORS[b.hp];
      const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
      g.addColorStop(0, c1); g.addColorStop(1, c2);
      ctx.fillStyle = g;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      if (b.maxHp > 1) {
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.font = "bold 13px Segoe UI, Arial";
        ctx.textAlign = "center";
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
    }

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Paddle
    const pg = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
    pg.addColorStop(0, "#b3e5fc"); pg.addColorStop(1, "#4fc3f7");
    ctx.fillStyle = pg;
    roundRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H, 7);
    ctx.fill();

    // Ball
    if (state !== "gameOver" && state !== "start") {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#9be7ff"; ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Overlays
    switch (state) {
      case "start":
        overlay("BRICK BREAKER", "Click or press Space to start",
          "Mouse or ←/→ (A/D) to move • P to pause");
        break;
      case "serve":
        hint("Click or press Space to launch");
        break;
      case "paused":
        overlay("PAUSED", "Press P, Esc, Space or click to resume");
        break;
      case "levelClear":
        overlay("LEVEL CLEAR!", "Click or press Space for " + LEVELS[levelIndex + 1].name,
          "Score: " + score);
        break;
      case "gameOver":
        overlay("GAME OVER", "Click or press Space to play again", "Final score: " + score);
        break;
      case "win":
        overlay("YOU WIN!", "Click or press Space to play again", "Final score: " + score);
        break;
    }
  }

  function overlay(title, sub, extra) {
    ctx.fillStyle = "rgba(8,10,16,0.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 52px Segoe UI, Arial";
    ctx.fillText(title, W / 2, H / 2 - 40);
    ctx.font = "22px Segoe UI, Arial";
    ctx.fillStyle = "#cfd8ea";
    ctx.fillText(sub, W / 2, H / 2 + 15);
    if (extra) {
      ctx.font = "18px Segoe UI, Arial";
      ctx.fillStyle = "#8b95ad";
      ctx.fillText(extra, W / 2, H / 2 + 50);
    }
  }

  function hint(text) {
    ctx.textAlign = "center";
    ctx.font = "18px Segoe UI, Arial";
    ctx.fillStyle = "#cfd8ea";
    ctx.fillText(text, W / 2, H / 2 + 60);
  }

  // ---- Loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30); // clamp to avoid huge jumps
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  buildLevel(0);
  resetBall();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
