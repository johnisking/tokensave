<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 20px;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #faf8ef;
    color: #776e65;
  }

  h1 {
    margin: 0;
    font-size: 56px;
    color: #776e65;
  }

  .top {
    width: min(90vw, 440px);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .score-box {
    background: #bbada0;
    color: #fff;
    border-radius: 4px;
    padding: 6px 16px;
    text-align: center;
    min-width: 90px;
  }

  .score-box span {
    display: block;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .score-box strong {
    font-size: 24px;
  }

  button {
    background: #8f7a66;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background: #9f8b77;
  }

  .board {
    position: relative;
    width: min(90vw, 440px);
    aspect-ratio: 1;
    padding: 10px;
    background: #bbada0;
    border-radius: 6px;
  }

  .cells,
  .tiles {
    position: absolute;
    inset: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
  }

  .cell {
    background: rgba(238, 228, 218, 0.35);
    border-radius: 3px;
  }

  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    font-size: 36px;
    font-weight: bold;
    background: #eee4da;
    color: #776e65;
    user-select: none;
  }

  .tile.d3 { font-size: 30px; }
  .tile.d4 { font-size: 24px; }

  .tile.new {
    animation: pop 0.2s ease-out;
  }

  @keyframes pop {
    from { transform: scale(0.2); }
    to   { transform: scale(1); }
  }

  .v2    { background: #eee4da; color: #776e65; }
  .v4    { background: #ede0c8; color: #776e65; }
  .v8    { background: #f2b179; color: #f9f6f2; }
  .v16   { background: #f59563; color: #f9f6f2; }
  .v32   { background: #f67c5f; color: #f9f6f2; }
  .v64   { background: #f65e3b; color: #f9f6f2; }
  .v128  { background: #edcf72; color: #f9f6f2; font-size: 30px !important; }
  .v256  { background: #edcc61; color: #f9f6f2; font-size: 30px !important; }
  .v512  { background: #edc850; color: #f9f6f2; font-size: 30px !important; }
  .v1024 { background: #edc53f; color: #f9f6f2; font-size: 24px !important; }
  .v2048 { background: #edc22e; color: #f9f6f2; font-size: 24px !important; }
  .vbig  { background: #3c3a32; color: #f9f6f2; font-size: 24px !important; }

  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(238, 228, 218, 0.73);
    border-radius: 6px;
    font-size: 28px;
    font-weight: bold;
    color: #776e65;
    text-align: center;
  }

  .overlay.show {
    display: flex;
  }

  .overlay p {
    margin: 0;
  }

  .hint {
    font-size: 14px;
    color: #9f8b77;
  }
</style>
</head>
<body>

<h1>2048</h1>

<div class="top">
  <div class="score-box">
    <span>Score</span>
    <strong id="score">0</strong>
  </div>
  <button id="new-game">New Game</button>
</div>

<div class="board" id="board">
  <div class="cells" id="cells"></div>
  <div class="tiles" id="tiles"></div>
  <div class="overlay" id="overlay">
    <p>No moves left!</p>
    <p id="final-score"></p>
    <button id="overlay-new-game">Try Again</button>
  </div>
</div>

<p class="hint">Use the arrow keys (or swipe) to move the tiles.</p>

<script>
  const SIZE = 4;

  const boardEl = document.getElementById('board');
  const cellsEl = document.getElementById('cells');
  const tilesEl = document.getElementById('tiles');
  const scoreEl = document.getElementById('score');
  const overlayEl = document.getElementById('overlay');
  const finalScoreEl = document.getElementById('final-score');

  let grid = [];
  let score = 0;
  let gameOver = false;

  // Build the 16 background cells once.
  for (let i = 0; i < SIZE * SIZE; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cellsEl.appendChild(cell);
  }

  function emptyGrid() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  }

  // Places a 2 (90%) or 4 (10%) on a random empty cell. Returns its position.
  function addRandomTile(g) {
    const empties = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (g[r][c] === 0) empties.push([r, c]);
      }
    }
    if (empties.length === 0) return null;

    const [r, c] = empties[Math.floor(Math.random() * empties.length)];
    g[r][c] = Math.random() < 0.9 ? 2 : 4;
    return { r, c };
  }

  // Slides one line toward index 0 and merges equal neighbours once per move.
  function slideLine(line) {
    const values = line.filter(v => v !== 0);
    const result = [];
    let gained = 0;

    for (let i = 0; i < values.length; i++) {
      if (i + 1 < values.length && values[i] === values[i + 1]) {
        const merged = values[i] * 2;
        result.push(merged);
        gained += merged;
        i++;
      } else {
        result.push(values[i]);
      }
    }

    while (result.length < SIZE) result.push(0);
    return { line: result, gained };
  }

  function move(direction) {
    const next = emptyGrid();
    let moved = false;
    let gained = 0;

    for (let i = 0; i < SIZE; i++) {
      // Coordinates of this row/column, ordered from the side the tiles slide toward.
      const coords = [];
      for (let j = 0; j < SIZE; j++) {
        if (direction === 'left')       coords.push([i, j]);
        else if (direction === 'right') coords.push([i, SIZE - 1 - j]);
        else if (direction === 'up')    coords.push([j, i]);
        else                            coords.push([SIZE - 1 - j, i]);
      }

      const line = coords.map(([r, c]) => grid[r][c]);
      const result = slideLine(line);
      gained += result.gained;

      result.line.forEach((value, j) => {
        const [r, c] = coords[j];
        next[r][c] = value;
        if (grid[r][c] !== value) moved = true;
      });
    }

    if (!moved) return;

    grid = next;
    score += gained;
    const spawned = addRandomTile(grid);
    render(spawned);

    if (!hasMovesLeft()) {
      gameOver = true;
      finalScoreEl.textContent = 'Final score: ' + score;
      overlayEl.classList.add('show');
    }
  }

  function hasMovesLeft() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        if (v === 0) return true;
        if (c + 1 < SIZE && grid[r][c + 1] === v) return true;
        if (r + 1 < SIZE && grid[r + 1][c] === v) return true;
      }
    }
    return false;
  }

  function render(spawned) {
    tilesEl.innerHTML = '';

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const value = grid[r][c];
        if (value === 0) continue;

        const tile = document.createElement('div');
        const valueClass = value <= 2048 ? 'v' + value : 'vbig';
        tile.className = `tile ${valueClass} d${String(value).length}`;
        if (spawned && spawned.r === r && spawned.c === c) {
          tile.classList.add('new');
        }
        tile.style.gridRow = r + 1;
        tile.style.gridColumn = c + 1;
        tile.textContent = value;
        tilesEl.appendChild(tile);
      }
    }

    scoreEl.textContent = score;
  }

  function newGame() {
    grid = emptyGrid();
    score = 0;
    gameOver = false;
    overlayEl.classList.remove('show');

    addRandomTile(grid);
    const spawned = addRandomTile(grid);
    render(spawned);
  }

  // Keyboard controls.
  const KEY_DIRECTIONS = {
    ArrowLeft: 'left',
    ArrowRight: 'right',
    ArrowUp: 'up',
    ArrowDown: 'down'
  };

  document.addEventListener('keydown', e => {
    const direction = KEY_DIRECTIONS[e.key];
    if (!direction) return;

    e.preventDefault();
    if (!gameOver) move(direction);
  });

  // Swipe controls for touch screens.
  let touchStart = null;

  boardEl.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  boardEl.addEventListener('touchend', e => {
    if (!touchStart) return;

    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;

    let direction;
    if (Math.abs(dx) > Math.abs(dy)) {
      direction = dx > 0 ? 'right' : 'left';
    } else {
      direction = dy > 0 ? 'down' : 'up';
    }

    if (!gameOver) move(direction);
  });

  document.getElementById('new-game').addEventListener('click', newGame);
  document.getElementById('overlay-new-game').addEventListener('click', newGame);

  newGame();
</script>
</body>
</html>
