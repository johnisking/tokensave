<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brick Breaker</title>
<style>
  html, body { margin: 0; height: 100%; background: #10131a; color: #eee; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { background: #181d29; border: 2px solid #334; max-width: 100vw; max-height: 85vh; cursor: none; }
  p { margin: 8px; font-size: 13px; color: #99a; }
</style>
</head>
<body>
<canvas id="c" width="640" height="480"></canvas>
<p>Move: mouse or ←/→ (A/D) · Launch ball: click / Space · Pause: P</p>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const COLORS = ['#ff5470', '#ff9f43', '#feca57', '#1dd1a1', '#48dbfb', '#a29bfe'];
const LEVELS = [
  { speed: 4.2, rows: ['111111111', '111111111', '111111111', '111111111'] },
  { speed: 5.2, rows: ['101010101', '111111111', '210101012', '111111111', '121212121', '111111111'] }
]; // 0 empty, 1 normal, 2 tough (2 hits)

const paddle = { w: 90, h: 12, x: W / 2 - 45, y: H - 30 };
const ball = { x: 0, y: 0, r: 7, dx: 0, dy: 0, stuck: true };
let bricks = [], level = 0, score = 0, lives = 3;
let state = 'start'; // start, play, paused, over, win, levelup
let keys = {};

function loadLevel(n) {
  const L = LEVELS[n], cols = 9, bw = 64, bh = 20, gap = 4;
  const ox = (W - (cols * (bw + gap) - gap)) / 2;
  bricks = [];
  L.rows.forEach((row, r) => [...row].forEach((ch, c) => {
    if (ch === '0') return;
    const hp = +ch;
    bricks.push({ x: ox + c * (bw + gap), y: 50 + r * (bh + gap), w: bw, h: bh, hp, color: COLORS[r % COLORS.length] });
  }));
  resetBall();
}
function resetBall() {
  paddle.x = W / 2 - paddle.w / 2;
  ball.stuck = true; ball.dx = ball.dy = 0;
  ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - ball.r;
}
function newGame() { level = 0; score = 0; lives = 3; loadLevel(0); state = 'play'; }
function launch() {
  if (state === 'start' || state === 'over' || state === 'win') { newGame(); return; }
  if (state === 'levelup') { state = 'play'; return; }
  if (state === 'play' && ball.stuck) {
    const s = LEVELS[level].speed, a = (Math.random() * 0.6 - 0.3);
    ball.dx = s * Math.sin(a); ball.dy = -s * Math.cos(a); ball.stuck = false;
  }
}
function movePaddleTo(x) { paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2)); }

addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
  if (e.key === ' ' || e.key === 'Enter') launch();
  if (e.key.toLowerCase() === 'p') {
    if (state === 'play') state = 'paused'; else if (state === 'paused') state = 'play';
  }
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  movePaddleTo((e.clientX - r.left) * W / r.width);
});
cv.addEventListener('mousedown', launch);

function update() {
  if (state !== 'play') return;
  const sp = 7;
  if (keys['arrowleft'] || keys['a']) paddle.x = Math.max(0, paddle.x - sp);
  if (keys['arrowright'] || keys['d']) paddle.x = Math.min(W - paddle.w, paddle.x + sp);
  if (ball.stuck) { ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - ball.r; return; }

  ball.x += ball.dx; ball.y += ball.dy;
  if (ball.x < ball.r) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
  if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
  if (ball.y < ball.r) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

  // paddle
  if (ball.dy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 8 &&
      ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
    const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
    const ang = hit * 1.05, s = Math.hypot(ball.dx, ball.dy);
    ball.dx = s * Math.sin(ang); ball.dy = -s * Math.cos(ang);
    ball.y = paddle.y - ball.r;
  }

  // bricks
  for (const b of bricks) {
    if (b.hp <= 0) continue;
    const nx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
    const ny = Math.max(b.y, Math.min(ball.y, b.y + b.h));
    const dx = ball.x - nx, dy = ball.y - ny;
    if (dx * dx + dy * dy <= ball.r * ball.r) {
      const ox = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
      const oy = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
      if (ox < oy) ball.dx = -ball.dx; else ball.dy = -ball.dy;
      b.hp--; score += b.hp > 0 ? 5 : 10 * (level + 1);
      break;
    }
  }

  if (bricks.every(b => b.hp <= 0)) {
    if (level + 1 < LEVELS.length) { level++; loadLevel(level); state = 'levelup'; }
    else state = 'win';
    return;
  }
  if (ball.y - ball.r > H) {
    lives--;
    if (lives <= 0) state = 'over'; else resetBall();
  }
}

function text(t, x, y, size, color = '#fff', align = 'center') {
  ctx.fillStyle = color; ctx.font = `bold ${size}px system-ui, sans-serif`; ctx.textAlign = align;
  ctx.fillText(t, x, y);
}
function overlay(title, sub) {
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
  text(title, W / 2, H / 2 - 10, 36);
  text(sub, W / 2, H / 2 + 25, 16, '#ccd');
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const b of bricks) {
    if (b.hp <= 0) continue;
    ctx.fillStyle = b.hp > 1 ? '#8395a7' : b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(b.x, b.y, b.w, 5);
  }
  ctx.fillStyle = '#fff'; ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fillStyle = '#feca57'; ctx.fill();

  text('Score: ' + score, 12, 28, 18, '#fff', 'left');
  text('Level ' + (level + 1) + ' / ' + LEVELS.length, W / 2, 28, 18);
  text('Lives: ' + '♥'.repeat(Math.max(0, lives)), W - 12, 28, 18, '#ff5470', 'right');

  if (state === 'start') overlay('BRICK BREAKER', 'Click or press Space to start');
  else if (state === 'paused') overlay('Paused', 'Press P to resume');
  else if (state === 'levelup') overlay('Level 2', 'Click or press Space to continue');
  else if (state === 'over') overlay('Game Over', 'Score ' + score + ' · click or Space to retry');
  else if (state === 'win') overlay('You Win!', 'Score ' + score + ' · click or Space to play again');
  else if (ball.stuck) text('Click or press Space to launch', W / 2, H - 55, 14, '#99a');
}
(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
