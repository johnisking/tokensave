<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #0d1020;
    color: #e8ecff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none;
    touch-action: none;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: min(96vw, 800px);
    font-size: 20px;
    font-weight: 600;
  }
  .hud b { color: #7ee0ff; }
  .lives { color: #ff6b8b; letter-spacing: 4px; font-size: 22px; }
  .frame {
    position: relative;
    width: min(96vw, 800px);
    aspect-ratio: 4 / 3;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 10px;
    box-shadow: 0 0 30px rgba(80, 120, 255, 0.25);
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px;
    background: rgba(8, 10, 25, 0.55);
    border-radius: 10px;
    text-align: center;
    pointer-events: none;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0; font-size: 42px; }
  .overlay p { margin: 0; font-size: 18px; opacity: 0.9; }
  .help { font-size: 14px; opacity: 0.6; text-align: center; }
</style>
</head>
<body>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Level: <b id="level">1</b></span>
    <span class="lives" id="lives"></span>
  </div>

  <div class="frame">
    <canvas id="game" width="800" height="600"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="title">Brick Breaker</h1>
      <p id="message">Click or press Space to launch</p>
    </div>
  </div>

  <div class="help">
    Move: mouse, or ← → / A D &nbsp;·&nbsp; Launch / continue: click or Space &nbsp;·&nbsp; Pause: P or Esc
  </div>

<script>
(() => {
  'use strict';

  const W = 800, H = 600;
  const PADDLE_W = 120, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 9;
  const BALL_R = 8, SUBSTEPS = 4;
  const COLS = 10, BRICK_H = 22, GAP = 6, TOP = 70, SIDE = 30;
  const BRICK_W = (W - SIDE * 2 - GAP * (COLS - 1)) / COLS;
  const COLORS = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#b197fc'];

  // Brick layouts: '0' = empty, '1' = one hit, '2' = two hits
  const LEVELS = [
    {
      speed: 5,
      rows: ['1111111111', '0111111110', '0011111100', '0001111000', '0000110000'],
    },
    {
      speed: 6,
      rows: ['2222222222', '1212121212', '2121212121', '1122222211', '2222112222'],
    },
  ];

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const el = {
    score: document.getElementById('score'),
    level: document.getElementById('level'),
    lives: document.getElementById('lives'),
    overlay: document.getElementById('overlay'),
    title: document.getElementById('title'),
    message: document.getElementById('message'),
  };

  const game = {
    mode: 'ready', // ready | playing | paused | cleared | won | over
    levelIndex: 0,
    score: 0,
    lives: 3,
    paddleX: (W - PADDLE_W) / 2,
    bricks: [],
    ball: { x: 0, y: 0, vx: 0, vy: 0 },
  };
  const keys = { left: false, right: false };

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const levelSpeed = () => LEVELS[game.levelIndex].speed;

  function showOverlay(title, msg) {
    el.title.textContent = title;
    el.message.textContent = msg;
    el.overlay.classList.remove('hidden');
  }

  function hideOverlay() {
    el.overlay.classList.add('hidden');
  }

  function updateHud() {
    el.score.textContent = game.score;
    el.level.textContent = game.levelIndex + 1;
    el.lives.textContent = '♥'.repeat(game.lives) + '♡'.repeat(3 - game.lives);
  }

  function buildLevel() {
    game.bricks = [];
    LEVELS[game.levelIndex].rows.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        const hp = Number(ch);
        if (hp > 0) {
          game.bricks.push({
            x: SIDE + c * (BRICK_W + GAP),
            y: TOP + r * (BRICK_H + GAP),
            hp,
            color: COLORS[r % COLORS.length],
          });
        }
      });
    });
  }

  function placeBallOnPaddle() {
    game.ball.x = game.paddleX + PADDLE_W / 2;
    game.ball.y = PADDLE_Y - BALL_R;
  }

  function resetBall(title, msg) {
    game.mode = 'ready';
    game.ball.vx = 0;
    game.ball.vy = 0;
    placeBallOnPaddle();
    showOverlay(title, msg);
  }

  function startLevel() {
    buildLevel();
    resetBall(`Level ${game.levelIndex + 1}`, 'Click or press Space to launch');
    updateHud();
  }

  function newGame() {
    game.score = 0;
    game.lives = 3;
    game.levelIndex = 0;
    startLevel();
  }

  function launch() {
    const s = levelSpeed();
    const vx = s * 0.4 * (Math.random() < 0.5 ? -1 : 1);
    game.ball.vx = vx;
    game.ball.vy = -Math.sqrt(s * s - vx * vx);
    game.mode = 'playing';
    hideOverlay();
  }

  function resume() {
    game.mode = 'playing';
    hideOverlay();
  }

  function togglePause() {
    if (game.mode === 'playing') {
      game.mode = 'paused';
      showOverlay('Paused', 'Press P, Esc, or Space to resume');
    } else if (game.mode === 'paused') {
      resume();
    }
  }

  // Primary action: launch, resume, advance, or restart depending on state
  function action() {
    switch (game.mode) {
      case 'ready': launch(); break;
      case 'paused': resume(); break;
      case 'cleared':
        game.levelIndex++;
        startLevel();
        break;
      case 'won':
      case 'over':
        newGame();
        break;
    }
  }

  function loseLife() {
    game.lives--;
    updateHud();
    if (game.lives <= 0) {
      game.mode = 'over';
      game.ball.vx = 0;
      game.ball.vy = 0;
      showOverlay('Game Over', `Final score: ${game.score}. Click or press Space to play again`);
    } else {
      resetBall('Ball lost', `Lives left: ${game.lives}. Click or press Space to launch`);
    }
  }

  function levelComplete() {
    if (game.levelIndex < LEVELS.length - 1) {
      game.mode = 'cleared';
      game.ball.vx = 0;
      game.ball.vy = 0;
      showOverlay(`Level ${game.levelIndex + 1} cleared!`,
        `Click or press Space for Level ${game.levelIndex + 2}`);
    } else {
      game.mode = 'won';
      game.ball.vx = 0;
      game.ball.vy = 0;
      showOverlay('You win!', `Final score: ${game.score}. Click or press Space to play again`);
    }
  }

  // Advance the ball by h (one substep), handling walls, paddle, bricks
  function step(h) {
    const g = game, b = g.ball;
    const prevX = b.x, prevY = b.y;
    b.x += b.vx * h;
    b.y += b.vy * h;

    // Side and top walls
    if (b.x - BALL_R < 0) { b.x = BALL_R; b.vx = Math.abs(b.vx); }
    else if (b.x + BALL_R > W) { b.x = W - BALL_R; b.vx = -Math.abs(b.vx); }
    if (b.y - BALL_R < 0) { b.y = BALL_R; b.vy = Math.abs(b.vy); }

    // Ball fell past the bottom
    if (b.y - BALL_R > H) {
      loseLife();
      return;
    }

    // Paddle: bounce angle depends on where the ball hits
    if (b.vy > 0 &&
        b.y + BALL_R >= PADDLE_Y &&
        b.y + BALL_R <= PADDLE_Y + PADDLE_H + 10 &&
        b.x >= g.paddleX - BALL_R &&
        b.x <= g.paddleX + PADDLE_W + BALL_R) {
      const s = levelSpeed();
      const hit = clamp((b.x - (g.paddleX + PADDLE_W / 2)) / (PADDLE_W / 2), -1, 1);
      b.vx = hit * s * 0.8;
      b.vy = -Math.sqrt(s * s - b.vx * b.vx);
      b.y = PADDLE_Y - BALL_R;
      return;
    }

    // Bricks: handle at most one collision per substep
    for (const br of g.bricks) {
      const cx = clamp(b.x, br.x, br.x + BRICK_W);
      const cy = clamp(b.y, br.y, br.y + BRICK_H);
      const dx = b.x - cx, dy = b.y - cy;
      if (dx * dx + dy * dy > BALL_R * BALL_R) continue;

      // Back out to the previous position, then reflect off the side that was hit
      b.x = prevX;
      b.y = prevY;
      if (prevY + BALL_R <= br.y || prevY - BALL_R >= br.y + BRICK_H) {
        b.vy = -b.vy;
      } else {
        b.vx = -b.vx;
      }

      br.hp--;
      g.score += br.hp > 0 ? 5 : 10;
      g.bricks = g.bricks.filter(x => x.hp > 0);
      updateHud();
      if (g.bricks.length === 0) levelComplete();
      break;
    }
  }

  function update(dt) {
    const g = game;
    if (g.mode === 'ready' || g.mode === 'playing') {
      if (keys.left) g.paddleX -= PADDLE_SPEED * dt;
      if (keys.right) g.paddleX += PADDLE_SPEED * dt;
      g.paddleX = clamp(g.paddleX, 0, W - PADDLE_W);
    }
    if (g.mode === 'ready') {
      placeBallOnPaddle();
      return;
    }
    if (g.mode !== 'playing') return;
    for (let i = 0; i < SUBSTEPS && game.mode === 'playing'; i++) {
      step(dt / SUBSTEPS);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function render() {
    ctx.fillStyle = '#151a33';
    ctx.fillRect(0, 0, W, H);

    // Bricks (two-hit bricks get a white outline)
    for (const br of game.bricks) {
      roundRect(br.x, br.y, BRICK_W, BRICK_H, 4);
      ctx.fillStyle = br.color;
      ctx.fill();
      if (br.hp === 2) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.stroke();
      }
    }

    // Paddle
    roundRect(game.paddleX, PADDLE_Y, PADDLE_W, PADDLE_H, 7);
    ctx.fillStyle = '#e8ecff';
    ctx.shadowColor = '#7ee0ff';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Ball
    ctx.beginPath();
    ctx.arc(game.ball.x, game.ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#7ee0ff';
    ctx.shadowBlur = 14;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Input: keyboard
  window.addEventListener('keydown', e => {
    switch (e.code) {
      case 'ArrowLeft':
      case 'KeyA':
        keys.left = true;
        e.preventDefault();
        break;
      case 'ArrowRight':
      case 'KeyD':
        keys.right = true;
        e.preventDefault();
        break;
      case 'Space':
      case 'Enter':
        e.preventDefault();
        if (!e.repeat) action();
        break;
      case 'KeyP':
      case 'Escape':
        if (!e.repeat) togglePause();
        break;
    }
  });

  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });

  // Input: mouse (and touch) controls the paddle; click to launch
  function setPaddleFromClientX(clientX) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (W / rect.width);
    game.paddleX = clamp(x - PADDLE_W / 2, 0, W - PADDLE_W);
  }

  window.addEventListener('pointermove', e => setPaddleFromClientX(e.clientX));
  window.addEventListener('pointerdown', e => {
    if (e.button === 0) {
      setPaddleFromClientX(e.clientX);
      action();
    }
  });

  // Auto-pause if the window loses focus
  window.addEventListener('blur', () => {
    keys.left = false;
    keys.right = false;
    if (game.mode === 'playing') togglePause();
  });

  // Main loop
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(2, (now - last) / (1000 / 60));
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
