<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    color: #e8ecf4;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: min(800px, 96vw, calc((100vh - 60px) * 4 / 3));
    aspect-ratio: 4 / 3;
    background: #161b29;
    border: 2px solid #2c3550;
    border-radius: 8px;
    cursor: none;
  }
  p {
    margin: 10px 0 0;
    font-size: 14px;
    color: #8a94ad;
    text-align: center;
  }
  kbd {
    background: #2c3550;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    color: #e8ecf4;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p>Move: <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> or mouse &nbsp;·&nbsp;
   Launch: <kbd>Space</kbd> or click &nbsp;·&nbsp; Pause: <kbd>P</kbd></p>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ----- Level layouts: '.' empty, '1' normal brick, '2' tough brick (2 hits) -----
  const LEVELS = [
    {
      speed: 380,
      rows: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      speed: 460,
      rows: [
        "2222222222",
        "2111111112",
        "21.2112.12",
        "21.1221.12",
        "2111111112",
        ".22.22.22.",
      ],
    },
  ];

  const ROW_COLORS = ["#ff5d73", "#ff9f43", "#feca57", "#1dd1a1", "#54a0ff", "#a29bfe"];
  const COLS = 10, MARGIN = 35, GAP = 6, BRICK_H = 22, TOP = 70;
  const BRICK_W = (W - MARGIN * 2 - GAP * (COLS - 1)) / COLS;
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 600;
  const BALL_R = 8;
  const START_LIVES = 3;

  const paddle = { x: W / 2 - PADDLE_W / 2, w: PADDLE_W, h: PADDLE_H, y: PADDLE_Y };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R, speed: 0 };
  let bricks = [];
  let particles = [];
  let score = 0, lives = START_LIVES, level = 0;
  // states: serve, play, paused, levelclear, gameover, win
  let state = "serve";
  const keys = { left: false, right: false };

  function loadLevel(idx) {
    level = idx;
    bricks = [];
    const lv = LEVELS[idx];
    lv.rows.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === ".") return;
        const hp = parseInt(ch, 10);
        bricks.push({
          x: MARGIN + c * (BRICK_W + GAP),
          y: TOP + r * (BRICK_H + GAP),
          w: BRICK_W,
          h: BRICK_H,
          hp,
          maxHp: hp,
          color: ROW_COLORS[r % ROW_COLORS.length],
        });
      });
    });
    resetBall();
  }

  function resetBall() {
    state = "serve";
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
    ball.speed = LEVELS[level].speed;
    stickBall();
  }

  function stickBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launch() {
    const angle = (Math.random() * 40 - 20) * Math.PI / 180;
    ball.vx = ball.speed * Math.sin(angle);
    ball.vy = -ball.speed * Math.cos(angle);
    state = "play";
  }

  function newGame() {
    score = 0;
    lives = START_LIVES;
    particles = [];
    loadLevel(0);
  }

  // Primary action: Space / click / Enter
  function action() {
    switch (state) {
      case "serve": launch(); break;
      case "paused": state = "play"; break;
      case "levelclear": loadLevel(level + 1); break;
      case "gameover":
      case "win": newGame(); break;
    }
  }

  function togglePause() {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }

  // ----- Input -----
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; e.preventDefault(); }
    else if (k === " " || k === "Spacebar" || k === "Enter") { if (!e.repeat) action(); e.preventDefault(); }
    else if (k === "p" || k === "P" || k === "Escape") togglePause();
  });
  document.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });
  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state === "play") state = "paused";
  });

  function pointerToCanvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener("mousemove", (e) => {
    if (state === "paused") return;
    const mx = pointerToCanvasX(e.clientX);
    paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
  });
  canvas.addEventListener("mousedown", (e) => {
    if (e.button === 0) action();
  });
  // Touch support as a bonus
  canvas.addEventListener("touchmove", (e) => {
    if (state === "paused") return;
    const mx = pointerToCanvasX(e.touches[0].clientX);
    paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("touchstart", (e) => { action(); e.preventDefault(); }, { passive: false });

  // ----- Update -----
  function spawnParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 160;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, color });
    }
  }

  function update(dt) {
    // particles always animate (except when paused)
    if (state !== "paused") {
      for (const p of particles) {
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt;
      }
      particles = particles.filter(p => p.life > 0);
    }

    if (state === "paused" || state === "gameover" || state === "win" || state === "levelclear") return;

    // keyboard paddle movement
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir) paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x + dir * PADDLE_SPEED * dt));

    if (state === "serve") { stickBall(); return; }

    // sub-stepping to avoid tunneling
    const dist = ball.speed * dt;
    const steps = Math.max(1, Math.ceil(dist / 4));
    const sdt = dt / steps;
    for (let i = 0; i < steps && state === "play"; i++) stepBall(sdt);
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    else if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // paddle
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x + ball.r >= paddle.x && ball.x - ball.r <= paddle.x + paddle.w) {
      let hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      hit = Math.max(-1, Math.min(1, hit));
      const angle = hit * 60 * Math.PI / 180;
      ball.vx = ball.speed * Math.sin(angle);
      ball.vy = -ball.speed * Math.cos(angle);
      ball.y = paddle.y - ball.r;
    }

    // bricks (resolve one collision per sub-step)
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > ball.r * ball.r) continue;

      const ox = (b.w / 2 + ball.r) - Math.abs(ball.x - (b.x + b.w / 2));
      const oy = (b.h / 2 + ball.r) - Math.abs(ball.y - (b.y + b.h / 2));
      if (ox < oy) {
        const s = ball.x < b.x + b.w / 2 ? -1 : 1;
        ball.vx = Math.abs(ball.vx) * s;
        ball.x += ox * s;
      } else {
        const s = ball.y < b.y + b.h / 2 ? -1 : 1;
        ball.vy = Math.abs(ball.vy) * s;
        ball.y += oy * s;
      }

      b.hp--;
      score += 10 * (level + 1);
      if (b.hp <= 0) {
        score += 5 * b.maxHp * (level + 1);
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);
      }
      break;
    }

    if (bricks.every(b => b.hp <= 0)) {
      state = level + 1 < LEVELS.length ? "levelclear" : "win";
      return;
    }

    // ball lost
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) state = "gameover";
      else resetBall();
    }
  }

  // ----- Render -----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "#1e2538";
    ctx.fillRect(0, 0, W, 44);
    ctx.font = "bold 20px 'Segoe UI', Arial, sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#e8ecf4";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, 22);
    ctx.textAlign = "center";
    ctx.fillText("Level " + (level + 1) + " / " + LEVELS.length, W / 2, 22);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 16 - START_LIVES * 22, 22);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (START_LIVES - 1 - i) * 22 - 8, 22, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5d73" : "#3a4360";
      ctx.fill();
    }
  }

  function drawOverlay(title, sub) {
    ctx.fillStyle = "rgba(10, 12, 20, 0.72)";
    ctx.fillRect(0, 44, W, H - 44);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 46px 'Segoe UI', Arial, sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 30);
    ctx.font = "20px 'Segoe UI', Arial, sans-serif";
    ctx.fillStyle = "#c3cbe0";
    sub.split("\n").forEach((line, i) => ctx.fillText(line, W / 2, H / 2 + 20 + i * 30));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // bricks
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.maxHp > 1 && b.hp < b.maxHp ? 0.55 : 1;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.maxHp > 1) {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.5);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // paddle
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, "#9ad0ff");
    g.addColorStop(1, "#3a7bd5");
    ctx.fillStyle = g;
    ctx.fill();

    // ball
    if (state !== "gameover") {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#9ad0ff";
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    drawHUD();

    if (state === "serve") {
      ctx.textAlign = "center";
      ctx.fillStyle = "#c3cbe0";
      ctx.font = "18px 'Segoe UI', Arial, sans-serif";
      ctx.fillText("Press Space or click to launch", W / 2, H / 2 + 80);
    } else if (state === "paused") {
      drawOverlay("Paused", "Press P, Space or click to resume");
    } else if (state === "levelclear") {
      drawOverlay("Level " + (level + 1) + " Cleared!", "Score: " + score + "\nPress Space or click for Level " + (level + 2));
    } else if (state === "gameover") {
      drawOverlay("Game Over", "Final score: " + score + "\nPress Space or click to play again");
    } else if (state === "win") {
      drawOverlay("You Win!", "All levels cleared — final score: " + score + "\nPress Space or click to play again");
    }
  }

  // ----- Main loop -----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
