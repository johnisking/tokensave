<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0d1a;
    color: #e8ecff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  canvas {
    width: min(96vw, 800px);
    height: auto;
    aspect-ratio: 4 / 3;
    background: #11142b;
    border-radius: 10px;
    box-shadow: 0 0 30px rgba(80, 120, 255, 0.25);
    touch-action: none;
  }
  p {
    margin: 0;
    font-size: 14px;
    opacity: 0.7;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p>Mouse: move paddle, click to launch &middot; Keys: &larr;/&rarr; or A/D to move, Space or Enter to launch, P to pause</p>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // '.' = empty cell, digits = hits needed to destroy the brick
  const LEVELS = [
    {
      speed: 340,
      rows: [
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111'
      ]
    },
    {
      speed: 400,
      rows: [
        '3333333333',
        '2.2.2.2.2.',
        '1111111111',
        '.22222222.',
        '1.1.1.1.1.',
        '2222222222'
      ]
    }
  ];
  const COLORS = ['#ff5d73', '#ffa23a', '#ffd23a', '#5be38a', '#4cc9f0', '#9d8cff'];
  const MAX_BOUNCE = Math.PI / 3; // 60 degrees
  const PADDLE_SPEED = 620;
  const START_LIVES = 3;
  const SUBSTEPS = 3;

  const paddle = { w: 110, h: 14, y: H - 40, x: (W - 110) / 2 };
  const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0 };

  let state, level, score, lives, bricks, speed;
  const keys = new Set();
  let mouseX = null;

  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  function attachBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    ball.vx = 0;
    ball.vy = 0;
  }

  function buildLevel() {
    const cfg = LEVELS[level - 1];
    const bw = 68, bh = 22, gap = 8, cols = 10;
    const ox = (W - (cols * bw + (cols - 1) * gap)) / 2;
    const oy = 70;
    bricks = [];
    cfg.rows.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === '.') return;
        const hp = Number(ch);
        bricks.push({
          x: ox + c * (bw + gap),
          y: oy + r * (bh + gap),
          w: bw,
          h: bh,
          hp,
          maxHp: hp,
          color: COLORS[r % COLORS.length]
        });
      });
    });
    speed = cfg.speed;
    paddle.x = (W - paddle.w) / 2;
    attachBall();
    state = 'ready';
  }

  function restart() {
    level = 1;
    score = 0;
    lives = START_LIVES;
    buildLevel();
  }

  function launch() {
    const a = (Math.random() * 0.6 - 0.3); // slight random angle off vertical
    ball.vx = speed * Math.sin(a);
    ball.vy = -speed * Math.cos(a);
    state = 'playing';
  }

  function loseLife() {
    lives--;
    if (lives <= 0) {
      state = 'gameover';
      attachBall();
    } else {
      state = 'ready';
      attachBall();
    }
  }

  function hitBrick(b) {
    const L = b.x, R = b.x + b.w, T = b.y, B = b.y + b.h;
    const cx = clamp(ball.x, L, R);
    const cy = clamp(ball.y, T, B);
    const dx = ball.x - cx;
    const dy = ball.y - cy;
    if (dx * dx + dy * dy >= ball.r * ball.r) return false;

    const inside = ball.x > L && ball.x < R && ball.y > T && ball.y < B;
    if (inside) {
      const left = ball.x - L, right = R - ball.x;
      const top = ball.y - T, bottom = B - ball.y;
      if (Math.min(left, right) < Math.min(top, bottom)) {
        ball.vx = -ball.vx;
        ball.x = left < right ? L - ball.r : R + ball.r;
      } else {
        ball.vy = -ball.vy;
        ball.y = top < bottom ? T - ball.r : B + ball.r;
      }
    } else if (Math.abs(dx) > Math.abs(dy)) {
      ball.vx = -ball.vx;
      ball.x = ball.x < L ? L - ball.r : R + ball.r;
    } else {
      ball.vy = -ball.vy;
      ball.y = ball.y < T ? T - ball.r : B + ball.r;
    }

    b.hp--;
    if (b.hp <= 0) {
      score += 10 * b.maxHp * level;
    } else {
      score += 5;
    }
    return true;
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // walls
    if (ball.x - ball.r < 0) {
      ball.x = ball.r;
      ball.vx = Math.abs(ball.vx);
    } else if (ball.x + ball.r > W) {
      ball.x = W - ball.r;
      ball.vx = -Math.abs(ball.vx);
    }
    if (ball.y - ball.r < 0) {
      ball.y = ball.r;
      ball.vy = Math.abs(ball.vy);
    }

    // paddle
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x - ball.r &&
        ball.x <= paddle.x + paddle.w + ball.r) {
      const rel = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const angle = rel * MAX_BOUNCE;
      ball.vx = speed * Math.sin(angle);
      ball.vy = -speed * Math.cos(angle);
      ball.y = paddle.y - ball.r;
    }

    // bricks (one per substep so corners don't double-count)
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      if (hitBrick(b)) break;
    }

    // bottom edge
    if (ball.y - ball.r > H) {
      loseLife();
    }
  }

  function update(dt) {
    if (state === 'ready') {
      attachBall();
      return;
    }
    if (state !== 'playing') return;

    // keyboard paddle movement
    let dir = 0;
    if (keys.has('ArrowLeft') || keys.has('KeyA')) dir -= 1;
    if (keys.has('ArrowRight') || keys.has('KeyD')) dir += 1;
    if (dir !== 0) {
      paddle.x = clamp(paddle.x + dir * PADDLE_SPEED * dt, 0, W - paddle.w);
    }

    // ball, in substeps to avoid tunnelling through bricks
    const sub = dt / SUBSTEPS;
    for (let i = 0; i < SUBSTEPS && state === 'playing'; i++) {
      stepBall(sub);
    }

    if (state === 'playing' && bricks.every(b => b.hp <= 0)) {
      if (level < LEVELS.length) {
        state = 'levelclear';
      } else {
        state = 'win';
      }
    }
  }

  // ---------- drawing ----------

  function drawBricks() {
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      ctx.save();
      ctx.globalAlpha = b.maxHp > 1 ? 0.35 + 0.65 * (b.hp / b.maxHp) : 1;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(b.x, b.y, b.w, 4);
      if (b.maxHp > 1) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
      }
      ctx.restore();
    }
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
    g.addColorStop(0, '#7aa2ff');
    g.addColorStop(1, '#3b5bdb');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
  }

  function drawBall() {
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#9fd4ff';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawHUD() {
    ctx.fillStyle = '#e8ecff';
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('SCORE  ' + String(score).padStart(5, '0'), 20, 28);

    ctx.textAlign = 'center';
    ctx.fillText('LEVEL ' + level + ' / ' + LEVELS.length, W / 2, 28);

    ctx.textAlign = 'right';
    ctx.fillText('LIVES', W - 20 - 3 * 22, 28);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.fillStyle = i < lives ? '#ff5d73' : 'rgba(255,255,255,0.15)';
      ctx.beginPath();
      ctx.arc(W - 20 - (2 - i) * 22 - 8, 28, 7, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawOverlay(title, lines) {
    ctx.fillStyle = 'rgba(5, 7, 18, 0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 40px system-ui, sans-serif';
    ctx.fillText(title, W / 2, H / 2 - 40);
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillStyle = '#c8d0f0';
    lines.forEach((line, i) => ctx.fillText(line, W / 2, H / 2 + 6 + i * 26));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#141838');
    bg.addColorStop(1, '#0a0c1c');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawBricks();
    drawPaddle();
    drawBall();
    drawHUD();

    if (state === 'ready') {
      drawOverlay('Ready?', ['Click or press Space to launch']);
    } else if (state === 'paused') {
      drawOverlay('Paused', ['Press P or click to resume']);
    } else if (state === 'levelclear') {
      drawOverlay('Level ' + level + ' cleared!', ['Click or press Space for Level ' + (level + 1)]);
    } else if (state === 'gameover') {
      drawOverlay('Game Over', ['Final score: ' + score, 'Click or press Enter to play again']);
    } else if (state === 'win') {
      drawOverlay('You win!', ['Final score: ' + score, 'Click or press Enter to play again']);
    }
  }

  // ---------- input ----------

  function action() {
    switch (state) {
      case 'ready':
        launch();
        break;
      case 'paused':
        state = 'playing';
        break;
      case 'levelclear':
        level++;
        buildLevel();
        break;
      case 'gameover':
      case 'win':
        restart();
        break;
    }
  }

  function togglePause() {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }

  const MOVE_KEYS = ['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD'];

  window.addEventListener('keydown', e => {
    if (MOVE_KEYS.includes(e.code) || e.code === 'Space') e.preventDefault();
    if (e.repeat && e.code !== 'ArrowLeft' && e.code !== 'ArrowRight') return;
    keys.add(e.code);
    if (e.code === 'Space' || e.code === 'Enter') {
      if (!e.repeat) action();
    } else if (e.code === 'KeyP' || e.code === 'Escape') {
      togglePause();
    }
  });

  window.addEventListener('keyup', e => keys.delete(e.code));

  window.addEventListener('blur', () => {
    keys.clear();
    if (state === 'playing') state = 'paused';
  });

  function toCanvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }

  function movePaddleTo(clientX) {
    mouseX = toCanvasX(clientX);
    paddle.x = clamp(mouseX - paddle.w / 2, 0, W - paddle.w);
  }

  canvas.addEventListener('mousemove', e => movePaddleTo(e.clientX));
  canvas.addEventListener('mousedown', e => {
    movePaddleTo(e.clientX);
    action();
  });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    movePaddleTo(e.touches[0].clientX);
    action();
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    movePaddleTo(e.touches[0].clientX);
  }, { passive: false });

  // ---------- main loop ----------

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.03);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  restart();
  state = 'ready';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
