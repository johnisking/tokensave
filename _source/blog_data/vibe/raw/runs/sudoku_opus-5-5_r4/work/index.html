<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku</title>
<style>
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 24px;
    background: #f4f5f7;
    color: #222;
  }
  h1 { margin: 0 0 16px; }
  #board {
    display: grid;
    grid-template-columns: repeat(9, 48px);
    grid-template-rows: repeat(9, 48px);
    border: 3px solid #222;
    background: #fff;
  }
  #board input {
    width: 48px;
    height: 48px;
    box-sizing: border-box;
    border: 1px solid #bbb;
    text-align: center;
    font-size: 24px;
    padding: 0;
    outline: none;
    background: #fff;
    color: #1a56c4;
    caret-color: transparent;
  }
  #board input:focus { background: #e3edff; }
  #board input.given { color: #222; font-weight: 600; background: #eef0f3; }
  #board input.wrong { background: #ffd2d2; color: #b00000; }
  #board input.col-3, #board input.col-6 { border-left: 2px solid #222; }
  #board input.row-3, #board input.row-6 { border-top: 2px solid #222; }
  .controls { margin-top: 16px; display: flex; gap: 10px; }
  button {
    font-size: 16px;
    padding: 8px 18px;
    border: none;
    border-radius: 6px;
    background: #1a56c4;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #1546a0; }
  #status { margin-top: 12px; min-height: 1.4em; font-weight: 500; }
</style>
</head>
<body>
<h1>Sudoku</h1>
<div id="board"></div>
<div class="controls">
  <button id="newBtn">New Puzzle</button>
  <button id="checkBtn">Check</button>
  <button id="solveBtn">Solve</button>
</div>
<div id="status"></div>

<script>
(function () {
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const cells = [];
  let solution = [];
  let puzzle = [];

  // Build the 81 inputs
  for (let i = 0; i < 81; i++) {
    const r = Math.floor(i / 9), c = i % 9;
    const input = document.createElement('input');
    input.type = 'text';
    input.inputMode = 'numeric';
    input.maxLength = 1;
    input.autocomplete = 'off';
    input.className = 'row-' + r + ' col-' + c;
    input.setAttribute('aria-label', 'Row ' + (r + 1) + ' column ' + (c + 1));
    input.addEventListener('input', () => {
      const digits = input.value.replace(/[^1-9]/g, '');
      input.value = digits ? digits[digits.length - 1] : '';
      input.classList.remove('wrong');
      statusEl.textContent = '';
    });
    input.addEventListener('keydown', (e) => {
      let nr = r, nc = c;
      if (e.key === 'ArrowUp') nr = (r + 8) % 9;
      else if (e.key === 'ArrowDown') nr = (r + 1) % 9;
      else if (e.key === 'ArrowLeft') nc = (c + 8) % 9;
      else if (e.key === 'ArrowRight') nc = (c + 1) % 9;
      else return;
      e.preventDefault();
      cells[nr * 9 + nc].focus();
    });
    boardEl.appendChild(input);
    cells.push(input);
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function canPlace(g, idx, n) {
    const r = Math.floor(idx / 9), c = idx % 9;
    const br = r - r % 3, bc = c - c % 3;
    for (let k = 0; k < 9; k++) {
      if (g[r * 9 + k] === n || g[k * 9 + c] === n) return false;
      if (g[(br + Math.floor(k / 3)) * 9 + bc + (k % 3)] === n) return false;
    }
    return true;
  }

  // Fill grid with a random complete solution
  function fill(g) {
    const idx = g.indexOf(0);
    if (idx === -1) return true;
    for (const n of shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9])) {
      if (canPlace(g, idx, n)) {
        g[idx] = n;
        if (fill(g)) return true;
      }
    }
    g[idx] = 0;
    return false;
  }

  // Count solutions up to limit, choosing the most constrained empty cell
  function countSolutions(g, limit) {
    let best = -1, bestCands = null;
    for (let i = 0; i < 81; i++) {
      if (g[i] !== 0) continue;
      const cands = [];
      for (let n = 1; n <= 9; n++) if (canPlace(g, i, n)) cands.push(n);
      if (cands.length === 0) return 0;
      if (!bestCands || cands.length < bestCands.length) {
        best = i; bestCands = cands;
        if (cands.length === 1) break;
      }
    }
    if (best === -1) return 1;
    let count = 0;
    for (const n of bestCands) {
      g[best] = n;
      count += countSolutions(g, limit - count);
      if (count >= limit) break;
    }
    g[best] = 0;
    return count;
  }

  function generate() {
    const full = new Array(81).fill(0);
    fill(full);
    const p = full.slice();
    for (const i of shuffle([...Array(81).keys()])) {
      const saved = p[i];
      p[i] = 0;
      if (countSolutions(p.slice(), 2) !== 1) p[i] = saved;
    }
    return { puzzle: p, solution: full };
  }

  function newPuzzle() {
    const g = generate();
    puzzle = g.puzzle;
    solution = g.solution;
    cells.forEach((input, i) => {
      input.classList.remove('wrong');
      if (puzzle[i]) {
        input.value = puzzle[i];
        input.readOnly = true;
        input.classList.add('given');
        input.tabIndex = -1;
      } else {
        input.value = '';
        input.readOnly = false;
        input.classList.remove('given');
        input.tabIndex = 0;
      }
    });
    statusEl.textContent = '';
  }

  function check() {
    let wrong = 0, empty = 0;
    cells.forEach((input, i) => {
      input.classList.remove('wrong');
      if (puzzle[i]) return;
      if (input.value === '') { empty++; return; }
      if (Number(input.value) !== solution[i]) {
        input.classList.add('wrong');
        wrong++;
      }
    });
    if (wrong) statusEl.textContent = wrong + ' wrong cell' + (wrong > 1 ? 's' : '') + '.';
    else if (empty) statusEl.textContent = 'So far so good! ' + empty + ' cell' + (empty > 1 ? 's' : '') + ' left.';
    else statusEl.textContent = 'Solved! Well done.';
  }

  function solve() {
    cells.forEach((input, i) => {
      input.value = solution[i];
      input.classList.remove('wrong');
    });
    statusEl.textContent = 'Solution shown.';
  }

  document.getElementById('newBtn').addEventListener('click', newPuzzle);
  document.getElementById('checkBtn').addEventListener('click', check);
  document.getElementById('solveBtn').addEventListener('click', solve);

  newPuzzle();
})();
</script>
</body>
</html>
