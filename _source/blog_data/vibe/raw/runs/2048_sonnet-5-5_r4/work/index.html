<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; background: #faf8ef; color: #776e65; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
  h1 { margin: 0 0 10px; font-size: 48px; }
  .bar { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
  .score { background: #bbada0; color: #fff; padding: 8px 18px; border-radius: 4px; font-weight: bold; }
  button { background: #8f7a66; color: #f9f6f2; border: 0; border-radius: 4px; padding: 10px 18px; font-size: 16px; font-weight: bold; cursor: pointer; }
  button:hover { background: #7f6a56; }
  #wrap { position: relative; }
  #board { position: relative; width: 340px; height: 340px; background: #bbada0; border-radius: 6px; }
  .cell, .tile { position: absolute; width: 73px; height: 73px; border-radius: 3px; }
  .cell { background: rgba(238,228,218,.35); }
  .tile { display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 32px; transition: left .1s, top .1s; }
  .tile.new { animation: pop .15s; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  .t2{background:#eee4da}.t4{background:#ede0c8}.t8{background:#f2b179;color:#f9f6f2}.t16{background:#f59563;color:#f9f6f2}
  .t32{background:#f67c5f;color:#f9f6f2}.t64{background:#f65e3b;color:#f9f6f2}.t128{background:#edcf72;color:#f9f6f2;font-size:28px}
  .t256{background:#edcc61;color:#f9f6f2;font-size:28px}.t512{background:#edc850;color:#f9f6f2;font-size:28px}
  .t1024{background:#edc53f;color:#f9f6f2;font-size:22px}.t2048{background:#edc22e;color:#f9f6f2;font-size:22px}
  .tbig{background:#3c3a32;color:#f9f6f2;font-size:20px}
  #msg { display: none; position: absolute; inset: 0; background: rgba(238,228,218,.8); border-radius: 6px; flex-direction: column; align-items: center; justify-content: center; font-size: 36px; font-weight: bold; gap: 14px; }
  #msg.show { display: flex; }
</style>
</head>
<body>
<h1>2048</h1>
<div class="bar">
  <div class="score">Score: <span id="score">0</span></div>
  <button id="new">New Game</button>
</div>
<div id="wrap">
  <div id="board"></div>
  <div id="msg"><span>Game over! No moves left.</span><button id="again">Try again</button></div>
</div>
<p>Use the arrow keys to move the tiles.</p>
<script>
(function () {
  var N = 4, STEP = 83, PAD = 8;
  var grid, score, nextId = 0;
  var board = document.getElementById('board');
  var scoreEl = document.getElementById('score');
  var msg = document.getElementById('msg');

  for (var i = 0; i < 16; i++) {
    var c = document.createElement('div');
    c.className = 'cell';
    c.style.left = (PAD + (i % N) * STEP) + 'px';
    c.style.top = (PAD + Math.floor(i / N) * STEP) + 'px';
    board.appendChild(c);
  }

  function empty() {
    var e = [];
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (!grid[r][c]) e.push([r, c]);
    return e;
  }
  function addRandom() {
    var e = empty();
    if (!e.length) return;
    var p = e[Math.floor(Math.random() * e.length)];
    grid[p[0]][p[1]] = { v: Math.random() < 0.9 ? 2 : 4, isNew: true };
  }
  function render() {
    var old = board.querySelectorAll('.tile');
    for (var i = 0; i < old.length; i++) board.removeChild(old[i]);
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var t = grid[r][c];
      if (!t) continue;
      var d = document.createElement('div');
      d.className = 'tile ' + (t.v <= 2048 ? 't' + t.v : 'tbig') + (t.isNew ? ' new' : '');
      d.textContent = t.v;
      d.style.left = (PAD + c * STEP) + 'px';
      d.style.top = (PAD + r * STEP) + 'px';
      board.appendChild(d);
      t.isNew = false;
    }
    scoreEl.textContent = score;
  }
  function slideLine(line) {
    var vals = line.filter(function (x) { return x; });
    var out = [], gained = 0;
    for (var i = 0; i < vals.length; i++) {
      if (i + 1 < vals.length && vals[i].v === vals[i + 1].v) {
        var v = vals[i].v * 2;
        out.push({ v: v });
        gained += v;
        i++;
      } else out.push({ v: vals[i].v });
    }
    while (out.length < N) out.push(null);
    return { line: out, gained: gained };
  }
  function move(dir) { // 0 left, 1 up, 2 right, 3 down
    var moved = false, gained = 0;
    for (var k = 0; k < N; k++) {
      var coords = [];
      for (var j = 0; j < N; j++) {
        var j2 = (dir === 2 || dir === 3) ? N - 1 - j : j;
        coords.push(dir % 2 === 0 ? [k, j2] : [j2, k]);
      }
      var line = coords.map(function (p) { return grid[p[0]][p[1]]; });
      var res = slideLine(line);
      gained += res.gained;
      for (var j = 0; j < N; j++) {
        var p = coords[j], before = line[j], after = res.line[j];
        if ((before ? before.v : 0) !== (after ? after.v : 0)) moved = true;
        grid[p[0]][p[1]] = after;
      }
    }
    if (!moved) return;
    score += gained;
    addRandom();
    render();
    if (!canMove()) msg.classList.add('show');
  }
  function canMove() {
    if (empty().length) return true;
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var v = grid[r][c].v;
      if (c + 1 < N && grid[r][c + 1].v === v) return true;
      if (r + 1 < N && grid[r + 1][c].v === v) return true;
    }
    return false;
  }
  function newGame() {
    grid = [];
    for (var r = 0; r < N; r++) grid.push([null, null, null, null]);
    score = 0;
    msg.classList.remove('show');
    addRandom(); addRandom();
    render();
  }

  document.addEventListener('keydown', function (e) {
    var map = { ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3 };
    if (!(e.key in map)) return;
    e.preventDefault();
    if (msg.classList.contains('show')) return;
    move(map[e.key]);
  });
  document.getElementById('new').onclick = newGame;
  document.getElementById('again').onclick = newGame;
  newGame();
})();
</script>
</body>
</html>
