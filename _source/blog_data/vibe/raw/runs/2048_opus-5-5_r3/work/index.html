<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<style>
  body {
    margin: 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #faf8ef;
    color: #776e65;
    display: flex;
    justify-content: center;
  }
  .container { width: 420px; padding: 24px 0; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  h1 { font-size: 64px; margin: 0; color: #776e65; }
  .controls { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .score-box {
    background: #bbada0;
    color: #fff;
    padding: 6px 18px;
    border-radius: 4px;
    text-align: center;
    min-width: 70px;
  }
  .score-box .label { font-size: 12px; text-transform: uppercase; color: #eee4da; }
  .score-box #score { font-size: 24px; font-weight: bold; }
  button {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 4px;
    padding: 10px 16px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #9f8b77; }
  .board-wrap { position: relative; }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 12px;
    background: #bbada0;
    padding: 12px;
    border-radius: 6px;
    width: 396px;
    height: 396px;
  }
  .cell {
    background: rgba(238, 228, 218, 0.35);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 40px;
    user-select: none;
  }
  .tile-2    { background: #eee4da; color: #776e65; }
  .tile-4    { background: #ede0c8; color: #776e65; }
  .tile-8    { background: #f2b179; color: #f9f6f2; }
  .tile-16   { background: #f59563; color: #f9f6f2; }
  .tile-32   { background: #f67c5f; color: #f9f6f2; }
  .tile-64   { background: #f65e3b; color: #f9f6f2; }
  .tile-128  { background: #edcf72; color: #f9f6f2; font-size: 34px; }
  .tile-256  { background: #edcc61; color: #f9f6f2; font-size: 34px; }
  .tile-512  { background: #edc850; color: #f9f6f2; font-size: 34px; }
  .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 28px; }
  .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 28px; }
  .tile-super { background: #3c3a32; color: #f9f6f2; font-size: 24px; }
  .tile-new { animation: pop 0.15s ease-out; }
  @keyframes pop { from { transform: scale(0.5); } to { transform: scale(1); } }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.75);
    border-radius: 6px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .overlay.show { display: flex; }
  .overlay p { font-size: 44px; font-weight: bold; margin: 0; }
  .hint { margin-top: 16px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>2048</h1>
    <div class="controls">
      <div class="score-box">
        <div class="label">Score</div>
        <div id="score">0</div>
      </div>
      <button id="new-game">New Game</button>
    </div>
  </div>
  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <p id="message">Game Over!</p>
      <button id="try-again">Try Again</button>
    </div>
  </div>
  <p class="hint">Use the <strong>arrow keys</strong> to move the tiles. Tiles with the same number merge into one.</p>
</div>

<script>
  const SIZE = 4;
  const boardEl = document.getElementById("board");
  const scoreEl = document.getElementById("score");
  const overlayEl = document.getElementById("overlay");
  const messageEl = document.getElementById("message");

  let grid, score, newCell;

  const cells = [];
  for (let i = 0; i < SIZE * SIZE; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    boardEl.appendChild(cell);
    cells.push(cell);
  }

  function newGame() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    addRandomTile();
    addRandomTile();
    overlayEl.classList.remove("show");
    render();
  }

  function addRandomTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) empty.push([r, c]);
    if (empty.length === 0) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    newCell = r * SIZE + c;
  }

  // Slide and merge one row toward index 0. Returns the new row and points gained.
  function slideRow(row) {
    const nums = row.filter(v => v !== 0);
    const out = [];
    let gained = 0;
    for (let i = 0; i < nums.length; i++) {
      if (i + 1 < nums.length && nums[i] === nums[i + 1]) {
        const merged = nums[i] * 2;
        out.push(merged);
        gained += merged;
        i++;
      } else {
        out.push(nums[i]);
      }
    }
    while (out.length < SIZE) out.push(0);
    return { row: out, gained };
  }

  // Coordinates of each line, ordered from the edge tiles move toward.
  function lineCoords(dir, i) {
    const coords = [];
    for (let j = 0; j < SIZE; j++) {
      if (dir === "left") coords.push([i, j]);
      else if (dir === "right") coords.push([i, SIZE - 1 - j]);
      else if (dir === "up") coords.push([j, i]);
      else coords.push([SIZE - 1 - j, i]);
    }
    return coords;
  }

  function move(dir) {
    let moved = false;
    for (let i = 0; i < SIZE; i++) {
      const coords = lineCoords(dir, i);
      const line = coords.map(([r, c]) => grid[r][c]);
      const { row, gained } = slideRow(line);
      score += gained;
      coords.forEach(([r, c], k) => {
        if (grid[r][c] !== row[k]) moved = true;
        grid[r][c] = row[k];
      });
    }
    if (!moved) return;
    addRandomTile();
    render();
    if (!canMove()) {
      messageEl.textContent = "Game Over! No moves left.";
      overlayEl.classList.add("show");
    }
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        if (v === 0) return true;
        if (c + 1 < SIZE && grid[r][c + 1] === v) return true;
        if (r + 1 < SIZE && grid[r + 1][c] === v) return true;
      }
    return false;
  }

  function render() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        const idx = r * SIZE + c;
        const v = grid[r][c];
        const cell = cells[idx];
        cell.textContent = v ? v : "";
        cell.className = "cell";
        if (v) cell.classList.add(v > 2048 ? "tile-super" : "tile-" + v);
        if (idx === newCell) cell.classList.add("tile-new");
      }
    newCell = -1;
    scoreEl.textContent = score;
  }

  const KEYS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
  document.addEventListener("keydown", e => {
    const dir = KEYS[e.key];
    if (!dir) return;
    e.preventDefault();
    if (overlayEl.classList.contains("show")) return;
    move(dir);
  });

  document.getElementById("new-game").addEventListener("click", newGame);
  document.getElementById("try-again").addEventListener("click", newGame);

  newGame();
</script>
</body>
</html>
