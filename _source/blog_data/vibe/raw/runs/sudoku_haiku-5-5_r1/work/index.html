<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku</title>
<style>
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f6f8;
    color: #222;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 24px 12px;
  }
  h1 { margin: 0 0 16px; font-weight: 600; }
  #board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    width: min(92vw, 480px);
    aspect-ratio: 1 / 1;
    border: 3px solid #333;
    background: #fff;
  }
  #board input {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border: 1px solid #c4c9d1;
    border-radius: 0;
    background: #fff;
    color: #1a56db;
    font: inherit;
    font-size: clamp(1rem, 4.5vw, 1.6rem);
    text-align: center;
    outline: none;
    caret-color: transparent;
    cursor: pointer;
  }
  #board input.br { border-right: 2px solid #333; }
  #board input.bb { border-bottom: 2px solid #333; }
  #board input.given {
    color: #111;
    font-weight: 700;
    background: #eaeef3;
    cursor: default;
  }
  #board input:focus { background: #fff8c5; }
  #board input.given:focus { background: #fff8c5; }
  #board input.wrong { color: #c81e1e; background: #fde2e2; }
  #controls { display: flex; gap: 10px; margin-top: 18px; }
  button {
    font: inherit;
    padding: 8px 18px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  button:hover { background: #e9edf2; }
  #message { min-height: 1.4em; margin-top: 14px; font-size: 0.95rem; }
</style>
</head>
<body>
  <h1>Sudoku</h1>
  <div id="board"></div>
  <div id="controls">
    <button id="new-btn" type="button">New Puzzle</button>
    <button id="check-btn" type="button">Check</button>
    <button id="solve-btn" type="button">Solve</button>
  </div>
  <div id="message" role="status"></div>

<script>
  const boardEl = document.getElementById('board');
  const messageEl = document.getElementById('message');
  const cells = [];

  // Current puzzle: 0 means empty. `solution` is the unique completed grid.
  let puzzle = [];
  let solution = [];

  // ---------- Puzzle generation ----------

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function canPlace(grid, idx, n) {
    const r = Math.floor(idx / 9);
    const c = idx % 9;
    for (let k = 0; k < 9; k++) {
      if (grid[r * 9 + k] === n) return false;
      if (grid[k * 9 + c] === n) return false;
    }
    const br = r - (r % 3);
    const bc = c - (c % 3);
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 3; j++) {
        if (grid[(br + i) * 9 + bc + j] === n) return false;
      }
    }
    return true;
  }

  // Fills the grid in place with a random valid completion.
  function fillGrid(grid) {
    const idx = grid.indexOf(0);
    if (idx === -1) return true;
    for (const n of shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9])) {
      if (canPlace(grid, idx, n)) {
        grid[idx] = n;
        if (fillGrid(grid)) return true;
        grid[idx] = 0;
      }
    }
    return false;
  }

  // Counts solutions, stopping once `limit` is reached. Restores the grid.
  function countSolutions(grid, limit) {
    const idx = grid.indexOf(0);
    if (idx === -1) return 1;
    let count = 0;
    for (let n = 1; n <= 9 && count < limit; n++) {
      if (canPlace(grid, idx, n)) {
        grid[idx] = n;
        count += countSolutions(grid, limit - count);
        grid[idx] = 0;
      }
    }
    return count;
  }

  // Start from a full solution, then remove clues while the puzzle
  // still has exactly one solution.
  function generatePuzzle() {
    const full = new Array(81).fill(0);
    fillGrid(full);
    const p = full.slice();
    const order = shuffle([...Array(81).keys()]);
    for (const idx of order) {
      const backup = p[idx];
      p[idx] = 0;
      if (countSolutions(p.slice(), 2) !== 1) p[idx] = backup;
    }
    return { puzzle: p, solution: full };
  }

  // ---------- Board ----------

  for (let i = 0; i < 81; i++) {
    const row = Math.floor(i / 9);
    const col = i % 9;
    const input = document.createElement('input');
    input.type = 'text';
    input.inputMode = 'numeric';
    input.autocomplete = 'off';
    input.setAttribute('aria-label', `Row ${row + 1}, column ${col + 1}`);
    if (col === 2 || col === 5) input.classList.add('br');
    if (row === 2 || row === 5) input.classList.add('bb');
    input.addEventListener('focus', () => input.select());
    input.addEventListener('input', onInput);
    input.addEventListener('keydown', onKeyDown);
    boardEl.appendChild(input);
    cells.push(input);
  }

  function render() {
    cells.forEach((input, i) => {
      const v = puzzle[i];
      input.value = v ? String(v) : '';
      input.readOnly = v !== 0;
      input.classList.toggle('given', v !== 0);
      input.classList.remove('wrong');
    });
  }

  // Keep only the last digit 1-9 typed into a cell.
  function onInput(e) {
    const input = e.target;
    input.value = input.value.replace(/[^1-9]/g, '').slice(-1);
    input.classList.remove('wrong');
  }

  // Arrow keys move between cells; everything else is handled by onInput.
  function onKeyDown(e) {
    const i = cells.indexOf(e.target);
    const r = Math.floor(i / 9);
    const c = i % 9;
    let nr = r;
    let nc = c;
    switch (e.key) {
      case 'ArrowUp':    nr = r - 1; break;
      case 'ArrowDown':  nr = r + 1; break;
      case 'ArrowLeft':  nc = c - 1; break;
      case 'ArrowRight': nc = c + 1; break;
      default: return;
    }
    if (nr >= 0 && nr < 9 && nc >= 0 && nc < 9) {
      e.preventDefault();
      cells[nr * 9 + nc].focus();
    }
  }

  // ---------- Actions ----------

  function newPuzzle() {
    ({ puzzle, solution } = generatePuzzle());
    render();
    messageEl.textContent = '';
  }

  function check() {
    let wrong = 0;
    let empty = 0;
    cells.forEach((input, i) => {
      input.classList.remove('wrong');
      if (puzzle[i]) return;
      if (input.value === '') {
        empty++;
      } else if (Number(input.value) !== solution[i]) {
        input.classList.add('wrong');
        wrong++;
      }
    });
    if (wrong) {
      messageEl.textContent = `${wrong} wrong cell${wrong === 1 ? '' : 's'} highlighted.`;
    } else if (empty) {
      messageEl.textContent = `No mistakes so far. ${empty} cell${empty === 1 ? '' : 's'} left to fill.`;
    } else {
      messageEl.textContent = 'Congratulations, the puzzle is solved!';
    }
  }

  function solve() {
    cells.forEach((input, i) => {
      input.value = String(solution[i]);
      input.classList.remove('wrong');
    });
    messageEl.textContent = 'Solution filled in.';
  }

  document.getElementById('new-btn').addEventListener('click', newPuzzle);
  document.getElementById('check-btn').addEventListener('click', check);
  document.getElementById('solve-btn').addEventListener('click', solve);

  newPuzzle();
</script>
</body>
</html>
