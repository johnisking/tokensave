<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; background: #faf8ef; color: #776e65; margin: 0; padding: 20px; text-align: center; }
  h1 { font-size: 56px; margin: 0 0 10px; }
  .bar { display: flex; justify-content: center; align-items: center; gap: 16px; margin-bottom: 14px; }
  .score { background: #bbada0; color: #fff; padding: 8px 18px; border-radius: 6px; font-weight: bold; }
  .score span { display: block; font-size: 22px; }
  button { background: #8f7a66; color: #fff; border: 0; border-radius: 6px; padding: 12px 18px; font-size: 16px; font-weight: bold; cursor: pointer; }
  button:hover { background: #9f8b77; }
  #wrap { position: relative; width: 340px; margin: 0 auto; }
  #board { display: grid; grid-template-columns: repeat(4, 1fr); grid-gap: 10px; background: #bbada0; padding: 10px; border-radius: 8px; }
  .cell { aspect-ratio: 1; background: rgba(238,228,218,.35); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 34px; }
  .t2 { background: #eee4da; } .t4 { background: #ede0c8; }
  .t8 { background: #f2b179; color: #f9f6f2; } .t16 { background: #f59563; color: #f9f6f2; }
  .t32 { background: #f67c5f; color: #f9f6f2; } .t64 { background: #f65e3b; color: #f9f6f2; }
  .t128 { background: #edcf72; color: #f9f6f2; font-size: 28px; } .t256 { background: #edcc61; color: #f9f6f2; font-size: 28px; }
  .t512 { background: #edc850; color: #f9f6f2; font-size: 28px; } .t1024 { background: #edc53f; color: #f9f6f2; font-size: 22px; }
  .t2048 { background: #edc22e; color: #f9f6f2; font-size: 22px; } .tbig { background: #3c3a32; color: #f9f6f2; font-size: 20px; }
  #msg { display: none; position: absolute; inset: 0; background: rgba(238,228,218,.8); border-radius: 8px; flex-direction: column; align-items: center; justify-content: center; font-size: 36px; font-weight: bold; gap: 14px; }
  #msg.show { display: flex; }
</style>
</head>
<body>
<h1>2048</h1>
<div class="bar">
  <div class="score">SCORE<span id="score">0</span></div>
  <button id="new">New Game</button>
</div>
<div id="wrap">
  <div id="board"></div>
  <div id="msg"><div>Game over! No moves left.</div><button id="again">Try Again</button></div>
</div>
<p>Use the arrow keys to move the tiles.</p>
<script>
const N = 4;
let grid, score;
const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const msgEl = document.getElementById('msg');

function addTile() {
  const empty = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) empty.push([r, c]);
  if (!empty.length) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function start() {
  grid = Array.from({ length: N }, () => Array(N).fill(0));
  score = 0;
  addTile(); addTile();
  msgEl.classList.remove('show');
  render();
}

function render() {
  boardEl.innerHTML = '';
  for (const row of grid) for (const v of row) {
    const d = document.createElement('div');
    d.className = 'cell' + (v ? ' t' + (v > 2048 ? 'big' : v) : '');
    d.textContent = v || '';
    boardEl.appendChild(d);
  }
  scoreEl.textContent = score;
}

// slide a line toward index 0; returns new line and points gained
function slide(line) {
  const t = line.filter(x => x);
  let pts = 0;
  for (let i = 0; i < t.length - 1; i++) {
    if (t[i] === t[i + 1]) { t[i] *= 2; pts += t[i]; t.splice(i + 1, 1); }
  }
  while (t.length < N) t.push(0);
  return [t, pts];
}

function move(dir) { // 0 left, 1 up, 2 right, 3 down
  let moved = false, gained = 0;
  const next = grid.map(r => r.slice());
  for (let i = 0; i < N; i++) {
    const idx = [];
    for (let j = 0; j < N; j++) {
      idx.push(dir === 0 ? [i, j] : dir === 2 ? [i, N - 1 - j] : dir === 1 ? [j, i] : [N - 1 - j, i]);
    }
    const [res, pts] = slide(idx.map(([r, c]) => grid[r][c]));
    gained += pts;
    idx.forEach(([r, c], k) => {
      if (next[r][c] !== res[k]) moved = true;
      next[r][c] = res[k];
    });
  }
  if (!moved) return;
  grid = next;
  score += gained;
  addTile();
  render();
  if (!canMove()) msgEl.classList.add('show');
}

function canMove() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (!grid[r][c]) return true;
    if (c < N - 1 && grid[r][c] === grid[r][c + 1]) return true;
    if (r < N - 1 && grid[r][c] === grid[r + 1][c]) return true;
  }
  return false;
}

document.addEventListener('keydown', e => {
  const dir = { ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3 }[e.key];
  if (dir === undefined) return;
  e.preventDefault();
  move(dir);
});
document.getElementById('new').onclick = start;
document.getElementById('again').onclick = start;
start();
</script>
</body>
</html>
