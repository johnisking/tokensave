<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d1117;
    color: #e6edf3;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #hud {
    width: min(800px, 96vw);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    font-weight: 600;
    padding: 6px 2px;
    box-sizing: border-box;
  }
  #lives { color: #ff6b6b; letter-spacing: 2px; }
  #wrap {
    position: relative;
    width: min(800px, 96vw);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    box-sizing: border-box;
    background: #010409;
    border: 2px solid #30363d;
    border-radius: 6px;
    cursor: none;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(1, 4, 9, 0.78);
    border-radius: 6px;
    cursor: pointer;
    padding: 20px;
    box-sizing: border-box;
  }
  #overlay.hidden { display: none; }
  #ot { font-size: clamp(28px, 6vw, 48px); margin: 0 0 12px; color: #58a6ff; }
  #os { font-size: clamp(14px, 2.5vw, 18px); margin: 0 0 18px; color: #c9d1d9; }
  #ob { font-size: 15px; margin: 0; color: #7ee787; }
  #help { width: min(800px, 96vw); font-size: 13px; color: #8b949e; margin-top: 8px; box-sizing: border-box; }
</style>
</head>
<body>

<div id="hud">
  <div>Score: <span id="score">0</span></div>
  <div id="level">Level 1</div>
  <div>Lives: <span id="lives"></span></div>
</div>

<div id="wrap">
  <canvas id="game" width="800" height="560"></canvas>
  <div id="overlay">
    <h1 id="ot">BRICK BREAKER</h1>
    <p id="os"></p>
    <p id="ob"></p>
  </div>
</div>

<p id="help">
  Move: mouse, or ← → / A D &nbsp;|&nbsp; Launch ball: click or Space &nbsp;|&nbsp; Pause: P or Esc
</p>

<script>
(() => {
  // ---------- Constants ----------
  const W = 800, H = 560;
  const MARGIN = 20, TOP = 70, GAP = 4, BH = 22;
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 36, PADDLE_SPEED = 9;
  const BALL_R = 8;
  const MAX_ANGLE = 1.2;           // max bounce angle off paddle edges (radians)
  const START_LIVES = 3;
  const HP_COLORS = { 1: '#69db7c', 2: '#ffd43b', 3: '#ff6b6b' };

  // Each digit = brick hit points (0 = empty). Level 2 has tougher bricks and a faster ball.
  const LEVELS = [
    {
      name: 'Level 1', speed: 5,
      layout: [
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
        '0111111110',
        '0011111100',
      ],
    },
    {
      name: 'Level 2', speed: 6.5,
      layout: [
        '333333333333',
        '322222222223',
        '321111111123',
        '320110011023',
        '321111111123',
        '322222222223',
        '333333333333',
      ],
    },
  ];

  // ---------- DOM ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  const overlay = document.getElementById('overlay');
  const elOT = document.getElementById('ot');
  const elOS = document.getElementById('os');
  const elOB = document.getElementById('ob');
  const elScore = document.getElementById('score');
  const elLevel = document.getElementById('level');
  const elLives = document.getElementById('lives');

  // ---------- State ----------
  let state = 'menu';             // menu | playing | paused | levelclear | gameover | win
  let levelIndex = 0;
  let score = 0;
  let lives = START_LIVES;
  let bricks = [];
  let paddleX = (W - PADDLE_W) / 2;
  const ball = { x: W / 2, y: PADDLE_Y - BALL_R, dx: 0, dy: 0, stuck: true };
  const keys = { left: 0, right: 0 };

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // ---------- Setup ----------
  function buildBricks(idx) {
    const layout = LEVELS[idx].layout;
    const cols = layout[0].length;
    const bw = (W - 2 * MARGIN - (cols - 1) * GAP) / cols;
    const list = [];
    layout.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        const hp = Number(ch);
        if (!hp) return;
        list.push({
          x: MARGIN + c * (bw + GAP),
          y: TOP + r * (BH + GAP),
          w: bw, h: BH, hp, alive: true,
        });
      });
    });
    return list;
  }

  function updateHUD() {
    elScore.textContent = score;
    elLevel.textContent = LEVELS[levelIndex].name;
    elLives.textContent = '♥'.repeat(Math.max(0, lives));
  }

  function showOverlay(title, sub, button) {
    elOT.textContent = title;
    elOS.textContent = sub;
    elOB.textContent = button;
    overlay.classList.remove('hidden');
  }

  function hideOverlay() {
    overlay.classList.add('hidden');
  }

  function resetBall() {
    ball.stuck = true;
    ball.x = paddleX + PADDLE_W / 2;
    ball.y = PADDLE_Y - BALL_R;
    ball.dx = 0;
    ball.dy = 0;
  }

  function startLevel(idx) {
    levelIndex = idx;
    bricks = buildBricks(idx);
    paddleX = (W - PADDLE_W) / 2;
    resetBall();
    state = 'playing';
    hideOverlay();
    updateHUD();
  }

  function newGame() {
    score = 0;
    lives = START_LIVES;
    startLevel(0);
  }

  function launch() {
    const sp = LEVELS[levelIndex].speed;
    const ang = (Math.random() * 0.6) - 0.3;
    ball.stuck = false;
    ball.dx = sp * Math.sin(ang);
    ball.dy = -sp * Math.cos(ang);
  }

  function pause() {
    state = 'paused';
    showOverlay('PAUSED', 'Press P or Esc to resume', 'Click or press Space to resume');
  }

  function resume() {
    state = 'playing';
    hideOverlay();
  }

  function togglePause() {
    if (state === 'playing') pause();
    else if (state === 'paused') resume();
  }

  // Single entry point for click / Space / Enter
  function onAction() {
    switch (state) {
      case 'menu':       newGame(); break;
      case 'playing':    if (ball.stuck) launch(); break;
      case 'paused':     resume(); break;
      case 'levelclear': startLevel(levelIndex + 1); break;
      case 'gameover':
      case 'win':        newGame(); break;
    }
  }

  function loseLife() {
    lives--;
    updateHUD();
    if (lives <= 0) {
      state = 'gameover';
      showOverlay('GAME OVER', `Final score: ${score}`, 'Click or press Space to play again');
    } else {
      resetBall();
    }
  }

  function levelComplete() {
    if (levelIndex + 1 < LEVELS.length) {
      state = 'levelclear';
      showOverlay(`${LEVELS[levelIndex].name} cleared!`, `Score: ${score}`,
        `Click or press Space for ${LEVELS[levelIndex + 1].name}`);
    } else {
      state = 'win';
      showOverlay('YOU WIN!', `Final score: ${score}`, 'Click or press Space to play again');
    }
  }

  // ---------- Physics ----------
  // Returns true if a brick was hit. Reflects along the axis the ball came from.
  function hitBrick(prevX, prevY) {
    for (const b of bricks) {
      if (!b.alive) continue;
      const cx = clamp(ball.x, b.x, b.x + b.w);
      const cy = clamp(ball.y, b.y, b.y + b.h);
      const ddx = ball.x - cx, ddy = ball.y - cy;
      if (ddx * ddx + ddy * ddy >= BALL_R * BALL_R) continue;

      if (prevX < b.x || prevX > b.x + b.w) {
        ball.dx = -ball.dx;
        ball.x = prevX;
      } else {
        ball.dy = -ball.dy;
        ball.y = prevY;
      }

      b.hp--;
      score += 10;
      if (b.hp <= 0) b.alive = false;
      updateHUD();

      if (bricks.every(br => !br.alive)) levelComplete();
      return true;
    }
    return false;
  }

  function update(dt) {
    paddleX = clamp(paddleX + (keys.right - keys.left) * PADDLE_SPEED * dt, 0, W - PADDLE_W);

    if (ball.stuck) {
      ball.x = paddleX + PADDLE_W / 2;
      ball.y = PADDLE_Y - BALL_R;
      return;
    }

    const mx = ball.dx * dt, my = ball.dy * dt;
    // Sub-step so fast balls cannot tunnel through bricks
    const steps = Math.max(1, Math.ceil(Math.max(Math.abs(mx), Math.abs(my)) / 3));

    for (let i = 0; i < steps; i++) {
      const prevX = ball.x, prevY = ball.y;
      ball.x += mx / steps;
      ball.y += my / steps;

      // Walls
      if (ball.x - BALL_R < 0)  { ball.x = BALL_R;     ball.dx = Math.abs(ball.dx); }
      if (ball.x + BALL_R > W)  { ball.x = W - BALL_R; ball.dx = -Math.abs(ball.dx); }
      if (ball.y - BALL_R < 0)  { ball.y = BALL_R;     ball.dy = Math.abs(ball.dy); }

      // Paddle
      if (ball.dy > 0 &&
          ball.y + BALL_R >= PADDLE_Y &&
          ball.y + BALL_R <= PADDLE_Y + PADDLE_H + BALL_R &&
          ball.x >= paddleX - BALL_R && ball.x <= paddleX + PADDLE_W + BALL_R) {
        const rel = clamp((ball.x - (paddleX + PADDLE_W / 2)) / (PADDLE_W / 2), -1, 1);
        const ang = rel * MAX_ANGLE;
        const sp = LEVELS[levelIndex].speed;
        ball.dx = sp * Math.sin(ang);
        ball.dy = -sp * Math.cos(ang);
        ball.y = PADDLE_Y - BALL_R;
        continue;
      }

      // Bricks
      hitBrick(prevX, prevY);
      if (state !== 'playing') return;

      // Fell off the bottom
      if (ball.y - BALL_R > H) {
        loseLife();
        return;
      }
    }
  }

  // ---------- Drawing ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      ctx.fillStyle = HP_COLORS[b.hp] || '#8b949e';
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      roundRect(b.x + 2, b.y + 2, b.w - 4, 4, 2);
      ctx.fill();
    }

    // Paddle
    const grad = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
    grad.addColorStop(0, '#79c0ff');
    grad.addColorStop(1, '#1f6feb');
    ctx.fillStyle = grad;
    roundRect(paddleX, PADDLE_Y, PADDLE_W, PADDLE_H, 7);
    ctx.fill();

    // Ball
    ctx.save();
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#58a6ff';
    ctx.fillStyle = '#f0f6fc';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Launch hint
    if (state === 'playing' && ball.stuck) {
      ctx.fillStyle = '#8b949e';
      ctx.font = '16px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Click or press Space to launch', W / 2, PADDLE_Y - 40);
    }
  }

  // ---------- Input ----------
  function setPaddleFromPointer(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    paddleX = clamp(x - PADDLE_W / 2, 0, W - PADDLE_W);
  }

  canvas.addEventListener('pointermove', setPaddleFromPointer);
  canvas.addEventListener('pointerdown', setPaddleFromPointer);
  wrap.addEventListener('pointerdown', onAction);

  window.addEventListener('keydown', e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === 'ArrowLeft' || k === 'a') { keys.left = 1; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd') { keys.right = 1; e.preventDefault(); }
    else if (k === ' ' || k === 'Enter') { e.preventDefault(); if (!e.repeat) onAction(); }
    else if ((k === 'p' || k === 'Escape') && !e.repeat) { togglePause(); }
  });

  window.addEventListener('keyup', e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === 'ArrowLeft' || k === 'a') keys.left = 0;
    else if (k === 'ArrowRight' || k === 'd') keys.right = 0;
  });

  window.addEventListener('blur', () => {
    keys.left = 0;
    keys.right = 0;
    if (state === 'playing') pause();
  });

  // ---------- Main loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 16.667, 3);
    last = now;
    if (state === 'playing') update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // Initial screen
  bricks = buildBricks(0);
  updateHUD();
  showOverlay('BRICK BREAKER',
    'Break every brick to clear a level. You have 3 lives.',
    'Click or press Space to start');
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
