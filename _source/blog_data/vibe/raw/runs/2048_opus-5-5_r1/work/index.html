<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #faf8ef;
    color: #776e65;
    display: flex;
    justify-content: center;
    margin: 0;
    padding: 30px 10px;
  }
  .container { width: 420px; }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  h1 { font-size: 64px; margin: 0; color: #776e65; }
  .score-box {
    background: #bbada0;
    color: #fff;
    padding: 6px 18px;
    border-radius: 4px;
    text-align: center;
    min-width: 70px;
  }
  .score-box .label { font-size: 12px; text-transform: uppercase; color: #eee4da; }
  .score-box .value { font-size: 24px; font-weight: bold; }
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  button {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 4px;
    padding: 10px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #9f8b77; }
  .board-wrap { position: relative; }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 12px;
    background: #bbada0;
    padding: 12px;
    border-radius: 6px;
    width: 396px;
    height: 396px;
  }
  .tile {
    background: rgba(238, 228, 218, 0.35);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 40px;
    user-select: none;
  }
  .tile.new { animation: pop 0.15s ease-out; }
  .tile.merged { animation: bump 0.15s ease-out; }
  @keyframes pop { from { transform: scale(0.3); } to { transform: scale(1); } }
  @keyframes bump { 50% { transform: scale(1.15); } }
  .t2    { background: #eee4da; color: #776e65; }
  .t4    { background: #ede0c8; color: #776e65; }
  .t8    { background: #f2b179; color: #f9f6f2; }
  .t16   { background: #f59563; color: #f9f6f2; }
  .t32   { background: #f67c5f; color: #f9f6f2; }
  .t64   { background: #f65e3b; color: #f9f6f2; }
  .t128  { background: #edcf72; color: #f9f6f2; font-size: 34px; }
  .t256  { background: #edcc61; color: #f9f6f2; font-size: 34px; }
  .t512  { background: #edc850; color: #f9f6f2; font-size: 34px; }
  .t1024 { background: #edc53f; color: #f9f6f2; font-size: 28px; }
  .t2048 { background: #edc22e; color: #f9f6f2; font-size: 28px; }
  .tbig  { background: #3c3a32; color: #f9f6f2; font-size: 24px; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.75);
    border-radius: 6px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .overlay.show { display: flex; }
  .overlay p { font-size: 44px; font-weight: bold; margin: 0; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>2048</h1>
    <div class="score-box">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>
  </div>
  <div class="controls">
    <span>Use arrow keys to move tiles.</span>
    <button id="newGame">New Game</button>
  </div>
  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <p>Game Over!</p>
      <div>No moves left.</div>
      <button id="tryAgain">Try Again</button>
    </div>
  </div>
</div>

<script>
  const SIZE = 4;
  const boardEl = document.getElementById("board");
  const scoreEl = document.getElementById("score");
  const overlayEl = document.getElementById("overlay");
  let grid, score, newCell, mergedCells;

  function newGame() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    mergedCells = new Set();
    addRandomTile();
    addRandomTile();
    overlayEl.classList.remove("show");
    render();
  }

  function addRandomTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    newCell = r * SIZE + c;
  }

  // Slide a single line toward index 0, merging equal neighbours once.
  function slideLine(line) {
    const nums = line.filter(v => v !== 0);
    const out = [];
    const merged = [];
    for (let i = 0; i < nums.length; i++) {
      if (i + 1 < nums.length && nums[i] === nums[i + 1]) {
        const v = nums[i] * 2;
        out.push(v);
        merged.push(out.length - 1);
        score += v;
        i++;
      } else {
        out.push(nums[i]);
      }
    }
    while (out.length < SIZE) out.push(0);
    return { out, merged };
  }

  function move(dir) {
    let moved = false;
    mergedCells = new Set();
    for (let i = 0; i < SIZE; i++) {
      // Build the list of cell coordinates for this line, ordered in the direction of movement.
      const coords = [];
      for (let j = 0; j < SIZE; j++) {
        if (dir === "left")  coords.push([i, j]);
        if (dir === "right") coords.push([i, SIZE - 1 - j]);
        if (dir === "up")    coords.push([j, i]);
        if (dir === "down")  coords.push([SIZE - 1 - j, i]);
      }
      const line = coords.map(([r, c]) => grid[r][c]);
      const { out, merged } = slideLine(line);
      coords.forEach(([r, c], k) => {
        if (grid[r][c] !== out[k]) moved = true;
        grid[r][c] = out[k];
      });
      merged.forEach(k => mergedCells.add(coords[k][0] * SIZE + coords[k][1]));
    }
    if (moved) {
      addRandomTile();
      render();
      if (!canMove()) overlayEl.classList.add("show");
    }
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        if (v === 0) return true;
        if (c + 1 < SIZE && grid[r][c + 1] === v) return true;
        if (r + 1 < SIZE && grid[r + 1][c] === v) return true;
      }
    return false;
  }

  function render() {
    boardEl.innerHTML = "";
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        const cell = document.createElement("div");
        cell.className = "tile";
        if (v) {
          cell.textContent = v;
          cell.classList.add(v <= 2048 ? "t" + v : "tbig");
          const idx = r * SIZE + c;
          if (idx === newCell) cell.classList.add("new");
          else if (mergedCells.has(idx)) cell.classList.add("merged");
        }
        boardEl.appendChild(cell);
      }
    scoreEl.textContent = score;
    newCell = -1;
  }

  const KEYS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
  document.addEventListener("keydown", e => {
    const dir = KEYS[e.key];
    if (!dir) return;
    e.preventDefault();
    if (overlayEl.classList.contains("show")) return;
    move(dir);
  });
  document.getElementById("newGame").addEventListener("click", newGame);
  document.getElementById("tryAgain").addEventListener("click", newGame);

  newGame();
</script>
</body>
</html>
