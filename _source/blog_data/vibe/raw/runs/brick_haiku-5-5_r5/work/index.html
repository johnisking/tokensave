<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05070d; color: #c9d1d9;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas {
    display: block; width: min(96vw, calc(86vh * 4 / 3)); height: auto; aspect-ratio: 4 / 3;
    border: 2px solid #1f2937; border-radius: 8px; background: #0b1020;
    box-shadow: 0 0 40px rgba(56, 139, 253, 0.15); touch-action: none; cursor: pointer;
  }
  #hint { font-size: 13px; color: #6e7681; text-align: center; }
  kbd {
    background: #161b22; border: 1px solid #30363d; border-bottom-width: 2px;
    border-radius: 4px; padding: 0 5px; font-family: inherit; color: #c9d1d9;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div id="hint"><kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> or mouse to move · <kbd>Space</kbd> or click to launch · <kbd>P</kbd> to pause</div>

<script>
'use strict';

const W = 800, H = 600, HUD_H = 50;
const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 50, PADDLE_SPEED = 640;
const BALL_R = 8, LIVES_START = 3;
const COLORS = ['#ef476f', '#ffd166', '#06d6a0', '#118ab2', '#8338ec', '#fb5607', '#3a86ff'];

// '1' = brick that takes 1 hit, '2' = brick that takes 2 hits, '.' = empty cell
const LEVELS = [
  {
    name: 'Level 1', speed: 340,
    map: [
      '1111111111',
      '1111111111',
      '.11111111.',
      '..11111...',
      '...111....',
    ],
  },
  {
    name: 'Level 2', speed: 420,
    map: [
      '2222222222',
      '2112112112',
      '2222222222',
      '1.1.1.1.1.',
      '2222222222',
      '1111111111',
      '2.2.2.2.2.',
    ],
  },
];

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// mode: ready | playing | paused | levelClear | gameOver | win
const g = {
  mode: 'ready',
  level: 0, score: 0, lives: LIVES_START,
  bricks: [], speed: LEVELS[0].speed,
  paddleX: W / 2, ball: null,
};
const keys = { left: false, right: false };

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// ---------- level / state management ----------

function buildBricks(map) {
  const cols = map[0].length;
  const gap = 6, margin = 40, top = 70, bh = 22;
  const bw = (W - margin * 2 - gap * (cols - 1)) / cols;
  const list = [];
  map.forEach((row, r) => {
    [...row].forEach((ch, c) => {
      if (ch === '.') return;
      const hp = Number(ch);
      list.push({
        x: margin + c * (bw + gap), y: top + r * (bh + gap),
        w: bw, h: bh, hp, maxHp: hp, row: r,
      });
    });
  });
  return list;
}

function placeBallOnPaddle() {
  g.ball = { x: g.paddleX, y: PADDLE_Y - BALL_R, vx: 0, vy: 0 };
}

function loadLevel(i) {
  g.level = i;
  g.bricks = buildBricks(LEVELS[i].map);
  g.speed = LEVELS[i].speed;
  g.paddleX = W / 2;
  placeBallOnPaddle();
  g.mode = 'ready';
}

function startGame() {
  g.score = 0;
  g.lives = LIVES_START;
  loadLevel(0);
}

function launchBall() {
  const a = (Math.random() - 0.5) * 0.6; // small random launch angle
  g.ball.vx = Math.sin(a) * g.speed;
  g.ball.vy = -Math.cos(a) * g.speed;
}

function loseLife() {
  g.lives--;
  if (g.lives > 0) {
    placeBallOnPaddle();
    g.mode = 'ready';
  } else {
    g.ball = null;
    g.mode = 'gameOver';
  }
}

function action() {
  switch (g.mode) {
    case 'ready': launchBall(); g.mode = 'playing'; break;
    case 'paused': g.mode = 'playing'; break;
    case 'levelClear': loadLevel(g.level + 1); break;
    case 'gameOver':
    case 'win': startGame(); break;
  }
}

function togglePause() {
  if (g.mode === 'playing') g.mode = 'paused';
  else if (g.mode === 'paused') g.mode = 'playing';
}

// ---------- physics ----------

function stepBall(dt) {
  const b = g.ball;
  const dist = Math.hypot(b.vx, b.vy) * dt;
  // move in small sub-steps so the ball cannot tunnel through bricks
  const steps = Math.max(1, Math.ceil(dist / 3));
  const h = dt / steps;

  for (let i = 0; i < steps; i++) {
    b.x += b.vx * h;
    b.y += b.vy * h;

    // side and top walls
    if (b.x < BALL_R) { b.x = BALL_R; b.vx = Math.abs(b.vx); }
    else if (b.x > W - BALL_R) { b.x = W - BALL_R; b.vx = -Math.abs(b.vx); }
    if (b.y < BALL_R) { b.y = BALL_R; b.vy = Math.abs(b.vy); }

    // paddle: direction depends on where the ball hit it
    const pLeft = g.paddleX - PADDLE_W / 2, pRight = g.paddleX + PADDLE_W / 2;
    if (b.vy > 0 &&
        b.y + BALL_R >= PADDLE_Y && b.y - BALL_R <= PADDLE_Y + PADDLE_H &&
        b.x >= pLeft - BALL_R && b.x <= pRight + BALL_R) {
      const off = clamp((b.x - g.paddleX) / (PADDLE_W / 2), -1, 1);
      const ang = off * 1.1; // up to ~63 degrees from vertical
      b.vx = Math.sin(ang) * g.speed;
      b.vy = -Math.cos(ang) * g.speed;
      b.y = PADDLE_Y - BALL_R;
    }

    // bricks: one collision per sub-step
    for (const br of g.bricks) {
      if (br.hp <= 0) continue;
      const cx = clamp(b.x, br.x, br.x + br.w);
      const cy = clamp(b.y, br.y, br.y + br.h);
      const dx = b.x - cx, dy = b.y - cy;
      if (dx * dx + dy * dy >= BALL_R * BALL_R) continue;

      if (Math.abs(dx) > Math.abs(dy)) {
        const sx = dx !== 0 ? Math.sign(dx) : (b.vx > 0 ? -1 : 1);
        b.vx = sx * Math.abs(b.vx);
        b.x = cx + sx * BALL_R;
      } else {
        const sy = dy !== 0 ? Math.sign(dy) : (b.vy > 0 ? -1 : 1);
        b.vy = sy * Math.abs(b.vy);
        b.y = cy + sy * BALL_R;
      }
      br.hp--;
      g.score += 10;
      break;
    }

    // ball fell past the paddle
    if (b.y - BALL_R > H) {
      loseLife();
      return;
    }
  }
}

function update(dt) {
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (g.mode === 'ready' || g.mode === 'playing') {
    g.paddleX = clamp(g.paddleX + dir * PADDLE_SPEED * dt, PADDLE_W / 2, W - PADDLE_W / 2);
  }
  if (g.mode === 'ready') g.ball.x = g.paddleX;

  if (g.mode === 'playing') {
    stepBall(dt);
    if (g.mode === 'playing' && g.bricks.every(br => br.hp <= 0)) {
      g.mode = g.level + 1 < LEVELS.length ? 'levelClear' : 'win';
    }
  }
}

// ---------- rendering ----------

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.fillRect(0, 0, W, HUD_H);
  ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e6edf3';

  ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + g.score, 20, HUD_H / 2);

  ctx.textAlign = 'center';
  ctx.fillText(LEVELS[g.level].name, W / 2, HUD_H / 2);

  ctx.textAlign = 'right';
  ctx.fillText('LIVES', W - 100, HUD_H / 2);
  for (let i = 0; i < LIVES_START; i++) {
    ctx.beginPath();
    ctx.arc(W - 30 - i * 26, HUD_H / 2, 8, 0, Math.PI * 2);
    ctx.fillStyle = i < g.lives ? '#ff4d6d' : '#2d3748';
    ctx.fill();
  }
}

function drawBricks() {
  for (const br of g.bricks) {
    if (br.hp <= 0) continue;
    ctx.globalAlpha = br.hp < br.maxHp ? 0.5 : 1; // damaged bricks look faded
    ctx.fillStyle = COLORS[br.row % COLORS.length];
    roundRect(br.x, br.y, br.w, br.h, 4);
    ctx.fill();
    ctx.lineWidth = br.maxHp > 1 ? 2 : 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawPaddle() {
  const grd = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
  grd.addColorStop(0, '#79c0ff');
  grd.addColorStop(1, '#1f6feb');
  ctx.fillStyle = grd;
  roundRect(g.paddleX - PADDLE_W / 2, PADDLE_Y, PADDLE_W, PADDLE_H, 7);
  ctx.fill();
}

function drawBall() {
  const b = g.ball;
  if (!b) return;
  ctx.save();
  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawOverlay() {
  let title = '', lines = [];
  switch (g.mode) {
    case 'ready':
      title = LEVELS[g.level].name;
      lines = ['Click or press Space to launch'];
      break;
    case 'paused':
      title = 'PAUSED';
      lines = ['Press P, Esc or click to resume'];
      break;
    case 'levelClear':
      title = 'LEVEL CLEARED!';
      lines = ['Score: ' + g.score, 'Click or press Space for ' + LEVELS[g.level + 1].name];
      break;
    case 'gameOver':
      title = 'GAME OVER';
      lines = ['Final score: ' + g.score, 'Click or press Space to play again'];
      break;
    case 'win':
      title = 'YOU WIN!';
      lines = ['Final score: ' + g.score, 'Click or press Space to play again'];
      break;
    default:
      return;
  }
  ctx.fillStyle = 'rgba(5, 8, 16, 0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#f0f6fc';
  ctx.font = 'bold 44px system-ui, sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 30);
  ctx.font = '20px system-ui, sans-serif';
  ctx.fillStyle = '#8b949e';
  lines.forEach((t, i) => ctx.fillText(t, W / 2, H / 2 + 20 + i * 32));
}

function draw() {
  ctx.fillStyle = '#0b1020';
  ctx.fillRect(0, 0, W, H);
  drawHUD();
  drawBricks();
  drawPaddle();
  drawBall();
  drawOverlay();
}

// ---------- input ----------

function setPaddleFromPointer(e) {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (W / rect.width);
  g.paddleX = clamp(x, PADDLE_W / 2, W - PADDLE_W / 2);
}

canvas.addEventListener('pointermove', setPaddleFromPointer);
canvas.addEventListener('pointerdown', e => {
  setPaddleFromPointer(e);
  action();
});

window.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) action();
  if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) togglePause();
});

window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});

window.addEventListener('blur', () => {
  keys.left = keys.right = false;
  if (g.mode === 'playing') g.mode = 'paused';
});

// ---------- main loop ----------

let lastTime = performance.now();
function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 1 / 30);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

startGame();
requestAnimationFrame(frame);
</script>
</body>
</html>
