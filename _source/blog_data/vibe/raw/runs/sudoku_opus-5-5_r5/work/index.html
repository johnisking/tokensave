<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku</title>
<style>
  body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; margin: 24px; background: #f4f6fa; color: #222; }
  h1 { margin: 0 0 16px; }
  #board { display: grid; grid-template-columns: repeat(9, 44px); grid-template-rows: repeat(9, 44px); border: 3px solid #222; background: #222; gap: 1px; }
  #board input { width: 100%; height: 100%; box-sizing: border-box; border: none; text-align: center; font-size: 22px; outline: none; background: #fff; color: #1a56db; padding: 0; caret-color: transparent; }
  #board input:focus { background: #dbeafe; }
  #board input.given { color: #111; font-weight: bold; background: #eef0f3; }
  #board input.wrong { background: #fecaca; color: #b91c1c; }
  #board input.br { border-right: 2px solid #222; }
  #board input.bb { border-bottom: 2px solid #222; }
  .controls { margin-top: 16px; display: flex; gap: 10px; }
  button { font-size: 16px; padding: 8px 16px; border: none; border-radius: 6px; background: #1a56db; color: #fff; cursor: pointer; }
  button:hover { background: #1e429f; }
  #status { margin-top: 12px; min-height: 1.4em; font-weight: 500; }
</style>
</head>
<body>
<h1>Sudoku</h1>
<div id="board"></div>
<div class="controls">
  <button id="newBtn">New Puzzle</button>
  <button id="checkBtn">Check</button>
  <button id="solveBtn">Solve</button>
</div>
<div id="status"></div>

<script>
const board = document.getElementById('board');
const statusEl = document.getElementById('status');
const inputs = [];
let solution = [];
let puzzle = [];

for (let i = 0; i < 81; i++) {
  const r = Math.floor(i / 9), c = i % 9;
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.inputMode = 'numeric';
  inp.maxLength = 1;
  inp.autocomplete = 'off';
  if (c === 2 || c === 5) inp.classList.add('br');
  if (r === 2 || r === 5) inp.classList.add('bb');
  inp.addEventListener('input', () => {
    const v = inp.value.replace(/[^1-9]/g, '');
    inp.value = v.slice(-1);
    inp.classList.remove('wrong');
    statusEl.textContent = '';
  });
  inp.addEventListener('keydown', e => {
    const moves = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 };
    if (moves[e.key] !== undefined) {
      const j = i + moves[e.key];
      if (j >= 0 && j < 81) inputs[j].focus();
      e.preventDefault();
    } else if (/^[1-9]$/.test(e.key) && !inp.readOnly) {
      inp.value = e.key;
      inp.classList.remove('wrong');
      statusEl.textContent = '';
      e.preventDefault();
    }
  });
  board.appendChild(inp);
  inputs.push(inp);
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function canPlace(g, idx, n) {
  const r = Math.floor(idx / 9), c = idx % 9;
  for (let k = 0; k < 9; k++) {
    if (g[r * 9 + k] === n || g[k * 9 + c] === n) return false;
  }
  const br = r - r % 3, bc = c - c % 3;
  for (let dr = 0; dr < 3; dr++)
    for (let dc = 0; dc < 3; dc++)
      if (g[(br + dr) * 9 + bc + dc] === n) return false;
  return true;
}

function fillGrid(g) {
  const idx = g.indexOf(0);
  if (idx === -1) return true;
  for (const n of shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9])) {
    if (canPlace(g, idx, n)) {
      g[idx] = n;
      if (fillGrid(g)) return true;
      g[idx] = 0;
    }
  }
  return false;
}

// Count solutions up to `limit`, choosing the cell with fewest candidates.
function countSolutions(g, limit) {
  let best = -1, bestCands = null;
  for (let i = 0; i < 81; i++) {
    if (g[i] !== 0) continue;
    const cands = [];
    for (let n = 1; n <= 9; n++) if (canPlace(g, i, n)) cands.push(n);
    if (cands.length === 0) return 0;
    if (!bestCands || cands.length < bestCands.length) {
      best = i; bestCands = cands;
      if (cands.length === 1) break;
    }
  }
  if (best === -1) return 1;
  let count = 0;
  for (const n of bestCands) {
    g[best] = n;
    count += countSolutions(g, limit - count);
    g[best] = 0;
    if (count >= limit) break;
  }
  return count;
}

function generate() {
  const full = new Array(81).fill(0);
  fillGrid(full);
  const p = full.slice();
  for (const i of shuffle([...Array(81).keys()])) {
    const saved = p[i];
    p[i] = 0;
    if (countSolutions(p.slice(), 2) !== 1) p[i] = saved;
  }
  return { puzzle: p, solution: full };
}

function newPuzzle() {
  const g = generate();
  puzzle = g.puzzle;
  solution = g.solution;
  inputs.forEach((inp, i) => {
    inp.classList.remove('wrong', 'given');
    if (puzzle[i]) {
      inp.value = puzzle[i];
      inp.readOnly = true;
      inp.classList.add('given');
    } else {
      inp.value = '';
      inp.readOnly = false;
    }
  });
  statusEl.textContent = '';
}

function check() {
  let wrong = 0, empty = 0;
  inputs.forEach((inp, i) => {
    inp.classList.remove('wrong');
    if (puzzle[i]) return;
    if (inp.value === '') { empty++; return; }
    if (Number(inp.value) !== solution[i]) { inp.classList.add('wrong'); wrong++; }
  });
  if (wrong) statusEl.textContent = `${wrong} wrong cell${wrong > 1 ? 's' : ''}.`;
  else if (empty) statusEl.textContent = `No mistakes so far. ${empty} cell${empty > 1 ? 's' : ''} left.`;
  else statusEl.textContent = 'Solved! Well done!';
}

function solve() {
  inputs.forEach((inp, i) => {
    inp.value = solution[i];
    inp.classList.remove('wrong');
  });
  statusEl.textContent = 'Solution shown.';
}

document.getElementById('newBtn').addEventListener('click', newPuzzle);
document.getElementById('checkBtn').addEventListener('click', check);
document.getElementById('solveBtn').addEventListener('click', solve);

newPuzzle();
</script>
</body>
</html>
