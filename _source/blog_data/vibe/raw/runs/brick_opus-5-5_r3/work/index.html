<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f1020;
    color: #eee;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  canvas {
    background: linear-gradient(#1a1b3a, #0b0c1c);
    border: 2px solid #444a8a;
    border-radius: 6px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
  }
  p { margin: 10px 0 0; color: #99a; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p>Mouse: move paddle, click to launch &nbsp;|&nbsp; Keyboard: ← → / A D to move, Space to launch, P to pause</p>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ---- Config ----
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 520;
  const BALL_R = 8;
  const BRICK_COLS = 10, BRICK_W = 70, BRICK_H = 24, BRICK_GAP = 6;
  const BRICK_TOP = 70;
  const BRICK_LEFT = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;

  // Level layouts: '.' = empty, '1' = normal brick, '2' = tough brick (2 hits), '3' = very tough (3 hits)
  const LEVELS = [
    {
      speed: 330,
      map: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      speed: 400,
      map: [
        "3.3.33.3.3",
        "2222222222",
        "1221111221",
        "1111221111",
        ".11222211.",
        "..111111..",
      ],
    },
  ];

  const ROW_COLORS = ["#ff5e7e", "#ff9f43", "#feca57", "#1dd1a1", "#48dbfb", "#a29bfe"];

  // ---- State ----
  let state;      // "ready" | "playing" | "paused" | "levelClear" | "gameOver" | "win"
  let score, lives, levelIndex;
  let paddle, ball, bricks;
  let keys = { left: false, right: false };
  let mouseX = null;
  let particles = [];

  function newGame() {
    score = 0;
    lives = 3;
    levelIndex = 0;
    loadLevel();
  }

  function loadLevel() {
    const lvl = LEVELS[levelIndex];
    bricks = [];
    lvl.map.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === ".") return;
        const hp = parseInt(ch, 10);
        bricks.push({
          x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H,
          hp, maxHp: hp,
          color: ROW_COLORS[r % ROW_COLORS.length],
        });
      });
    });
    paddle = { x: W / 2 - PADDLE_W / 2, w: PADDLE_W };
    particles = [];
    resetBall();
  }

  function resetBall() {
    ball = { x: paddle.x + paddle.w / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, stuck: true };
    state = "ready";
  }

  function launch() {
    if (!ball.stuck) return;
    const speed = LEVELS[levelIndex].speed;
    const angle = (Math.random() * 0.6 - 0.3); // radians off vertical
    ball.vx = speed * Math.sin(angle);
    ball.vy = -speed * Math.cos(angle);
    ball.stuck = false;
    state = "playing";
  }

  // Primary action: Space / Enter / click
  function action() {
    switch (state) {
      case "ready": launch(); break;
      case "paused": state = "playing"; break;
      case "levelClear":
        levelIndex++;
        loadLevel();
        break;
      case "gameOver":
      case "win":
        newGame();
        break;
    }
  }

  function togglePause() {
    if (state === "playing") state = "paused";
    else if (state === "paused") state = "playing";
  }

  // ---- Input ----
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; mouseX = null; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; mouseX = null; e.preventDefault(); }
    else if (k === " " || k === "Enter") { action(); e.preventDefault(); }
    else if (k === "p" || k === "P" || k === "Escape") { togglePause(); }
  });
  document.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener("mousemove", (e) => { mouseX = canvasX(e.clientX); });
  canvas.addEventListener("mousedown", (e) => { mouseX = canvasX(e.clientX); action(); });
  canvas.addEventListener("touchmove", (e) => { mouseX = canvasX(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchstart", (e) => { mouseX = canvasX(e.touches[0].clientX); action(); e.preventDefault(); }, { passive: false });
  window.addEventListener("blur", () => { keys.left = keys.right = false; if (state === "playing") state = "paused"; });

  // ---- Update ----
  function update(dt) {
    if (state === "paused" || state === "gameOver" || state === "win" || state === "levelClear") {
      updateParticles(dt);
      return;
    }

    // Paddle movement
    if (keys.left) paddle.x -= PADDLE_SPEED * dt;
    if (keys.right) paddle.x += PADDLE_SPEED * dt;
    if (mouseX !== null && !keys.left && !keys.right) paddle.x = mouseX - paddle.w / 2;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = PADDLE_Y - BALL_R - 1;
      updateParticles(dt);
      return;
    }

    // Sub-step the ball to avoid tunneling
    const speed = Math.hypot(ball.vx, ball.vy);
    const steps = Math.max(1, Math.ceil((speed * dt) / (BALL_R * 0.5)));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (stepBall(sdt)) break;
    }
    updateParticles(dt);
  }

  // Returns true if ball was lost or level finished (stop stepping)
  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 &&
        ball.y + BALL_R >= PADDLE_Y && ball.y - BALL_R <= PADDLE_Y + PADDLE_H &&
        ball.x >= paddle.x - BALL_R && ball.x <= paddle.x + paddle.w + BALL_R) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const clamped = Math.max(-1, Math.min(1, hit));
      const angle = clamped * (Math.PI / 3); // max 60 degrees
      const sp = Math.hypot(ball.vx, ball.vy);
      ball.vx = sp * Math.sin(angle);
      ball.vy = -sp * Math.cos(angle);
      ball.y = PADDLE_Y - BALL_R - 0.5;
    }

    // Bottom - lose a life
    if (ball.y - BALL_R > H) {
      lives--;
      if (lives <= 0) {
        lives = 0;
        state = "gameOver";
      } else {
        resetBall();
      }
      return true;
    }

    // Bricks
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const nx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const ny = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - nx, dy = ball.y - ny;
      if (dx * dx + dy * dy > BALL_R * BALL_R) continue;

      // Determine bounce axis by penetration depth
      const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + b.w - (ball.x - BALL_R));
      const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + b.h - (ball.y - BALL_R));
      if (overlapX < overlapY) {
        ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      } else {
        ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      }

      b.hp--;
      if (b.hp <= 0) {
        score += 10 * b.maxHp * (levelIndex + 1);
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);
        bricks.splice(i, 1);
        // Slight speedup each brick destroyed
        ball.vx *= 1.006;
        ball.vy *= 1.006;
      } else {
        score += 5;
      }
      break; // one brick per sub-step
    }

    if (bricks.length === 0) {
      score += 100 * lives;
      state = levelIndex + 1 < LEVELS.length ? "levelClear" : "win";
      return true;
    }
    return false;
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }
  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  // ---- Render ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // HUD
    ctx.fillStyle = "#fff";
    ctx.font = "bold 20px Segoe UI, Arial";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, 28);
    ctx.textAlign = "center";
    ctx.fillText("Level " + (levelIndex + 1) + " / " + LEVELS.length, W / 2, 28);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 90, 28);
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(W - 70 + i * 22, 28, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5e7e" : "#3a3b5a";
      ctx.fill();
    }
    ctx.strokeStyle = "#333766";
    ctx.beginPath(); ctx.moveTo(0, 50); ctx.lineTo(W, 50); ctx.stroke();

    // Bricks
    for (const b of bricks) {
      ctx.globalAlpha = 0.45 + 0.55 * (b.hp / b.maxHp);
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.maxHp > 1) {
        ctx.strokeStyle = "rgba(255,255,255,0.8)";
        ctx.lineWidth = 2;
        roundRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2, 4);
        ctx.stroke();
        ctx.lineWidth = 1;
        ctx.fillStyle = "#111";
        ctx.font = "bold 13px Segoe UI, Arial";
        ctx.textAlign = "center";
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
    }

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Paddle
    const grad = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
    grad.addColorStop(0, "#9ad0ff");
    grad.addColorStop(1, "#3d7bd9");
    ctx.fillStyle = grad;
    roundRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H, 7);
    ctx.fill();

    // Ball
    if (state !== "gameOver") {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "#fff";
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Overlays
    switch (state) {
      case "ready":
        message("Level " + (levelIndex + 1), "Click or press Space to launch");
        break;
      case "paused":
        message("Paused", "Press P, Space or click to resume");
        break;
      case "levelClear":
        message("Level " + (levelIndex + 1) + " Cleared!", "Click or press Space for Level " + (levelIndex + 2));
        break;
      case "gameOver":
        message("Game Over", "Final score: " + score + "  —  Click or press Space to restart");
        break;
      case "win":
        message("You Win!", "Final score: " + score + "  —  Click or press Space to play again");
        break;
    }
  }

  function message(title, sub) {
    const dim = state !== "ready";
    if (dim) {
      ctx.fillStyle = "rgba(5,6,20,0.65)";
      ctx.fillRect(0, 0, W, H);
    }
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 44px Segoe UI, Arial";
    ctx.fillText(title, W / 2, H / 2 + 40);
    ctx.font = "18px Segoe UI, Arial";
    ctx.fillStyle = "#cfd3ff";
    ctx.fillText(sub, W / 2, H / 2 + 85);
  }

  // ---- Loop ----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
