<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #faf8ef;
    color: #776e65;
    font-family: "Segoe UI", Arial, sans-serif;
  }

  header {
    width: 450px;
    max-width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  h1 {
    margin: 0;
    font-size: 56px;
    color: #776e65;
  }

  .score-box {
    background: #bbada0;
    color: #fff;
    border-radius: 6px;
    padding: 6px 18px;
    text-align: center;
    min-width: 90px;
  }

  .score-label {
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  #score {
    font-size: 26px;
    font-weight: bold;
  }

  .controls {
    width: 450px;
    max-width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .controls p {
    margin: 0;
    font-size: 15px;
    line-height: 1.4;
  }

  button {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 4px;
    padding: 10px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover { background: #9f8b77; }

  /* Board: 4x4 grid of empty cells; tiles are absolutely positioned on top */
  .board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 100px);
    grid-template-rows: repeat(4, 100px);
    gap: 10px;
    padding: 10px;
    width: 450px;
    height: 450px;
    max-width: 100%;
    background: #bbada0;
    border-radius: 8px;
  }

  .cell {
    background: #cdc1b4;
    border-radius: 6px;
  }

  .tile {
    position: absolute;
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-size: 48px;
    font-weight: bold;
    user-select: none;
    background: #3c3a32;
    color: #f9f6f2;
    transition: left 0.12s ease, top 0.12s ease;
  }

  .tile[data-v="2"]    { background: #eee4da; color: #776e65; }
  .tile[data-v="4"]    { background: #ede0c8; color: #776e65; }
  .tile[data-v="8"]    { background: #f2b179; }
  .tile[data-v="16"]   { background: #f59563; }
  .tile[data-v="32"]   { background: #f67c5f; }
  .tile[data-v="64"]   { background: #f65e3b; }
  .tile[data-v="128"]  { background: #edcf72; }
  .tile[data-v="256"]  { background: #edcc61; }
  .tile[data-v="512"]  { background: #edc850; }
  .tile[data-v="1024"] { background: #edc53f; }
  .tile[data-v="2048"] { background: #edc22e; }

  .tile[data-len="3"] { font-size: 40px; }
  .tile[data-len="4"] { font-size: 32px; }
  .tile[data-len="5"] { font-size: 26px; }

  .tile.spawn { animation: spawn 0.15s ease-out; }
  .tile.pop   { animation: pop 0.15s ease-out; }

  @keyframes spawn {
    from { transform: scale(0); }
    to   { transform: scale(1); }
  }

  @keyframes pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .message {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    border-radius: 8px;
    background: rgba(250, 248, 239, 0.75);
    color: #776e65;
    font-size: 28px;
    font-weight: bold;
    text-align: center;
  }

  .message.show { display: flex; }
</style>
</head>
<body>
  <header>
    <h1>2048</h1>
    <div class="score-box">
      <div class="score-label">Score</div>
      <div id="score">0</div>
    </div>
  </header>

  <div class="controls">
    <p>Use the <strong>arrow keys</strong> to slide tiles.<br>Matching tiles merge.</p>
    <button id="new-game">New Game</button>
  </div>

  <div class="board" id="board">
    <div class="message" id="message">
      <p id="message-text"></p>
      <button id="keep-going" hidden>Keep Going</button>
    </div>
  </div>

<script>
  const SIZE = 4;
  const STEP = 110; // cell width (100px) + gap (10px)
  const PAD = 10;   // board padding

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const messageEl = document.getElementById('message');
  const messageText = document.getElementById('message-text');
  const keepGoingBtn = document.getElementById('keep-going');

  let grid;      // grid[row][col] = tile object or null
  let score;
  let gameOver;
  let won;

  // Create the 16 empty background cells
  for (let i = 0; i < SIZE * SIZE; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    boardEl.insertBefore(cell, messageEl);
  }

  // Map a line index and a position along it (0 = edge the tiles slide toward) to [row, col]
  function cellAt(line, k, dir) {
    switch (dir) {
      case 'left':  return [line, k];
      case 'right': return [line, SIZE - 1 - k];
      case 'up':    return [k, line];
      case 'down':  return [SIZE - 1 - k, line];
    }
  }

  function render(tile) {
    const value = tile.value;
    tile.el.dataset.v = value;
    tile.el.dataset.len = String(value).length;
    tile.el.textContent = value;
    tile.el.style.left = PAD + tile.c * STEP + 'px';
    tile.el.style.top = PAD + tile.r * STEP + 'px';
    tile.el.classList.toggle('super', value > 2048);
  }

  function addRandomTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) empty.push([r, c]);
      }
    }
    if (empty.length === 0) return;

    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    const el = document.createElement('div');
    el.className = 'tile spawn';
    el.addEventListener('animationend', () => el.classList.remove('spawn', 'pop'));

    const tile = { value: Math.random() < 0.9 ? 2 : 4, r, c, el };
    grid[r][c] = tile;
    render(tile);
    boardEl.appendChild(el);
  }

  function hasMoves() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const tile = grid[r][c];
        if (!tile) return true;
        if (c + 1 < SIZE && grid[r][c + 1] && grid[r][c + 1].value === tile.value) return true;
        if (r + 1 < SIZE && grid[r + 1][c] && grid[r + 1][c].value === tile.value) return true;
      }
    }
    return false;
  }

  function showMessage(text, canKeepGoing) {
    messageText.textContent = text;
    keepGoingBtn.hidden = !canKeepGoing;
    messageEl.classList.add('show');
  }

  function move(dir) {
    if (gameOver) return;

    const next = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    const merged = [];   // surviving tiles that merged this move
    const removed = [];  // tiles consumed by a merge
    let gained = 0;

    for (let line = 0; line < SIZE; line++) {
      // Collect the tiles on this line, ordered from the edge tiles slide toward
      const tiles = [];
      for (let k = 0; k < SIZE; k++) {
        const [r, c] = cellAt(line, k, dir);
        if (grid[r][c]) tiles.push(grid[r][c]);
      }

      let slot = 0;
      for (let i = 0; i < tiles.length; i++, slot++) {
        const tile = tiles[i];
        const [r, c] = cellAt(line, slot, dir);
        const other = tiles[i + 1];

        tile.r = r;
        tile.c = c;
        next[r][c] = tile;

        if (other && other.value === tile.value) {
          tile.value *= 2;
          gained += tile.value;
          other.r = r;
          other.c = c;
          removed.push(other);
          merged.push(tile);
          i++; // the other tile is consumed by this merge
        }
      }
    }

    // If nothing moved or merged, this was not a valid move: do nothing
    let changed = false;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (next[r][c] !== grid[r][c]) changed = true;
      }
    }
    if (!changed) return;

    grid = next;
    score += gained;
    scoreEl.textContent = score;

    for (const tile of grid.flat()) {
      if (tile) render(tile);
    }
    for (const tile of removed) {
      render(tile); // slide into the merge target, then remove
      setTimeout(() => tile.el.remove(), 150);
    }
    for (const tile of merged) {
      tile.el.classList.add('pop');
    }

    addRandomTile();

    if (!won && grid.flat().some(tile => tile && tile.value >= 2048)) {
      won = true;
      showMessage('You reached 2048!', true);
    }
    if (!hasMoves()) {
      gameOver = true;
      showMessage('Game over! No moves left.', false);
    }
  }

  function newGame() {
    boardEl.querySelectorAll('.tile').forEach(el => el.remove());
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    score = 0;
    gameOver = false;
    won = false;
    scoreEl.textContent = '0';
    messageEl.classList.remove('show');
    addRandomTile();
    addRandomTile();
  }

  const KEY_DIRS = {
    ArrowLeft: 'left',
    ArrowRight: 'right',
    ArrowUp: 'up',
    ArrowDown: 'down'
  };

  document.addEventListener('keydown', e => {
    const dir = KEY_DIRS[e.key];
    if (!dir) return;
    e.preventDefault(); // keep the page from scrolling
    move(dir);
  });

  document.getElementById('new-game').addEventListener('click', newGame);
  keepGoingBtn.addEventListener('click', () => messageEl.classList.remove('show'));

  newGame();
</script>
</body>
</html>
