<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; background: #faf8ef; color: #776e65; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
  h1 { margin: 0 0 10px; font-size: 48px; }
  .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .score { background: #bbada0; color: #fff; padding: 8px 18px; border-radius: 4px; font-weight: bold; }
  button { background: #8f7a66; color: #fff; border: 0; border-radius: 4px; padding: 10px 18px; font-size: 16px; font-weight: bold; cursor: pointer; }
  button:hover { background: #9f8b77; }
  .wrap { position: relative; }
  #board { position: relative; width: 340px; height: 340px; background: #bbada0; border-radius: 6px; }
  .cell, .tile { position: absolute; width: 74px; height: 74px; border-radius: 3px; }
  .cell { background: rgba(238,228,218,.35); }
  .tile { display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 32px; transition: left .1s, top .1s; }
  .t2{background:#eee4da}.t4{background:#ede0c8}.t8{background:#f2b179;color:#f9f6f2}.t16{background:#f59563;color:#f9f6f2}
  .t32{background:#f67c5f;color:#f9f6f2}.t64{background:#f65e3b;color:#f9f6f2}.t128{background:#edcf72;color:#f9f6f2;font-size:28px}
  .t256{background:#edcc61;color:#f9f6f2;font-size:28px}.t512{background:#edc850;color:#f9f6f2;font-size:28px}
  .t1024{background:#edc53f;color:#f9f6f2;font-size:22px}.t2048{background:#edc22e;color:#f9f6f2;font-size:22px}
  .tbig{background:#3c3a32;color:#f9f6f2;font-size:20px}
  #msg { display: none; position: absolute; inset: 0; background: rgba(238,228,218,.8); border-radius: 6px; flex-direction: column; align-items: center; justify-content: center; font-size: 36px; font-weight: bold; gap: 14px; }
  #msg.show { display: flex; }
  p { font-size: 14px; }
</style>
</head>
<body>
<h1>2048</h1>
<div class="bar">
  <div class="score">Score: <span id="score">0</span></div>
  <button id="new">New Game</button>
</div>
<div class="wrap">
  <div id="board"></div>
  <div id="msg"><div>Game over! No moves left.</div><button id="retry">Try Again</button></div>
</div>
<p>Use the arrow keys to move the tiles.</p>
<script>
const N = 4, SIZE = 74, GAP = 10;
let grid, score;
const board = document.getElementById('board');
const scoreEl = document.getElementById('score');
const msg = document.getElementById('msg');

for (let i = 0; i < N * N; i++) {
  const c = document.createElement('div');
  c.className = 'cell';
  c.style.left = (GAP + (i % N) * (SIZE + GAP)) + 'px';
  c.style.top = (GAP + Math.floor(i / N) * (SIZE + GAP)) + 'px';
  board.appendChild(c);
}

function addRandom() {
  const empty = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) empty.push([r, c]);
  if (!empty.length) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function render() {
  board.querySelectorAll('.tile').forEach(t => t.remove());
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const v = grid[r][c];
    if (!v) continue;
    const t = document.createElement('div');
    t.className = 'tile ' + (v <= 2048 ? 't' + v : 'tbig');
    t.textContent = v;
    t.style.left = (GAP + c * (SIZE + GAP)) + 'px';
    t.style.top = (GAP + r * (SIZE + GAP)) + 'px';
    board.appendChild(t);
  }
  scoreEl.textContent = score;
}

function slideLine(line) {
  const vals = line.filter(v => v);
  const out = [];
  let gained = 0;
  for (let i = 0; i < vals.length; i++) {
    if (vals[i] === vals[i + 1]) {
      out.push(vals[i] * 2);
      gained += vals[i] * 2;
      i++;
    } else out.push(vals[i]);
  }
  while (out.length < N) out.push(0);
  return { out, gained };
}

function move(dir) {
  let moved = false;
  for (let i = 0; i < N; i++) {
    let line = [];
    for (let j = 0; j < N; j++) {
      const [r, c] = pos(dir, i, j);
      line.push(grid[r][c]);
    }
    const { out, gained } = slideLine(line);
    score += gained;
    for (let j = 0; j < N; j++) {
      const [r, c] = pos(dir, i, j);
      if (grid[r][c] !== out[j]) moved = true;
      grid[r][c] = out[j];
    }
  }
  return moved;
}

// j-th cell along line i, ordered starting from the edge tiles move toward
function pos(dir, i, j) {
  switch (dir) {
    case 'ArrowLeft': return [i, j];
    case 'ArrowRight': return [i, N - 1 - j];
    case 'ArrowUp': return [j, i];
    case 'ArrowDown': return [N - 1 - j, i];
  }
}

function canMove() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (!grid[r][c]) return true;
    if (c < N - 1 && grid[r][c] === grid[r][c + 1]) return true;
    if (r < N - 1 && grid[r][c] === grid[r + 1][c]) return true;
  }
  return false;
}

function newGame() {
  grid = Array.from({ length: N }, () => Array(N).fill(0));
  score = 0;
  msg.classList.remove('show');
  addRandom();
  addRandom();
  render();
}

document.addEventListener('keydown', e => {
  if (!e.key.startsWith('Arrow')) return;
  e.preventDefault();
  if (msg.classList.contains('show')) return;
  if (move(e.key)) {
    addRandom();
    render();
    if (!canMove()) msg.classList.add('show');
  }
});
document.getElementById('new').onclick = newGame;
document.getElementById('retry').onclick = newGame;
newGame();
</script>
</body>
</html>
