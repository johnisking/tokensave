<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  body {
    font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
    background: #faf8ef;
    color: #776e65;
    display: flex;
    justify-content: center;
    margin: 0;
    padding: 30px 10px;
  }
  .container { width: 420px; }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  h1 { font-size: 56px; margin: 0; color: #776e65; }
  .score-box {
    background: #bbada0;
    color: #fff;
    padding: 6px 18px;
    border-radius: 4px;
    text-align: center;
    min-width: 70px;
  }
  .score-box .label { font-size: 12px; text-transform: uppercase; color: #eee4da; }
  .score-box .value { font-size: 24px; font-weight: bold; }
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  button {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 4px;
    padding: 10px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #9f8b77; }
  .board-wrap { position: relative; }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 12px;
    background: #bbada0;
    padding: 12px;
    border-radius: 6px;
    width: 396px;
    height: 396px;
  }
  .cell {
    background: rgba(238, 228, 218, 0.35);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 40px;
    user-select: none;
  }
  .tile-2    { background: #eee4da; color: #776e65; }
  .tile-4    { background: #ede0c8; color: #776e65; }
  .tile-8    { background: #f2b179; color: #f9f6f2; }
  .tile-16   { background: #f59563; color: #f9f6f2; }
  .tile-32   { background: #f67c5f; color: #f9f6f2; }
  .tile-64   { background: #f65e3b; color: #f9f6f2; }
  .tile-128  { background: #edcf72; color: #f9f6f2; font-size: 34px; }
  .tile-256  { background: #edcc61; color: #f9f6f2; font-size: 34px; }
  .tile-512  { background: #edc850; color: #f9f6f2; font-size: 34px; }
  .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 28px; }
  .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 28px; }
  .tile-super { background: #3c3a32; color: #f9f6f2; font-size: 24px; }
  .new { animation: appear 0.15s ease-out; }
  .merged { animation: pop 0.15s ease-out; }
  @keyframes appear { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.75);
    border-radius: 6px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .overlay.show { display: flex; }
  .overlay p { font-size: 44px; font-weight: bold; margin: 0; color: #776e65; }
  .hint { margin-top: 16px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>2048</h1>
    <div class="score-box">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>
  </div>
  <div class="controls">
    <span>Join the tiles, get to 2048!</span>
    <button id="new-game">New Game</button>
  </div>
  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <p>Game Over!</p>
      <div>No moves left. Final score: <span id="final-score">0</span></div>
      <button id="try-again">Try Again</button>
    </div>
  </div>
  <p class="hint">Use the <strong>arrow keys</strong> to move the tiles.</p>
</div>

<script>
  const SIZE = 4;
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const overlayEl = document.getElementById('overlay');
  const finalScoreEl = document.getElementById('final-score');

  let grid, score, gameOver, newCell, mergedCells;

  const cells = [];
  for (let i = 0; i < SIZE * SIZE; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    boardEl.appendChild(cell);
    cells.push(cell);
  }

  function newGame() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    gameOver = false;
    mergedCells = new Set();
    newCell = null;
    addRandomTile();
    addRandomTile();
    overlayEl.classList.remove('show');
    render();
  }

  function addRandomTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) empty.push([r, c]);
    if (empty.length === 0) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    newCell = r * SIZE + c;
  }

  // Returns the list of [row, col] coordinates for each line, ordered
  // so that tiles slide toward index 0 of each line.
  function getLines(direction) {
    const lines = [];
    for (let i = 0; i < SIZE; i++) {
      const line = [];
      for (let j = 0; j < SIZE; j++) {
        if (direction === 'left')  line.push([i, j]);
        if (direction === 'right') line.push([i, SIZE - 1 - j]);
        if (direction === 'up')    line.push([j, i]);
        if (direction === 'down')  line.push([SIZE - 1 - j, i]);
      }
      lines.push(line);
    }
    return lines;
  }

  function move(direction) {
    if (gameOver) return;
    let moved = false;
    mergedCells = new Set();
    newCell = null;

    for (const line of getLines(direction)) {
      const values = line.map(([r, c]) => grid[r][c]).filter(v => v !== 0);
      const result = [];
      for (let i = 0; i < values.length; i++) {
        if (i + 1 < values.length && values[i] === values[i + 1]) {
          const merged = values[i] * 2;
          score += merged;
          const [r, c] = line[result.length];
          mergedCells.add(r * SIZE + c);
          result.push(merged);
          i++;
        } else {
          result.push(values[i]);
        }
      }
      while (result.length < SIZE) result.push(0);
      line.forEach(([r, c], idx) => {
        if (grid[r][c] !== result[idx]) moved = true;
        grid[r][c] = result[idx];
      });
    }

    if (!moved) return;
    addRandomTile();
    render();
    if (!canMove()) {
      gameOver = true;
      finalScoreEl.textContent = score;
      overlayEl.classList.add('show');
    }
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) return true;
        if (c + 1 < SIZE && grid[r][c] === grid[r][c + 1]) return true;
        if (r + 1 < SIZE && grid[r][c] === grid[r + 1][c]) return true;
      }
    }
    return false;
  }

  function render() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const idx = r * SIZE + c;
        const value = grid[r][c];
        const cell = cells[idx];
        cell.className = 'cell';
        cell.textContent = value ? value : '';
        if (value) {
          cell.classList.add(value <= 2048 ? 'tile-' + value : 'tile-super');
          if (idx === newCell) cell.classList.add('new');
          else if (mergedCells.has(idx)) cell.classList.add('merged');
        }
      }
    }
    scoreEl.textContent = score;
  }

  const KEYS = {
    ArrowLeft: 'left',
    ArrowRight: 'right',
    ArrowUp: 'up',
    ArrowDown: 'down',
  };

  document.addEventListener('keydown', e => {
    const direction = KEYS[e.key];
    if (!direction) return;
    e.preventDefault();
    move(direction);
  });

  document.getElementById('new-game').addEventListener('click', newGame);
  document.getElementById('try-again').addEventListener('click', newGame);

  newGame();
</script>
</body>
</html>
