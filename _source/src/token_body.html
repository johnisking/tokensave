    <!-- ===== Header ===== -->
    <header class="text-center mb-8">
      <div class="flex justify-center">
        <div class="inline-flex items-center gap-2 text-xs font-medium text-violet-300 bg-violet-500/10 border border-violet-500/20 rounded-full px-3 py-1 mb-4">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          {{badge}}
        </div>
      </div>
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-white via-violet-200 to-indigo-300 bg-clip-text text-transparent leading-tight pb-1">
        {{h1}}
      </h1>
      <p class="mt-3 text-zinc-400 text-sm sm:text-base">{{sub}}</p>

      <!-- Provider tabs -->
      <nav id="providerTabs" class="ltr mt-6 inline-flex p-1 bg-zinc-900/80 border border-zinc-800 rounded-xl gap-1" role="tablist" aria-label="AI provider">
        <button data-provider="openai" class="tab px-4 sm:px-5 py-2 rounded-lg text-sm font-semibold text-zinc-400 transition">GPT</button>
        <button data-provider="claude" class="tab px-4 sm:px-5 py-2 rounded-lg text-sm font-semibold text-zinc-400 transition">Claude</button>
        <button data-provider="gemini" class="tab px-4 sm:px-5 py-2 rounded-lg text-sm font-semibold text-zinc-400 transition">Gemini</button>
      </nav>

      <!-- Model select -->
      <div class="mt-3 flex justify-center">
        <label class="sr-only" for="modelSelect">Model</label>
        <select id="modelSelect" class="ltr bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-1.5 text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-violet-500/50"></select>
      </div>
    </header>

    <!-- ===== Main grid ===== -->
    <section class="grid grid-cols-1 lg:grid-cols-5 gap-5">

      <!-- Input -->
      <div class="lg:col-span-3 bg-zinc-900/70 backdrop-blur border border-zinc-800 rounded-2xl p-4 sm:p-5 flex flex-col">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <label for="input" class="text-sm font-semibold text-zinc-300">{{prompt}}</label>
          <div class="flex gap-2">
            <button id="btnOptimize" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-500/25 transition" title="{{optimizeTip}}">✨ {{optimize}}</button>
            <button id="btnCopy" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 transition">{{copy}}</button>
            <button id="btnClear" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-zinc-800 border border-zinc-700 hover:bg-rose-500/20 hover:border-rose-500/40 transition">{{clear}}</button>
          </div>
        </div>
        <textarea id="input" spellcheck="false" dir="auto"
          class="w-full flex-1 min-h-[280px] lg:min-h-[420px] resize-y bg-zinc-950/70 border border-zinc-800 rounded-xl p-4 text-sm leading-relaxed text-zinc-100 placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500/50"
          placeholder="{{ph1}}&#10;&#10;{{ph2}}"></textarea>
        <p id="toast" class="h-5 mt-2 text-xs text-emerald-400 transition-opacity opacity-0" aria-live="polite"></p>
      </div>

      <!-- Results -->
      <aside class="lg:col-span-2 flex flex-col gap-5">

        <div class="bg-zinc-900/70 backdrop-blur border border-zinc-800 rounded-2xl p-5">
          <div class="flex items-center justify-between">
            <span class="text-xs uppercase tracking-wider text-zinc-500 font-semibold">{{tokens}}</span>
            <span id="methodBadge" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-400">{{est}}</span>
          </div>
          <div id="tokenCount" class="ltr text-5xl font-extrabold mt-1 tabular-nums">0</div>

          <div class="grid grid-cols-2 gap-3 mt-5">
            <div class="bg-zinc-950/60 border border-zinc-800 rounded-xl p-3">
              <div class="text-[11px] uppercase tracking-wider text-zinc-500 font-semibold">{{chars}}</div>
              <div id="charCount" class="ltr text-xl font-bold tabular-nums mt-0.5">0</div>
            </div>
            <div class="bg-zinc-950/60 border border-zinc-800 rounded-xl p-3">
              <div class="text-[11px] uppercase tracking-wider text-zinc-500 font-semibold">{{words}}</div>
              <div id="wordCount" class="ltr text-xl font-bold tabular-nums mt-0.5">0</div>
            </div>
          </div>

          <div class="mt-3 bg-gradient-to-br from-violet-500/10 to-indigo-500/10 border border-violet-500/20 rounded-xl p-3">
            <div class="text-[11px] uppercase tracking-wider text-violet-300 font-semibold">{{cost}}</div>
            <div class="flex items-baseline justify-between mt-1">
              <span class="text-sm text-zinc-400">{{asIn}}</span>
              <span id="costIn" class="ltr text-lg font-bold tabular-nums">$0.000000</span>
            </div>
            <div class="flex items-baseline justify-between">
              <span class="text-sm text-zinc-400">{{asOut}}</span>
              <span id="costOut" class="ltr text-lg font-bold tabular-nums">$0.000000</span>
            </div>
            <p id="priceNote" class="text-[11px] text-zinc-500 mt-2"></p>
          </div>
        </div>

        <!-- Language efficiency gauge -->
        <div class="bg-zinc-900/70 backdrop-blur border border-zinc-800 rounded-2xl p-5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs uppercase tracking-wider text-zinc-500 font-semibold">{{eff}}</span>
            <span id="wasteLabel" class="text-xs font-bold text-emerald-400"></span>
          </div>
          <div class="ltr flex items-center gap-1 mt-3" aria-hidden="true">
            <div id="battery" class="flex-1 grid grid-cols-10 gap-1 p-1 border-2 border-zinc-600 rounded-lg h-10"></div>
            <div class="w-1.5 h-4 bg-zinc-600 rounded-r"></div>
          </div>
          <div class="flex items-baseline justify-between gap-2 mt-3">
            <span id="effPercent" class="text-2xl font-extrabold tabular-nums"></span>
            <span id="effText" class="text-xs text-zinc-400"></span>
          </div>
          <p id="langMix" class="text-[11px] text-zinc-500 mt-2"></p>
          <p class="text-[11px] text-zinc-600 mt-1">{{tip}}</p>
        </div>

        <!-- ===== AD PLACEHOLDER: Sidebar rectangle (300x250) ===== -->
        <!-- <div class="flex justify-center"><ins class="adsbygoogle" style="display:inline-block;width:300px;height:250px" ...></ins></div> -->
      </aside>
    </section>
