<!DOCTYPE html>
<!-- TokenSave (tokensave.app). Generated by _source/build.py — edit the files in _source/src, not this file. -->
<html lang="{{htmlLang}}" dir="{{dir}}" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <meta name="description" content="{{desc}}" />
  <link rel="canonical" href="{{url}}" />
{{hreflang}}
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{url}}" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{desc}}" />
  <meta property="og:locale" content="{{ogLocale}}" />
  <meta name="twitter:card" content="summary" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>" />
{{redirect}}
  <script type="application/ld+json">{{ldjson}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { background: radial-gradient(ellipse at top, #1e1b4b 0%, #0a0a0f 55%); background-color: #0a0a0f; }
    textarea::-webkit-scrollbar { width: 8px; }
    textarea::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 8px; }
    .tab-active { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff !important; box-shadow: 0 4px 20px -4px rgba(139,92,246,.6); }
    .battery-cell { transition: background-color .3s; }
    .ltr { direction: ltr; }
    input[type=number]::-webkit-inner-spin-button { opacity: .4; }
  </style>
  <!-- Cloudflare Web Analytics (cookieless). Only page views are sent — never what you type. -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "553cc8f2baba4297bd3b81f73b138536"}'></script>
</head>
<body class="min-h-screen text-zinc-100 font-sans antialiased">

  <!-- ===== AD PLACEHOLDER: Top leaderboard (728x90 desktop / 320x50 mobile) ===== -->

  <main class="max-w-5xl mx-auto px-4 py-6 sm:py-10">

    <!-- ===== Top bar: brand + tools + language ===== -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div class="flex flex-wrap items-center gap-x-5 gap-y-2">
        <a href="{{homeUrl}}" class="inline-flex items-center gap-2 text-sm font-bold tracking-tight text-zinc-300">
          <span class="text-lg">🪙</span> TokenSave
        </a>
        <nav class="flex gap-1 text-xs" aria-label="Tools">
{{toolNav}}
        </nav>
      </div>
      <label class="inline-flex items-center gap-1.5 text-xs text-zinc-400">
        <span aria-hidden="true">🌐</span>
        <span class="sr-only">{{lang}}</span>
        <select id="langSelect" aria-label="{{lang}}" class="bg-zinc-900 border border-zinc-800 rounded-lg px-2 py-1.5 text-xs text-zinc-200 focus:outline-none focus:ring-2 focus:ring-violet-500/50">
{{langOptions}}
        </select>
      </label>
    </div>

{{body}}

    <!-- ===== AD PLACEHOLDER: In-content banner below tool (responsive) ===== -->

    <section class="mt-12 grid sm:grid-cols-3 gap-4 text-sm">
      <div class="bg-zinc-900/50 border border-zinc-800 rounded-2xl p-5">
        <h2 class="font-semibold mb-1.5">{{q1}}</h2>
        <p class="text-zinc-400">{{a1}}</p>
      </div>
      <div class="bg-zinc-900/50 border border-zinc-800 rounded-2xl p-5">
        <h2 class="font-semibold mb-1.5">{{q2}}</h2>
        <p class="text-zinc-400">{{a2}}</p>
      </div>
      <div class="bg-zinc-900/50 border border-zinc-800 rounded-2xl p-5">
        <h2 class="font-semibold mb-1.5">{{q3}}</h2>
        <p class="text-zinc-400">{{a3}}</p>
      </div>
    </section>

    <footer class="mt-10 text-center text-xs text-zinc-600 space-y-1">
      <p>{{f1}}</p>
      <p>{{f2}}</p>
      <p class="pt-2">© 2026 TokenSave</p>
    </footer>
  </main>

  <!-- ===== AD PLACEHOLDER: Mobile sticky footer (320x50) ===== -->

  <script>window.T = {{tjson}};</script>
  <script type="module" src="/{{script}}?v={{ver}}"></script>
</body>
</html>
