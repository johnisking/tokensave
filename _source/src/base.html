<!DOCTYPE html>
<!-- TokenSave (tokensave.app). Generated by _source/build.py — edit the files in _source/src, not this file. -->
<html lang="{{htmlLang}}" dir="{{dir}}" class="dark">
<head>
  <meta charset="UTF-8" />
  <script>/* shared text lives in the #fragment: take it out of the URL before any third-party script can read it */if(/[#&]t=/.test(location.hash)){window.__share=location.hash.slice(1);history.replaceState(null,"",location.pathname+location.search)}</script>
  <!-- Google Tag Manager (loaded after the line above, so a shared text in the #fragment never reaches it) -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-KCGSDH87');</script>
  <!-- End Google Tag Manager -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <meta name="description" content="{{desc}}" />
  <link rel="canonical" href="{{url}}" />
{{hreflang}}
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{url}}" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{desc}}" />
  <meta property="og:locale" content="{{ogLocale}}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta property="og:image" content="{{ogImage}}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="TokenSave" />
  <meta name="twitter:image" content="{{ogImage}}" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script type="application/ld+json">{{ldjson}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v={{ver}}" />
{{adsHead}}
  <!-- Cloudflare Web Analytics (cookieless). Only page views are sent — never what you type. -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "553cc8f2baba4297bd3b81f73b138536"}'></script>
</head>
<body class="min-h-screen text-zinc-100 font-sans antialiased">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KCGSDH87"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <!-- ===== AD PLACEHOLDER: Top leaderboard (728x90 desktop / 320x50 mobile) ===== -->

  <main class="max-w-5xl mx-auto px-4 py-6 sm:py-10">

    <!-- ===== Top bar: brand + tools + language ===== -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div class="flex flex-wrap items-center gap-x-5 gap-y-2">
        <a href="{{homeUrl}}" class="inline-flex items-center gap-2 text-sm font-bold tracking-tight text-zinc-300">
          <img src="/favicon.svg" alt="TokenSave logo" width="22" height="22" /> TokenSave
        </a>
        <nav class="flex flex-wrap gap-1 text-xs" aria-label="Tools">
{{toolNav}}
        </nav>
      </div>
      <label class="inline-flex items-center gap-1.5 text-xs text-zinc-400">
        <span aria-hidden="true">🌐</span>
        <span class="sr-only">{{lang}}</span>
        <select id="langSelect" data-all="{{langAll}}" aria-label="{{lang}}" class="bg-zinc-900 border border-zinc-800 rounded-lg px-2 py-1.5 text-xs text-zinc-200 focus:outline-none focus:ring-2 focus:ring-violet-500/50">
{{langOptions}}
        </select>
      </label>
    </div>

{{body}}

    <!-- ===== AD PLACEHOLDER: In-content banner below tool (responsive) ===== -->

{{faq}}
{{guide}}

    <footer class="mt-10 text-center text-xs text-zinc-600 space-y-1">
      <p>{{f1}}</p>
      <p>{{f2}}</p>
      <p class="pt-2"><a href="/about" class="hover:text-zinc-300">{{fAbout}}</a> · <a href="/privacy" class="hover:text-zinc-300">{{fPrivacy}}</a> · <a href="/terms" class="hover:text-zinc-300">Terms</a> · <a href="/contact" class="hover:text-zinc-300">Contact</a> · <a href="/blog/" class="hover:text-zinc-300">Blog</a> · <a href="/compare/" class="hover:text-zinc-300">Compare</a> · <a href="/languages" class="hover:text-zinc-300">Languages</a> · © 2026 TokenSave</p>
    </footer>
  </main>

  <!-- ===== AD PLACEHOLDER: Mobile sticky footer (320x50) ===== -->

  <script>window.T = {{tjson}};</script>
  {{scriptTag}}
</body>
</html>
