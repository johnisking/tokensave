    <!-- ===== Header ===== -->
    <header class="text-center mb-8">
      <div class="flex justify-center">
        <div class="inline-flex items-center gap-2 text-xs font-medium text-violet-300 bg-violet-500/10 border border-violet-500/20 rounded-full px-3 py-1 mb-4">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          {{badge}}
        </div>
      </div>
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-white via-violet-200 to-indigo-300 bg-clip-text text-transparent leading-tight pb-1">
        {{h1}}
      </h1>
      <p class="mt-3 text-zinc-400 text-sm sm:text-base">{{sub}}</p>
    </header>

    <!-- ===== Controls ===== -->
    <section class="bg-zinc-900/70 backdrop-blur border border-zinc-800 rounded-2xl p-4 sm:p-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label for="iCount" class="block text-xs uppercase tracking-wider text-zinc-500 font-semibold mb-2">{{count}}</label>
        <input id="iCount" type="number" min="1" max="1000000" value="100" inputmode="numeric"
          class="ltr w-full bg-zinc-950/70 border border-zinc-800 rounded-lg px-3 py-2 text-lg font-bold tabular-nums focus:outline-none focus:ring-2 focus:ring-violet-500/50" />
        <div class="ltr flex gap-1 mt-2" id="countPresets">
          <button data-count="1" class="flex-1 text-xs py-1 rounded-md bg-zinc-800 hover:bg-zinc-700">1</button>
          <button data-count="100" class="flex-1 text-xs py-1 rounded-md bg-zinc-800 hover:bg-zinc-700">100</button>
          <button data-count="1000" class="flex-1 text-xs py-1 rounded-md bg-zinc-800 hover:bg-zinc-700">1,000</button>
          <button data-count="10000" class="flex-1 text-xs py-1 rounded-md bg-zinc-800 hover:bg-zinc-700">10,000</button>
        </div>
      </div>
      <div>
        <span class="block text-xs uppercase tracking-wider text-zinc-500 font-semibold mb-2">{{res}}</span>
        <div id="resTabs" class="ltr grid grid-cols-4 p-1 bg-zinc-950/70 border border-zinc-800 rounded-lg gap-1" role="radiogroup" aria-label="{{res}}">
          <button data-res="0.5k" class="tab py-2 rounded-md text-xs font-semibold text-zinc-400">0.5K<span class="block text-[10px] font-normal opacity-70">512px</span></button>
          <button data-res="1k" class="tab py-2 rounded-md text-xs font-semibold text-zinc-400">1K<span class="block text-[10px] font-normal opacity-70">1024px</span></button>
          <button data-res="2k" class="tab py-2 rounded-md text-xs font-semibold text-zinc-400">2K<span class="block text-[10px] font-normal opacity-70">2048px</span></button>
          <button data-res="4k" class="tab py-2 rounded-md text-xs font-semibold text-zinc-400">4K<span class="block text-[10px] font-normal opacity-70">4096px</span></button>
        </div>
      </div>
    </section>

    <!-- ===== Results ===== -->
    <section class="mt-5 bg-zinc-900/70 backdrop-blur border border-zinc-800 rounded-2xl overflow-hidden">
      <div class="hidden sm:grid grid-cols-12 gap-3 px-5 py-3 text-[11px] uppercase tracking-wider text-zinc-500 font-semibold border-b border-zinc-800">
        <div class="col-span-6">{{model}}</div>
        <div class="col-span-3 text-end">{{perImg}}</div>
        <div class="col-span-3 text-end">{{total}}</div>
      </div>
      <ul id="iResults" class="divide-y divide-zinc-800/80"></ul>
    </section>
    <p class="mt-3 text-[11px] text-zinc-500">{{notes}}</p>
