    <!-- ===== Header ===== -->
    <header class="text-center mb-8">
      <div class="flex justify-center">
        <div class="inline-flex items-center gap-2 text-xs font-medium text-violet-300 bg-violet-500/10 border border-violet-500/20 rounded-full px-3 py-1 mb-4">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          {{badge}}
        </div>
      </div>
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-white via-violet-200 to-indigo-300 bg-clip-text text-transparent leading-tight pb-1">
        {{h1}}
      </h1>
      <p class="mt-3 text-zinc-400 text-sm sm:text-base max-w-2xl mx-auto">{{sub}}</p>
    </header>
    <p class="-mt-4 mb-6 text-center text-sm"><a href="agents" class="inline-flex items-center gap-1.5 rounded-full border border-violet-500/30 bg-violet-500/10 px-3 py-1.5 text-violet-200 hover:bg-violet-500/20 hover:text-white">{{toAgents}} →</a></p>

    <!-- ===== Usage ===== -->
    <section class="bg-zinc-900/70 backdrop-blur border border-zinc-800 rounded-2xl p-4 sm:p-5">
      <h2 class="text-xs uppercase tracking-wider text-zinc-500 font-semibold mb-4">{{usage}}</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div>
          <label for="pMsgs" class="block text-xs text-zinc-400 font-semibold mb-2">{{msgs}}</label>
          <div class="ltr flex items-center gap-3">
            <input id="pMsgs" type="range" min="1" max="300" value="30" class="flex-1 accent-violet-500" />
            <input id="pMsgsNum" type="number" min="1" max="2000" value="30" inputmode="numeric"
              class="w-20 bg-zinc-950/70 border border-zinc-800 rounded-lg px-2 py-1.5 text-base font-bold tabular-nums text-end focus:outline-none focus:ring-2 focus:ring-violet-500/50" />
          </div>
          <div class="ltr flex gap-1 mt-2" id="pMsgPresets">
            <button data-n="10" class="flex-1 text-xs py-1 rounded-md bg-zinc-800 hover:bg-zinc-700">10</button>
            <button data-n="30" class="flex-1 text-xs py-1 rounded-md bg-zinc-800 hover:bg-zinc-700">30</button>
            <button data-n="80" class="flex-1 text-xs py-1 rounded-md bg-zinc-800 hover:bg-zinc-700">80</button>
            <button data-n="200" class="flex-1 text-xs py-1 rounded-md bg-zinc-800 hover:bg-zinc-700">200</button>
          </div>
        </div>
        <div>
          <span class="block text-xs text-zinc-400 font-semibold mb-2">{{size}}</span>
          <div id="pSize" class="grid grid-cols-1 p-1 bg-zinc-950/70 border border-zinc-800 rounded-lg gap-1" role="radiogroup" aria-label="{{size}}">
            <button data-size="short" class="tab py-1.5 px-2 rounded-md text-xs font-semibold text-zinc-400">{{sizeShort}}</button>
            <button data-size="chat" class="tab py-1.5 px-2 rounded-md text-xs font-semibold text-zinc-400">{{sizeChat}}</button>
            <button data-size="long" class="tab py-1.5 px-2 rounded-md text-xs font-semibold text-zinc-400">{{sizeLong}}</button>
          </div>
        </div>
        <div>
          <label for="pTurns" class="block text-xs text-zinc-400 font-semibold mb-2">{{turns}}</label>
          <div class="ltr flex items-center gap-3">
            <input id="pTurns" type="range" min="1" max="30" value="6" class="flex-1 accent-violet-500" />
            <span id="pTurnsVal" class="w-10 text-end text-base font-bold tabular-nums">6</span>
          </div>
        </div>
        <div>
          <label for="pLang" class="block text-xs text-zinc-400 font-semibold mb-2">{{lang}}</label>
          <select id="pLang" class="w-full bg-zinc-950/70 border border-zinc-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500/50"></select>
          <p id="pLangNote" class="mt-2 text-[11px] text-amber-300/90"></p>
        </div>
      </div>
      <div class="mt-4 pt-4 border-t border-zinc-800 flex flex-wrap items-baseline gap-x-6 gap-y-1 text-sm">
        <span class="text-xs uppercase tracking-wider text-zinc-500 font-semibold">{{tokMonth}}</span>
        <span class="ltr tabular-nums"><span class="text-zinc-500">{{inTok}}</span> <b id="pTokIn">0</b></span>
        <span class="ltr tabular-nums"><span class="text-zinc-500">{{outTok}}</span> <b id="pTokOut">0</b></span>
      </div>
    </section>

    <!-- ===== Results: one card per provider ===== -->
    <section id="pCards" class="mt-5 grid grid-cols-1 lg:grid-cols-3 gap-5"></section>

    <p class="mt-4 text-[11px] text-zinc-500 max-w-3xl">{{note}}</p>
    <p class="mt-2 text-[11px]">{{moreLink}}</p>
    <p class="mt-2 text-sm">{{proLink}}</p>
