    <!-- ===== Header ===== -->
    <header class="text-center mb-8">
      <div class="flex justify-center">
        <div class="inline-flex items-center gap-2 text-xs font-medium text-violet-300 bg-violet-500/10 border border-violet-500/20 rounded-full px-3 py-1 mb-4">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          {{badge}}
        </div>
      </div>
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-white via-violet-200 to-indigo-300 bg-clip-text text-transparent leading-tight pb-1">
        {{h1}}
      </h1>
      <p class="mt-3 text-zinc-400 text-sm sm:text-base">{{sub}}</p>
    </header>

    <!-- ===== Controls ===== -->
    <section class="bg-zinc-900/70 backdrop-blur border border-zinc-800 rounded-2xl p-4 sm:p-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div>
        <label for="vLen" class="block text-xs uppercase tracking-wider text-zinc-500 font-semibold mb-2">{{len}}</label>
        <input id="vLen" type="number" min="1" max="600" value="8" inputmode="numeric"
          class="ltr w-full bg-zinc-950/70 border border-zinc-800 rounded-lg px-3 py-2 text-lg font-bold tabular-nums focus:outline-none focus:ring-2 focus:ring-violet-500/50" />
        <div class="ltr flex gap-1 mt-2" id="lenPresets">
          <button data-len="5" class="flex-1 text-xs py-1 rounded-md bg-zinc-800 hover:bg-zinc-700">5s</button>
          <button data-len="8" class="flex-1 text-xs py-1 rounded-md bg-zinc-800 hover:bg-zinc-700">8s</button>
          <button data-len="10" class="flex-1 text-xs py-1 rounded-md bg-zinc-800 hover:bg-zinc-700">10s</button>
          <button data-len="60" class="flex-1 text-xs py-1 rounded-md bg-zinc-800 hover:bg-zinc-700">60s</button>
        </div>
      </div>
      <div>
        <label for="vClips" class="block text-xs uppercase tracking-wider text-zinc-500 font-semibold mb-2">{{clips}}</label>
        <input id="vClips" type="number" min="1" max="10000" value="1" inputmode="numeric"
          class="ltr w-full bg-zinc-950/70 border border-zinc-800 rounded-lg px-3 py-2 text-lg font-bold tabular-nums focus:outline-none focus:ring-2 focus:ring-violet-500/50" />
      </div>
      <div>
        <span class="block text-xs uppercase tracking-wider text-zinc-500 font-semibold mb-2">{{res}}</span>
        <div id="resTabs" class="ltr grid grid-cols-4 p-1 bg-zinc-950/70 border border-zinc-800 rounded-lg gap-1" role="radiogroup" aria-label="{{res}}">
          <button data-res="480" class="tab py-1.5 rounded-md text-xs font-semibold text-zinc-400">480p</button>
          <button data-res="720" class="tab py-1.5 rounded-md text-xs font-semibold text-zinc-400">720p</button>
          <button data-res="1080" class="tab py-1.5 rounded-md text-xs font-semibold text-zinc-400">1080p</button>
          <button data-res="4k" class="tab py-1.5 rounded-md text-xs font-semibold text-zinc-400">4K</button>
        </div>
      </div>
      <div>
        <span class="block text-xs uppercase tracking-wider text-zinc-500 font-semibold mb-2">{{audio}}</span>
        <div id="audioTabs" class="grid grid-cols-2 p-1 bg-zinc-950/70 border border-zinc-800 rounded-lg gap-1" role="radiogroup" aria-label="{{audio}}">
          <button data-audio="1" class="tab py-1.5 rounded-md text-xs font-semibold text-zinc-400">{{audioOn}}</button>
          <button data-audio="0" class="tab py-1.5 rounded-md text-xs font-semibold text-zinc-400">{{audioOff}}</button>
        </div>
      </div>
    </section>

    <!-- ===== Results ===== -->
    <section class="mt-5 bg-zinc-900/70 backdrop-blur border border-zinc-800 rounded-2xl overflow-hidden">
      <div class="hidden sm:grid grid-cols-12 gap-3 px-5 py-3 text-[11px] uppercase tracking-wider text-zinc-500 font-semibold border-b border-zinc-800">
        <div class="col-span-5">{{model}}</div>
        <div class="col-span-2 text-end">{{perSec}}</div>
        <div class="col-span-2 text-end">{{perClip}}</div>
        <div class="col-span-3 text-end">{{total}}</div>
      </div>
      <ul id="vResults" class="divide-y divide-zinc-800/80"></ul>
    </section>
    <p class="mt-3 text-[11px] text-zinc-500">{{notes}}</p>
